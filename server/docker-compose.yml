services:
  relay:
    build: .
    container_name: pleya-relay
    restart: unless-stopped
    mem_limit: 128m
    stop_grace_period: 15s
    volumes:
      # Logs, Discord-posters en de room-snapshot leven allemaal onder /data.
      - logs:/data
    expose:
      - "8080"
    ports:
      # Loopback-only: `POST /logs` is onauthenticated en de OAuth-proxy zit op
      # dezelfde poort, dus een 0.0.0.0-binding zou iedereen op het LAN (en alles
      # dat via een bestaande port-forward binnenkomt) langs Cloudflare's TLS,
      # WAF en rate limiting laten. deploy-nas.sh curlt dit over ssh óp de NAS.
      - "127.0.0.1:8831:8080"
    environment:
      OAUTH_BASE_URL: https://ice.pleya.app
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Publiceert ice.pleya.app zonder inkomende poorten: cloudflared belt naar
  # buiten. De koppeling hostname -> http://relay:8080 staat in het Cloudflare-
  # dashboard bij de tunnel zelf, niet hier.
  #
  # Dezelfde tunnel bedient ook web.pleya.app -> http://pleya-server:8080, en
  # die naam leeft in het netwerk van de Pleya Server-stack. Vandaar twee
  # netwerken hieronder. Zodra een service `networks:` expliciet noemt vervalt
  # de impliciete default, dus `default` staat er met opzet bij: zonder die
  # regel verliest cloudflared juist `relay` en gaat ice.pleya.app plat.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pleya-tunnel
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - relay
    command: tunnel --no-autoupdate run
    networks:
      - default
      - pleya-server
    environment:
      # Bewust geen `:?`-guard: die wordt bij het parsen geëvalueerd en zou ook
      # `up relay` en het vps-profile blokkeren. deploy-nas.sh controleert hem.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alternatief voor een losse VPS waar poort 80/443 vrij zijn: Caddy regelt
  # dan zelf het certificaat. Niet gebruikt in de NAS-opstelling.
  #   docker compose --profile vps up -d
  caddy:
    profiles: ["vps"]
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Het privenetwerk van de Pleya Server-stack, die een eigen compose heeft in
  # pleya_server/. Compose leidt de naam af van de projectnaam, en die komt op
  # de NAS van de map /volume1/docker/pleya-server. Vandaar de expliciete
  # `name:`, zodat de verwijzing niet meeverandert met de projectnaam hier.
  #
  # Dit stond tot 24 augustus 2026 nergens en was met de hand gelegd met
  # `docker network connect`. Elke `docker compose up -d --build` bouwde relay
  # opnieuw, nam via depends_on ook cloudflared mee, en dan was de koppeling
  # weg: web.pleya.app gaf 502 terwijl de server zelf gezond was.
  pleya-server:
    external: true
    name: pleya-server_default

volumes:
  logs:
  caddy_data:
  caddy_config:
