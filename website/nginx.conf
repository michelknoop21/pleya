server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change — cache hard.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The explainer video and its poster: large, rarely replaced (rename the file to bust the cache).
    location /video/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Private downloads: served from a host mount, survives redeploys.
    # No autoindex — files are only reachable with the exact (secret) path.
    location /downloads/ {
        alias /downloads/;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /install {
        try_files /install.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /install.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /get/android-tv {
        proxy_pass http://download-counter:8080/start/android-tv;
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /download-counts.json {
        proxy_pass http://download-counter:8080/stats;
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    # Pretty URLs: /privacy -> privacy.html, then dir index, else 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        # HTML entry points must revalidate so a redeploy shows up immediately
        # instead of the browser reusing a heuristically-cached page.
        add_header Cache-Control "no-cache";
    }
}
