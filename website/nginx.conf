server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change — cache hard.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Private downloads: served from a host mount, survives redeploys.
    # No autoindex — files are only reachable with the exact (secret) path.
    location /downloads/ {
        alias /downloads/;
        add_header Cache-Control "no-store";
    }

    # Pretty URLs: /privacy -> privacy.html, then dir index, else 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        # HTML entry points must revalidate so a redeploy shows up immediately
        # instead of the browser reusing a heuristically-cached page.
        add_header Cache-Control "no-cache";
    }
}
