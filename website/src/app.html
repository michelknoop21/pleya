<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Hanken Grotesk and Bricolage Grotesque are the landing page. Inter and
			Archivo Black are the two families the app itself ships (pubspec.yaml),
			so the documentation reads in the app's own type. Material Symbols is
			subsetted to the icon names the chapter badges use.
		-->
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0&icon_names=add_circle,bookmark,build,cast_connected,download,group,groups,help,home,info,live_tv,menu_book,movie,play_circle,rocket_launch,search,settings,settings_remote,subtitles,video_library&display=block"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
