<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="%sveltekit.assets%/brand/pleya-mark-64.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/brand/pleya-mark-256.png" />
    <title>Pleya</title>
    %sveltekit.head%
    <!--
      De herotitel staat op Home bovenaan; zonder preload ontdekt de browser
      ArchivoBlack pas na de CSS en springt de titel op 393 van één naar twee
      regels zodra de letter binnenkomt. Na de head van SvelteKit, zodat de CSP-meta
      (font-src self) er al voor staat.
    -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/ArchivoBlack-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body data-sveltekit-preload-data="hover">
    %sveltekit.body%
  </body>
</html>
