name: Dependency health

# Bewust een eigen workflow en geen scheduled variant van de PR-CI. Zodra
# checkout@v8 uitkomt zou "CI" anders elke week rood staan terwijl main prima
# is, en dan leert iedereen die kleur negeren. Rood hier betekent onderhoud
# nodig, niet code stuk.
on:
  schedule:
    # Maandagochtend, ruim voor de maandelijkse releaseronde.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Eén run tegelijk: twee runs zouden dezelfde branch en hetzelfde issue
# tegelijk herschrijven. Een hangende run blokkeert niets blijvend; GitHub
# breekt hem af op de job-timeout.
concurrency:
  group: dependency-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      # Mag falen, en dat is het punt. Toen de background_downloader-pin in
      # september onbereikbaar raakte, stierf deze stap eraan en kwam het
      # rapport dat die rot had moeten melden er niet meer. De controles die
      # geen opgeloste pakketten nodig hebben (pins, forks, engine, MPVKit,
      # Actions) draaien hier nu sowieso; wat wél resolutie nodig heeft, valt
      # verderop vanzelf om in UNKNOWN en dat faalt de run alsnog.
      #
      # Bewust geen --enforce-lockfile: dat voegt hier alleen een faalwijze
      # toe (pubspec.yaml gewijzigd zonder de lock te regenereren) die niets
      # met dependency-gezondheid te maken heeft en die ci.yml al hard afvangt.
      - name: flutter pub get
        run: flutter pub get
        continue-on-error: true

      # --strict-through-ring 1: alleen ring 1 mag deze run laten falen. MPVKit,
      # de tvOS-engine en libass horen bewust op een releasecyclus te wachten, en
      # die mogen de signalering niet permanent rood zetten. Exit 2 (een
      # incompleet rapport) faalt altijd.
      - name: Rapport
        run: scripts/check_updates.sh --strict-through-ring 1

      - name: JSON-rapport bewaren
        if: always()
        run: scripts/check_updates.sh --json > dependency-health.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-health
          path: dependency-health.json

  # Doet iets met het rapport in plaats van alleen rood te kleuren. Alle
  # ring-1-kandidaten gaan in één batch; daarna één volledige graph-check en
  # één gate. Auto-merge alleen als de hoogste ring in de hele lockfile-diff 1
  # is, ci_checks.sh slaagt en ci.yml op exact dezelfde SHA groen is. Anders
  # blijft de PR open voor handmatige analyse. Nooit een deploy.
  # Zie scripts/deps_update.sh, scripts/deps_backlog.py en
  # docs/agents/dependencies.md.
  onderhoud:
    # macOS omdat ci_checks.sh ook swift-format en clang-format draait.
    runs-on: macos-latest
    timeout-minutes: 120
    # Alleen vanaf main: vanaf een andere ref zou de batch-commit op die ref
    # staan en de merge die commits meenemen.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/deps-ring1
      ISSUE_TITLE: Dependency-onderhoud
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Ring-1-batch
        id: lane
        run: |
          flutter pub get --enforce-lockfile
          scripts/check_updates.sh --json > "$RUNNER_TEMP/pre.json" || true
          flutter pub outdated --json > "$RUNNER_TEMP/pre-outdated.json" || true
          # Een open PR is een batch die op handmatige analyse wacht; die
          # overschrijven we niet met een force-push.
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$open_pr" ]; then
            echo "rc=5" >> "$GITHUB_OUTPUT"
            printf 'Overgeslagen op %s: PR #%s staat nog open en wacht op handmatige analyse.' "$(date +%F)" "$open_pr" > "$RUNNER_TEMP/lane.txt"
            exit 0
          fi
          set +e
          scripts/deps_update.sh --report "$RUNNER_TEMP/pre.json" | tee "$RUNNER_TEMP/update.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          grep '^summary:' "$RUNNER_TEMP/update.log" > "$RUNNER_TEMP/summary.txt" || true

      # Volledige check_updates.sh op de graph ná de batch, als deel van het
      # bewijs. Het issue toont deze stand pas als de merge echt gebeurd is.
      - name: Volledig rapport na de batch
        id: post
        if: steps.lane.outputs.rc == '0' || steps.lane.outputs.rc == '4'
        continue-on-error: true
        run: |
          scripts/check_updates.sh --json > "$RUNNER_TEMP/post.json" || true
          flutter pub outdated --json > "$RUNNER_TEMP/post-outdated.json" || true
          # Gate: geen enkele ring-1-controle mag na de batch UNKNOWN zijn.
          python3 - "$RUNNER_TEMP/post.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))["components"]
          bad = [r["component"] for r in rows if r["ring"] <= 1 and r["status"] == "UNKNOWN"]
          print("ring-1 UNKNOWN: " + (", ".join(bad) or "geen"))
          sys.exit(1 if bad else 0)
          PY

      - name: Gate
        id: gate
        if: steps.lane.outputs.rc == '0' || steps.lane.outputs.rc == '4'
        run: |
          set +e
          scripts/ci_checks.sh > "$RUNNER_TEMP/gate.log" 2>&1
          rc=$?
          set -e
          tail -30 "$RUNNER_TEMP/gate.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: PR, CI op dezelfde SHA, merge
        if: steps.lane.outputs.rc == '0' || steps.lane.outputs.rc == '4'
        env:
          LANE_RC: ${{ steps.lane.outputs.rc }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          POST_OK: ${{ steps.post.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qm "chore(deps): ring-1-update $(date +%G-W%V)" pubspec.lock
          sha="$(git rev-parse HEAD)"
          # Opnieuw kijken vlak voor de push: tijdens de gates kan iemand een
          # PR op deze branch geopend hebben.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            printf 'Overgeslagen op %s: tijdens de run werd een PR op %s geopend; niet overschreven.' "$(date +%F)" "$BRANCH" > "$RUNNER_TEMP/lane.txt"
            exit 1
          fi
          git push -f origin "$BRANCH"
          # Voorlopige uitkomst: breekt de stap hierna af, dan noemt het issue
          # de branch die nu de volgende runs tegenhoudt.
          printf '**Afgebroken** op %s na de push van %s; controleer of er een PR open staat (die houdt volgende runs tegen). Run: %s' "$(date +%F)" "$BRANCH" "$RUN_URL" > "$RUNNER_TEMP/lane.txt"
          summary="$(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null)"

          pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head "$BRANCH" --title "chore(deps): ring-1-update" \
              --body "Wekelijkse batch uit dependency-health.yml. Lockfile-diff: $summary. Run: $RUN_URL" \
              | sed -n 's#.*/pull/##p')" || pr=""
          fi

          # Een push of PR met GITHUB_TOKEN start ci.yml niet; workflow_dispatch wel.
          gh workflow run ci.yml --ref "$BRANCH"
          ci_id=""
          for _ in $(seq 1 30); do
            ci_id="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha -q ".[] | select(.headSha == \"$sha\") | .databaseId" | head -1)"
            [ -n "$ci_id" ] && break
            sleep 10
          done
          ci_ok=0
          [ -n "$ci_id" ] && gh run watch "$ci_id" --exit-status --interval 30 > /dev/null && ci_ok=1

          why=""
          [ "$LANE_RC" = 0 ] || why="$why lockfile-diff boven ring 1 of UNKNOWN ($summary);"
          [ "$GATE_RC" = 0 ] || why="$why ci_checks.sh rood;"
          [ "$POST_OK" = true ] || why="$why check_updates.sh na de batch heeft ring-1 UNKNOWN;"
          [ "$ci_ok" = 1 ] || why="$why ci.yml op $sha niet groen;"
          [ -n "$pr" ] || why="$why geen PR (repo-instelling 'Allow GitHub Actions to create pull requests');"

          if [ -z "$why" ]; then
            # Versheid direct voor de merge, zodat het venster seconden is. Een
            # base die daarna nog beweegt is niet uit te sluiten: GitHub kent
            # geen verwachte-base bij een merge.
            git fetch -q origin main
            git merge-base --is-ancestor origin/main "$sha" || why=" main is intussen verder;"
          fi
          if [ -z "$why" ]; then
            # De REST-merge merget nu of faalt; hij zet nooit auto-merge of een
            # queue aan, en sha pint de geteste commit.
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f sha="$sha" -f merge_method=merge > /dev/null || true
            if [ "$(gh pr view "$pr" --json state -q .state)" = MERGED ]; then
              git push -q origin --delete "$BRANCH" || true
            else
              why=" merge niet voltooid;"
            fi
          fi
          if [ -z "$why" ]; then
            touch "$RUNNER_TEMP/merged"
            lane="PR #$pr automatisch gemerged op $(date +%F): $summary; ci_checks.sh en ci.yml groen op $sha."
          else
            lane="**Niet gemerged** op $(date +%F):$why PR ${pr:+#$pr }blijft open voor handmatige analyse. Run: $RUN_URL"
          fi
          printf '%s' "$lane" > "$RUNNER_TEMP/lane.txt"
          [ -z "$why" ]

      - name: Doorlopend issue
        if: always()
        env:
          LANE_RC: ${{ steps.lane.outputs.rc }}
        run: |
          if [ ! -s "$RUNNER_TEMP/lane.txt" ]; then
            case "$LANE_RC" in
              3) msg="Niets te doen op $(date +%F)." ;;
              1) msg="**Faalde** op $(date +%F): upgrade of volledige resolutie faalde; main niet aangeraakt. Run: $RUN_URL" ;;
              *) msg="**Faalde** op $(date +%F): rapport onbruikbaar of job afgebroken. Run: $RUN_URL" ;;
            esac
            printf '%s' "$msg" > "$RUNNER_TEMP/lane.txt"
          fi
          num="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)"
          [ -n "$num" ] && gh issue view "$num" --json body -q .body > "$RUNNER_TEMP/prev.md"
          # Stand van main: vóór de batch, tenzij de batch echt gemerged is.
          state=pre; [ -f "$RUNNER_TEMP/merged" ] && state=post
          scripts/deps_backlog.py --outdated "$RUNNER_TEMP/$state-outdated.json" --report "$RUNNER_TEMP/$state.json" \
            --previous "$RUNNER_TEMP/prev.md" --lane "$(cat "$RUNNER_TEMP/lane.txt")" > "$RUNNER_TEMP/body.md"
          if [ -n "$num" ]; then gh issue edit "$num" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      # rc 5 (open PR wacht) is ook rood: anders zou testflight_release.sh
      # vanaf de tweede week stoppen met waarschuwen terwijl de PR open staat.
      - name: Baan gefaald
        if: steps.lane.outputs.rc == '1' || steps.lane.outputs.rc == '2' || steps.lane.outputs.rc == '5'
        run: exit 1

  # Major-baan: één kandidaat (pakket of bundel) tegelijk, nooit meer dan één
  # open major-PR. De job opent een draft-PR met de nieuwe constraints en laat
  # ci.yml op die SHA draaien; bij rode gates blijft de branch staan als
  # startpunt voor de migratie. Hij schrijft geen migratiecode, merget niet en
  # deployt niet: een major gaat altijd door handmatige review.
  # Zie scripts/deps_major.sh, scripts/deps_backlog.py --next-major en
  # docs/agents/dependencies.md.
  major:
    needs: onderhoud
    # always(): ook als onderhoud rood is (open ring-1-PR) mag de major-baan lopen.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Dependency-onderhoud
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # ref: main, niet de SHA van de trigger: onderhoud kan intussen gemerged hebben.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Kandidaat kiezen
        id: pick
        run: |
          flutter pub get --enforce-lockfile
          scripts/check_updates.sh --json > "$RUNNER_TEMP/report.json" || true
          flutter pub outdated --json > "$RUNNER_TEMP/outdated.json" || true
          num="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)"
          : > "$RUNNER_TEMP/prev.md"
          [ -n "$num" ] && gh issue view "$num" --json body -q .body > "$RUNNER_TEMP/prev.md"
          gh pr list --state open --limit 1000 --json number,headRefName > "$RUNNER_TEMP/prs.json"
          git ls-remote --heads origin 'chore/deps-major-*' > "$RUNNER_TEMP/heads.txt"
          : > "$RUNNER_TEMP/backlog.args"
          # Fail-closed: haalt de lijst de limiet, dan kan een open major-PR erbuiten vallen
          # en zou de WIP-limiet stil omzeild worden.
          if [ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/prs.json")" -ge 1000 ]; then
            printf 'Geen major gestart op %s: de lijst open PR-s haalt de limiet van 1000, WIP-limiet niet te controleren.' "$(date +%F)" > "$RUNNER_TEMP/major-lane.txt"
            echo "name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip=()
          name=""
          pkgs=""
          # Een kandidaat waarvan de probe geen constraint ziet verschuiven wacht op
          # de runtime of de graph; de volgende komt aan de beurt.
          for _ in 1 2 3 4 5 6 7 8; do
            pick="$(scripts/deps_backlog.py --next-major --outdated "$RUNNER_TEMP/outdated.json" \
              --report "$RUNNER_TEMP/report.json" --previous "$RUNNER_TEMP/prev.md" \
              --majors-open "$RUNNER_TEMP/prs.json" --majors-branches "$RUNNER_TEMP/heads.txt" \
              ${skip[@]+"${skip[@]}"})"
            [ -z "$pick" ] && break
            cand="${pick%% *}"
            cand_pkgs="${pick#* }"
            # shellcheck disable=SC2086 # cand_pkgs is bewust een woordenlijst
            if scripts/deps_major.sh --probe $cand_pkgs; then
              name="$cand"; pkgs="$cand_pkgs"; break
            else
              probe_rc=$?
            fi
            # Exit 3 is een echte hold; elke andere uitkomst is een solver- of netwerkfout
            # en mag niet als "niets te doen" slagen.
            if [ "$probe_rc" != 3 ]; then
              echo "probe_failed=true" >> "$GITHUB_OUTPUT"
              printf '**Faalde** op %s: probe van %s eindigde met exit %s (geen hold). Run: %s' "$(date +%F)" "$cand" "$probe_rc" "$RUN_URL" > "$RUNNER_TEMP/major-lane.txt"
              break
            fi
            skip+=(--skip "$cand")
            printf '%s\n' "--skip" "$cand" >> "$RUNNER_TEMP/backlog.args"
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          if [ -z "$name" ] && [ ! -s "$RUNNER_TEMP/major-lane.txt" ]; then
            printf 'Geen major gestart op %s: niets te kiezen, een major-PR staat open, of de resolutie laat niets toe.' "$(date +%F)" > "$RUNNER_TEMP/major-lane.txt"
          fi

      - name: Migratie-branch en draft-PR
        id: lane
        if: steps.pick.outputs.name != ''
        env:
          NAME: ${{ steps.pick.outputs.name }}
          PKGS: ${{ steps.pick.outputs.pkgs }}
        run: |
          branch="chore/deps-major-$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          set +e
          # shellcheck disable=SC2086 # PKGS is bewust een woordenlijst
          scripts/deps_major.sh "$NAME" $PKGS 2>&1 | tee "$RUNNER_TEMP/major.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          gate="$(sed -n 's/^gate: //p' "$RUNNER_TEMP/major.log" | head -1)"
          summary="$(grep '^summary:' "$RUNNER_TEMP/major.log" | tail -1)"

          case "$rc" in
            0|4) ;;
            3) printf 'Major %s niet gestart op %s: de resolutie liet na de probe toch niets toe.' "$NAME" "$(date +%F)" > "$RUNNER_TEMP/major-lane.txt"; exit 0 ;;
            *) printf '**Faalde** op %s: resolutie van major %s faalde; main niet aangeraakt. Run: %s' "$(date +%F)" "$NAME" "$RUN_URL" > "$RUNNER_TEMP/major-lane.txt"; exit 0 ;;
          esac

          # Bij rode gates ook committen: de wijziging, inclusief wat codegen
          # veranderde, is het startpunt voor de migratie.
          git add -A
          git commit -qm "chore(deps): major $NAME"
          git push origin "$branch"
          {
            echo "Roadmap: geen ID (CI-onderhoud)"
            echo
            echo "Major-baan uit dependency-health.yml voor \`$NAME\`: $PKGS."
            echo "Lockfile-diff: ${summary:-onbekend}."
            if [ "$rc" = 0 ]; then
              echo "Gates (codegen zonder diff, ci_checks.sh): groen. ci.yml draait apart op deze branch."
            else
              echo "**Gate rood: $gate.** Deze branch is het startpunt voor de migratie, niet merge-klaar."
              echo
              echo "~~~"
              tail -30 "$RUNNER_TEMP/major.log"
              echo "~~~"
            fi
            echo
            echo "Draft: de baan schrijft geen migratiecode en merget niet. Review en merge handmatig. Run: $RUN_URL"
          } > "$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr create --draft --base main --head "$branch" --title "chore(deps): major $NAME" \
            --body-file "$RUNNER_TEMP/pr-body.md" | sed -n 's#.*/pull/##p')" || pr=""
          # Een push of PR met GITHUB_TOKEN start ci.yml niet; workflow_dispatch wel.
          gh workflow run ci.yml --ref "$branch"
          if [ "$rc" = 0 ]; then
            printf 'Draft-PR %s voor major %s geopend op %s; gates groen, ci.yml gestart. Run: %s' "${pr:+#$pr}" "$NAME" "$(date +%F)" "$RUN_URL" > "$RUNNER_TEMP/major-lane.txt"
          else
            printf 'Draft-PR %s voor major %s geopend op %s met rode gate %s. Run: %s' "${pr:+#$pr}" "$NAME" "$(date +%F)" "$gate" "$RUN_URL" > "$RUNNER_TEMP/major-lane.txt"
            printf '%s\n' "--note" "$NAME=blocked: $gate" >> "$RUNNER_TEMP/backlog.args"
          fi

      # Werkt dezelfde tabel bij als onderhoud, nu met de status per kandidaat.
      # De ring-1-regel blijft staan zoals onderhoud hem schreef.
      - name: Doorlopend issue
        if: always()
        run: |
          gh pr list --state open --limit 1000 --json number,headRefName > "$RUNNER_TEMP/prs.json"
          git ls-remote --heads origin 'chore/deps-major-*' > "$RUNNER_TEMP/heads.txt"
          num="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)"
          : > "$RUNNER_TEMP/prev.md"
          [ -n "$num" ] && gh issue view "$num" --json body -q .body > "$RUNNER_TEMP/prev.md"
          ring1="$(awk '/^## Ring-1-baan/{f=1;next} /^## /{f=0} f' "$RUNNER_TEMP/prev.md" | sed '/^$/d')"
          args=()
          while IFS= read -r line; do args+=("$line"); done < "$RUNNER_TEMP/backlog.args"
          major="$(cat "$RUNNER_TEMP/major-lane.txt" 2>/dev/null)"
          lane="${ring1:-geen uitkomst doorgegeven}"
          [ -n "$major" ] && lane="$lane"$'\n\n'"Major-baan: $major"
          scripts/deps_backlog.py --outdated "$RUNNER_TEMP/outdated.json" --report "$RUNNER_TEMP/report.json" \
            --previous "$RUNNER_TEMP/prev.md" --majors-open "$RUNNER_TEMP/prs.json" \
            --majors-branches "$RUNNER_TEMP/heads.txt" --lane "$lane" \
            ${args[@]+"${args[@]}"} > "$RUNNER_TEMP/body.md"
          if [ -n "$num" ]; then gh issue edit "$num" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Baan gefaald
        if: steps.lane.outputs.rc == '1' || steps.lane.outputs.rc == '2' || steps.pick.outputs.probe_failed == 'true'
        run: exit 1
