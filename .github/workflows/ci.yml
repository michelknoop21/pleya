name: CI - Sanity Checks

on:
  push:
    branches:
      - main
      # De integratiebranch leeft langer dan één PR en draagt de merges van elke
      # slice. Zonder deze regel draait de CI daar nooit, en dan is de gate een
      # belofte in plaats van bewijs (RB-15).
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Een nieuwe push op een PR maakt de runs op de vorige commit van diezelfde PR
# overbodig; zonder deze groep bleven ze doorlopen en hielden ze de wachtrij vol.
# De groep is per workflow en per PR. Elke andere trigger (push op main of een
# integratiebranch, handmatig) krijgt een eigen groep per run en wordt
# dus nooit geannuleerd en wacht nooit op een andere run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Levert de antwoorden waar de Flutter-jobs en de Go-databasejob hieronder op
  # sturen, op dezelfde manier als `Bereik bepalen` in server-web.yml en
  # pleya-verify.yml: een eigen job en geen `on.pull_request.paths`, zodat elke
  # checknaam altijd verschijnt en de inhoud bepaalt of er werk te doen is.
  #
  # Alleen bij een pull request valt er iets af te bakenen. Bij een push op main
  # of een integratiebranch en bij een handmatige run geeft
  # scripts/ci_changed_files.sh alle bestanden terug, en dan draait alles.
  #
  # De afhankelijke jobs draaien met `if: !cancelled()` en vallen open: alleen
  # een geslaagde run van deze job met expliciet "false" slaat het werk over.
  # Faalt deze job, of levert hij niets op, dan draait alles gewoon door.
  #
  # scripts/ci_scope_selftest.sh voert dit filter uit tegen een set
  # voorbeeldwijzigingen en toont welke jobs er draaien. Draai hem na elke
  # wijziging aan de patronen hieronder.
  changes:
    name: Bereik bepalen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Raakt deze verandering de app of de server?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(scripts/ci_changed_files.sh "$BASE" "${HEAD:-HEAD}")"
          # Alleen om te tonen; een SIGPIPE van head mag de uitkomst niet raken.
          printf '%s\n' "$files" | head -50 || true

          # Here-strings en geen pijp, om dezelfde SIGPIPE-reden als in
          # server-web.yml: `grep -q` sluit zijn leeskant zodra hij een antwoord
          # heeft, en onder pipefail wordt een echte match dan stil "false".
          match() { grep -qE "$1" <<< "$files"; }
          other() { grep -qvE "$1" <<< "$files"; }

          # Flutter (Unit Tests, Code Analysis, Native Formatting). Alleen
          # deze paden kunnen de app, haar tests en haar analyse aantoonbaar
          # niet raken. Alles daarbuiten, en elke twijfel, laat de jobs draaien.
          # docs/ valt niet in zijn geheel weg: de wire-contracttests lezen
          # docs/pleya-protocol/v1/examples en de schermtests vergelijken met
          # mockups in docs/assets/. Twee scripts in pleya_server/ en pleya_web/
          # worden gelezen door test/scripts/pleya_server_verify_local_test.dart.
          # Een nieuwe test die een bestand buiten lib/ en test/ leest, hoort
          # hier in de uitzonderingen.
          flutter_skip='^(docs/|pleya_server/|pleya_web/|website/|\.githooks/|\.claude/|[^/]*\.md$)'
          flutter_read='^(docs/pleya-protocol/|docs/pleya-protocol-v1\.md$|docs/assets/|pleya_server/scripts/verify-local\.sh$|pleya_web/scripts/build-into-server\.sh$)'
          if other "$flutter_skip" || match "$flutter_read"; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

          # Go-databasejob. Naast de module zelf lezen de Go-tests twee
          # bestanden die scripts/go-tool.sh alleen-lezen in de container zet
          # (pleya_verify/redact/ en docs/pleya-protocol-v1.md), en de
          # validator toetst de vastgelegde antwoorden tegen
          # docs/pleya-protocol/v1/openapi.yaml. Zelfde lijst als het
          # server-filter in server-web.yml, plus dit workflowbestand.
          if match '^(pleya_server/|docs/pleya-protocol/|docs/pleya-protocol-v1\.md$|pleya_verify/redact/|scripts/check_server_responses\.py$|scripts/check_protocol|scripts/ci_changed_files\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # Houdt de filters hierboven en in server-web.yml en pleya-verify.yml
      # eerlijk: voorbeeldwijzigingen, de paden die tests buiten hun map lezen,
      # en de open val van elke gestuurde job. Faalt hij, dan faalt deze job,
      # en dan draaien de gestuurde jobs alles (zie hierboven).
      # PyYAML staat op de Ubuntu-runner; alleen als hij ontbreekt komt hij
      # gepind van PyPI.
      - name: Self-test of the scope filters
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.2"
          scripts/ci_scope_selftest.sh

  analyze:
    name: Code Analysis
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Valt open: alleen een geslaagde `changes` met expliciet "false" zet dit
      # op false. Elke stap hieronder leest het; de job zelf draait altijd.
      RUN_FLUTTER: ${{ needs.changes.result != 'success' || needs.changes.outputs.flutter != 'false' }}
    steps:
      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Verify pinned SPM plugin packaging
        run: python3 scripts/test_spm_plugins.py

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Verify generated files committed
        run: |
          scripts/codegen.sh
          if ! git diff --exit-code lib/; then
            echo "::error::Generated files (.g.dart / .freezed.dart) are out of date."
            echo "Run 'scripts/codegen.sh' and commit the result."
            exit 1
          fi

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Verify formatting
        run: |
          # Find all Dart files excluding generated files
          search_roots=(lib)
          [ ! -d test ] || search_roots+=(test)
          files_found="$(find "${search_roots[@]}" -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f -print -quit 2>/dev/null)"
          if [ -z "$files_found" ]; then
            echo "No Dart files found to format"
            exit 0
          fi
          find "${search_roots[@]}" -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f 2>/dev/null -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Analyze code
        run: |
          # Run flutter analyze
          # Fails on errors or warnings only (info messages are allowed)
          flutter analyze 2>&1 | tee analyze_output.txt || true

          # Check output for errors or warnings. dart_code_linter-plugin rules
          # (kebab-case) are dropped: flutter analyze does not wait for the
          # plugin, so which files it covers is a race. Same filter as
          # scripts/ci_checks.sh.
          # The filter goes by rule code, not severity: a plugin rule set to
          # `severity: error` is dropped too. Rules that must block run in the
          # "Check hard dart_code_linter rules" step. Without "No issues found!"
          # or "issues found", analyze itself did not finish: that fails.
          grep -E "error •|warning •" analyze_output.txt \
            | grep -vE '• [a-z0-9]+(-[a-z0-9]+)+[[:space:]]*$' > core_issues.txt || true
          if ! grep -qE "No issues found!|issues? found" analyze_output.txt; then
            echo "❌ flutter analyze did not produce a result"
            exit 1
          elif grep -q "error •" core_issues.txt; then
            echo "❌ Analysis failed with errors"
            exit 1
          elif grep -q "warning •" core_issues.txt; then
            echo "⚠️  Analysis completed with warnings"
            exit 1
          else
            echo "✅ Analysis passed!"
            exit 0
          fi

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Check hard dart_code_linter rules
        run: scripts/dcl_hard_rules.sh

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Check for unused code
        run: |
          echo "🔍 Checking for unused code..."
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          if grep -qi "no unused code found" unused_code.txt; then
            echo "✅ No unused code found"
          else
            echo "❌ Found unused code:"
            cat unused_code.txt
            exit 1
          fi

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Check for unused files
        run: |
          echo "🔍 Checking for unused files..."
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          if grep -qi "no unused files found" unused_files.txt; then
            echo "✅ No unused files found"
          else
            echo "❌ Found unused files:"
            cat unused_files.txt
            exit 1
          fi

      - if: ${{ env.RUN_FLUTTER == 'false' }}
        name: Niets te draaien
        run: echo "Deze verandering raakt de app, haar tests en haar analyse niet."

  test:
    name: Unit Tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Valt open: alleen een geslaagde `changes` met expliciet "false" zet dit
      # op false. Elke stap hieronder leest het; de job zelf draait altijd.
      RUN_FLUTTER: ${{ needs.changes.result != 'success' || needs.changes.outputs.flutter != 'false' }}
    steps:
      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Run tests
        run: |
          if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            flutter test
          else
            echo "No tests found, skipping test execution"
          fi

      - if: ${{ env.RUN_FLUTTER == 'false' }}
        name: Niets te draaien
        run: echo "Deze verandering raakt de app en haar tests niet."

  # Bewijst dat de Android-toolchain (AGP, Kotlin, Gradle) en de plugins samen
  # een app bouwen. De rest van deze workflow draait alleen Dart: analyze en
  # tests zien een te lage AGP of Kotlin voor een plugin niet, en de release-
  # build in build.yml heeft een keystore nodig en maakt een draft-release.
  # Debug-APK, geen secrets, geen upload. Zonder key.properties tekent Gradle
  # met de debugsleutel (android/app/build.gradle.kts).
  android-debug:
    name: Android Debug APK
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Valt open, zoals bij Unit Tests: alleen een geslaagde `changes` met
      # expliciet "false" slaat het werk over.
      RUN_FLUTTER: ${{ needs.changes.result != 'success' || needs.changes.outputs.flutter != 'false' }}
    steps:
      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Build debug APK
        run: flutter build apk --debug

      - if: ${{ env.RUN_FLUTTER == 'false' }}
        name: Niets te draaien
        run: echo "Deze verandering raakt de app niet, dus ook de Android-build niet."

  pleya-server:
    name: Pleya Server (Go, database)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pleya
          POSTGRES_PASSWORD: pleya
          POSTGRES_DB: pleya_test
        options: >-
          --health-cmd "pg_isready -U pleya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      # Valt open: alleen een geslaagde `changes` met expliciet "false" zet dit
      # op false. Elke stap hieronder leest het; de job zelf draait altijd.
      RUN_SERVER: ${{ needs.changes.result != 'success' || needs.changes.outputs.server != 'false' }}
      # Zonder deze DSN slaan de pakketten die een echte database nodig hebben
      # zichzelf over, en dan zegt een groene run niets over de migraties.
      PLEYA_TEST_DATABASE_URL: postgres://pleya:pleya@localhost:5432/pleya_test?sslmode=disable
    steps:
      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pleya_server/go.mod
          cache-dependency-path: pleya_server/go.sum

      # De tests draaien tegen dezelfde gepinde ffmpeg als de server zelf
      # (scripts/test-image.sh). De ffmpeg van Ubuntu (6.1) meldt de voortgang
      # onder loudnorm anders, en dan meet de loudnesstest een verkeerde duur.
      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Build test image with pinned ffmpeg
        working-directory: pleya_server
        run: scripts/test-image.sh

      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Build
        working-directory: pleya_server
        run: go build ./...

      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Vet
        working-directory: pleya_server
        run: go vet ./...

      # De testrun legt ook de antwoorden voor de contractcontrole vast. Tot
      # oktober 2026 was dat een tweede run van ./internal/api, en die kostte
      # bijna vijf minuten voor tests die net al gedraaid hadden. Alleen
      # internal/api leest PLEYA_RESPONSE_DIR (harness_test.go), dus de andere
      # pakketten merken er niets van. -count=1 hoort erbij: een resultaat uit
      # de testcache voert de tests niet uit en laat de map dan leeg.
      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Test and capture responses for the contract check
        working-directory: pleya_server
        env:
          GO_IMAGE: pleya-server-test:go-ffmpeg
          PLEYA_TEST_DOCKER_NETWORK: host
          PLEYA_RESPONSE_DIR: /src/.responses
        run: |
          rm -rf .responses && mkdir -p .responses
          scripts/go-tool.sh test -count=1 -timeout 30m ./...

      - if: ${{ env.RUN_SERVER != 'false' }}
        name: Validate responses against openapi.yaml
        run: |
          # De runner heeft een oudere jsonschema voorgeïnstalleerd, en die kent het
          # `registry`-argument niet. Lokaal valt dat niet op, want daar draait de
          # validator in een verse python:3.12-slim. Vandaar de ondergrens.
          python3 -m pip install --quiet --disable-pip-version-check --upgrade \
            "jsonschema>=4.18" pyyaml referencing
          python3 scripts/check_server_responses.py pleya_server/.responses

      - if: ${{ env.RUN_SERVER == 'false' }}
        name: Niets te draaien
        run: echo "pleya_server, het protocol en de bestanden die de Go-tests lezen zijn niet geraakt."

  pleya-web:
    name: Pleya Web (contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pleya_web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check

      - name: Verify the generated client matches the contract
        run: bun run api:check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  authority-merge:
    name: Authority Files Merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # De controle loopt alle merges sinds de branch-base af. Een ondiepe
          # checkout ziet die geschiedenis niet en zou stilzwijgend groen zijn.
          fetch-depth: 0

      - name: Fetch authority base
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Self-test the authority merge gate
        run: scripts/check_authority_merge_test.sh

      - name: Verify no authority file was reverted to one merge parent
        env:
          AUTHORITY_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$AUTHORITY_BEFORE" ] && ! printf '%s' "$AUTHORITY_BEFORE" | grep -Eq '^0+$'; then
            base="$AUTHORITY_BEFORE"
          else
            base="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          scripts/check_authority_merge.sh "$base"

      # De tellers in docs/PLEYA-SERVER-MASTERLIST.md (de taakregel, de
      # blokkentabel en de golftabel) worden met de hand bijgewerkt. Dit script
      # telt de taakrijen zelf na en faalt met een verschiltabel als een teller
      # afwijkt. Een eigen job zou een runner vragen voor
      # een controle van een fractie van een seconde, dus hij hangt hier aan.
      # Draait ook als de authority-controle hierboven faalt, zodat beide
      # uitkomsten in één run zichtbaar zijn. De job blijft dan rood.
      - name: Masterlist counters match the task rows
        if: ${{ !cancelled() }}
        run: scripts/masterlist_counts.sh --check

  protocol:
    name: Protocol Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate contract and fixtures
        run: scripts/check_protocol.sh

      # De fake server uit pleya_verify bedient de app-tests. Loopt hij weg van
      # het contract, dan slagen die tegen een verzinsel. Zelfde vangstvorm en
      # zelfde validator als de echte server, met --subset omdat deze fixture
      # bewust maar een deel van het contract bedient.
      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Capture the fake server's responses
        working-directory: pleya_verify/fixture_server
        env:
          PLEYA_RESPONSE_DIR: ${{ github.workspace }}/pleya_verify/fixture_server/.responses
        run: |
          dart pub get
          dart test test/pleya_fake_server_contract_test.dart

      - name: Validate the fake server against openapi.yaml
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --upgrade \
            "jsonschema>=4.18" pyyaml referencing
          python3 scripts/check_server_responses.py --subset \
            pleya_verify/fixture_server/.responses

  native-format:
    name: Native Formatting
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Valt open: alleen een geslaagde `changes` met expliciet "false" zet dit
      # op false. Elke stap hieronder leest het; de job zelf draait altijd.
      RUN_FLUTTER: ${{ needs.changes.result != 'success' || needs.changes.outputs.flutter != 'false' }}
    steps:
      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - if: ${{ env.RUN_FLUTTER != 'false' }}
        name: Verify native formatting
        run: scripts/format_native.sh --check

      - if: ${{ env.RUN_FLUTTER == 'false' }}
        name: Niets te draaien
        run: echo "Deze verandering raakt geen native code en geen formatteerregels."
