name: CI - Sanity Checks

on:
  push:
    branches:
      - main
      # De integratiebranch leeft langer dan één PR en draagt de merges van elke
      # slice. Zonder deze regel draait de CI daar nooit, en dan is de gate een
      # belofte in plaats van bewijs (RB-15).
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: |

          flutter pub get

      - name: Verify generated files committed
        run: |
          scripts/codegen.sh
          if ! git diff --exit-code lib/; then
            echo "::error::Generated files (.g.dart / .freezed.dart) are out of date."
            echo "Run 'scripts/codegen.sh' and commit the result."
            exit 1
          fi

      - name: Verify formatting
        run: |
          # Find all Dart files excluding generated files
          find lib $([ -d test ] && echo test) -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f 2>/dev/null | while IFS= read -r file; do
            files_found=true
            break
          done
          if [ "$files_found" != "true" ]; then
            echo "No Dart files found to format"
            exit 0
          fi
          find lib $([ -d test ] && echo test) -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f 2>/dev/null -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Analyze code
        run: |
          # Run flutter analyze
          # Fails on errors or warnings only (info messages are allowed)
          flutter analyze 2>&1 | tee analyze_output.txt || true

          # Check output for errors or warnings
          if grep -q "error •" analyze_output.txt; then
            echo "❌ Analysis failed with errors"
            exit 1
          elif grep -q "warning •" analyze_output.txt; then
            echo "⚠️  Analysis completed with warnings"
            exit 1
          else
            echo "✅ Analysis passed!"
            exit 0
          fi

      - name: Check for unused code
        run: |
          echo "🔍 Checking for unused code..."
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          if grep -qi "no unused code found" unused_code.txt; then
            echo "✅ No unused code found"
          else
            echo "❌ Found unused code:"
            cat unused_code.txt
            exit 1
          fi

      - name: Check for unused files
        run: |
          echo "🔍 Checking for unused files..."
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          if grep -qi "no unused files found" unused_files.txt; then
            echo "✅ No unused files found"
          else
            echo "❌ Found unused files:"
            cat unused_files.txt
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            flutter test
          else
            echo "No tests found, skipping test execution"
          fi

  pleya-server:
    name: Pleya Server (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pleya
          POSTGRES_PASSWORD: pleya
          POSTGRES_DB: pleya_test
        options: >-
          --health-cmd "pg_isready -U pleya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      # Zonder deze DSN slaan de pakketten die een echte database nodig hebben
      # zichzelf over, en dan zegt een groene run niets over de migraties.
      PLEYA_TEST_DATABASE_URL: postgres://pleya:pleya@localhost:5432/pleya_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: pleya_server/go.mod
          cache-dependency-path: pleya_server/go.sum

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build
        working-directory: pleya_server
        run: go build ./...

      - name: Vet
        working-directory: pleya_server
        run: go vet ./...

      - name: Test
        working-directory: pleya_server
        run: go test ./...

      - name: Capture responses for the contract check
        working-directory: pleya_server
        env:
          PLEYA_RESPONSE_DIR: ${{ github.workspace }}/pleya_server/.responses
        run: |
          rm -rf .responses && mkdir -p .responses
          go test -count=1 ./internal/api/

      - name: Validate responses against openapi.yaml
        run: |
          python3 -m pip install --quiet --disable-pip-version-check jsonschema pyyaml referencing
          python3 scripts/check_server_responses.py pleya_server/.responses

  pleya-web:
    name: Pleya Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pleya_web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check

      - name: Verify the generated client matches the contract
        run: bun run api:check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  protocol:
    name: Protocol Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate contract and fixtures
        run: scripts/check_protocol.sh

  native-format:
    name: Native Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify native formatting
        run: scripts/format_native.sh --check

  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Verify dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub outdated
