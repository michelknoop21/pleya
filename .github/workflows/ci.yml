name: CI - Sanity Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated files committed
        run: |
          scripts/codegen.sh
          if ! git diff --exit-code lib/; then
            echo "::error::Generated files (.g.dart / .freezed.dart) are out of date."
            echo "Run 'scripts/codegen.sh' and commit the result."
            exit 1
          fi

      - name: Verify formatting
        run: |
          # Find all Dart files excluding generated files
          find lib $([ -d test ] && echo test) -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f 2>/dev/null | while IFS= read -r file; do
            files_found=true
            break
          done
          if [ "$files_found" != "true" ]; then
            echo "No Dart files found to format"
            exit 0
          fi
          find lib $([ -d test ] && echo test) -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -type f 2>/dev/null -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Analyze code
        run: |
          # Run flutter analyze
          # Fails on errors or warnings only (info messages are allowed)
          flutter analyze 2>&1 | tee analyze_output.txt || true

          # Check output for errors or warnings. dart_code_linter-plugin rules
          # (kebab-case) are dropped: flutter analyze does not wait for the
          # plugin, so which files it covers is a race. Same filter as
          # scripts/ci_checks.sh.
          # The filter goes by rule code, not severity: a plugin rule set to
          # `severity: error` is dropped too. Rules that must block run in the
          # "Check hard dart_code_linter rules" step. Without "No issues found!"
          # or "issues found", analyze itself did not finish: that fails.
          grep -E "error •|warning •" analyze_output.txt \
            | grep -vE '• [a-z0-9]+(-[a-z0-9]+)+[[:space:]]*$' > core_issues.txt || true
          if ! grep -qE "No issues found!|issues? found" analyze_output.txt; then
            echo "❌ flutter analyze did not produce a result"
            exit 1
          elif grep -q "error •" core_issues.txt; then
            echo "❌ Analysis failed with errors"
            exit 1
          elif grep -q "warning •" core_issues.txt; then
            echo "⚠️  Analysis completed with warnings"
            exit 1
          else
            echo "✅ Analysis passed!"
            exit 0
          fi

      - name: Check hard dart_code_linter rules
        run: scripts/dcl_hard_rules.sh

      - name: Check for unused code
        run: |
          echo "🔍 Checking for unused code..."
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          if grep -qi "no unused code found" unused_code.txt; then
            echo "✅ No unused code found"
          else
            echo "❌ Found unused code:"
            cat unused_code.txt
            exit 1
          fi

      - name: Check for unused files
        run: |
          echo "🔍 Checking for unused files..."
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          if grep -qi "no unused files found" unused_files.txt; then
            echo "✅ No unused files found"
          else
            echo "❌ Found unused files:"
            cat unused_files.txt
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: |
          if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            flutter test
          else
            echo "No tests found, skipping test execution"
          fi

  native-format:
    name: Native Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify native formatting
        run: scripts/format_native.sh --check
