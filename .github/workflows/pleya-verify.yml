name: Pleya Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly extended run for the tvOS gate (idb-dependent, not required on
    # every push). Portable and macOS jobs also run here: they are cheap
    # enough that a weekly re-check costs nothing extra.
    - cron: "17 4 * * 1"

jobs:
  # Levert één antwoord waar de Apple-gate hieronder op stuurt. Bewust een
  # eigen job en geen `on.pull_request.paths`: zodra die gate required wordt,
  # zou een paths-filter op workflowniveau de status helemaal laten verdwijnen
  # en wacht GitHub eindeloos op iets dat nooit komt. Zo bestaat de checknaam
  # altijd, en bepaalt de inhoud of er werk te doen is.
  #
  # De gate hieronder draait met `if: always()` en valt open: alleen een
  # succesvolle run van deze job mét expliciet "false" slaat het echte werk
  # over. Faalt deze job, of levert hij niets op, dan draait de simulatorrun
  # gewoon door — anders zou GitHub de check "skipped" zien en dat als groen
  # tellen, precies op het moment dat het filter zelf stuk is.
  changes:
    name: Bereik bepalen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Raakt deze verandering de app zelf?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(scripts/ci_changed_files.sh "$BASE" "${HEAD:-HEAD}")"
          # head sluit de pijp na 50 regels; bij meer bestanden dan dat krijgt
          # echo een SIGPIPE en breekt de stap af onder pipefail. Alleen om te
          # tonen, dus een falende preview mag de uitkomst niet meenemen.
          printf '%s\n' "$files" | head -50 || true
          # Alleen deze mappen kunnen de gebouwde app aantoonbaar niet raken.
          # Alles daarbuiten, en elke twijfel, laat de simulatorrun doorgaan.
          #
          # Bewust een here-string, geen pijp: `grep -qv` stopt zodra hij zijn
          # antwoord heeft en sluit dan zijn leeskant, en een schrijvende
          # printf die nog niet klaar was krijgt daardoor SIGPIPE (141). Onder
          # pipefail wordt dat de uitkomst van de hele pijp, en `if` leest 141
          # als "onwaar" — dus een echte match werd hier stilzwijgend
          # apple=false. Geverifieerd tegen de git-ls-files-fallback van deze repo
          # (3260 bestanden): met de pijp apple=false, met de here-string
          # apple=true, wat hier het enige juiste antwoord is.
          if grep -qvE '^(docs/|test/|pleya_server/|pleya_web/|\.githooks/|[^/]*\.md$)' <<< "$files"; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Required-candidate gate. Pure Dart, no simulator, no Xcode, no secrets.
  # Covers pleya_verify/{fixture_server,runner,mcp} unit tests plus a
  # portable schema check (list + validate) over every scenario file, all
  # of it deterministic and network-free.
  portable:
    name: Verify - portable (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-verify-v1-${{ hashFiles('pleya_verify/**/pubspec.yaml', 'pleya_verify/**/pubspec.lock') }}

      - name: fixture_server tests
        working-directory: pleya_verify/fixture_server
        run: |
          dart pub get
          dart test

      - name: runner tests
        working-directory: pleya_verify/runner
        run: |
          dart pub get
          dart test

      - name: mcp tests
        working-directory: pleya_verify/mcp
        run: |
          dart pub get
          dart test

      - name: Scenario schema check (list + validate, no driver dispatch)
        working-directory: pleya_verify/runner
        run: |
          set -euo pipefail
          echo "Known scenarios:"
          dart run bin/verify.dart list scenarios --json
          echo
          status=0
          for f in ../scenarios/*.yaml; do
            echo "--- validate $f ---"
            if ! dart run bin/verify.dart validate "$f" --json; then
              status=1
            fi
            echo
          done
          exit "$status"

  # Apple/simulator gate: macOS driver + iOS-simulator driver, neither of
  # which needs idb (macOS talks HTTP transport, the iOS-sim driver drives
  # the simulator through `xcrun simctl` directly). Genuinely runs the
  # existing CLI end to end (build -> install -> launch -> assert ->
  # evidence) via `verify run`, exactly as a contributor would locally.
  #
  # Bewust nog geen required check: op 23 september viel `discover.layout` om
  # op een timeout van 15 s op `screen.discover`, terwijl dezelfde job op een
  # byte-identieke boom in de PR slaagde en de herstart groen was. Een
  # simulator die af en toe traag start hoort een product-PR niet te blokkeren;
  # de job blijft wel zichtbaar draaien. Zie ook DEC-083.
  macos-verify:
    name: Verify - macOS + iOS simulator
    needs: changes
    if: always()
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # The hosted runner has no Apple Development certificate, and the Debug
      # configuration of macos/Runner.xcodeproj asks for one ("No profiles for
      # 'nl.michelknoop.pleya' were found"). The macOS driver re-signs its
      # isolated copy ad hoc anyway (`codesign --sign -`), so the build may be
      # ad hoc too. flutter_tools forwards every FLUTTER_XCODE_<SETTING> to
      # xcodebuild as a build setting, which is its documented route for CI
      # signing without touching the project (ios/xcodeproj.dart,
      # environmentVariablesAsXcodeBuildSettings; used by build_macos.dart).
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
      FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ""
    steps:
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: Checkout code
        uses: actions/checkout@v7

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: Install app dependencies
        run: flutter pub get --enforce-lockfile

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: runner dependencies
        working-directory: pleya_verify/runner
        run: dart pub get

      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.apple != 'false' }}
        name: macos.smoke.boot (target macos)
        working-directory: pleya_verify/runner
        run: dart run bin/verify.dart run ../scenarios/macos.smoke.boot.yaml --json

      - if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.apple != 'false') }}
        name: discover.layout (target ios-sim)
        working-directory: pleya_verify/runner
        run: dart run bin/verify.dart run ../scenarios/discover.layout.yaml --json

      - if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.apple != 'false') }}
        name: Upload evidence bundles
        uses: actions/upload-artifact@v7
        with:
          name: pleya-verify-macos-evidence-${{ github.run_id }}
          # Only the per-run evidence bundles, not the isolated app-install
          # caches (`.build/pleya-verify/{macos,ios}-app/`) the drivers keep
          # around between runs: those are multi-hundred-MB build output,
          # not evidence.
          path: |
            .build/pleya-verify/*
            !.build/pleya-verify/*-app
          if-no-files-found: warn
          retention-days: 14

      - if: ${{ needs.changes.result == 'success' && needs.changes.outputs.apple == 'false' }}
        name: Niets te draaien
        run: |
          echo "Deze verandering raakt lib/, de platformmappen, pubspec of"
          echo "pleya_verify niet, dus er valt op de simulator niets te meten."
          echo "De check bestaat en slaagt; dat is met opzet, zodat branch"
          echo "protection nooit op een status wacht die niet komt."

  # tvOS gate: the only driver that needs idb (Siri-Remote HID input has no
  # transport-level equivalent, see CONTRIBUTING.md). Deliberately NOT on
  # push/pull_request: idb-companion/fb-idb are unmaintained and their
  # behavior on a fresh hosted runner is unproven, so this stays a visible,
  # honestly-failing, non-blocking gate (workflow_dispatch + weekly
  # schedule) until it has a real-run track record. See DEC-083.
  tvos-verify:
    name: Verify - tvOS (extended, not required)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install app dependencies
        run: flutter pub get --enforce-lockfile

      - name: runner dependencies
        working-directory: pleya_verify/runner
        run: dart pub get

      - name: Install idb (facebook/fb tap, required for Siri-Remote HID input)
        run: |
          brew tap facebook/fb
          brew trust --tap facebook/fb
          brew install facebook/fb/idb

      - name: Verify idb toolchain
        run: |
          which idb
          which idb_companion
          idb --help
          idb_companion --version

      - name: Simulator runtimes (diagnostic) + ensure tvOS runtime
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          if ! xcrun simctl list runtimes | grep -q tvOS; then
            echo "no tvOS runtime on this image; attempting one-time platform download"
            sudo xcodebuild -downloadPlatform tvOS || \
              echo "tvOS platform download failed; the scenario below will report this honestly"
          fi

      - name: tvos_sim.sh doctor
        run: scripts/tvos_sim.sh doctor --json || true

      - name: tvos.smoke.boot (target tvos-sim)
        working-directory: pleya_verify/runner
        run: dart run bin/verify.dart run ../scenarios/tvos.smoke.boot.yaml --json

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pleya-verify-tvos-evidence-${{ github.run_id }}
          path: |
            .build/pleya-verify/*
            !.build/pleya-verify/*-app
          if-no-files-found: warn
          retention-days: 14
