<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big P motion</title>
<style>
/* Tokens en componenten overgenomen uit src/tv.css en src/assets/bigp/bigp.css (mockup 38). */
@font-face { font-family: Inter; src: url(assets/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: Inter; src: url(assets/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: Inter; src: url(assets/Inter-Bold.otf); font-weight: 700; }
:root {
  --bg: #141414; --surface: #1F1F1F; --elevated: #2F2F2F; --accent: #E5140F; --amber: #FFB020; --ok: #35C759;
  --ink: #FFFFFF; --ink-2: rgba(255,255,255,.72); --ink-3: rgba(255,255,255,.50); --ink-4: rgba(255,255,255,.30);
  --hair: rgba(255,255,255,.10); --inset: 75px; --ring: 4px; --ring-gap: 8px; --r-card: 12px; --r-tile: 16px;
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0b0b; color: var(--ink); font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }

/* ---------- stage: 1920x1080 geschaald op de vensterbreedte ---------- */
#stage { position: relative; width: 100%; overflow: hidden; }
#tv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--bg); font-size: 22px; line-height: 1.3; }
svg.ic { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: middle; }

/* ---------- topnav ---------- */
.topnav { position: absolute; left: 0; right: 0; top: 44px; height: 52px; padding: 0 var(--inset); display: flex; align-items: center; z-index: 1; }
.topnav .chip { width: 44px; height: 44px; border-radius: 999px; background: var(--elevated); overflow: hidden; }
.topnav .chip img { width: 100%; height: 100%; object-fit: cover; }
.topnav .cluster { position: absolute; left: 50%; top: 0; height: 52px; transform: translateX(-50%); display: flex; align-items: center; }
.topnav .search { width: 26px; height: 26px; color: var(--ink-2); margin-right: 32px; }
.topnav .item { font-size: 24px; font-weight: 500; color: var(--ink-2); padding: 0 20px; height: 52px; line-height: 52px; border-radius: 999px; white-space: nowrap; transition: background .3s, color .3s; }
.topnav .item.on { background: var(--ink); color: var(--bg); }
.topnav .wordmark { position: absolute; right: var(--inset); top: 0; height: 52px; }
.topnav .wordmark img { height: 52px; display: block; }

.page { position: absolute; left: 0; right: 0; top: 132px; padding: 0 var(--inset); }
.page-title { font-size: 44px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.page-sub { font-size: 22px; color: var(--ink-3); margin-top: 8px; }

/* ---------- knoppen, chips, focus ---------- */
.btn { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 30px; border-radius: 999px; font-size: 22px; font-weight: 500; white-space: nowrap;
  background: rgba(255,255,255,.14); color: var(--ink); transition: box-shadow .25s var(--ease), transform .12s, opacity .3s; }
.btn.primary { background: var(--ink); color: var(--bg); font-weight: 700; }
.btn .ic { width: 24px; height: 24px; }
.btn.disabled { opacity: .35; }
.btn-row { display: flex; gap: 16px; align-items: center; }
.focus { box-shadow: 0 0 0 var(--ring-gap) var(--bg), 0 0 0 calc(var(--ring-gap) + var(--ring)) var(--ink) !important; }
.press { transform: scale(.95); }
.chip-btn { font-size: 21px; color: var(--ink-2); background: var(--surface); border-radius: 999px; height: 52px; padding: 0 24px; display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 999px; background: var(--ok); vertical-align: middle; flex: none; transition: background .4s; }
.dot.off { background: var(--accent); } .dot.warn { background: var(--amber); }
.amber, .step .m.amber { color: var(--amber); } .red, .step .m.red { color: #ff6b5e; } .muted { color: var(--ink-3); }

/* ---------- inkomende elementen ---------- */
.in { animation: up .5s var(--ease) backwards; animation-delay: var(--d, 0ms); }
@keyframes up { from { opacity: 0; transform: translateY(18px); } }
.swap { transition: opacity .25s, transform .25s var(--ease); }
.swap.out { opacity: 0; transform: translateY(-10px); }

/* ---------- Films-catalogus (gewoon Pleya-scherm, scene 0) ---------- */
.screen { position: absolute; inset: 0; transition: opacity .45s; }
.screen.hide { opacity: 0; pointer-events: none; visibility: hidden; }
.cat-head { display: flex; align-items: center; gap: 22px; }
.cat-head .chips { display: flex; gap: 12px; margin-left: 18px; }
.grid6 { position: absolute; left: 56px; top: 270px; display: grid; grid-template-columns: repeat(6, 281px); gap: 40px 22px; }
.card .art { width: 281px; height: 422px; border-radius: var(--r-card); position: relative; overflow: hidden; transform-origin: 50% 100%; transition: transform .3s var(--ease), box-shadow .3s; }
.card .art b { position: absolute; left: 20px; right: 20px; bottom: 22px; font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.card .art .src { position: absolute; left: 12px; top: 12px; background: rgba(20,20,20,.78); font-size: 16px; font-weight: 500; padding: 4px 10px; border-radius: 6px; }
.card .t { font-size: 21px; font-weight: 500; margin-top: 12px; }
.card .s { font-size: 18px; color: var(--ink-3); margin-top: 4px; }
.card.focus { box-shadow: none !important; }
.card.focus .art { transform: scale(1.05); box-shadow: 0 0 0 var(--ring-gap) var(--bg), 0 0 0 calc(var(--ring-gap) + var(--ring)) var(--ink), 0 24px 48px rgba(0,0,0,.6); }
.card.focus .t { font-weight: 700; }

/* ---------- Big P-scherm ---------- */
#bigp-screen .under { position: absolute; inset: 0; transition: opacity .4s; }
#bigp-screen.behind .under { opacity: .3; }
.ctx { position: absolute; right: var(--inset); top: 140px; display: flex; align-items: center; gap: 26px; font-size: 21px; color: var(--ink-2); }
.ctx span { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.ctx .sep { width: 1px; height: 26px; background: var(--hair); }
.ctx .jobs { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fig { position: absolute; left: 60px; top: 236px; width: 448px; height: 560px; transform-origin: 0 0; transition: transform .55s var(--ease), opacity .4s; }
.fig.small { transform: translate(80px, 14px) scale(.6); }
.col { position: absolute; left: 600px; top: 290px; width: 1180px; }
.st { font-size: 21px; color: var(--ink-3); display: flex; align-items: center; gap: 12px; }
.h { font-size: 44px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin-top: 14px; }
.p { font-size: 26px; line-height: 1.45; color: var(--ink-2); margin-top: 16px; max-width: 1040px; }
.q { font-size: 24px; color: var(--ink-3); }
.q b { color: var(--ink); font-weight: 500; }
.col .btn-row { margin-top: 40px; }
.ex-label { font-size: 22px; color: var(--ink-3); margin: 44px 0 16px; }
.ex { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.ctxchip { margin-top: 26px; }

/* stappenlijst: de diepte van het werk */
.steps { margin-top: 30px; width: 1040px; display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; align-items: center; gap: 18px; min-height: 58px; padding: 0 22px; border-radius: 14px; background: var(--surface); font-size: 24px; }
.step .t { flex: 1; }
.step .m { font-size: 21px; color: var(--ink-3); white-space: nowrap; transition: opacity .3s; }
.mark { width: 30px; height: 30px; border-radius: 999px; flex: none; display: grid; place-items: center; border: 3px solid var(--ink-4); animation: pulse 1.4s ease-in-out infinite; }
.mark .ic { width: 18px; height: 18px; color: var(--bg); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
.mark.ok, .mark.fail { animation: none; border-color: transparent; transition: background .2s; }
.mark.ok { background: var(--ok); } .mark.fail { background: #c0392b; }
.mark.ok .ic, .mark.fail .ic { opacity: 1; transform: none; color: var(--ink); }
@keyframes pulse { 50% { border-color: var(--ink-2); } }

/* Pleya-resultaatkaart */
.pcard { background: var(--surface); border-radius: var(--r-tile); padding: 26px 32px; margin-top: 30px; width: 1040px; }
.pcard .hd { display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--ink-3); }
.pcard .hd .ic { width: 22px; height: 22px; color: var(--ink-2); }
.pcard .line { display: flex; align-items: flex-start; gap: 18px; margin-top: 20px; }
.pcard .line > div { flex: 1; }
.pcard .line .t { font-size: 27px; font-weight: 700; }
.pcard .line .s { font-size: 21px; color: var(--ink-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
.pcard .mark { width: 40px; height: 40px; }
.pcard .mark .ic { width: 24px; height: 24px; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; }

/* ---------- systeemtoetsenbord (benaderd, zoals 38 E) ---------- */
.dim { position: absolute; inset: 0; z-index: 2; background: rgba(20,20,20,.38); opacity: 0; transition: opacity .45s; pointer-events: none; }
.dim.on { opacity: 1; }
#kb { position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: rgba(38,38,40,.97);
  transform: translateY(105%); transition: transform .5s var(--ease); z-index: 5; }
#kb.up { transform: none; box-shadow: 0 -30px 80px rgba(0,0,0,.55); }
#kb .lbl { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font-size: 18px; color: var(--ink-3); }
#kb .fld { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 1240px; height: 84px; border-radius: 14px; background: rgba(255,255,255,.10); display: flex; align-items: center; gap: 4px; padding: 0 28px; font-size: 30px; }
#kb .fld .w { animation: up .25s var(--ease) backwards; display: inline-block; white-space: pre; }
#kb .caret { width: 3px; height: 38px; background: var(--ink); margin-left: 2px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
#kb .live { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--ink-2); }
#kb .live .ic { width: 26px; height: 26px; color: var(--ink); }
#kb .keys { position: absolute; left: 50%; top: 168px; transform: translateX(-50%); display: flex; gap: 6px; }
#kb .k { width: 52px; height: 64px; border-radius: 10px; display: grid; place-items: center; font-size: 28px; color: var(--ink-2); }
#kb .ctl { position: absolute; left: 50%; top: 262px; transform: translateX(-50%); display: flex; gap: 14px; }
#kb .c { height: 64px; padding: 0 28px; border-radius: 10px; background: rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-2); transition: background .2s, color .2s, box-shadow .2s, transform .12s; }
#kb .c .ic { width: 26px; height: 26px; }
#kb .c.on { background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: 0 0 0 6px rgba(38,38,40,1), 0 0 0 10px var(--ink); }

/* ---------- opgeroepen Big P (zwevend, rechtsonder) ---------- */
#float { position: absolute; right: 0; bottom: 0; width: 1000px; height: 420px; z-index: 6; pointer-events: none;
  transform: translateY(0); transition: transform .5s var(--ease); }
#float.kbup { transform: translateY(-400px); }
#float .ffig { position: absolute; right: 50px; bottom: 30px; width: 272px; height: 340px; opacity: 0; transform: translateX(120px) scale(.85); transform-origin: 50% 85%;
  transition: opacity .35s, transform .55s cubic-bezier(.3,1.35,.5,1); }
#float .panel { position: absolute; right: 330px; bottom: 70px; width: 620px; background: var(--surface); border-radius: 20px; padding: 26px 30px 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,.55); opacity: 0; transform: translateX(40px); transition: opacity .35s, transform .5s var(--ease); }
#float .ffig::before { content: ""; position: absolute; inset: -40px -60px -30px; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,20,20,.9), rgba(20,20,20,.6) 60%, rgba(20,20,20,0)); }
#float.on .ffig, #float.on .panel { opacity: 1; transform: none; }
#float.on .panel { transition-delay: .12s; }
#float.under { z-index: 3; }
#float .panel .h { font-size: 32px; margin-top: 10px; }
#float .panel .q { font-size: 21px; }
#float .panel .ctxl { font-size: 20px; color: var(--ink-3); margin-top: 14px; display: flex; gap: 10px; align-items: center; }
#float .panel .ctxl .ic { width: 22px; height: 22px; }
#float .steps { width: auto; margin-top: 18px; }
#float .step { font-size: 21px; min-height: 52px; background: var(--elevated); padding: 0 16px; gap: 14px; }
#float .step .m { font-size: 19px; }
#float .mark { width: 26px; height: 26px; }
#float .pcard { width: auto; margin-top: 18px; background: var(--elevated); padding: 20px 22px; }
#float .pcard .line .t { font-size: 23px; }
#float .pcard .line .s { font-size: 19px; }
#float .pcard .mark { width: 34px; height: 34px; }

/* ---------- bevestiging door Pleya (38 H) ---------- */
.scrim { position: absolute; inset: 0; background: rgba(20,20,20,.55); opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 4; }
.scrim.on { opacity: 1; }
#modal { position: absolute; left: 50%; top: 50%; width: 1080px; padding: 40px 48px 44px; background: var(--surface); border-radius: 22px; box-shadow: 0 40px 100px rgba(0,0,0,.6);
  transform: translate(-50%, -44%); opacity: 0; transition: opacity .35s, transform .5s var(--ease); z-index: 7; pointer-events: none; }
#modal.on { transform: translate(-50%, -50%); opacity: 1; }
#modal .src { display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--ink-3); }
#modal .src .ic { width: 22px; height: 22px; color: var(--ink-2); }
#modal h2 { font-size: 36px; font-weight: 700; line-height: 1.15; margin-top: 12px; }
.kvs { margin-top: 26px; border-top: 1px solid var(--hair); }
.kv { display: flex; align-items: center; min-height: 70px; border-bottom: 1px solid var(--hair); font-size: 24px; }
.kv .k { width: 220px; color: var(--ink-3); flex: none; }
.kv .v { font-weight: 500; }
.pw { flex: 1; height: 56px; border-radius: 12px; background: var(--elevated); display: flex; align-items: center; gap: 14px; padding: 0 20px; font-size: 22px; transition: box-shadow .25s; }
.pw .ic { width: 22px; height: 22px; color: var(--ink-2); }
.fine { display: flex; gap: 12px; margin-top: 20px; font-size: 20px; line-height: 1.45; color: var(--ink-3); }
.fine .ic { width: 22px; height: 22px; margin-top: 3px; color: var(--ink-2); }
#modal .btn-row { margin-top: 32px; justify-content: flex-end; }

/* ---------- bediening buiten het tv-beeld ---------- */
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; font: 14px/1.3 system-ui, -apple-system, sans-serif; color: #cfcfcf; }
#controls button { font: inherit; color: #eee; background: #262626; border: 1px solid #3a3a3a; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
#controls button.on { background: #eee; color: #111; }
#controls button.trigger { border-color: var(--amber); }
#controls button.trigger.hot { background: var(--amber); color: #111; }
#controls .sep { width: 1px; height: 26px; background: #3a3a3a; margin: 0 4px; }
#controls .note { color: #9a9a9a; }
#controls label { display: inline-flex; gap: 6px; align-items: center; }
body.still #controls { display: none; }

@media (prefers-reduced-motion: reduce) {
  .in, #kb .fld .w { animation-duration: .01s; }
  .mark { animation: none; }
  #kb, #float, #float .ffig, #float .panel, #modal, .fig, .swap { transition-duration: .15s; transition-property: opacity; }
}
body.rm .in, body.rm #kb .fld .w { animation-duration: .01s; }
body.rm .mark { animation: none; }
</style>
</head>
<body>
<div id="stage"><div id="tv">
  <nav class="topnav"><div class="chip"><img src="assets/avatar.jpg" alt=""></div>
    <div class="cluster"><svg class="ic search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <div class="item" data-nav="Home">Home</div><div class="item" data-nav="Series">Series</div><div class="item" data-nav="Films">Films</div><div class="item" data-nav="Live TV">Live TV</div><div class="item" data-nav="Mijn Pleya">Mijn Pleya</div></div>
    <div class="wordmark"><img src="assets/pleya_wordmark.png" alt="Pleya"></div></nav>

  <section class="screen" id="films-screen">
    <div class="page"><div class="cat-head"><div class="page-title">Films</div>
      <div class="chips"><span class="chip-btn">Bron: Zolder</span><span class="chip-btn">Filters</span><span class="chip-btn">Recent toegevoegd</span></div></div></div>
    <div class="grid6" id="grid"></div>
  </section>

  <section class="screen" id="bigp-screen">
    <div class="under">
      <div class="page"><div class="page-title">Big P</div><div class="page-sub">Mijn Pleya ▸ Big P</div></div>
      <div class="ctx" id="ctx"></div>
      <div class="fig" id="fig"></div>
      <div class="col swap" id="col"></div>
    </div>
  </section>

  <div class="dim" id="dim"></div>
  <div class="scrim" id="scrim"></div>
  <div id="float"><div class="panel swap" id="panel"></div><div class="ffig" id="ffig"></div></div>
  <div id="kb">
    <div class="lbl">Vraag Big P</div>
    <div class="fld"><span id="typed"></span><span class="caret"></span><span class="live" id="kblive"></span></div>
    <div class="keys" id="keys"></div>
    <div class="ctl" id="kbctl"></div>
  </div>
  <div id="modal"></div>
</div></div>

<div id="controls">
  <button id="play">Pauze</button>
  <button id="next">Volgende stap</button>
  <span class="sep"></span>
  <span id="scenes"></span>
  <span class="sep"></span>
  <button id="trigger" class="trigger" title="Prototype: lang drukken op Play/Pause roept Big P op">Lang drukken Play/Pause</button>
  <label><input type="checkbox" id="rm"> Minder beweging</label>
  <span class="note" id="note"></span>
</div>

<script src="bigp.js"></script>
<script src="scenes.js"></script>
</body>
</html>
