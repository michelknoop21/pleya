<link rel="stylesheet" href="../../../liquid-glass/src/tv-glass.css">
<style>
.bleed { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.bleed img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
.bleed .scrim { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(20,20,20,.92) 0%, rgba(20,20,20,.70) 28%, rgba(20,20,20,.12) 56%, rgba(20,20,20,0) 100%),
  linear-gradient(180deg, rgba(20,20,20,.18) 0%, rgba(20,20,20,0) 18%, rgba(20,20,20,0) 52%, rgba(20,20,20,.70) 78%, var(--bg) 96%); }
.htext { position: absolute; left: var(--inset); width: 900px; top: 579px; }
.htext h1 { font-size: 56px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.htext .meta { margin-top: 12px; }
.htext .syn { margin-top: 12px; font-size: 22px; line-height: 1.35; color: var(--ink-2); }
.htext .btn-row { margin-top: 26px; }
.rails { position: absolute; left: var(--inset); right: 0; top: 880px; }
.rails .rail-label { margin-bottom: 18px; }
.rb { display: flex; gap: 22px; align-items: flex-end; height: 346px; }
.rb .c { position: relative; flex: none; width: 231px; height: 346px; border-radius: var(--r-card); overflow: hidden; background: var(--surface); }
.rb .c img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rb .c .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.25); }
.rb .c .prog i { display: block; height: 100%; background: var(--accent); }
</style>
<div class="bleed"><img src="{{art:bbb-frame}}"><div class="scrim"></div></div>
<nav class="topnav"><div class="chip tvglass on-glass">A</div><div class="cluster tvglass on-glass">
<span class="search">{{icon:search}}</span>
<div class="item on focus">Home</div><div class="item">Series</div><div class="item">Movies</div><div class="item">My Pleya</div>
</div><div class="wordmark"><img src="../assets/pleya_wordmark.png" alt="Pleya"></div></nav>
<div class="htext">
  <h1>Big Buck Bunny</h1>
  <div class="meta">Movie<span class="sep">·</span>Animation<span class="sep">·</span>2008<span class="sep">·</span>9min</div>
  <div class="syn">Follow a day of the life of Big Buck Bunny when he meets three bullying rodents: Frank, Rinky, and Gamera.</div>
  <div class="btn-row"><div class="btn primary">{{icon:play}} Resume</div><div class="btn tvglass on-glass">{{icon:info}} View details</div></div>
</div>
<div class="rails">
  <div class="rail-label">Continue Watching</div>
  <div class="rb">
    <div class="c"><img src="{{art:sintel-poster}}"><div class="prog"><i style="width:22%"></i></div></div>
    <div class="c"><img src="{{art:spring-poster}}"><div class="prog"><i style="width:55%"></i></div></div>
    <div class="c"><img src="{{art:tears-poster}}"><div class="prog"><i style="width:18%"></i></div></div>
    <div class="c"><img src="{{art:elephants-poster}}"><div class="prog"><i style="width:40%"></i></div></div>
    <div class="c"><img src="{{art:charge-poster}}"><div class="prog"><i style="width:70%"></i></div></div>
    <div class="c"><img src="{{art:caminandes-poster}}"><div class="prog"><i style="width:30%"></i></div></div>
    <div class="c"><img src="{{art:coffeerun-poster}}"><div class="prog"><i style="width:60%"></i></div></div>
  </div>
</div>
