<style>
.page { padding: 0 var(--grid-inset); }
.head { display: flex; align-items: flex-end; gap: 22px; }
.head .tags { margin-left: auto; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }
.head .tags .tag { border-color: var(--ink-4); color: var(--ink-3); font-size: 18px; line-height: 28px; }
.body { display: flex; gap: 34px; margin-top: calc(34px + var(--focus-headroom)); align-items: flex-start; }
.strip { width: 6px; flex: none; border-radius: 3px; background: var(--fill-2); margin-top: 6px; height: 300px; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 620px; text-align: center; }
.empty .ic { width: 88px; height: 88px; color: var(--ink-4); }
.empty h3 { margin-top: 30px; font-size: 38px; font-weight: 700; }
.empty p { margin-top: 14px; font-size: 24px; color: var(--ink-3); max-width: 900px; line-height: 1.4; }
.empty .btn { margin-top: 36px; }
</style>
