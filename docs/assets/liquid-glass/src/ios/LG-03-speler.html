<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LG-03 Player</title>
<link rel="stylesheet" href="ios.css">
<style>
.video { position: absolute; inset: 0; }
.video img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,.22) 100%); }
.down { left: 62px; top: 16px; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 22px; }
.tinfo { position: absolute; left: 114px; top: 16px; }
.tinfo .t { font-size: 17px; font-weight: 700; }
.tinfo .s { font-size: 12.5px; color: rgba(255,255,255,.85); margin-top: 2px; }
.tr { right: 62px; top: 16px; height: 40px; border-radius: 999px; display: flex; align-items: center; gap: 20px; padding: 0 16px; font-size: 22px; }
.ctr { position: absolute; left: 0; right: 0; top: 165px; display: flex; justify-content: center; align-items: center; gap: 56px; }
.ctr .glass { position: relative; border-radius: 999px; display: grid; place-items: center; }
.ctr .sm { width: 54px; height: 54px; font-size: 30px; }
.ctr .lg1 { width: 74px; height: 74px; font-size: 34px; }
.slab { left: 50px; right: 50px; bottom: 12px; height: 88px; border-radius: 30px; padding: 12px 22px 0; }
.times { display: flex; justify-content: space-between; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 4px; border-radius: 999px; background: rgba(255,255,255,.35); margin-top: 8px; }
.track .pos { position: absolute; left: 0; top: 0; bottom: 0; width: 23%; background: var(--accent); border-radius: 999px; }
.track .knob { position: absolute; left: 23%; top: 50%; width: 14px; height: 14px; border-radius: 999px; background: var(--accent); transform: translate(-50%,-50%); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.tools { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13.5px; }
.tools div { display: flex; align-items: center; gap: 7px; }
.tools svg { font-size: 18px; }
</style></head><body class="land">
