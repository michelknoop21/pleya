<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleya golden 05 · Boekdetail</title>
<style>

/* Fonts: the app's own Inter cuts (assets/fonts) so metrics match. */
@font-face{font-family:'Inter';font-weight:400;src:url('../../../../../../assets/fonts/Inter-Regular.otf')}
@font-face{font-family:'Inter';font-weight:500;src:url('../../../../../../assets/fonts/Inter-Medium.otf')}
@font-face{font-family:'Inter';font-weight:700;src:url('../../../../../../assets/fonts/Inter-Bold.otf')}

/* Tokens from lib/theme/mono_theme.dart (dark, non-OLED) and the DEC-090 audit §2. */
:root{
  --accent:#E5140F;
  --bg:#141414; --surface:#1F1F1F; --surface-el:#2F2F2F;
  --ink:#fff; --ink-78:rgba(255,255,255,.78); --ink-70:rgba(255,255,255,.70); --ink-62:rgba(255,255,255,.62); --ink-50:rgba(255,255,255,.5);
  --bar:#101010; --hair:rgba(255,255,255,.14);
  --r-sm:8px; --r-md:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:393px;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--bg)}
.screen[hidden],.spec[hidden]{display:none}

/* iOS status bar + Dynamic Island, as in the northstar frames. */
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none}
.status .time{position:absolute;left:38px;top:18px;font-size:17px;font-weight:700;letter-spacing:-.2px}
.status .island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62px;background:#000;border-radius:20px}
.status .right{position:absolute;right:30px;top:21px;display:flex;gap:7px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end}.sig i{display:block;width:3.5px;background:#fff;border-radius:1px}
.bat{width:27px;height:13px;border:1.6px solid rgba(255,255,255,.55);border-radius:4px;position:relative}
.bat::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:20px;background:#fff;border-radius:2px}
.bat::before{content:"";position:absolute;right:-4px;top:3.5px;width:1.8px;height:4px;background:rgba(255,255,255,.55);border-radius:0 2px 2px 0}

/* ---- Cover-derived ambience, the rule golden 01b set for the continue-reading
   card and the only place on this screen where the cover's colour is reused.
   It is a colour field, not a second, blurred print of the cover: no shape of
   the artwork survives it. The scrim lands it on the page background before
   the stats row, so the lower half of the screen is ordinary --bg. ---- */
.amb{position:absolute;left:-70px;right:-70px;top:-90px;height:660px;filter:blur(72px) saturate(1.18);opacity:.92;z-index:0}
.amb-scrim{position:absolute;left:0;right:0;top:0;height:660px;z-index:1;
  background:linear-gradient(180deg,rgba(20,20,20,.34) 0%,rgba(20,20,20,.06) 24%,rgba(20,20,20,.30) 58%,rgba(20,20,20,.86) 84%,#141414 100%)}
.amb-dune{background:radial-gradient(46% 62% at 24% 30%,#c86a24,rgba(200,106,36,0) 70%),radial-gradient(52% 66% at 74% 74%,#7d2f10,rgba(125,47,16,0) 72%),linear-gradient(150deg,#3a1a0b,#1d0e06)}
.amb-phm{background:radial-gradient(44% 58% at 28% 26%,#f0bf2c,rgba(240,191,44,0) 70%),radial-gradient(50% 62% at 78% 78%,#5a4708,rgba(90,71,8,0) 72%),linear-gradient(150deg,#2b2205,#141002)}

/* Everything above the ambience. */
.layer{position:relative;z-index:2}

/* ---- Header. Back and overflow only: the comp puts no title here, and the
   title stands 270 pt lower in 30 pt bold. Vertically on the band that
   06-film-detail.png uses for its own header (71-84 pt). ---- */
.nav{position:absolute;left:0;right:0;top:62px;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:3}
.nav .back{width:26px;height:26px}
.nav .more{width:26px;height:26px;opacity:.92}

/* ---- Cover: 150 x 225, 2:3, centred. 150 pt is the width golden 01b gave a
   Boekenseries card, and 2:3 is the ratio golden 02 fixed for the grid. ---- */
.cover{position:absolute;left:50%;margin-left:-75px;top:104px;width:150px;height:225px;border-radius:10px;overflow:hidden;
       box-shadow:0 20px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);z-index:3}

/* ---- Identity block, centred under the cover. ---- */
.ttl{position:absolute;left:16px;right:16px;text-align:center;font-size:30px;font-weight:700;line-height:36px;letter-spacing:-.5px;z-index:3}
.aut{position:absolute;left:16px;right:16px;text-align:center;font-size:17px;line-height:22px;color:var(--ink-78);z-index:3}
.ser{position:absolute;left:16px;right:16px;text-align:center;font-size:13.5px;line-height:18px;color:var(--ink-50);z-index:3}

/* ---- Reading progress: two lines of text, no bar. The percentage is exact
   and the chapter names the place; a rule across a centred column would be a
   third horizontal line right above two full-width pills. ---- */
.prg1{position:absolute;left:16px;right:16px;text-align:center;font-size:15px;font-weight:600;line-height:20px;z-index:3}
.prg2{position:absolute;left:16px;right:16px;text-align:center;font-size:13.5px;line-height:18px;color:var(--ink-62);z-index:3}

/* ---- The two actions. 48 tall with a 10 pt gap and 16 pt margins, measured
   on 06-film-detail.png; the secondary is a filled --surface-el pill, as it is
   there, not the outline the comp draws. ---- */
.cta{position:absolute;left:16px;right:16px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:3}
.cta.primary{background:#fff;color:#111;font-size:16.5px;font-weight:700}
.cta.secondary{background:var(--surface-el);color:var(--ink);font-size:16.5px;font-weight:600}
.cta svg{width:19px;height:19px;display:block}

/* ---- Stats: three columns with hairlines between them, exactly the three
   the comp names. This is the screen where a book's metadata belongs; golden
   02 kept it out of the grid, not out of the product. ---- */
.stats{position:absolute;left:16px;right:16px;height:40px;display:flex;z-index:3}
.stats .st{flex:1;text-align:center;position:relative}
.stats .st.wide{flex:1.45}
.stats .st + .st::before{content:"";position:absolute;left:0;top:5px;width:1px;height:30px;background:var(--hair)}
.stats .v{font-size:16px;font-weight:700;line-height:22px}
.stats .l{font-size:12px;line-height:16px;color:var(--ink-50);margin-top:2px}

/* ---- Description: 16/21 from 06-film-detail.png, clamped to three lines with
   an inline "meer". Three is what fits above the bar in the state that carries
   progress, and the clamp does not grow in the state that does not: an
   unstarted book gets air at the bottom, not a longer summary. ---- */
.desc{position:absolute;left:16px;right:16px;font-size:16px;line-height:21px;color:var(--ink-78);z-index:3}
.desc .more{color:var(--ink-50)}

/* Bottom bar: geometry measured on 01-series-landing.png (bar top 768 pt). */
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bar);border-top:1px solid #1E1E1E;z-index:30}
.bar .items{display:flex;height:60px}
.bar .it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;color:var(--ink-62);gap:5px}
.bar .it svg{width:26px;height:26px;display:block;fill:currentColor}
.bar .it span{font-size:11px;font-weight:500;line-height:13px;letter-spacing:.1px}
.bar .it.on{color:var(--accent)}
.bar .it .av2{width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,#3d4a8a,#1b2247 60%,#121633);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff}

/* ---- Fixture artwork: repository-safe, drawn in CSS (no commercial covers). ---- */
.art{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.9'/></svg>")}
.t,.a{position:absolute;left:0;right:0;text-align:center;font-weight:700}
.t.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}
.cv-dune{background:linear-gradient(180deg,#2a1208 0%,#5a2410 38%,#b5561c 70%,#e2893a 100%)}
.cv-dune .moon{position:absolute;width:56%;padding-top:56%;border-radius:50%;left:22%;top:12%;background:radial-gradient(circle at 35% 35%,#ffd9a0,#e08a3c 55%,#8a3a12 100%);box-shadow:0 0 30px rgba(255,170,90,.55)}
.cv-dune .dune{position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;background:radial-gradient(60% 100% at 30% 100%,#3b1a0b,rgba(59,26,11,0) 70%),radial-gradient(70% 100% at 80% 100%,#2a1208,rgba(42,18,8,0) 70%)}
.cv-dune .t{bottom:12%;font-size:30px;letter-spacing:8px;color:#f7e2c6}
.cv-dune .a{top:6%;font-size:8px;letter-spacing:2px;text-indent:2px;color:rgba(255,235,210,.8)}
.cv-phm{background:linear-gradient(160deg,#f6c62d 0%,#e9a814 55%,#1c1a12 56%,#101010 100%)}
.cv-phm .t{top:13%;font-size:25px;line-height:27px;color:#111;letter-spacing:1px}
.cv-phm .a{bottom:8%;font-size:12px;letter-spacing:2.5px;color:#f6c62d}

/* ---- Specimen frame (05c) ---- */
.spec{position:relative;width:393px;background:var(--bg);padding-bottom:30px}
.spec .lbl{padding:26px 16px 12px 16px;font-size:13px;color:var(--ink-50);letter-spacing:.3px;text-transform:uppercase}
.spec .block{position:relative;width:393px}
.spec .block .prg1,.spec .block .prg2,.spec .block .cta,.spec .block .stats{z-index:1}
</style>
</head>
<body>

<!-- ============ shared pieces, cloned into each screen by the script ======== -->
<template id="statusbar">
  <div class="status">
    <div class="time">9:41</div><div class="island"></div>
    <div class="right"><div class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></div>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2Zm0-3.6c1.5 0 2.9.6 3.9 1.6l-1.3 1.3A3.7 3.7 0 0 0 8 7.7c-1 0-1.9.4-2.6 1.1L4.1 7.5C5.1 6.5 6.5 5.9 8 5.9Zm0-3.7c2.5 0 4.9 1 6.6 2.7l-1.3 1.3A7.4 7.4 0 0 0 8 4.1c-2 0-3.9.8-5.3 2.2L1.4 4.9A9.3 9.3 0 0 1 8 2.2Z" fill="#fff"/></svg>
      <div class="bat"></div></div>
  </div>
</template>

<template id="header">
  <div class="nav">
    <svg class="back" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>
    <svg class="more" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
  </div>
</template>

<template id="tabbar">
  <nav class="bar">
    <div class="items">
      <div class="it"><svg viewBox="0 0 24 24"><path d="M11.3 3.3a1 1 0 0 1 1.4 0l8 7.6c.2.2.3.5.3.7V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.4c0-.3.1-.5.3-.7l8-7.6Z"/></svg><span>Home</span></div>
      <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" style="fill:none"><rect x="3" y="7.5" width="18" height="13" rx="2"/><path d="m8 3 4 4.5L16 3"/></svg><span>Series</span></div>
      <div class="it"><svg viewBox="0 0 24 24"><path d="M3.5 9.5h17V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V9.5Zm.6-5.6 15.8 3.3-.5 2.3L3.6 6.2l.5-2.3Zm2.9 0 2.4 2.2-2 .4L5 4.3l2-.4Zm4.2.9 2.4 2.2-2 .4-2.4-2.2 2-.4Zm4.2.9 2.4 2.2-2 .4-2.4-2.2 2-.4Z"/></svg><span>Films</span></div>
      <div class="it on"><svg viewBox="0 0 24 24"><path d="M11 4.9C9.6 4 7.7 3.5 5.9 3.5c-1.3 0-2.6.2-3.9.7v14.6c0 .3.3.5.6.4 1.1-.4 2.3-.6 3.3-.6 1.8 0 3.7.5 5.1 1.4V4.9Zm2 0v15.1c1.4-.9 3.3-1.4 5.1-1.4 1 0 2.2.2 3.3.6.3.1.6-.1.6-.4V4.2c-1.3-.5-2.6-.7-3.9-.7-1.8 0-3.7.5-5.1 1.4Z"/></svg><span>Boeken</span></div>
      <div class="it"><div class="av2">M</div><span>Mijn Pleya</span></div>
    </div>
    <div class="home-ind"></div>
  </nav>
</template>

<template id="cv-dune">
  <div class="art cv-dune"><div class="moon"></div><div class="dune"></div>
    <div class="a">FRANK HERBERT</div><div class="t serif">DUNE</div><div class="grain"></div></div>
</template>

<template id="cv-phm">
  <div class="art cv-phm">
    <div class="t">PROJECT<br>HAIL<br>MARY</div><div class="a">ANDY WEIR</div><div class="grain"></div></div>
</template>

<template id="play">
  <svg viewBox="0 0 24 24" fill="#111"><path d="M7 4.5v15l13-7.5-13-7.5Z"/></svg>
</template>

<template id="download">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v12"/><path d="m6.5 10.5 5.5 5.5 5.5-5.5"/><path d="M4.5 20.5h15"/></svg>
</template>

<!-- ================= 05a: Dune, halverwege ================= -->
<section class="screen" id="reading"></section>

<!-- ================= 05b: Project Hail Mary, nog niet begonnen ============ -->
<section class="screen" id="unread"></section>

<!-- ================= 05c: het actieblok in beide staten ================= -->
<section class="spec" id="actions">
  <div class="lbl">Met leesvoortgang: percentage, hoofdstuk, Lees verder</div>
  <div class="block" id="spec-reading"></div>
  <div class="lbl">Nog niet begonnen: het voortgangsblok vervalt, Lezen</div>
  <div class="block" id="spec-unread"></div>
</section>

<script>
  const tpl = (id) => document.getElementById(id).content.cloneNode(true);

  /// The fixed fixture, the same books the earlier goldens use.
  const DUNE = {
    cover: 'cv-dune', amb: 'amb-dune',
    title: 'Dune', author: 'Frank Herbert', series: 'Dune #1',
    progress: {percent: '48% gelezen', chapter: 'Hoofdstuk 12'},
    action: 'Lees verder',
    stats: [['1965', 'Jaar'], ['Sciencefiction', 'Genre'], ['616', "Pagina's"]],
    desc: 'Ver weg in de toekomst krijgt Paul Atreides, een briljante en begaafde jongeman, een lot dat groter is dan hij ooit had kunnen',
  };
  const PHM = {
    cover: 'cv-phm', amb: 'amb-phm',
    title: 'Project Hail Mary', author: 'Andy Weir', series: null,
    progress: null,
    action: 'Lezen',
    stats: [['2021', 'Jaar'], ['Sciencefiction', 'Genre'], ['496', "Pagina's"]],
    desc: 'Ryland Grace wordt wakker aan boord van een schip dat hij zich niet herinnert, met twee dode bemanningsleden',
  };

  /// One column, laid out from the bottom of the cover down. Each entry is the
  /// space above it and its own height, so an element a book does not have
  /// takes its gap with it: the block below moves up by exactly what is
  /// missing, and the air lands at the bottom of the page rather than being
  /// spread through the column. Dune, which has everything, reproduces the
  /// numbers measured off the comp; Project Hail Mary, which has neither a
  /// series nor progress, keeps the same 24 pt between its identity block and
  /// its first action.
  const COVER_BOTTOM = 329;
  const FLOW = [
    ['title', 20, 36],
    ['author', 4, 22],
    ['series', 2, 18],
    ['progress1', 10, 20],
    ['progress2', 0, 18],
    ['primary', 24, 48],
    ['secondary', 10, 48],
    ['stats', 20, 40],
    ['desc', 20, 63],
  ];

  function layout(book) {
    const skip = new Set();
    if (!book.series) skip.add('series');
    if (!book.progress) { skip.add('progress1'); skip.add('progress2'); }

    const y = {};
    let cursor = COVER_BOTTOM;
    for (const [name, gap, height] of FLOW) {
      if (skip.has(name)) continue;
      cursor += gap;
      y[name] = cursor;
      cursor += height;
    }
    return y;
  }

  function actionBlock(host, book, y) {
    if (book.progress) {
      const p1 = document.createElement('div');
      p1.className = 'prg1'; p1.style.top = y.progress1 + 'px'; p1.textContent = book.progress.percent;
      const p2 = document.createElement('div');
      p2.className = 'prg2'; p2.style.top = y.progress2 + 'px'; p2.textContent = book.progress.chapter;
      host.append(p1, p2);
    }

    const primary = document.createElement('div');
    primary.className = 'cta primary'; primary.style.top = y.primary + 'px';
    primary.appendChild(tpl('play'));
    primary.appendChild(document.createTextNode(book.action));
    host.appendChild(primary);

    const secondary = document.createElement('div');
    secondary.className = 'cta secondary'; secondary.style.top = y.secondary + 'px';
    secondary.appendChild(tpl('download'));
    secondary.appendChild(document.createTextNode('Downloaden'));
    host.appendChild(secondary);

    const stats = document.createElement('div');
    stats.className = 'stats'; stats.style.top = y.stats + 'px';
    for (const [value, label] of book.stats) {
      const st = document.createElement('div');
      // The genre column carries the only word of the three, and an equal
      // third is not wide enough to keep it off the hairlines.
      st.className = 'st' + (label === 'Genre' ? ' wide' : '');
      st.innerHTML = '<div class="v"></div><div class="l"></div>';
      st.querySelector('.v').textContent = value;
      st.querySelector('.l').textContent = label;
      stats.appendChild(st);
    }
    host.appendChild(stats);
  }

  function build(host, book) {
    const amb = document.createElement('div');
    amb.className = 'amb ' + book.amb;
    const scrim = document.createElement('div');
    scrim.className = 'amb-scrim';
    host.append(amb, scrim);

    host.appendChild(tpl('statusbar'));
    host.appendChild(tpl('header'));

    const cover = document.createElement('div');
    cover.className = 'cover';
    cover.appendChild(tpl(book.cover));
    host.appendChild(cover);

    const y = layout(book);
    for (const [cls, name, text] of [['ttl', 'title', book.title], ['aut', 'author', book.author], ['ser', 'series', book.series]]) {
      if (!text) continue;
      const el = document.createElement('div');
      el.className = cls;
      el.style.top = y[name] + 'px';
      el.textContent = text;
      host.appendChild(el);
    }

    actionBlock(host, book, y);

    const desc = document.createElement('div');
    desc.className = 'desc'; desc.style.top = y.desc + 'px';
    desc.textContent = book.desc + '… ';
    const more = document.createElement('span');
    more.className = 'more'; more.textContent = 'meer';
    desc.appendChild(more);
    host.appendChild(desc);

    host.appendChild(tpl('tabbar'));
  }

  build(document.getElementById('reading'), DUNE);
  build(document.getElementById('unread'), PHM);

  /// 05c lifts the action block out of the page: the same absolute geometry,
  /// re-hung from the top of its own box so the two states can be read side by
  /// side. It is a shape specification, not a runtime state.
  for (const [id, book] of [['spec-reading', DUNE], ['spec-unread', PHM]]) {
    const host = document.getElementById(id);
    const y = layout(book);
    const top = book.progress ? y.progress1 : y.primary;
    actionBlock(host, book, y);
    for (const el of host.children) el.style.top = (parseFloat(el.style.top) - top) + 'px';
    host.style.height = (y.stats + 40 - top) + 'px';
  }

  const which = new URLSearchParams(location.search).get('screen') || 'reading';
  document.querySelectorAll('.screen,.spec').forEach((s) => { s.hidden = s.id !== which; });
</script>
</body>
</html>
