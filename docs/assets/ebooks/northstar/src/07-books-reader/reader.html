<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleya golden 07 · Reader</title>
<style>

/* Fonts. Both faces are the app's own cuts from assets/fonts, so this golden
   reproduces from every clone and the chrome and the page carry the same
   metrics the app will. Inter is the chrome, as in every other golden of this
   set; Literata is the reading face, decided at revision B and recorded with
   its licence in assets/fonts/README.md. No system serif and no webfont. */
@font-face{font-family:'Inter';font-weight:400;src:url('../../../../../../assets/fonts/Inter-Regular.otf')}
@font-face{font-family:'Inter';font-weight:500;src:url('../../../../../../assets/fonts/Inter-Medium.otf')}
@font-face{font-family:'Inter';font-weight:700;src:url('../../../../../../assets/fonts/Inter-Bold.otf')}
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;
           src:url('../../../../../../assets/fonts/Literata-Variable.ttf')}

:root{
  --accent:#E5140F;
  /* App tokens (lib/theme/mono_theme.dart, dark, non-OLED) for the reader's
     own dark theme, so a reader that goes dark lands on the app's ground
     rather than on a second, nearly-identical black. */
  --app-bg:#141414;
  --r-md:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:393px;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;background:#000}
.screen{position:relative;width:393px;height:852px;overflow:hidden}
.screen[hidden],.spec[hidden]{display:none}

/* ---- Reading themes. Three grounds, three inks, three highlights. Sepia is
   what panel 7 draws and is the state 07a and 07b are shot in; panel 12 lists
   `Leesthema  Donker` as a setting, which is a different claim about the
   default and is called out as an open point. ---- */
.t-light  {--page:#FFFFFF; --ink:#1A1A1A; --ink-2:rgba(26,26,26,.55); --mark:#FFE9A8; --track:#DFDCD6}
.t-sepia  {--page:#F0E5D7; --ink:#2A2117; --ink-2:rgba(42,33,23,.55); --mark:#FDDF9E; --track:#D0C7BB}
.t-dark   {--page:#141414; --ink:rgba(255,255,255,.80); --ink-2:rgba(255,255,255,.50); --mark:rgba(245,197,66,.26); --track:#3A3A3A}
.page{position:absolute;inset:0;background:var(--page);color:var(--ink)}

/* iOS status bar. Dark ink on a light page, light ink on the dark theme: the
   platform inverts it with the content, and a reader that fills the screen is
   content. The island is black in both, because it is a hole. */
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:20;pointer-events:none}
.status .time{position:absolute;left:38px;top:18px;font-size:17px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.status .island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62px;background:#000;border-radius:20px}
.status .right{position:absolute;right:30px;top:21px;display:flex;gap:7px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end}.sig i{display:block;width:3.5px;background:var(--ink);border-radius:1px}
.bat{width:27px;height:13px;border:1.6px solid var(--ink-2);border-radius:4px;position:relative}
.bat::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:20px;background:var(--ink);border-radius:2px}
.bat::before{content:"";position:absolute;right:-4px;top:3.5px;width:1.8px;height:4px;background:var(--ink-2);border-radius:0 2px 2px 0}

/* ---- Chrome. It sits directly on the page, without the scrim 20-speler.png
   puts under its controls: that scrim exists to lift white glyphs off a moving
   photograph, and a page of text is neither moving nor a photograph. The band
   is the same 62-94 every screen in this set uses. Margin 24 and not 16: the
   chrome hangs on the frame of the reader, not on the frame of a list. ---- */
.chrome{position:absolute;left:0;right:0;top:62px;height:32px;display:flex;align-items:center;padding:0 24px;z-index:5}
.chrome .gap{flex:1}
.chrome svg{display:block}
.chrome .slot{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.chrome .slot + .slot{margin-left:24px}

/* The running head. Not chrome: it is the page's own header, the line a printed
   book carries at the top of every page, so it stays when the chrome goes. */
.runhead{position:absolute;left:24px;right:24px;top:124px;height:18px;text-align:center;
         font-size:12px;font-weight:700;letter-spacing:1.4px;line-height:18px;color:var(--ink-2);z-index:4}

/* ---- The page box. Fixed, and the whole point of it being fixed: showing or
   hiding the chrome must not reflow a single line. A page that repaginates when
   you tap it loses your place, so the bands the chrome and the footer occupy
   stay reserved whether they are drawn or not. Margin 32, wider than the
   chrome's 24, because a measure is set for reading and not for the frame. ---- */
/* Both axes are pinned rather than left to the browser. Chromium applies
   optical sizing by itself and feeds the type size into `opsz`; Flutter does
   not and would sit on the font's own default of 12. Writing 18 here makes the
   two agree, and 18 is the size the column is set at, which is what optical
   sizing means. Whether `opsz` follows a reader-chosen size is golden 08. */
.body{position:absolute;left:32px;right:32px;top:188px;z-index:3;
      font-family:Literata,serif;font-size:18px;line-height:28px;
      font-variation-settings:'opsz' 18,'wght' 400;color:var(--ink)}
.body p + p{margin-top:24px}
/* A highlight bleeds 7 pt into the margin on both sides, the way a marker
   overshoots the words it covers. */
.body mark{background:var(--mark);color:inherit;box-shadow:-7px 0 0 var(--mark),7px 0 0 var(--mark)}

/* ---- The foot: one continuous scrubber over the whole publication, and one
   line underneath. The scrubber is the reader's position control, the same
   object 20-speler.png puts under its player, in the reader's own accent. ---- */
.foot{position:absolute;left:0;right:0;top:752px;z-index:5}
.track{position:absolute;left:24px;right:24px;top:8px;height:3px;border-radius:2px;background:var(--track)}
.track .done{position:absolute;left:0;top:0;bottom:0;width:48%;background:var(--accent);border-radius:2px}
.knob{position:absolute;left:calc(24px + (393px - 48px) * .48 - 8px);top:1.5px;width:16px;height:16px;border-radius:50%;
      background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.foot .label{position:absolute;left:24px;right:24px;top:34px;text-align:center;font-size:13px;line-height:18px;color:var(--ink-2)}

.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;
          background:var(--ink);opacity:.85;z-index:20}

/* ---- Specimen frame (07c) ---- */
.spec{position:relative;width:393px;background:#000;padding-bottom:28px}
.spec .lbl{padding:26px 16px 10px 16px;font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.3px;text-transform:uppercase;font-family:Inter,sans-serif}
.spec .slice{position:relative;width:393px;height:214px;overflow:hidden}
.spec .slice .page{position:absolute;inset:0}
.spec .slice .runhead{top:20px}
.spec .slice .body{top:60px}
</style>
</head>
<body>

<template id="statusbar">
  <div class="status">
    <div class="time">9:41</div><div class="island"></div>
    <div class="right"><div class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></div>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2Zm0-3.6c1.5 0 2.9.6 3.9 1.6l-1.3 1.3A3.7 3.7 0 0 0 8 7.7c-1 0-1.9.4-2.6 1.1L4.1 7.5C5.1 6.5 6.5 5.9 8 5.9Zm0-3.7c2.5 0 4.9 1 6.6 2.7l-1.3 1.3A7.4 7.4 0 0 0 8 4.1c-2 0-3.9.8-5.3 2.2L1.4 4.9A9.3 9.3 0 0 1 8 2.2Z" fill="currentColor"/></svg>
      <div class="bat"></div></div>
  </div>
</template>

<!-- Four glyphs and not the comp's five. The comp draws two magnifiers side by
     side; one of them is either a slip or a second function with no name, and
     this golden does not invent a meaning for it.

     The bookmark is drawn hollow. A filled glyph is itself a state, and it
     would claim that the locator under the reader is bookmarked, which nothing
     in this golden decides. Hollow is "not bookmarked here"; filled is the
     state that comes with the bookmark model, later. -->
<template id="chrome">
  <div class="chrome">
    <div class="slot"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg></div>
    <div class="slot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h14"/></svg></div>
    <div class="gap"></div>
    <div class="slot"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></div>
    <div class="slot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.4L5 21V4a1 1 0 0 1 1-1Z"/></svg></div>
  </div>
</template>

<template id="runhead"><div class="runhead">DUNE · HOOFDSTUK 12</div></template>

<template id="body">
  <div class="body">
    <p>The sun hung low over the horizon, a pale disc in an endless sea of sand. Paul felt the tremor of the desert
      under his feet, a rhythm he had come to know as well as his own heartbeat.</p>
    <p>He thought of his father, of House Atreides, of everything that had been lost.</p>
    <p>But he thought too of what was still to come.</p>
    <p><mark>In the silence he heard the voice of the desert, old and patient.</mark></p>
  </div>
</template>

<!-- The specimen carries the two short paragraphs rather than the whole page:
     a theme is judged on its ground, its ink and its highlight, and the
     highlight is the one of the three that has to be in the crop. -->
<template id="body-short">
  <div class="body">
    <p>But he thought too of what was still to come.</p>
    <p><mark>In the silence he heard the voice of the desert, old and patient.</mark></p>
  </div>
</template>

<template id="foot">
  <div class="foot">
    <div class="track"><div class="done"></div></div>
    <div class="knob"></div>
    <div class="label">48% · Pagina 248 van 616</div>
  </div>
</template>

<section class="screen" id="reading"></section>
<section class="screen" id="immersive"></section>
<section class="spec" id="themes"></section>

<script>
  const tpl = (id) => document.getElementById(id).content.cloneNode(true);

  /// The fixture is Dune, chapter 12, 48 %: the position golden 01b, golden 05
  /// and the comp all agree on. The passage is written for this repository
  /// rather than
  /// quoted from the book, and it is in English because the fixture declares
  /// Dune an English edition; the comp's Dutch filler would put a translation on
  /// screen the shelf does not have.
  function build(host, {chrome}) {
    const page = document.createElement('div');
    page.className = 'page';
    host.className = 'screen t-sepia';
    host.appendChild(page);
    host.appendChild(tpl('statusbar'));
    if (chrome) host.appendChild(tpl('chrome'));
    host.appendChild(tpl('runhead'));
    host.appendChild(tpl('body'));
    if (chrome) host.appendChild(tpl('foot'));
    host.appendChild(Object.assign(document.createElement('div'), {className: 'home-ind'}));
  }

  build(document.getElementById('reading'), {chrome: true});
  build(document.getElementById('immersive'), {chrome: false});

  /// 07c lifts the same page out in all three themes so the grounds, the inks
  /// and the highlight can be judged against each other. A shape specification,
  /// not a runtime state: the reader shows one theme at a time.
  (function themes() {
    const host = document.getElementById('themes');
    for (const [cls, label] of [['t-light', 'Licht'], ['t-sepia', 'Sepia'], ['t-dark', 'Donker']]) {
      const lbl = document.createElement('div');
      lbl.className = 'lbl'; lbl.textContent = label;
      const slice = document.createElement('div');
      slice.className = 'slice ' + cls;
      const page = document.createElement('div');
      page.className = 'page';
      slice.append(page, tpl('runhead'), tpl('body-short'));
      host.append(lbl, slice);
    }
  })();

  const which = new URLSearchParams(location.search).get('screen') || 'reading';
  document.querySelectorAll('.screen,.spec').forEach((s) => { s.hidden = s.id !== which; });

  /// Reported so the specimen frame is rendered at exactly its own height
  /// instead of a number guessed and then corrected.
  window.specHeight = () => Math.ceil(document.getElementById('themes').getBoundingClientRect().height);
</script>
</body>
</html>
