# Pleya Protocol v1: contractueel leidend.
#
# De prozaspecificatie staat in docs/pleya-protocol-v1.md en legt uit waarom de
# keuzes hieronder zo zijn. Botsen de twee, dan wint dit bestand.
#
# Deze versie beschrijft feature level 1: het oppervlak dat PS-2 tot en met PS-4
# nodig hebben. Elk later oppervlak wordt toegevoegd door de fase die het
# introduceert, binnen de zes compatibiliteitsregels uit hoofdstuk 3.
openapi: 3.1.0

info:
  title: Pleya Protocol
  version: "1.0.0"
  summary: Wire-contract tussen een Pleya-client en een Pleya Server.
  description: |
    Alles wat hier niet in staat, mag een client niet aannemen.

    Zes compatibiliteitsregels binnen v1:
      1. Een nieuw optioneel veld in een antwoord mag. Clients negeren
         onbekende velden.
      2. Een veld hernoemen of verwijderen mag niet.
      3. De betekenis van een bestaand veld wijzigen mag niet.
      4. Een nieuw verplicht veld in een aanvraag mag niet, in de query net zo
         min als in de body.
      5. Een aanvraagbody is gesloten (additionalProperties: false). Een client
         stuurt een nieuw optioneel veld pas wanneer capabilities of
         feature_level zegt dat de server het kent.
      6. Een nieuwe enum-waarde mag alleen waar x-unknown-safe true is. Elk
         enum-veld in dit document draagt die markering; check_protocol.sh
         weigert er een zonder.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only

servers:
  - url: /pleya/v1
    description: Het pad draagt de majorversie.

tags:
  - name: discovery
  - name: auth
  - name: library
  - name: playback
  - name: watch-state
  - name: users
  - name: sessions

security:
  - bearerAuth: []

paths:
  /info:
    get:
      tags: [discovery]
      operationId: getInfo
      summary: Wat staat er aan de andere kant.
      description: |
        Klasse `public`. Bereikbaar zonder authenticatie, want een client moet
        weten wat er staat voordat hij een inlogpoging doet. Draagt daarom
        bewust geen servernaam, versie of buildnummer; die staan in /server.
      security: []
      responses:
        "200":
          description: Serverinformatie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /auth/setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Maak de bootstrap-eigenaar aan met de setupcode.
      description: |
        Klasse `public`, en uitsluitend zolang info.auth.setup_required waar is.
        De eerste start van een server drukt een eenmalige code af op de console.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Eigenaar aangemaakt, tokenpaar uitgegeven.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Wissel gebruikersnaam en wachtwoord in voor een tokenpaar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: |
            auth.invalid_credentials. Een onbekende gebruiker en een verkeerd
            wachtwoord geven hetzelfde antwoord, zodat het bestaan van een
            account niet lekt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Ververs het tokenpaar.
      description: |
        Klasse `public`, want het refreshtoken is zelf het bewijs. Het token
        roteert bij elk gebruik en het oude vervalt onmiddellijk. Een tweede
        aanroep met hetzelfde token geeft auth.refresh_token_reused, en de
        server mag de hele keten dan ongeldig maken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Nieuw tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/stream-token:
    post:
      tags: [auth]
      operationId: issueStreamToken
      summary: Vraag een kortlevend token voor bytes.
      description: |
        Klasse `authenticated`. Voor spelers die geen header kunnen zetten.
        Kortlevend en smal, maar NIET eenmalig: een speler doet een HEAD, dan
        een open range, dan losse ranges per seek, plus retries. Een token dat
        na de eerste range vervalt breekt op de tweede.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamTokenRequest" }
      responses:
        "200":
          description: Streamtoken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/stream-session:
    post:
      tags: [auth]
      operationId: createStreamSession
      summary: Open een browser-streamsessie.
      description: |
        Klasse `authenticated`. Alleen aanwezig wanneer `capabilities.stream_sessions`
        waar is; een client vraagt er niet om zonder die vlag.

        Waarvoor. Een `<video>`-element stuurt bij elke seek een nieuwe
        range-aanvraag met de URL uit `src`, en het streamtoken uit
        /auth/stream-token leeft twee tot vijf minuten. Een lange film breekt
        daardoor op de eerste seek na die tijd. Een streamsessie leeft langer en
        houdt het geheim buiten de URL.

        Hoe. Het antwoord draagt een niet-geheime `stream_session_id`, en de
        server zet daarnaast een cookie waarvan de NAAM die id bevat:
        `pleya_ss_<stream_session_id>=<geheim>; HttpOnly; SameSite=Strict;
        Path=/pleya/v1/stream/`, met `Secure` waar de context dat toelaat. Een
        cookienaam per sessie, want cookies met dezelfde naam, domein en pad
        vervangen elkaar en twee gelijktijdige streams zouden elkaar dan breken.
        De client zet de id in de media-URL als `ss`; het geheim komt nooit in
        een URL, een log of een referrer.

        Grens. Ten hoogste acht ACTIEVE sessies per subject. De server ruimt
        eerst verlopen en ingetrokken sessies op; blijven er acht over, dan
        weigert hij de negende met `session.stream_session_limit`. Een nog
        levende stream wordt niet stilzwijgend beëindigd om plaats te maken.

        Op een LAN zonder TLS reist het geheim in klare tekst. `HttpOnly` houdt
        JavaScript op de pagina eruit; het is geen versleuteling.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamSessionRequest" }
      responses:
        "200":
          description: De sessie, plus de cookie in Set-Cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `pleya_ss_<stream_session_id>=<geheim>`, HttpOnly en
                SameSite=Strict, op Path=/pleya/v1/stream/.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: |
            session.stream_session_limit. Er staan al acht actieve streamsessies
            voor dit subject. Beëindig er een of wacht tot er een vervalt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Beëindig de huidige sessie.
      description: |
        Klasse `authenticated`. Trekt uitsluitend de sessie in waarvan het
        accesstoken op deze aanvraag `sid` draagt. Geen vervanging van
        DELETE /sessions/{id}: een ander toestel intrekken kan hiermee niet.
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }

  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Maak een nieuwe gebruiker aan.
      description: |
        Klasse `admin`. `role` mag niet `owner` zijn; er is precies één owner
        en die ontstaat uitsluitend via /auth/setup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: De aangemaakte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.username_taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    get:
      tags: [users]
      operationId: listUsers
      summary: Gebruikers van dit huishouden.
      description: |
        Klasse `authenticated`. `owner` en `admin` zien iedereen; `member` en
        `restricted` zien in dit antwoord uitsluitend zichzelf.
      responses:
        "200":
          description: Gebruikers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Error" }

  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Wijzig rol of wachtwoord van een gebruiker.
      description: |
        Klasse `admin`, of `owner` op de eigen gebruiker. Een gebruiker die
        niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: De bijgewerkte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable. De owner kan niet gedegradeerd worden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Verwijder een gebruiker.
      description: Klasse `admin`. De owner verwijderen wordt geweigerd.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Gebruiker verwijderd. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /users/{id}/permissions:
    put:
      tags: [users]
      operationId: setUserPermissions
      summary: Zet de bibliotheekrechten van een gebruiker.
      description: |
        Klasse `admin`. Vervangt de volledige rechtenlijst van deze gebruiker.
        `owner` en `admin` hebben hier geen rijen voor: hun toegang volgt uit
        de rol.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionsRequest" }
      responses:
        "200":
          description: De nu geldende rechten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPermissionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found (aanvrager is geen admin, of de gebruiker
            bestaat niet) of library.not_found (een library_id in de aanvraag
            bestaat niet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: Sessies van een gebruiker.
      description: |
        Klasse `owner` op de eigen sessies. Met `?user_id=` kunnen `owner` en
        `admin` de sessies van een ander opvragen.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Alleen bruikbaar door `owner` en `admin`. Zonder deze parameter de eigen sessies.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Sessies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. user_id is niet van de aanvrager en de aanvrager is geen admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /sessions/{id}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Trek precies één sessie in.
      description: |
        Klasse `owner` op de eigen sessies, `admin` op elke sessie. Zet
        `revoked_at`, cascadeert naar de refreshtokens en browserstreamsessies
        van deze sessie, en werkt het intrekkingsregister bij. Een sessie-id
        dat niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.session_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /server:
    get:
      tags: [discovery]
      operationId: getServer
      summary: Serverdetail achter authenticatie.
      responses:
        "200":
          description: Naam, versie en starttijd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDetail" }
        "401": { $ref: "#/components/responses/Error" }

  /libraries:
    get:
      tags: [library]
      operationId: listLibraries
      summary: Alle zichtbare bibliotheken.
      description: Niet gepagineerd; een huishouden heeft er een handvol.
      responses:
        "200":
          description: Bibliotheken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryList" }
        "401": { $ref: "#/components/responses/Error" }

  /libraries/{library_id}/items:
    get:
      tags: [library]
      operationId: listLibraryItems
      summary: Blader door een bibliotheek.
      description: |
        Een bibliotheek van soort `shows` levert uitsluitend items met
        kind `show`. Seizoenen en afleveringen bereikt u via /items/{id}/children.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          required: false
          description: Een voorafgaand minteken keert de volgorde om.
          schema:
            type: string
            enum: [title, added_at, year, "-title", "-added_at", "-year"]
            default: title
            x-unknown-safe: false
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /items/{item_id}:
    get:
      tags: [library]
      operationId: getItem
      summary: Eén item met zijn versies en kijkstatus.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /items/{item_id}/children:
    get:
      tags: [library]
      operationId: listItemChildren
      summary: Seizoenen van een serie, afleveringen van een seizoen.
      description: Voor een film is het antwoord een lege lijst en geen fout.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /search:
    get:
      tags: [library]
      operationId: search
      summary: Zoek over alle bibliotheken.
      description: |
        Resultaten zijn gewone itemobjecten. Er is geen apart resultaattype en
        geen groepering per soort; de client groepeert zelf en hoeft daarvoor
        geen tweede vorm te kennen.

        Zonder kind levert een zoekopdracht items van soort movie, show en
        episode. Seizoenen blijven eruit: hun titel is "Season 3" en draagt
        niets van wat een gebruiker intypt, dus ze voegen alleen ruis toe aan
        korte zoektermen. Een seizoen is met kind=season wel op te vragen en
        staat verder in de kinderen van zijn serie.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ItemKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items. Geen treffers is een lege lijst, geen fout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /hubs/{hub_id}:
    get:
      tags: [library]
      operationId: getHub
      summary: Bouwstenen voor het homescherm.
      description: |
        De server levert bouwstenen en geen schermindeling; de client bouwt zijn
        eigen rijen. Een server zonder kijkstatus levert lege lijsten voor
        continue_watching en next_up, en geen fout.

        Staat capabilities.watch_state op true, dan geldt hoofdstuk 15 van de
        specificatie, dat de inhoud van beide hubs normatief vastlegt.
        continue_watching bevat films en afleveringen met watched false en
        position_ms boven nul, aflopend op het moment van de laatste wijziging.
        next_up bevat per serie precies een aflevering: de laagst genummerde
        aflevering vanaf de hoogst genummerde aflevering waar deze identiteit
        kijkstatus op heeft, die ongekeken is en waaraan nog niet begonnen is.
        Specials (seizoen met item_index 0) en ongenummerde afleveringen tellen
        niet mee, niet als kandidaat en niet als ankerpunt. Een serie zonder
        kijkstatus staat niet in next_up, en een serie die uit is verdwijnt
        eruit. De twee hubs leveren nooit hetzelfde item.

        Een cursor hoort bij de hub die hem uitgaf; hem op een andere hub
        aanbieden levert library.cursor_invalid.
      parameters:
        - name: hub_id
          in: path
          required: true
          schema:
            type: string
            enum: [recently_added, continue_watching, next_up]
            x-unknown-safe: false
        - name: library_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /artwork/{artwork_id}:
    get:
      tags: [library]
      operationId: getArtwork
      summary: Een afbeelding, eventueel op maat.
      description: |
        Artwork is onveranderlijk: een andere afbeelding krijgt een ander id.
        In v1 levert de server uitsluitend afbeeldingen die naast de media op
        schijf staan; een 404 is daarom een normale toestand en geen storing.
      parameters:
        - name: artwork_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: width
          in: query
          required: false
          description: Zonder deze parameter krijgt u het origineel.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: De afbeelding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              schema: { type: string }
              description: Lang, want artwork is onveranderlijk.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Niet gewijzigd. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /subtitles/{subtitle_id}:
    get:
      tags: [playback]
      operationId: getSubtitle
      summary: Een ondertitelbestand.
      security:
        - bearerAuth: []
        - streamToken: []
      parameters:
        - name: subtitle_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Het ondertitelbestand.
          content:
            application/x-subrip: { schema: { type: string } }
            text/x-ssa: { schema: { type: string } }
            text/vtt: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /stream/{version_id}:
    get:
      tags: [playback]
      operationId: getStream
      summary: Direct play met HTTP-range.
      description: |
        Het hoofdpad en verreweg het meeste verkeer. Geen sessie, geen state,
        geen opruimwerk.

        Eén bereik per aanvraag. Een Range-header met meerdere bereiken wordt
        beantwoord met het volledige bestand als 200; dat is de toegestane
        terugval en houdt een speler die het toch probeert aan de praat, waar
        een 416 hem zou breken.

        De ETag is een ZWAKKE validator (`W/"..."`). Pleya beheert de bestanden
        niet: ze staan op mounts die er buiten Pleya om vervangen worden, en RFC
        9110 §8.8.1 vraagt van een sterke validator strict revision control of
        een collision-resistant hash over de bytes. Geen van beide is er, dus de
        belofte staat er niet.

        Gevolg voor If-Range: de server negeert de Range-header en antwoordt met
        de volledige representatie als 200, de terugval uit RFC 9110 §13.1.5.
        Een conformante client stuurt If-Range sowieso niet met een zwakke
        validator.

        Een VERSCHILLENDE ETag betekent: er is iets veranderd, gooi de buffer
        weg. Een GELIJKE ETag zegt niets over de bytes en is nooit grond om twee
        los opgehaalde bereiken aan elkaar te plakken. Hervatten na een
        onderbreking gaat met een gewone Range-aanvraag.
      security:
        - bearerAuth: []
        - streamToken: []
        - streamSession: []
      parameters:
        - name: version_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          example: bytes=0-1048575
        - name: ss
          in: query
          required: false
          description: |
            De niet-geheime id van een browser-streamsessie uit
            POST /auth/stream-session. Het bijbehorende geheim reist als cookie
            en staat nooit in de URL. Alleen te gebruiken wanneer
            `capabilities.stream_sessions` waar is.
          schema: { type: string, minLength: 1 }
        - name: If-Range
          in: header
          required: false
          description: |
            De eerder ontvangen ETag. Die is zwak, dus de server kan er geen
            deelantwoord op geven en antwoordt met 200 en het volledige bestand.
          schema: { type: string }
      responses:
        "200":
          description: Het hele bestand. Ook het antwoord op meerdere bereiken.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Het gevraagde bereik.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Range:
              schema: { type: string }
              example: bytes 0-1048575/5368709120
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            library.version_multifile. De versie bestaat uit meer dan een
            bestand. Dat is een geldige versie in het domeinmodel; v1 begrenst
            alleen de levering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415": { $ref: "#/components/responses/Error" }
        "416":
          description: playback.range_not_satisfiable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Error" }

  /watch-state:
    post:
      tags: [watch-state]
      operationId: reportWatchState
      summary: Meld wat er gebeurd is.
      description: |
        Een update is een gebeurtenis en geen waarde. De client stuurt niet "de
        positie is nu X" maar "dit is er gebeurd", en de server beslist wat dat
        voor de toestand betekent.

        session_id is client-generated: de client maakt bij het starten van
        afspelen een UUID aan en houdt die aan tot hij stopt. Er zijn in v1
        bewust geen serverzijdige playbacksessies, dus er is ook geen endpoint
        dat een sessie-id uitdeelt.

        Op een server met capabilities.watch_state_ownership beslist het model
        uit DEC-049 wat een event met de toestand doet. De server is eigenaar:
        alleen de sessie met een geldige lease schrijft de canonieke positie,
        eigendom wordt uitsluitend verworven met explicit_action =
        playback_started, en base_revision draagt de causaliteit.

        Het antwoord is ALTIJD de actuele toestand, ook wanneer het event is
        afgewezen. Een client die een 200 krijgt met een hogere revision dan hij
        stuurde weet daarmee dat hij achterliep, en synchroniseert in plaats van
        door te schrijven. Er is dus geen foutcode voor "u bent niet de
        eigenaar"; dat is een normale uitkomst en geen fout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchStateEvent" }
      responses:
        "200":
          description: De nieuwe toestand van het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [watch-state]
      operationId: listWatchState
      summary: Alles wat deze identiteit heeft aangeraakt.
      description: |
        Gesorteerd op updated_at aflopend. updated_since is wat de offline-laag
        gebruikt om na een periode zonder netwerk bij te trekken zonder de hele
        catalogus op te halen.
      parameters:
        - name: updated_since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina kijkstatusregels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchStatePage" }
        "401": { $ref: "#/components/responses/Error" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Het accesstoken. Nooit in een querystring.
    streamSession:
      type: apiKey
      in: query
      name: ss
      description: |
        De niet-geheime helft van een browser-streamsessie. Het geheim reist in
        een cookie waarvan de naam deze id bevat, en de server valideert de twee
        samen. Alleen geldig op /stream, en alleen wanneer
        `capabilities.stream_sessions` waar is.
    streamToken:
      type: apiKey
      in: query
      name: stream_token
      description: |
        De enige uitzondering op de regel hierboven. Externe spelers kunnen geen
        header zetten. Geldig voor twee tot vijf minuten, gebonden aan een
        identiteit en een mediaresource, zonder rechten op de rest van de API.

  headers:
    ETag:
      schema: { type: string }
      description: |
        Zwakke validator, in de vorm `W/"..."`. Ondoorzichtig: een client
        ontleedt hem niet en leidt er niets uit af.

        Verschillend betekent "er is iets veranderd". Gelijk betekent NIET dat
        de bytes gelijk zijn: de server leidt hem af uit bestandsmetadata plus
        de generatie van de versie, en een in-place overschrijving van gelijke
        lengte met teruggezette mtime blijft daar onder de radar. Gebruik hem
        als change detector en nooit als bewijs van byte-identiteit.
    AcceptRanges:
      schema: { type: string, const: bytes }

  parameters:
    LibraryId:
      name: library_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    UserId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    Limit:
      name: limit
      in: query
      required: false
      description: Een hogere waarde wordt naar het maximum teruggebracht en is geen fout.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Ondoorzichtig. Hoort bij een sortering; bij een andere sortering ongeldig.
      schema: { type: string }

  responses:
    Error:
      description: Fout met een stabiele machineleesbare code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:

    Id:
      type: string
      minLength: 1
      description: |
        Ondoorzichtig voor de client. Er mag niets uit worden afgeleid, ook niet
        wanneer het op iets herkenbaars lijkt. Een pad is nooit een id.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, met Z-achtervoegsel.

    DurationMs:
      type: integer
      minimum: 0
      description: Milliseconden. Nooit seconden, nooit een kommagetal.

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              pattern: "^(auth|library|playback|session|storage)\\.[a-z0-9_]+$"
              description: Het contract. De client vertaalt codes en matcht nooit op message.
            message:
              type: string
              description: Voor logs, niet voor de UI.
            retryable:
              type: boolean
              description: |
                Expliciet en geen afleiding uit de status, omdat een 503 soms wel
                en een 409 soms niet te herhalen is.
            details:
              type: object
              additionalProperties: true

    Info:
      type: object
      required: [protocol, server, capabilities, auth]
      properties:
        protocol:
          type: object
          required: [major, feature_level, profile]
          properties:
            major: { type: integer, const: 1 }
            feature_level:
              type: integer
              minimum: 1
              description: |
                Wat de implementatie kan verstaan. Zegt niets over wat deze
                server aanbiedt; daarvoor is capabilities leidend.
            profile:
              type: string
              enum: [minimal, full]
              x-unknown-safe: false
        server:
          type: object
          required: [id]
          properties:
            id: { $ref: "#/components/schemas/Id" }
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        auth:
          type: object
          required: [methods, setup_required]
          properties:
            methods:
              type: array
              items:
                type: string
                enum: [password, pairing_code]
                x-unknown-safe: true
                description: |
                  Er mag binnen v1 een methode bij komen. Een client slaat een
                  methode die hij niet kent over en kiest er een die hij wel kent.
            setup_required:
              type: boolean
              description: True zolang er nog geen eigenaar is aangemaakt.

    Capabilities:
      type: object
      description: Altijd leidend boven feature_level.
      required: [browse, search, artwork, watch_state]
      properties:
        browse: { type: boolean }
        search: { type: boolean }
        artwork: { type: boolean }
        watch_state: { type: boolean }
        playback_plan: { type: boolean, default: false }
        transcode: { type: boolean, default: false }
        downloads: { type: boolean, default: false }
        live_tv: { type: boolean, default: false }
        realtime: { type: boolean, default: false }
        users: { type: boolean, default: false }
        watch_state_ownership:
          type: boolean
          default: false
          description: |
            De server kent het eigendomsmodel uit DEC-049: base_revision, de
            playback_started-verwerving en de backlog-markering op
            WatchStateEvent, en revision op UserState. WatchStateEvent is
            gesloten (additionalProperties: false), dus een client stuurt die
            velden pas wanneer deze vlag waar is.
        stream_sessions:
          type: boolean
          default: false
          description: |
            De server kent POST /auth/stream-session en de ss-parameter op
            /stream. Voor browsers; externe spelers blijven het streamtoken in
            de querystring gebruiken.
        sessions:
          type: boolean
          default: false
          description: |
            De server kent device-scoped sessies (DEC-102): device_id en
            device_name op LoginRequest en SetupRequest, GET/DELETE /sessions
            en POST /auth/logout. Een client stuurt device_id/device_name pas
            wanneer deze vlag waar is; zonder de vlag krijgt de sessie
            device_id NULL en een vaste plaatshouder als naam.

    ServerDetail:
      type: object
      required: [id, name, version, started_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        version: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }

    SetupRequest:
      type: object
      required: [setup_code, username, password]
      additionalProperties: false
      properties:
        setup_code: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        device_id: { $ref: "#/components/schemas/DeviceId" }
        device_name: { $ref: "#/components/schemas/DeviceName" }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        device_id: { $ref: "#/components/schemas/DeviceId" }
        device_name: { $ref: "#/components/schemas/DeviceName" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 1 }

    DeviceId:
      type: string
      minLength: 1
      description: |
        PreferenceDeviceId van de client: stabiel, niet gesynchroniseerd, en
        geen Plex-clientidentifier. Optioneel; alleen sturen wanneer
        capabilities.sessions waar is. Weglaten geeft een sessie met
        device_id NULL, hetzelfde als een client die de capability niet kent.

    DeviceName:
      type: string
      minLength: 1
      description: Mensleesbare naam, bijvoorbeeld "iPhone van Michel".

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in_ms]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: Roteert bij elk gebruik; het oude vervalt onmiddellijk.
        token_type: { type: string, const: bearer }
        expires_in_ms: { $ref: "#/components/schemas/DurationMs" }

    StreamTokenRequest:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { $ref: "#/components/schemas/Id" }

    StreamSessionRequest:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { $ref: "#/components/schemas/Id" }

    StreamSession:
      type: object
      required: [stream_session_id, expires_at]
      properties:
        stream_session_id:
          type: string
          minLength: 1
          description: |
            Niet geheim. Hoort in de ss-parameter van de media-URL. Het geheim
            zit in de cookie met de naam `pleya_ss_<stream_session_id>` en komt
            nergens anders voor.
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    StreamToken:
      type: object
      required: [stream_token, expires_at]
      properties:
        stream_token: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    LibraryKind:
      type: string
      enum: [movies, shows]
      x-unknown-safe: true
      description: |
        Er mag binnen v1 een soort bij komen. Een client die de soort niet kent
        toont de bibliotheek niet, en faalt niet.

    Library:
      type: object
      required: [id, title, kind, item_count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        item_count: { type: integer, minimum: 0 }

    LibraryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Library" }

    ItemKind:
      type: string
      enum: [movie, show, season, episode]
      x-unknown-safe: true
      description: |
        Er mag binnen v1 een soort bij komen. Een client die de soort niet kent
        toont het item niet, en faalt niet.

    Artwork:
      type: object
      description: Ids van beschikbare afbeeldingen. Null wanneer er geen is.
      properties:
        poster_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        backdrop_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }

    VideoStream:
      type: object
      required: [id, index, codec]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index: { type: integer, minimum: 0 }
        codec: { type: string }
        profile: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        bit_depth: { type: [integer, "null"] }
        frame_rate: { type: [number, "null"] }

    AudioStream:
      type: object
      required: [id, index, codec]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index: { type: integer, minimum: 0 }
        codec: { type: string }
        channels: { type: [integer, "null"] }
        language:
          type: [string, "null"]
          description: ISO 639-2/B in drie letters, of null.
        title: { type: [string, "null"] }
        is_default: { type: boolean, default: false }

    SubtitleStream:
      type: object
      required: [id, format, is_external, is_forced, is_hearing_impaired]
      description: |
        Twee soorten met hetzelfde veldenpakket. Extern heeft een url en geen
        index; ingebed heeft een index en geen url.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index:
          type: [integer, "null"]
          description: Alleen bij ingebedde sporen.
        format:
          type: string
          enum: [srt, ass, ssa, vtt, pgs, dvdsub]
          x-unknown-safe: true
          description: |
            Er mag binnen v1 een formaat bij komen. Een client die het formaat
            niet kent biedt het spoor niet aan, en faalt niet.
        language: { type: [string, "null"] }
        title: { type: [string, "null"] }
        is_default: { type: boolean, default: false }
        is_forced:
          type: boolean
          description: Expliciet, geen afleiding uit de titel.
        is_hearing_impaired:
          type: boolean
          description: Expliciet, geen afleiding uit de titel.
        is_external: { type: boolean }
        url:
          type: [string, "null"]
          description: Alleen bij externe sporen.

    Version:
      type: object
      required: [id, container, duration_ms, file_count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        container: { type: string }
        duration_ms: { $ref: "#/components/schemas/DurationMs" }
        file_count:
          type: integer
          minimum: 1
          description: |
            Een versie mag uit meerdere bestanden bestaan; dat is geldig in het
            domeinmodel. Direct play accepteert in v1 uitsluitend 1.
        edition:
          type: [string, "null"]
          description: Bijvoorbeeld "Director's Cut". Onderscheidt twee snedes van dezelfde titel.
        video_streams:
          type: array
          items: { $ref: "#/components/schemas/VideoStream" }
        audio_streams:
          type: array
          items: { $ref: "#/components/schemas/AudioStream" }
        subtitle_streams:
          type: array
          items: { $ref: "#/components/schemas/SubtitleStream" }

    UserState:
      type: object
      required: [position_ms, watched, play_count, updated_at]
      description: |
        De leeskant van kijkstatus. Reist mee in elk itemantwoord, zodat een
        detailscherm geen tweede aanvraag nodig heeft.
      properties:
        position_ms: { $ref: "#/components/schemas/DurationMs" }
        watched: { type: boolean }
        play_count: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        revision:
          type: integer
          minimum: 0
          description: |
            Monotoon en uitsluitend serverzijdig toegekend. Een client bewaart
            de laatst geziene waarde en stuurt hem terug als base_revision, en
            de server accepteert een schrijving alleen wanneer die gelijk is aan
            de actuele revision. Zo kan een client die op een verouderd beeld
            handelde de nieuwere toestand niet overschrijven.

            Afwezig op een server zonder capabilities.watch_state_ownership. Een
            client die het veld niet kent blijft correct: hij stuurt dan geen
            base_revision en de server valt terug op de eigenaarsregel.
        owned_by_this_session:
          type: boolean
          description: |
            Of de sessie die dit antwoord kreeg op dit moment de canonieke
            positie mag schrijven. Alleen aanwezig in het antwoord op
            POST /watch-state, en alleen op een server met
            capabilities.watch_state_ownership.

    Item:
      type: object
      required: [id, kind, title, added_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        sort_title: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        added_at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms:
          oneOf:
            - { $ref: "#/components/schemas/DurationMs" }
            - { type: "null" }
        parent_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        index:
          type: [integer, "null"]
          description: Seizoen- of afleveringsnummer.
        child_count: { type: [integer, "null"] }
        episode_count:
          type: [integer, "null"]
          description: Backend-neutrale naam; het interne model van de client heet anders.
        watched_episode_count: { type: [integer, "null"] }
        artwork: { $ref: "#/components/schemas/Artwork" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        user_state:
          oneOf:
            - { $ref: "#/components/schemas/UserState" }
            - { type: "null" }

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Null op de laatste pagina.
        total_estimate:
          type: [integer, "null"]
          description: |
            Expliciet een schatting, zodat een UI een scrollbar kan tekenen
            zonder dat de server per pagina telt. Nooit als exact aantal tonen.

    ItemPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Item" }

    ExplicitAction:
      type: string
      enum: [none, mark_watched, mark_unwatched, restart, playback_started]
      x-unknown-safe: false
      description: |
        Een expliciete handeling wint van elke passieve update die ervoor ligt.
        Dat onderscheid is de reden dat een update een gebeurtenis is.

        `playback_started` is de enige manier om het eigendom van de kijkstatus
        te verwerven (DEC-049). Een passief voortgangsevent verwerft nooit, ook
        niet wanneer de lease van de eigenaar verlopen is. De waarde is alleen
        toegestaan wanneer capabilities.watch_state_ownership waar is; het veld
        is niet unknown-safe, dus een oudere server wijst hem af in plaats van
        hem te negeren.

        `mark_watched`, `mark_unwatched` en `restart` negeren de lease van de
        huidige eigenaar en nemen het eigendom over. Ze ordenen op
        serverontvangst, niet op occurred_at.

    PlaybackCause:
      type: string
      enum: [user_started, reclaim]
      x-unknown-safe: false
      description: |
        Waarom een playback_started binnenkomt. Bij `user_started` heeft iemand
        op afspelen gedrukt en neemt die sessie het eigendom over, ongeacht de
        lease van een ander. Bij `reclaim` heropent een sessie die zelf nog
        speelt haar eigendom, en dat wordt alleen toegekend wanneer de lease van
        de huidige eigenaar verlopen is.

    WatchStateEvent:
      type: object
      required: [item_id, session_id, position_ms, occurred_at, explicit_action]
      additionalProperties: false
      properties:
        item_id: { $ref: "#/components/schemas/Id" }
        session_id:
          type: string
          minLength: 1
          description: |
            Client-generated. De client maakt bij het starten van afspelen een
            UUID aan en houdt die aan tot hij stopt.
        position_ms: { $ref: "#/components/schemas/DurationMs" }
        duration_ms:
          oneOf:
            - { $ref: "#/components/schemas/DurationMs" }
            - { type: "null" }
        occurred_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: |
            Het moment volgens de client. De server bewaart daarnaast zijn eigen
            ontvangstmoment, want een toestel met een scheve klok mag de
            volgorde niet bepalen.
        completed: { type: boolean, default: false }
        explicit_action: { $ref: "#/components/schemas/ExplicitAction" }
        base_revision:
          type: integer
          minimum: 0
          description: |
            De revision waarop de client zijn beeld baseerde. De server
            accepteert de schrijving alleen bij gelijkheid met de actuele
            revision; wijkt hij af, dan antwoordt de server met de actuele
            toestand en verandert er niets aan de canonieke positie.

            Weglaten mag: dan doet het event geen causale claim, en wordt het
            alleen geaccepteerd van de huidige eigenaar met een geldige lease.
            Een expliciete handeling wordt wél toegepast met een verouderde
            base_revision, zolang hij live binnenkomt en niet als backlog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.
        cause:
          allOf: [{ $ref: "#/components/schemas/PlaybackCause" }]
          description: |
            Verplicht bij explicit_action = playback_started en zinloos
            daarbuiten. Alleen te sturen wanneer
            capabilities.watch_state_ownership waar is.
        backlog:
          type: boolean
          default: false
          description: |
            Dit event komt uit een offline wachtrij en niet uit een sessie die nu
            speelt. Een backlog verwerft nooit eigendom en verplaatst de
            canonieke toestand niet zolang revision > 0, ook niet wanneer de
            lease van de eigenaar verlopen is. Alleen bij revision = 0 is er
            niets te beschermen en vestigt het laatste event uit de batch de
            toestand alsnog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.

    WatchStateEntry:
      type: object
      required: [item_id, state]
      properties:
        item_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/UserState" }

    WatchStatePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/WatchStateEntry" }

    Role:
      type: string
      enum: [owner, admin, member, restricted]
      x-unknown-safe: false
      description: |
        Vier rollen (DEC-098), gesloten. Een client moet weten wat een rol
        betekent voordat hij ernaar handelt: `owner` (precies één, niet te
        verwijderen of te degraderen), `admin`, `member`, `restricted`
        (als member, kan nooit manage krijgen en beheert zijn eigen
        wachtwoord niet).

    Permission:
      type: string
      enum: [view, download, manage]
      x-unknown-safe: false
      description: |
        Een geordende ladder (DEC-098): download impliceert view, manage
        impliceert beide. Gesloten, om dezelfde reden als Role.

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        role: { $ref: "#/components/schemas/Role" }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Minimaal één van beide velden; een leeg object is geen geldige aanvraag.
      properties:
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 8 }

    LibraryPermission:
      type: object
      required: [library_id, permission]
      properties:
        library_id: { $ref: "#/components/schemas/Id" }
        permission: { $ref: "#/components/schemas/Permission" }

    LibraryPermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryPermission" }

    PermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          items: { $ref: "#/components/schemas/LibraryPermission" }

    Session:
      type: object
      required: [id, device_name, created_at, last_seen_at, current]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        device_name:
          type: string
          description: Een vaste plaatshouder voor een sessie zonder bekend toestel.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        current:
          type: boolean
          description: True voor de sessie die deze aanvraag zelf doet.

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
