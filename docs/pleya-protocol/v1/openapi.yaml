        `GET /items/{item_id}`; een tweede kopie van de itemgegevens hier zou
        een tweede bron maken voor dezelfde vraag.
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: |
            De id van de streamsessie. Niet geheim: hij reist als `ss` in de
            media-URL en mag in browsergeschiedenis en logs staan.
        user_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        device_name:
          type: string
          description: |
            Ontbreekt wanneer de streamsessie geen auth-sessie draagt, en dat
            is een rij van vóór de migratie die sessies introduceerde. Een
            client verzint er zelf een plaatshouder bij als hij die wil tonen.
        item_id: { $ref: "#/components/schemas/Id" }
        item_title: { type: string }
        item_kind: { $ref: "#/components/schemas/ItemKind" }
        position_ms:
          allOf: [{ $ref: "#/components/schemas/DurationMs" }]
          description: |
