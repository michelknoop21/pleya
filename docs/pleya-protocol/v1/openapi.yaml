# Pleya Protocol v1: contractueel leidend.
#
# De prozaspecificatie staat in docs/pleya-protocol-v1.md en legt uit waarom de
# keuzes hieronder zo zijn. Botsen de twee, dan wint dit bestand.
#
# Deze versie beschrijft feature level 1: het oppervlak dat PS-2 tot en met PS-4
# nodig hebben. Elk later oppervlak wordt toegevoegd door de fase die het
# introduceert, binnen de zes compatibiliteitsregels uit hoofdstuk 3.
openapi: 3.1.0

info:
  title: Pleya Protocol
  version: "1.0.0"
  summary: Wire-contract tussen een Pleya-client en een Pleya Server.
  description: |
    Alles wat hier niet in staat, mag een client niet aannemen.

    Zes compatibiliteitsregels binnen v1:
      1. Een nieuw optioneel veld in een antwoord mag. Clients negeren
         onbekende velden.
      2. Een veld hernoemen of verwijderen mag niet.
      3. De betekenis van een bestaand veld wijzigen mag niet.
      4. Een nieuw verplicht veld in een aanvraag mag niet, in de query net zo
         min als in de body.
      5. Een aanvraagbody is gesloten (additionalProperties: false). Een client
         stuurt een nieuw optioneel veld pas wanneer capabilities of
         feature_level zegt dat de server het kent.
      6. Een nieuwe enum-waarde mag alleen waar x-unknown-safe true is. Elk
         enum-veld in dit document draagt die markering; check_protocol.sh
         weigert er een zonder.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only

servers:
  - url: /pleya/v1
    description: Het pad draagt de majorversie.

tags:
  - name: discovery
  - name: auth
  - name: library
  - name: playback
  - name: watch-state
  - name: users
  - name: sessions
  - name: administration

security:
  - bearerAuth: []

paths:
  /info:
    get:
      tags: [discovery]
      operationId: getInfo
      summary: Wat staat er aan de andere kant.
      description: |
        Klasse `public`. Bereikbaar zonder authenticatie, want een client moet
        weten wat er staat voordat hij een inlogpoging doet. Draagt daarom
        bewust geen servernaam, versie of buildnummer; die staan in /server.
      security: []
      responses:
        "200":
          description: Serverinformatie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Maak de bootstrap-eigenaar aan met de setupcode.
      description: |
        Klasse `public`, en uitsluitend zolang info.auth.setup_required waar is.
        De eerste start van een server drukt een eenmalige code af op de console.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Eigenaar aangemaakt, tokenpaar uitgegeven.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Wissel gebruikersnaam en wachtwoord in voor een tokenpaar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: |
            auth.invalid_credentials. Een onbekende gebruiker en een verkeerd
            wachtwoord geven hetzelfde antwoord, zodat het bestaan van een
            account niet lekt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: |
            auth.origin_rejected. Alleen op het cookiepad: de aanvraag droeg
            credential_mode cookie en kwam van een origin die deze server niet
            toestaat, of droeg helemaal geen Origin. Zie hoofdstuk 17d.4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Ververs het tokenpaar.
      description: |
        Klasse `public`, want het refreshtoken is zelf het bewijs. Het token
        roteert bij elk gebruik en het oude vervalt onmiddellijk. Een tweede
        aanroep met hetzelfde token geeft auth.refresh_token_reused, en de
        server mag de hele keten dan ongeldig maken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Nieuw tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: |
            auth.origin_rejected. Alleen op het cookiepad; zie hoofdstuk 17d.4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/stream-token:
    post:
      tags: [auth]
      operationId: issueStreamToken
      summary: Vraag een kortlevend token voor bytes.
      description: |
        Klasse `authenticated`. Voor spelers die geen header kunnen zetten.
        Kortlevend en smal, maar NIET eenmalig: een speler doet een HEAD, dan
        een open range, dan losse ranges per seek, plus retries. Een token dat
        na de eerste range vervalt breekt op de tweede.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamTokenRequest" }
      responses:
        "200":
          description: Streamtoken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/stream-session:
    post:
      tags: [auth]
      operationId: createStreamSession
      summary: Open een browser-streamsessie.
      description: |
        Klasse `authenticated`. Alleen aanwezig wanneer `capabilities.stream_sessions`
        waar is; een client vraagt er niet om zonder die vlag.

        Waarvoor. Een `<video>`-element stuurt bij elke seek een nieuwe
        range-aanvraag met de URL uit `src`, en het streamtoken uit
        /auth/stream-token leeft twee tot vijf minuten. Een lange film breekt
        daardoor op de eerste seek na die tijd. Een streamsessie leeft langer en
        houdt het geheim buiten de URL.

        Hoe. Het antwoord draagt een niet-geheime `stream_session_id`, en de
        server zet daarnaast een cookie waarvan de NAAM die id bevat:
        `pleya_ss_<stream_session_id>=<geheim>; HttpOnly; SameSite=Strict;
        Path=/pleya/v1/stream/`, met `Secure` waar de context dat toelaat. Een
        cookienaam per sessie, want cookies met dezelfde naam, domein en pad
        vervangen elkaar en twee gelijktijdige streams zouden elkaar dan breken.
        De client zet de id in de media-URL als `ss`; het geheim komt nooit in
        een URL, een log of een referrer.

        Grens. Ten hoogste acht ACTIEVE sessies per subject. De server ruimt
        eerst verlopen en ingetrokken sessies op; blijven er acht over, dan
        weigert hij de negende met `session.stream_session_limit`. Een nog
        levende stream wordt niet stilzwijgend beëindigd om plaats te maken.

        Op een LAN zonder TLS reist het geheim in klare tekst. `HttpOnly` houdt
        JavaScript op de pagina eruit; het is geen versleuteling.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamSessionRequest" }
      responses:
        "200":
          description: De sessie, plus de cookie in Set-Cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `pleya_ss_<stream_session_id>=<geheim>`, HttpOnly en
                SameSite=Strict, op Path=/pleya/v1/stream/.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: |
            session.stream_session_limit. Er staan al acht actieve streamsessies
            voor dit subject. Beëindig er een of wacht tot er een vervalt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Beëindig de huidige sessie.
      description: |
        Klasse `authenticated`. Trekt uitsluitend de sessie in waarvan het
        accesstoken op deze aanvraag `sid` draagt. Geen vervanging van
        DELETE /sessions/{id}: een ander toestel intrekken kan hiermee niet.
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/api-tokens:
    post:
      tags: [auth]
      operationId: createApiToken
      summary: Maak een API-token.
      description: |
        Klasse `authenticated` op zichzelf, `admin` met `user_id` van een ander.
        Dezelfde regel als `GET /sessions`, en met opzet geen beheerroute: RB-20
        beschrijft een token dat een gebruiker voor zichzelf maakt, of een
        beheerder namens iemand.

        Een API-token is een sessie met `kind: api`. Het valt onder
        `DELETE /sessions/{id}`, onder dezelfde intrekking binnen twee seconden,
        en het staat in `GET /sessions` naast de toestellen.

        `secret` staat precies één keer in een antwoord: hier. De server bewaart
        alleen de hash ervan, dus een tweede kans is er niet.

        Het bereik komt nooit boven de rol van de eigenaar. Een aanvraag die dat
        wel doet krijgt `auth.scope_exceeds_role`, met het gevraagde bereik en de
        rol in `details`.

        Een aanvraag die zelf met een API-token is geauthenticeerd kan alleen
        tokens maken wanneer dat token bereik `admin` heeft; anders is het
        antwoord `404`, byte-gelijk aan dat van een beheerroute. Zonder die
        regel zou een `read`-token van een beheerder een `admin`-token kunnen
        maken, want het bereik wordt tegen de rol getoetst en de rol is dan
        `admin`.

        Beschikbaar wanneer `capabilities.api_tokens` waar is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenRequest" }
      responses:
        "201":
          description: Het token, met het geheim erbij.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400":
          description: |
            auth.scope_exceeds_role wanneer het bereik boven de rol van de
            eigenaar uitkomt, session.invalid bij een naam, bereik of
            geldigheidsduur die niet klopt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found. user_id is niet van de aanvrager en de
            aanvrager is geen admin, of de aanvraag komt van een API-token
            zonder bereik `admin`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [auth]
      operationId: listApiTokens
      summary: De levende API-tokens van een gebruiker.
      description: |
        Klasse `authenticated` op zichzelf, `admin` met `?user_id=`. Zonder
        geheimen: die bestaan na het aanmaken alleen nog bij de aanvrager.

        Ingetrokken en verlopen tokens staan er niet in, om dezelfde reden als
        bij `GET /sessions`: de lijst beantwoordt wat er nú met dit account kan
        praten.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Alleen bruikbaar door `owner` en `admin`. Zonder deze parameter de eigen tokens.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: De tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. user_id is niet van de aanvrager en de aanvrager is geen admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /audit:
    get:
      tags: [administration]
      operationId: listAudit
      summary: Het auditlog.
      description: |
        Klasse `admin`. Eén regel per beherende handeling, nieuwste eerst.

        Het bereik is ruimer dan alleen mutaties op beheerendpoints: geslaagde
        en mislukte logins, het aanmaken en intrekken van tokens en sessies,
        rol- en rechtenwijzigingen, en de configuratie die de beveiliging raakt.
        Wat er niet in staat is even bewust: catalogusreads, playbackticks en
        leesvoortgang zijn volume zonder beveiligingsbetekenis.

        Regels worden negentig dagen bewaard en daarna door de opruimronde
        verwijderd. Die termijn is geen instelling: een bewaartermijn die een
        beheerder kan verlagen, kan een aanvaller met beheerrechten verlagen.

        `detail` uit de tabel staat niet in het antwoord. Het is vrije vorm, en
        vrije vorm in een antwoord is de weg waarlangs er ooit iets in belandt
        dat er niet in hoort.
      parameters:
        - name: source
          in: query
          required: false
          description: |
            `http` of `mcp`. Een onbekende waarde is geen fout maar een filter
            dat niets oplevert.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: De regels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: library.cursor_invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Maak een nieuwe gebruiker aan.
      description: |
        Klasse `admin`. `role` mag niet `owner` zijn; er is precies één owner
        en die ontstaat uitsluitend via /auth/setup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: De aangemaakte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.username_taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [users]
      operationId: listUsers
      summary: Gebruikers van dit huishouden.
      description: |
        Klasse `authenticated`. `owner` en `admin` zien iedereen; `member` en
        `restricted` zien in dit antwoord uitsluitend zichzelf.
      responses:
        "200":
          description: Gebruikers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: De gebruiker die deze aanvraag doet.
      description: |
        Klasse `authenticated`, en de enige beheerachtige route waar elke rol
        `200` krijgt. Dat is geen uitzondering op de 404-regel maar de
        toepassing ervan: het doel is de aanvrager zelf, er staat geen id in het
        pad en er is geen parameter, dus er valt niets te raden.

        Beschikbaar wanneer `capabilities.users` waar is; `administration` is
        hier niet voor nodig. Een oudere server kent de route niet en antwoordt
        `404`; een client valt dan terug op de naam waarmee hij inlogde.

        `me` botst niet met een id: er is geen `GET /users/{id}`.
      responses:
        "200":
          description: De eigen gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found. De gebruiker achter dit token bestaat niet
            meer; het accesstoken heeft zijn gebruiker overleefd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Wijzig rol of wachtwoord van een gebruiker.
      description: |
        Klasse `admin`, of `owner` op de eigen gebruiker. Een gebruiker die
        niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: De bijgewerkte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable. De owner kan niet gedegradeerd worden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Verwijder een gebruiker.
      description: Klasse `admin`. De owner verwijderen wordt geweigerd.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Gebruiker verwijderd. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}/permissions:
    put:
      tags: [users]
      operationId: setUserPermissions
      summary: Zet de bibliotheekrechten van een gebruiker.
      description: |
        Klasse `admin`. Vervangt de volledige rechtenlijst van deze gebruiker.
        `owner` en `admin` hebben hier geen rijen voor: hun toegang volgt uit
        de rol.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionsRequest" }
      responses:
        "200":
          description: De nu geldende rechten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPermissionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found (aanvrager is geen admin, of de gebruiker
            bestaat niet) of library.not_found (een library_id in de aanvraag
            bestaat niet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: |
            auth.permission_not_allowed. De rol van het doel verbiedt deze
            trede: `restricted` krijgt nooit `manage` (DEC-098). Geen `404`,
            want de aanvrager is een beheerder die de gebruiker en de
            bibliotheek allebei al mag zien; er valt niets te verbergen. De
            hele lijst wordt geweigerd, ook de treden die op zichzelf mochten.
            `details` draagt `permission` en `role`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: Sessies van een gebruiker.
      description: |
        Klasse `owner` op de eigen sessies. Met `?user_id=` kunnen `owner` en
        `admin` de sessies van een ander opvragen.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Alleen bruikbaar door `owner` en `admin`. Zonder deze parameter de eigen sessies.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Sessies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. user_id is niet van de aanvrager en de aanvrager is geen admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sessions/{id}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Trek precies één sessie in.
      description: |
        Klasse `owner` op de eigen sessies, `admin` op elke sessie. Zet
        `revoked_at`, cascadeert naar de refreshtokens en browserstreamsessies
        van deze sessie, en werkt het intrekkingsregister bij. Een sessie-id
        dat niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.session_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /stream-sessions:
    get:
      tags: [administration]
      operationId: listStreamSessions
      summary: Wie er op dit moment kijkt.
      description: |
        Klasse `admin`. De browser-streamsessies (6.4a) die op dit moment nog
        bytes kunnen ophalen: niet ingetrokken, niet verlopen, en de auth-sessie
        waaruit ze zijn uitgegeven evenmin ingetrokken. Een sessie die aan een
        van die drie voorwaarden niet voldoet staat er niet in, want een
        overzicht dat iemand toont die op zijn eerstvolgende aanvraag geweigerd
        wordt is misleidend.

        Ongepagineerd. Het aantal is per gebruiker begrensd door
        `max_stream_sessions` (1 tot 32), dus de lijst groeit met het
        huishouden en niet met de bibliotheek.

        Er staat geen geheim in. Het geheim van een streamsessie leeft
        uitsluitend in de cookie `pleya_ss_<id>`; de id zelf is niet geheim en
        reist als `ss` in de media-URL.
      responses:
        "200":
          description: De lopende streams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server:
    get:
      tags: [discovery]
      operationId: getServer
      summary: Serverdetail achter authenticatie.
      description: |
        Klasse `authenticated`. Voor klasse `admin` komen er acht velden bij
        (S1.3): `public_url`, `listen`, `behind_proxy`, `trusted_proxies`,
        `build`, `database`, `ffprobe` en `health`. Een lid krijgt hetzelfde
        antwoord als altijd, zonder die velden en zonder een aanwijzing dat ze
        bestaan.
      responses:
        "200":
          description: Naam, versie en starttijd; voor een beheerder ook hoe de server draait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/environment:
    get:
      tags: [administration]
      operationId: getServerEnvironment
      summary: De omgevingsvariabelen van deze server.
      description: |
        Klasse `admin`. Alleen `PLEYA_SERVER_*` plus een gemaskeerde
        `DATABASE_URL`; de rest van de procesomgeving hoort bij de container en
        kan credentials van heel andere diensten dragen. Een lid of een
        beperkte gebruiker krijgt `404`.
      responses:
        "200":
          description: De variabelen, gesorteerd op naam.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvironment" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/log:
    get:
      tags: [administration]
      operationId: getServerLog
      summary: De laatste logregels.
      description: |
        Klasse `admin`. De regels komen uit een ringbuffer in het geheugen en
        nooit uit een bestand, en ze zijn geredigeerd op de weg de buffer in.
        Nieuwste eerst.
      parameters:
        - name: level
          in: query
          required: false
          description: Ondergrens. Een waarde die deze server niet kent is geen fout maar geen filter.
          schema: { $ref: "#/components/schemas/LogLevel" }
        - name: limit
          in: query
          required: false
          description: Hoogstens 500, de capaciteit van de buffer. Een hogere waarde wordt daarheen teruggebracht.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: De regels, nieuwste eerst.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerLog" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/connectivity-check:
    post:
      tags: [administration]
      operationId: checkConnectivity
      summary: Is deze server van buiten bereikbaar, en komen ranges heel aan.
      description: |
        Klasse `admin`. Er is geen aanvraagbody, en dat is de beveiliging: het
        doel is altijd het eigen `public_url` en er is dus niets aan de
        aanvrager om het ergens anders heen te richten. Vaste time-out, geen
        omleidingen. Zonder ingesteld `public_url` is het antwoord `false` op
        beide metingen, want er is dan niets aan te roepen.
      responses:
        "200":
          description: De uitkomst van de twee metingen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectivityCheck" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/rotate-signing-key:
    post:
      tags: [administration]
      operationId: rotateSigningKey
      summary: Vervang de ondertekensleutel en trek elke sessie in.
      description: |
        Klasse `admin`, en de bevestiging is verplicht: `confirm` moet
        letterlijk `rotate` zijn.

        De handeling trekt eerst elke sessie in en vervangt daarna pas de
        sleutel. Andersom zou een mislukte schrijfactie een server achterlaten
        waarvan de accesstokens dood zijn en de refreshtokens leven, en dan
        logt elke client zichzelf meteen weer in met precies de keten die de
        beheerder wilde verbreken.

        Ook het token van de aanvrager is hierna dood; opnieuw inloggen hoort
        erbij. Het antwoord draagt de nieuwe sleutel niet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateSigningKeyRequest" }
      responses:
        "204": { description: "Sleutel vervangen; alle sessies zijn ingetrokken." }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: server.confirm_mismatch. De bevestiging ontbreekt of klopt niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /settings:
    get:
      tags: [administration]
      operationId: getSettings
      summary: De beheerbare serverinstellingen.
      description: |
        Klasse `admin`. Per sleutel de waarde die nu geldt plus de laag die hem
        levert: `env` is de omgeving waarmee de server startte, `db` een waarde
        die een beheerder heeft opgeslagen. Een lid of een beperkte gebruiker
        krijgt `404`, dezelfde weigering als overal (hoofdstuk 7.1).

        Wat hier niet in staat is een keuze en geen omissie: bindadres,
        vertrouwde proxy's, paden en de ondertekensleutel horen bij het draaien
        van de container en niet bij beheer in de app.
      responses:
        "200":
          description: De set zoals hij nu geldt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [administration]
      operationId: patchSettings
      summary: Wijzig een of meer instellingen.
      description: |
        Klasse `admin`. De body is gesloten: een onbekende sleutel is een fout
        en geen veld dat stil wegvalt. Elke waarde heeft een grens; een waarde
        erbuiten geeft `settings.invalid_value` met het veld en de grens in
        `details`, en dan wijzigt er niets, ook niet aan de sleutels die wel
        klopten.

        Een geslaagde wijziging geldt vanaf het eerstvolgende verzoek: een
        nieuwe TTL zit dus in het eerstvolgende token, zonder herstart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: De set na de wijziging.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400":
          description: settings.invalid_value. Onbekende sleutel, verkeerd type, of buiten de grens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries:
    get:
      tags: [library]
      operationId: listLibraries
      summary: Alle zichtbare bibliotheken.
      description: Niet gepagineerd; een huishouden heeft er een handvol.
      responses:
        "200":
          description: Bibliotheken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryList" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/items:
    get:
      tags: [library]
      operationId: listLibraryItems
      summary: Blader door een bibliotheek.
      description: |
        Een bibliotheek van soort `shows` levert uitsluitend items met
        kind `show`. Seizoenen en afleveringen bereikt u via /items/{id}/children.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          required: false
          description: Een voorafgaand minteken keert de volgorde om.
          schema:
            type: string
            enum: [title, added_at, year, "-title", "-added_at", "-year"]
            default: title
            x-unknown-safe: false
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /items/{item_id}:
    get:
      tags: [library]
      operationId: getItem
      summary: Eén item met zijn versies en kijkstatus.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /items/{item_id}/children:
    get:
      tags: [library]
      operationId: listItemChildren
      summary: Seizoenen van een serie, afleveringen van een seizoen.
      description: Voor een film is het antwoord een lege lijst en geen fout.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /search:
    get:
      tags: [library]
      operationId: search
      summary: Zoek over alle bibliotheken.
      description: |
        Resultaten zijn gewone itemobjecten. Er is geen apart resultaattype en
        geen groepering per soort; de client groepeert zelf en hoeft daarvoor
        geen tweede vorm te kennen.

        Zonder kind levert een zoekopdracht items van soort movie, show en
        episode. Seizoenen blijven eruit: hun titel is "Season 3" en draagt
        niets van wat een gebruiker intypt, dus ze voegen alleen ruis toe aan
        korte zoektermen. Een seizoen is met kind=season wel op te vragen en
        staat verder in de kinderen van zijn serie.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ItemKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items. Geen treffers is een lege lijst, geen fout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /hubs/{hub_id}:
    get:
      tags: [library]
      operationId: getHub
      summary: Bouwstenen voor het homescherm.
      description: |
        De server levert bouwstenen en geen schermindeling; de client bouwt zijn
        eigen rijen. Een server zonder kijkstatus levert lege lijsten voor
        continue_watching en next_up, en geen fout.

        Staat capabilities.watch_state op true, dan geldt hoofdstuk 15 van de
        specificatie, dat de inhoud van beide hubs normatief vastlegt.
        continue_watching bevat films en afleveringen met watched false en
        position_ms boven nul, aflopend op het moment van de laatste wijziging.
        next_up bevat per serie precies een aflevering: de laagst genummerde
        aflevering vanaf de hoogst genummerde aflevering waar deze identiteit
        kijkstatus op heeft, die ongekeken is en waaraan nog niet begonnen is.
        Specials (seizoen met item_index 0) en ongenummerde afleveringen tellen
        niet mee, niet als kandidaat en niet als ankerpunt. Een serie zonder
        kijkstatus staat niet in next_up, en een serie die uit is verdwijnt
        eruit. De twee hubs leveren nooit hetzelfde item.

        Een cursor hoort bij de hub die hem uitgaf; hem op een andere hub
        aanbieden levert library.cursor_invalid.
      parameters:
        - name: hub_id
          in: path
          required: true
          schema:
            type: string
            enum: [recently_added, continue_watching, next_up]
            x-unknown-safe: false
        - name: library_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /artwork/{artwork_id}:
    get:
      tags: [library]
      operationId: getArtwork
      summary: Een afbeelding, eventueel op maat.
      description: |
        Artwork is onveranderlijk: een andere afbeelding krijgt een ander id.
        In v1 levert de server uitsluitend afbeeldingen die naast de media op
        schijf staan; een 404 is daarom een normale toestand en geen storing.
      parameters:
        - name: artwork_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: width
          in: query
          required: false
          description: Zonder deze parameter krijgt u het origineel.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: De afbeelding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              schema: { type: string }
              description: Lang, want artwork is onveranderlijk.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Niet gewijzigd. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /subtitles/{subtitle_id}:
    get:
      tags: [playback]
      operationId: getSubtitle
      summary: Een ondertitelbestand.
      security:
        - bearerAuth: []
        - streamToken: []
      parameters:
        - name: subtitle_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Het ondertitelbestand.
          content:
            application/x-subrip: { schema: { type: string } }
            text/x-ssa: { schema: { type: string } }
            text/vtt: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /stream/{version_id}:
    get:
      tags: [playback]
      operationId: getStream
      summary: Direct play met HTTP-range.
      description: |
        Het hoofdpad en verreweg het meeste verkeer. Geen sessie, geen state,
        geen opruimwerk.

        Eén bereik per aanvraag. Een Range-header met meerdere bereiken wordt
        beantwoord met het volledige bestand als 200; dat is de toegestane
        terugval en houdt een speler die het toch probeert aan de praat, waar
        een 416 hem zou breken.

        De ETag is een ZWAKKE validator (`W/"..."`). Pleya beheert de bestanden
        niet: ze staan op mounts die er buiten Pleya om vervangen worden, en RFC
        9110 §8.8.1 vraagt van een sterke validator strict revision control of
        een collision-resistant hash over de bytes. Geen van beide is er, dus de
        belofte staat er niet.

        Gevolg voor If-Range: de server negeert de Range-header en antwoordt met
        de volledige representatie als 200, de terugval uit RFC 9110 §13.1.5.
        Een conformante client stuurt If-Range sowieso niet met een zwakke
        validator.

        Een VERSCHILLENDE ETag betekent: er is iets veranderd, gooi de buffer
        weg. Een GELIJKE ETag zegt niets over de bytes en is nooit grond om twee
        los opgehaalde bereiken aan elkaar te plakken. Hervatten na een
        onderbreking gaat met een gewone Range-aanvraag.
      security:
        - bearerAuth: []
        - streamToken: []
        - streamSession: []
      parameters:
        - name: version_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          example: bytes=0-1048575
        - name: ss
          in: query
          required: false
          description: |
            De niet-geheime id van een browser-streamsessie uit
            POST /auth/stream-session. Het bijbehorende geheim reist als cookie
            en staat nooit in de URL. Alleen te gebruiken wanneer
            `capabilities.stream_sessions` waar is.
          schema: { type: string, minLength: 1 }
        - name: If-Range
          in: header
          required: false
          description: |
            De eerder ontvangen ETag. Die is zwak, dus de server kan er geen
            deelantwoord op geven en antwoordt met 200 en het volledige bestand.
          schema: { type: string }
      responses:
        "200":
          description: Het hele bestand. Ook het antwoord op meerdere bereiken.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Het gevraagde bereik.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Range:
              schema: { type: string }
              example: bytes 0-1048575/5368709120
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            library.version_multifile. De versie bestaat uit meer dan een
            bestand. Dat is een geldige versie in het domeinmodel; v1 begrenst
            alleen de levering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415": { $ref: "#/components/responses/Error" }
        "416":
          description: playback.range_not_satisfiable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /watch-state:
    post:
      tags: [watch-state]
      operationId: reportWatchState
      summary: Meld wat er gebeurd is.
      description: |
        Een update is een gebeurtenis en geen waarde. De client stuurt niet "de
        positie is nu X" maar "dit is er gebeurd", en de server beslist wat dat
        voor de toestand betekent.

        session_id is client-generated: de client maakt bij het starten van
        afspelen een UUID aan en houdt die aan tot hij stopt. Er zijn in v1
        bewust geen serverzijdige playbacksessies, dus er is ook geen endpoint
        dat een sessie-id uitdeelt.

        Op een server met capabilities.watch_state_ownership beslist het model
        uit DEC-049 wat een event met de toestand doet. De server is eigenaar:
        alleen de sessie met een geldige lease schrijft de canonieke positie,
        eigendom wordt uitsluitend verworven met explicit_action =
        playback_started, en base_revision draagt de causaliteit.

        Het antwoord is ALTIJD de actuele toestand, ook wanneer het event is
        afgewezen. Een client die een 200 krijgt met een hogere revision dan hij
        stuurde weet daarmee dat hij achterliep, en synchroniseert in plaats van
        door te schrijven. Er is dus geen foutcode voor "u bent niet de
        eigenaar"; dat is een normale uitkomst en geen fout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchStateEvent" }
      responses:
        "200":
          description: De nieuwe toestand van het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [watch-state]
      operationId: listWatchState
      summary: Alles wat deze identiteit heeft aangeraakt.
      description: |
        Gesorteerd op updated_at aflopend. updated_since is wat de offline-laag
        gebruikt om na een periode zonder netwerk bij te trekken zonder de hele
        catalogus op te halen.
      parameters:
        - name: updated_since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina kijkstatusregels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchStatePage" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Het accesstoken. Nooit in een querystring.
    streamSession:
      type: apiKey
      in: query
      name: ss
      description: |
        De niet-geheime helft van een browser-streamsessie. Het geheim reist in
        een cookie waarvan de naam deze id bevat, en de server valideert de twee
        samen. Alleen geldig op /stream, en alleen wanneer
        `capabilities.stream_sessions` waar is.
    streamToken:
      type: apiKey
      in: query
      name: stream_token
      description: |
        De enige uitzondering op de regel hierboven. Externe spelers kunnen geen
        header zetten. Geldig voor twee tot vijf minuten, gebonden aan een
        identiteit en een mediaresource, zonder rechten op de rest van de API.

  headers:
    ETag:
      schema: { type: string }
      description: |
        Zwakke validator, in de vorm `W/"..."`. Ondoorzichtig: een client
        ontleedt hem niet en leidt er niets uit af.

        Verschillend betekent "er is iets veranderd". Gelijk betekent NIET dat
        de bytes gelijk zijn: de server leidt hem af uit bestandsmetadata plus
        de generatie van de versie, en een in-place overschrijving van gelijke
        lengte met teruggezette mtime blijft daar onder de radar. Gebruik hem
        als change detector en nooit als bewijs van byte-identiteit.
    AcceptRanges:
      schema: { type: string, const: bytes }

  parameters:
    LibraryId:
      name: library_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    UserId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    Limit:
      name: limit
      in: query
      required: false
      description: Een hogere waarde wordt naar het maximum teruggebracht en is geen fout.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Ondoorzichtig. Hoort bij een sortering; bij een andere sortering ongeldig.
      schema: { type: string }

  responses:
    Error:
      description: Fout met een stabiele machineleesbare code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: |
        `server.internal`. Elke operatie kan hem geven, want hij is het antwoord
        op een fout die de handler zelf niet had voorzien: de recovery-laag vangt
        een panic af en maakt er een envelop van in plaats van een verbroken
        verbinding of een leeg lichaam.

        `details.request_id` draagt dezelfde id als de logregel die de stack
        bevat. Dat is het enige dat een client ermee doet: tonen zodat een
        gebruiker hem kan doorgeven. De stack zelf verlaat de server nooit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:

    Id:
      type: string
      minLength: 1
      description: |
        Ondoorzichtig voor de client. Er mag niets uit worden afgeleid, ook niet
        wanneer het op iets herkenbaars lijkt. Een pad is nooit een id.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, met Z-achtervoegsel.

    DurationMs:
      type: integer
      minimum: 0
      description: Milliseconden. Nooit seconden, nooit een kommagetal.

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              pattern: "^(auth|library|playback|session|settings|storage|server)\\.[a-z0-9_]+$"
              description: |
                Het contract. De client vertaalt codes en matcht nooit op message.

                Het domein is de helft voor de punt. De lijst is niet gesloten
                maar groeit per protocolvenster, en elke uitbreiding is een
                besluit: `server` en `settings` kwamen erbij met venster 1
                (DEC-110 en DEC-111). Een client die een code niet kent valt
                terug op een generieke melding en takt niet op het domein.

                Codes die een client zelf verzint horen hier niet thuis. De
                webclient draagt `client.transport` en
                `client.malformed_response`; die komen nooit over de lijn en
                het contract keurt ze af.
            message:
              type: string
              description: Voor logs, niet voor de UI.
            retryable:
              type: boolean
              description: |
                Expliciet en geen afleiding uit de status, omdat een 503 soms wel
                en een 409 soms niet te herhalen is.
            details:
              type: object
              additionalProperties: true

    Info:
      type: object
      required: [protocol, server, capabilities, auth]
      properties:
        protocol:
          type: object
          required: [major, feature_level, profile]
          properties:
            major: { type: integer, const: 1 }
            feature_level:
              type: integer
              minimum: 1
              description: |
                Wat de implementatie kan verstaan. Zegt niets over wat deze
                server aanbiedt; daarvoor is capabilities leidend.
            profile:
              type: string
              enum: [minimal, full]
              x-unknown-safe: false
        server:
          type: object
          required: [id]
          properties:
            id: { $ref: "#/components/schemas/Id" }
            setup_accepts_name:
              type: boolean
              default: false
              description: |
                De server neemt `server_name` aan op `POST /auth/setup` en legt
                hem vast als de instelling `server_name`. Optioneel en op `Info`
                en niet in `capabilities`, want het is geen functie die aan of
                uit staat maar een eigenschap van dit ene endpoint, en het is het
                enige veld dat een client vóór het inloggen moet weten. Zonder
                deze vlag laat een client `server_name` weg: `SetupRequest` is
                gesloten, dus een oudere server wijst het veld af in plaats van
                het te negeren.
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        auth:
          type: object
          required: [methods, setup_required]
          properties:
            methods:
              type: array
              items:
                type: string
                enum: [password, pairing_code]
                x-unknown-safe: true
                description: |
                  Er mag binnen v1 een methode bij komen. Een client slaat een
                  methode die hij niet kent over en kiest er een die hij wel kent.
            setup_required:
              type: boolean
              description: True zolang er nog geen eigenaar is aangemaakt.

    Capabilities:
      type: object
      description: Altijd leidend boven feature_level.
      required: [browse, search, artwork, watch_state]
      properties:
        browse: { type: boolean }
        search: { type: boolean }
        artwork: { type: boolean }
        watch_state: { type: boolean }
        playback_plan: { type: boolean, default: false }
        transcode: { type: boolean, default: false }
        downloads: { type: boolean, default: false }
        live_tv: { type: boolean, default: false }
        realtime: { type: boolean, default: false }
        users: { type: boolean, default: false }
        watch_state_ownership:
          type: boolean
          default: false
          description: |
            De server kent het eigendomsmodel uit DEC-049: base_revision, de
            playback_started-verwerving en de backlog-markering op
            WatchStateEvent, en revision op UserState. WatchStateEvent is
            gesloten (additionalProperties: false), dus een client stuurt die
            velden pas wanneer deze vlag waar is.
        stream_sessions:
          type: boolean
          default: false
          description: |
            De server kent POST /auth/stream-session en de ss-parameter op
            /stream. Voor browsers; externe spelers blijven het streamtoken in
            de querystring gebruiken.
        sessions:
          type: boolean
          default: false
          description: |
            De server kent device-scoped sessies (DEC-102): device_id en
            device_name op LoginRequest en SetupRequest, GET/DELETE /sessions
            en POST /auth/logout. Een client stuurt device_id/device_name pas
            wanneer deze vlag waar is; zonder de vlag krijgt de sessie
            device_id NULL en een vaste plaatshouder als naam.
        api_tokens:
          type: boolean
          default: false
          description: |
            De server kent API-tokens als sessies (RB-20): POST en GET
            /auth/api-tokens bestaan, en Session draagt kind, scope en
            expires_at. De vlag staat naast `sessions` en niet erin: een client
            die sessies kent maar deze vlag niet ziet, toont het
            sessieoverzicht zonder tokens, en dat is een geldig scherm.
        cookie_auth:
          type: boolean
          default: false
          description: |
            De server kent `credential_mode` op POST /auth/login en
            POST /auth/refresh (RB-29, hoofdstuk 17d) en zet het refreshcredential
            desgevraagd in een HttpOnly-cookie. Bedoeld voor browsers; een client
            zonder cookiejar heeft er niets aan en laat het veld weg.
        administration:
          type: boolean
          default: false
          description: |
            De server heeft een beheeroppervlak: `GET`/`PATCH /settings`, de vier
            routes onder `/server`, `GET /stream-sessions` en `GET /audit`. Een
            client die de vlag niet ziet toont geen beheer, en dat is geen
            beveiliging maar netheid: de server weigert onafhankelijk daarvan met
            `404` voor wie er niet bij mag (hoofdstuk 16.4, regel 16 tot en met
            26).

            Eén vlag voor het hele oppervlak en niet één per endpoint. De zes
            routes kwamen in vier slices tegelijk met deze vlag, en een client
            die ze los zou moeten onderhandelen krijgt zes vragen waarvan het
            antwoord altijd hetzelfde is.
        mcp:
          type: boolean
          default: false
          description: |
            De server biedt een MCP-endpoint aan waarmee een agent hem kan
            beheren (RB-19, RB-20). Staat op `false` tot de slice die het bouwt;
            `Server.mcp` draagt dan het adres en het aantal tools.

    ServerDetail:
      type: object
      required: [id, name, version, started_at]
      description: |
        De eerste vier velden zijn klasse `authenticated`. De tien daaronder
        gaan alleen mee voor klasse `admin` (acht met S1.3, `web_origin` met
        S1.8, `mcp` met S1.6): ze beschrijven hoe deze server draait, en dat is
        voor een huisgenoot geen informatie maar een verkenning. Een client die
        ze niet krijgt is dus geen beheerder, en verbergt het beheeroppervlak.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        version: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        public_url:
          type: string
          description: |
            Het adres waarop deze server van buiten bereikbaar hoort te zijn.
            Leeg wanneer er geen is ingesteld. Ook een instelling
            (`Settings.public_url`); dit veld toont de waarde die nu geldt.
        web_origin:
          type: string
          description: |
            De canonieke origin van de webclient die bij deze server hoort,
            bijvoorbeeld `https://pleya.thuis`. Leeg wanneer er geen is
            ingesteld. Ook een instelling (`Settings.web_origin`); dit veld toont
            de waarde die nu geldt. `cors_origins` staat hier bewust niet naast:
            dat is beleid en geen adres, en een lijst vertrouwde origins vertelt
            wie het proberen waard is (hoofdstuk 17d.3).
        listen:
          type: string
          description: Het bindadres van het proces, bijvoorbeeld `:8080`. Geen instelling.
        behind_proxy:
          type: boolean
          description: |
            True wanneer déze aanvraag via een vertrouwde proxy binnenkwam: de
            tegenpartij staat in `trusted_proxies` én er stond een
            forwarding-header op. Zonder de eerste voorwaarde zou elke client
            het antwoord zelf kunnen bepalen.
        trusted_proxies:
          type: array
          description: De adressen en bereiken waarvan de server forwarding-headers aanneemt. Geen instelling.
          items: { type: string }
        build:
          type: string
          description: Versie, toolchain en platform van de draaiende binary.
        database:
          type: object
          required: [version, schema]
          properties:
            version:
              type: string
              description: Het versienummer van Postgres, zonder de distributieregel erachter.
            schema:
              type: integer
              description: De hoogste toegepaste migratie.
        ffprobe:
          type: object
          description: Gemeten bij het opstarten, niet per aanvraag.
          required: [found]
          properties:
            found: { type: boolean }
            version: { type: string }
        health:
          type: object
          required: [ready, jobs_running, jobs_failed]
          properties:
            ready:
              type: boolean
              description: Hetzelfde antwoord als /readyz, maar dan achter authenticatie en met de tellers ernaast.
            jobs_running: { type: integer }
            jobs_failed: { type: integer }
        mcp:
          type: object
          required: [enabled, tool_count]
          description: |
            De MCP-beheerlaag, klasse `admin` net als de velden erboven. Zolang
            `capabilities.mcp` `false` is staat hier `enabled: false` met
            `tool_count: 0` en geen `url`: het object bestaat dan wel en zegt
            precies dat er niets aanstaat, wat een ander antwoord is dan een
            server die de vraag niet kent.
          properties:
            enabled: { type: boolean }
            url:
              type: string
              description: Het adres van het MCP-endpoint. Afwezig zolang het uit staat.
            tool_count:
              type: integer
              description: Het aantal tools dat het endpoint aanbiedt, zodat een beheerscherm ziet of de laag compleet is.

    ServerEnvironment:
      type: object
      required: [entries]
      description: |
        De omgevingsvariabelen van deze server, en niet die van de container
        eromheen: alleen `PLEYA_SERVER_*` plus een gemaskeerde `DATABASE_URL`.
        Een variabele waarvan de naam een geheim aankondigt gaat er in zijn
        geheel af, ook wanneer de waarde er geen is: de TTL's staan met hun
        bron en hun grens in `GET /settings`, dus die uitzondering kost niets.
      properties:
        entries:
          type: array
          items:
            type: object
            required: [key, value, redacted]
            properties:
              key: { type: string }
              value: { type: string }
              redacted:
                type: boolean
                description: |
                  True wanneer de waarde hierboven niet de echte is. Zonder dit
                  veld zou een beheerder een gemaskeerde DSN voor de werkelijke
                  instelling aanzien.

    LogLevel:
      type: string
      description: Het niveau van een logregel, en de ondergrens van `?level=`.
      enum: [debug, info, warn, error]
      x-unknown-safe: true

    ServerLog:
      type: object
      required: [entries]
      description: |
        De laatste regels uit een ringbuffer in het geheugen, nieuwste eerst.
        Nooit uit een bestand: een endpoint dat een pad opent is een
        bestandsbrowser met een filter ervoor. De regels zijn geredigeerd op de
        weg de buffer in, dus er is geen leespad dat die redactie overslaat.
      properties:
        entries:
          type: array
          items:
            type: object
            required: [at, level, message]
            properties:
              at: { $ref: "#/components/schemas/Timestamp" }
              level: { $ref: "#/components/schemas/LogLevel" }
              component:
                type: string
                description: Het subsysteem dat de regel schreef, bijvoorbeeld `scanner` of `http`.
              message:
                type: string
                description: Het bericht met zijn attributen erachter, geredigeerd en afgekapt.

    ConnectivityCheck:
      type: object
      required: [public_url_reachable, range_intact, behind_proxy]
      properties:
        public_url_reachable:
          type: boolean
          description: Het eigen `public_url` gaf `200` op `/pleya/v1/info`, binnen de vaste time-out en zonder omleiding.
        range_intact:
          type: boolean
          description: |
            Een `Range`-aanvraag kwam als `206` met een `Content-Range` terug.
            Een tussenliggende proxy die ranges wegbuffert antwoordt `200` met
            het hele bestand, en dat breekt direct play: aan de clientkant is
            dat een speler die bij elke seek hapert.
        behind_proxy: { type: boolean }

    RotateSigningKeyRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          type: string
          description: Moet letterlijk `rotate` zijn. Een vast woord en geen boolean, want dit is een handeling die iemand met opzet uitschrijft.
          enum: [rotate]
          x-unknown-safe: false

    SetupRequest:
      type: object
      required: [setup_code, username, password]
      additionalProperties: false
      properties:
        setup_code: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        device_id: { $ref: "#/components/schemas/DeviceId" }
        device_name: { $ref: "#/components/schemas/DeviceName" }
        server_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            De naam van deze server, meteen bij het aanmaken van de eigenaar.
            Alleen te sturen wanneer `info.server.setup_accepts_name` waar is;
            deze body is gesloten. Dezelfde grenzen als de instelling
            `server_name`, want het is diezelfde instelling: setup schrijft hem,
            `GET /server` toont hem, en `GET /settings` noemt hem daarna met
            bron `db`.

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        device_id: { $ref: "#/components/schemas/DeviceId" }
        device_name: { $ref: "#/components/schemas/DeviceName" }
        credential_mode: { $ref: "#/components/schemas/CredentialMode" }

    RefreshRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Zonder `credential_mode`, of met `credential_mode: token`, is
        `refresh_token` verplicht en is dit de body die er sinds v1 in staat. Met
        `credential_mode: cookie` komt het credential uit de cookie
        `pleya_refresh` en hoort `refresh_token` er niet bij; staan ze er
        allebei, dan weigert de server met `auth.token_invalid`, want dan zijn er
        twee bronnen en geen manier om te weten welke bedoeld is.
      properties:
        refresh_token: { type: string, minLength: 1 }
        credential_mode: { $ref: "#/components/schemas/CredentialMode" }

    CredentialMode:
      type: string
      description: |
        Waar het refreshcredential heen gaat. Optioneel, en alleen te sturen
        wanneer `capabilities.cookie_auth` waar is: de bodies zijn gesloten, dus
        een oudere server wijst het veld af in plaats van het stil te laten
        vallen.

        Afwezig betekent `token`, en `token` reproduceert het gedrag van v1: het
        credential staat als `refresh_token` in het antwoord. Bij `cookie` zet de
        server het in een `HttpOnly`-, `SameSite=Strict`-cookie op
        `Path=/pleya/v1/auth/refresh`, blijft `refresh_token` uit het antwoord,
        en moet de aanvraag een toegestane `Origin` dragen (hoofdstuk 17d).
      enum: [token, cookie]
      x-unknown-safe: false

    DeviceId:
      type: string
      minLength: 1
      description: |
        PreferenceDeviceId van de client: stabiel, niet gesynchroniseerd, en
        geen Plex-clientidentifier. Optioneel; alleen sturen wanneer
        capabilities.sessions waar is. Weglaten geeft een sessie met
        device_id NULL, hetzelfde als een client die de capability niet kent.

    DeviceName:
      type: string
      minLength: 1
      description: Mensleesbare naam, bijvoorbeeld "iPhone van Michel".

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in_ms]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: |
            Roteert bij elk gebruik; het oude vervalt onmiddellijk.

            Aanwezig tenzij de aanvraag `credential_mode: cookie` droeg; dan
            staat het credential in de cookie `pleya_refresh` en komt het niet in
            het lichaam. Het veld staat daarom niet in `required`. Voor een
            client die `credential_mode` niet stuurt verandert er niets: die
            krijgt het altijd, en de voorwaarde ligt volledig bij de client zelf
            (hoofdstuk 17d.1).
        token_type: { type: string, const: bearer }
        expires_in_ms: { $ref: "#/components/schemas/DurationMs" }

    StreamTokenRequest:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { $ref: "#/components/schemas/Id" }

    StreamSessionRequest:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { $ref: "#/components/schemas/Id" }

    StreamSession:
      type: object
      required: [stream_session_id, expires_at]
      properties:
        stream_session_id:
          type: string
          minLength: 1
          description: |
            Niet geheim. Hoort in de ss-parameter van de media-URL. Het geheim
            zit in de cookie met de naam `pleya_ss_<stream_session_id>` en komt
            nergens anders voor.
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    StreamSessionSummary:
      type: object
      required: [id, user_id, username, item_id, item_title, item_kind, started_at, expires_at]
      description: |
        Eén lopende stream in het beheeroverzicht. De vier dingen die het scherm
        toont zijn de gebruiker, het toestel, het item en de positie; de rest is
        wat een rij van een andere onderscheidt.

        Er staat bewust geen uitgeschreven stamboom van een aflevering in. Wie
        "serie S2 · A3" wil tonen haalt dat met `item_id` uit
        `GET /items/{item_id}`; een tweede kopie van de itemgegevens hier zou
        een tweede bron maken voor dezelfde vraag.
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: |
            De id van de streamsessie. Niet geheim: hij reist als `ss` in de
            media-URL en mag in browsergeschiedenis en logs staan.
        user_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        device_name:
          type: string
          description: |
            Ontbreekt wanneer de streamsessie geen auth-sessie draagt, en dat
            is een rij van vóór de migratie die sessies introduceerde. Een
            client verzint er zelf een plaatshouder bij als hij die wil tonen.
        item_id: { $ref: "#/components/schemas/Id" }
        item_title: { type: string }
        item_kind: { $ref: "#/components/schemas/ItemKind" }
        position_ms:
          allOf: [{ $ref: "#/components/schemas/DurationMs" }]
          description: |
            De laatst gemelde positie van deze gebruiker op dit item. Ontbreekt
            zolang er niets is gerapporteerd, en dat is iets anders dan nul: een
            client die het verschil niet maakt tekent een balk op 0% voor iemand
            die net begon.
        duration_ms:
          allOf: [{ $ref: "#/components/schemas/DurationMs" }]
          description: |
            De lengte waartegen `position_ms` telt. Staat er alleen wanneer
            `position_ms` er ook staat; zonder positie zegt hij niets dat niet
            al op het item staat.
        started_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: Ontbreekt zolang de sessie nog geen byte heeft opgehaald.
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    StreamSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StreamSessionSummary" }

    StreamToken:
      type: object
      required: [stream_token, expires_at]
      properties:
        stream_token: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    LibraryKind:
      type: string
      enum: [movies, shows]
      x-unknown-safe: true
      description: |
        Er mag binnen v1 een soort bij komen. Een client die de soort niet kent
        toont de bibliotheek niet, en faalt niet.

    Library:
      type: object
      required: [id, title, kind, item_count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        item_count: { type: integer, minimum: 0 }

    LibraryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Library" }

    ItemKind:
      type: string
      enum: [movie, show, season, episode]
      x-unknown-safe: true
      description: |
        Er mag binnen v1 een soort bij komen. Een client die de soort niet kent
        toont het item niet, en faalt niet.

    Artwork:
      type: object
      description: Ids van beschikbare afbeeldingen. Null wanneer er geen is.
      properties:
        poster_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        backdrop_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }

    VideoStream:
      type: object
      required: [id, index, codec]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index: { type: integer, minimum: 0 }
        codec: { type: string }
        profile: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        bit_depth: { type: [integer, "null"] }
        frame_rate: { type: [number, "null"] }

    AudioStream:
      type: object
      required: [id, index, codec]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index: { type: integer, minimum: 0 }
        codec: { type: string }
        channels: { type: [integer, "null"] }
        language:
          type: [string, "null"]
          description: ISO 639-2/B in drie letters, of null.
        title: { type: [string, "null"] }
        is_default: { type: boolean, default: false }

    SubtitleStream:
      type: object
      required: [id, format, is_external, is_forced, is_hearing_impaired]
      description: |
        Twee soorten met hetzelfde veldenpakket. Extern heeft een url en geen
        index; ingebed heeft een index en geen url.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        index:
          type: [integer, "null"]
          description: Alleen bij ingebedde sporen.
        format:
          type: string
          enum: [srt, ass, ssa, vtt, pgs, dvdsub]
          x-unknown-safe: true
          description: |
            Er mag binnen v1 een formaat bij komen. Een client die het formaat
            niet kent biedt het spoor niet aan, en faalt niet.
        language: { type: [string, "null"] }
        title: { type: [string, "null"] }
        is_default: { type: boolean, default: false }
        is_forced:
          type: boolean
          description: Expliciet, geen afleiding uit de titel.
        is_hearing_impaired:
          type: boolean
          description: Expliciet, geen afleiding uit de titel.
        is_external: { type: boolean }
        url:
          type: [string, "null"]
          description: Alleen bij externe sporen.

    Version:
      type: object
      required: [id, container, duration_ms, file_count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        container: { type: string }
        duration_ms: { $ref: "#/components/schemas/DurationMs" }
        file_count:
          type: integer
          minimum: 1
          description: |
            Een versie mag uit meerdere bestanden bestaan; dat is geldig in het
            domeinmodel. Direct play accepteert in v1 uitsluitend 1.
        edition:
          type: [string, "null"]
          description: Bijvoorbeeld "Director's Cut". Onderscheidt twee snedes van dezelfde titel.
        video_streams:
          type: array
          items: { $ref: "#/components/schemas/VideoStream" }
        audio_streams:
          type: array
          items: { $ref: "#/components/schemas/AudioStream" }
        subtitle_streams:
          type: array
          items: { $ref: "#/components/schemas/SubtitleStream" }

    UserState:
      type: object
      required: [position_ms, watched, play_count, updated_at]
      description: |
        De leeskant van kijkstatus. Reist mee in elk itemantwoord, zodat een
        detailscherm geen tweede aanvraag nodig heeft.
      properties:
        position_ms: { $ref: "#/components/schemas/DurationMs" }
        watched: { type: boolean }
        play_count: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        revision:
          type: integer
          minimum: 0
          description: |
            Monotoon en uitsluitend serverzijdig toegekend. Een client bewaart
            de laatst geziene waarde en stuurt hem terug als base_revision, en
            de server accepteert een schrijving alleen wanneer die gelijk is aan
            de actuele revision. Zo kan een client die op een verouderd beeld
            handelde de nieuwere toestand niet overschrijven.

            Afwezig op een server zonder capabilities.watch_state_ownership. Een
            client die het veld niet kent blijft correct: hij stuurt dan geen
            base_revision en de server valt terug op de eigenaarsregel.
        owned_by_this_session:
          type: boolean
          description: |
            Of de sessie die dit antwoord kreeg op dit moment de canonieke
            positie mag schrijven. Alleen aanwezig in het antwoord op
            POST /watch-state, en alleen op een server met
            capabilities.watch_state_ownership.

    Item:
      type: object
      required: [id, kind, title, added_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        sort_title: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        added_at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms:
          oneOf:
            - { $ref: "#/components/schemas/DurationMs" }
            - { type: "null" }
        parent_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        index:
          type: [integer, "null"]
          description: Seizoen- of afleveringsnummer.
        child_count: { type: [integer, "null"] }
        episode_count:
          type: [integer, "null"]
          description: Backend-neutrale naam; het interne model van de client heet anders.
        watched_episode_count: { type: [integer, "null"] }
        artwork: { $ref: "#/components/schemas/Artwork" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        user_state:
          oneOf:
            - { $ref: "#/components/schemas/UserState" }
            - { type: "null" }

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Null op de laatste pagina.
        total_estimate:
          type: [integer, "null"]
          description: |
            Expliciet een schatting, zodat een UI een scrollbar kan tekenen
            zonder dat de server per pagina telt. Nooit als exact aantal tonen.

    ItemPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Item" }

    ExplicitAction:
      type: string
      enum: [none, mark_watched, mark_unwatched, restart, playback_started]
      x-unknown-safe: false
      description: |
        Een expliciete handeling wint van elke passieve update die ervoor ligt.
        Dat onderscheid is de reden dat een update een gebeurtenis is.

        `playback_started` is de enige manier om het eigendom van de kijkstatus
        te verwerven (DEC-049). Een passief voortgangsevent verwerft nooit, ook
        niet wanneer de lease van de eigenaar verlopen is. De waarde is alleen
        toegestaan wanneer capabilities.watch_state_ownership waar is; het veld
        is niet unknown-safe, dus een oudere server wijst hem af in plaats van
        hem te negeren.

        `mark_watched`, `mark_unwatched` en `restart` negeren de lease van de
        huidige eigenaar en nemen het eigendom over. Ze ordenen op
        serverontvangst, niet op occurred_at.

    PlaybackCause:
      type: string
      enum: [user_started, reclaim]
      x-unknown-safe: false
      description: |
        Waarom een playback_started binnenkomt. Bij `user_started` heeft iemand
        op afspelen gedrukt en neemt die sessie het eigendom over, ongeacht de
        lease van een ander. Bij `reclaim` heropent een sessie die zelf nog
        speelt haar eigendom, en dat wordt alleen toegekend wanneer de lease van
        de huidige eigenaar verlopen is.

    WatchStateEvent:
      type: object
      required: [item_id, session_id, position_ms, occurred_at, explicit_action]
      additionalProperties: false
      properties:
        item_id: { $ref: "#/components/schemas/Id" }
        session_id:
          type: string
          minLength: 1
          description: |
            Client-generated. De client maakt bij het starten van afspelen een
            UUID aan en houdt die aan tot hij stopt.
        position_ms: { $ref: "#/components/schemas/DurationMs" }
        duration_ms:
          oneOf:
            - { $ref: "#/components/schemas/DurationMs" }
            - { type: "null" }
        occurred_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: |
            Het moment volgens de client. De server bewaart daarnaast zijn eigen
            ontvangstmoment, want een toestel met een scheve klok mag de
            volgorde niet bepalen.
        completed: { type: boolean, default: false }
        explicit_action: { $ref: "#/components/schemas/ExplicitAction" }
        base_revision:
          type: integer
          minimum: 0
          description: |
            De revision waarop de client zijn beeld baseerde. De server
            accepteert de schrijving alleen bij gelijkheid met de actuele
            revision; wijkt hij af, dan antwoordt de server met de actuele
            toestand en verandert er niets aan de canonieke positie.

            Weglaten mag: dan doet het event geen causale claim, en wordt het
            alleen geaccepteerd van de huidige eigenaar met een geldige lease.
            Een expliciete handeling wordt wél toegepast met een verouderde
            base_revision, zolang hij live binnenkomt en niet als backlog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.
        cause:
          allOf: [{ $ref: "#/components/schemas/PlaybackCause" }]
          description: |
            Verplicht bij explicit_action = playback_started en zinloos
            daarbuiten. Alleen te sturen wanneer
            capabilities.watch_state_ownership waar is.
        backlog:
          type: boolean
          default: false
          description: |
            Dit event komt uit een offline wachtrij en niet uit een sessie die nu
            speelt. Een backlog verwerft nooit eigendom en verplaatst de
            canonieke toestand niet zolang revision > 0, ook niet wanneer de
            lease van de eigenaar verlopen is. Alleen bij revision = 0 is er
            niets te beschermen en vestigt het laatste event uit de batch de
            toestand alsnog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.

    WatchStateEntry:
      type: object
      required: [item_id, state]
      properties:
        item_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/UserState" }

    WatchStatePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/WatchStateEntry" }

    Role:
      type: string
      enum: [owner, admin, member, restricted]
      x-unknown-safe: false
      description: |
        Vier rollen (DEC-098), gesloten. Een client moet weten wat een rol
        betekent voordat hij ernaar handelt: `owner` (precies één, niet te
        verwijderen of te degraderen), `admin`, `member`, `restricted`
        (als member, kan nooit manage krijgen en beheert zijn eigen
        wachtwoord niet).

    Permission:
      type: string
      enum: [view, download, manage]
      x-unknown-safe: false
      description: |
        Een geordende ladder (DEC-098): download impliceert view, manage
        impliceert beide. Gesloten, om dezelfde reden als Role.

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        role: { $ref: "#/components/schemas/Role" }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Minimaal één van beide velden; een leeg object is geen geldige aanvraag.
      properties:
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 8 }

    LibraryPermission:
      type: object
      required: [library_id, permission]
      properties:
        library_id: { $ref: "#/components/schemas/Id" }
        permission: { $ref: "#/components/schemas/Permission" }

    LibraryPermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryPermission" }

    PermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          items: { $ref: "#/components/schemas/LibraryPermission" }

    SettingSource:
      type: string
      description: |
        De laag die deze waarde levert. `env` is de omgeving waarmee de server
        startte (inclusief zijn ingebouwde default), `db` een waarde die een
        beheerder heeft opgeslagen.
      enum: [env, db]
      x-unknown-safe: true

    SettingDuration:
      type: object
      required: [value, source]
      description: Een duur in de vorm die de omgevingsvariabele ernaast ook gebruikt, bijvoorbeeld `15m` of `720h`.
      properties:
        value: { type: string }
        source: { $ref: "#/components/schemas/SettingSource" }

    SettingString:
      type: object
      required: [value, source]
      properties:
        value: { type: string }
        source: { $ref: "#/components/schemas/SettingSource" }

    SettingInteger:
      type: object
      required: [value, source]
      properties:
        value: { type: integer }
        source: { $ref: "#/components/schemas/SettingSource" }

    SettingStringList:
      type: object
      required: [value, source]
      description: |
        Een sleutel met een lijst als waarde. De lijst staat als JSON-array in de
        kolom en in het antwoord, en niet als tekst met scheidingstekens: dat
        laatste zou een waarde met een scheidingsteken erin stil in tweeën
        knippen. De lege lijst is een geldige waarde en betekent "geen".
      properties:
        value:
          type: array
          items: { type: string }
        source: { $ref: "#/components/schemas/SettingSource" }

    Settings:
      type: object
      required:
        [server_name, access_token_ttl, refresh_token_ttl, stream_token_ttl, stream_session_ttl,
         max_stream_sessions, public_url, web_origin, cors_origins]
      description: |
        De volledige set. Elke sleutel is er altijd, ook wanneer niemand hem ooit
        heeft gewijzigd; dan staat er de waarde uit de omgeving met `source:
        env`.
      properties:
        server_name: { $ref: "#/components/schemas/SettingString" }
        access_token_ttl: { $ref: "#/components/schemas/SettingDuration" }
        refresh_token_ttl: { $ref: "#/components/schemas/SettingDuration" }
        stream_token_ttl: { $ref: "#/components/schemas/SettingDuration" }
        stream_session_ttl: { $ref: "#/components/schemas/SettingDuration" }
        max_stream_sessions: { $ref: "#/components/schemas/SettingInteger" }
        public_url: { $ref: "#/components/schemas/SettingString" }
        web_origin: { $ref: "#/components/schemas/SettingString" }
        cors_origins: { $ref: "#/components/schemas/SettingStringList" }

    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Alleen bekende sleutels, minimaal één. De grenzen staan in de
        beschrijving per veld; een waarde erbuiten geeft
        `settings.invalid_value` en wijzigt niets.
      properties:
        server_name:
          type: string
          description: 1 tot 64 tekens.
          minLength: 1
          maxLength: 64
        access_token_ttl:
          type: string
          description: 1m tot 60m.
        refresh_token_ttl:
          type: string
          description: 24h tot 2160h (1 tot 90 dagen).
        stream_token_ttl:
          type: string
          description: 1m tot 15m.
        stream_session_ttl:
          type: string
          description: 5m tot 120m.
        max_stream_sessions:
          type: integer
          description: 1 tot 32.
          minimum: 1
          maximum: 32
        public_url:
          type: string
          description: |
            Absolute `http`- of `https`-URL zonder inloggegevens, querystring of
            fragment; leeg maakt de sleutel leeg en laat de omgeving weer
            gelden. Een letterlijk privé-, loopback- of link-local-adres wordt
            geweigerd: dit is het enige doel dat
            `POST /server/connectivity-check` aanroept, en een adres in het
            interne netwerk maakt van die knop een scanner. Een naam wordt niet
            opgezocht, want wie de zone beheert kan hem na de controle toch
            verzetten; de omgeving valt er bewust buiten, want op een
            thuisnetwerk ís `192.168.x.y` het juiste antwoord.
          maxLength: 2048
        web_origin:
          type: string
          description: |
            Een origin: `schema://host[:poort]`, `http` of `https`, zonder pad,
            inloggegevens, querystring of fragment. Leeg maakt de sleutel leeg.
            Anders dan bij `public_url` is een privé-adres hier wél toegestaan:
            dit is geen doel dat de server aanroept maar een verwachting over wie
            hém aanroept, en `http://nas:8832` is op een thuisnetwerk precies de
            juiste waarde.
          maxLength: 2048
        cors_origins:
          type: array
          description: |
            Origins die deze API cross-origin mogen aanroepen, elk in dezelfde
            vorm als `web_origin`. Ten hoogste zestien, elk uniek, en `*` wordt
            geweigerd. De lege lijst betekent: geen, en is de default.
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            maxLength: 2048

    Session:
      type: object
      required: [id, device_name, created_at, last_seen_at, current]
      description: |
        kind, scope en expires_at kwamen met S1.5. Ze zijn optioneel omdat een
        oudere client ze niet kent en een oudere server ze niet stuurt; een
        client die ze wel leest onderscheidt een agent van een telefoon en
        trekt daarmee de juiste in.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        device_name:
          type: string
          description: |
            Een vaste plaatshouder voor een sessie zonder bekend toestel. Voor
            een API-token is dit de naam die de beheerder gaf.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        current:
          type: boolean
          description: True voor de sessie die deze aanvraag zelf doet.
        kind: { $ref: "#/components/schemas/SessionKind" }
        scope:
          allOf:
            - $ref: "#/components/schemas/ApiTokenScope"
          description: Alleen aanwezig op een sessie met kind `api`.
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Alleen aanwezig op een sessie met kind `api`. Een toestelsessie
            eindigt met haar refreshketen en niet op een datum in haar eigen rij.

    SessionKind:
      type: string
      x-unknown-safe: true
      enum: [device, api, legacy]
      description: |
        `device` is een toestel, `api` een API-token (RB-20), `legacy` een keten
        die migratie 0007 overnam en waar geen toestel bij hoort. Nieuwe waarden
        mogen erbij; een client die er een niet kent behandelt hem als `device`.

    ApiTokenScope:
      type: string
      x-unknown-safe: true
      enum: [read, maintenance, admin]
      description: |
        Een ladder, laag naar hoog. `read` mag lezen wat de eigenaar mag lezen
        en niets beheren; `admin` haalt de adminklasse, mits de rol van de
        eigenaar dat ook doet. `maintenance` is gereserveerd voor de
        operationele handelingen die later komen (back-up, onderhoudsmodus,
        herstel) en onderscheidt zich vandaag in geen enkele operatie van
        `read`; dat staat hier expliciet in plaats van dat het gedrag het
        suggereert.

    ApiToken:
      type: object
      required: [id, user_id, name, scope, created_at, last_seen_at, expires_at]
      description: Een API-token zonder zijn geheim.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        user_id: { $ref: "#/components/schemas/Id" }
        name:
          type: string
          maxLength: 64
          description: Het label in het overzicht. Geen document.
        scope: { $ref: "#/components/schemas/ApiTokenScope" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }

    ApiTokenCreated:
      type: object
      required: [token, secret]
      description: |
        Een eigen schema en niet ApiToken met een optioneel geheimveld. Een
        optioneel `secret` op het lijsttype zou een lezer laten denken dat het
        er soms in kan staan, en dan is de vraag "kan dit antwoord een geheim
        dragen" niet meer aan het type te zien.
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret:
          type: string
          description: |
            Het geheim, precies één keer. De server bewaart alleen de hash. Het
            begint met een herkenbaar voorvoegsel zodat het in een logbestand of
            een repository terug te vinden is.

    ApiTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scope: { $ref: "#/components/schemas/ApiTokenScope" }
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 90
          description: |
            Standaard negentig dagen. "Nooit" bestaat niet: een token zonder
            vervaldatum is de vorm die jaren later nog in een oude configuratie
            meeloopt en die niemand mist tot iemand hem vindt.
        user_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          description: |
            Alleen bruikbaar door `owner` en `admin`. Zonder dit veld gaat het
            token over de aanvrager zelf.

    AuditOutcome:
      type: string
      x-unknown-safe: true
      enum: [ok, denied, failed]
      description: |
        `denied` is de aanvrager die het niet mocht of iets aanbood dat niet
        klopte; een mislukte login is `denied` en geen `failed`. `failed` is de
        server die het niet kon.

    AuditSource:
      type: string
      x-unknown-safe: true
      enum: [http, mcp]

    AuditEntry:
      type: object
      required: [id, at, source, operation, outcome]
      description: |
        user_id en session_id kunnen ontbreken: een mislukte login heeft geen
        van beide, want er is dan geen vastgestelde identiteit.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        at: { $ref: "#/components/schemas/Timestamp" }
        user_id: { $ref: "#/components/schemas/Id" }
        session_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/AuditSource" }
        operation:
          type: string
          description: |
            De operationId uit dit contract, niet het pad. Een pad verandert mee
            met een route-refactor en breekt dan de leesbaarheid van een log dat
            jaren teruggaat.
        target:
          type: string
          description: Waar de handeling over ging, meestal een id.
        outcome: { $ref: "#/components/schemas/AuditOutcome" }

    AuditPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
