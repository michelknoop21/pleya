        `credential_mode: cookie` komt het credential uit de cookie
        `pleya_refresh` en hoort `refresh_token` er niet bij; staan ze er
        allebei, dan weigert de server met `auth.token_invalid`, want dan zijn er
        twee bronnen en geen manier om te weten welke bedoeld is.
      properties:
        refresh_token: { type: string, minLength: 1 }
        credential_mode: { $ref: "#/components/schemas/CredentialMode" }

    CredentialMode:
      type: string
