    ExplicitAction:
      type: string
      enum: [none, mark_watched, mark_unwatched, restart, playback_started]
      x-unknown-safe: false
      description: |
        Een expliciete handeling wint van elke passieve update die ervoor ligt.
        Dat onderscheid is de reden dat een update een gebeurtenis is.

        `playback_started` is de enige manier om het eigendom van de kijkstatus
        te verwerven (DEC-049). Een passief voortgangsevent verwerft nooit, ook
        niet wanneer de lease van de eigenaar verlopen is. De waarde is alleen
        toegestaan wanneer capabilities.watch_state_ownership waar is; het veld
        is niet unknown-safe, dus een oudere server wijst hem af in plaats van
        hem te negeren.

        `mark_watched`, `mark_unwatched` en `restart` negeren de lease van de
        huidige eigenaar en nemen het eigendom over. Ze ordenen op
        serverontvangst, niet op occurred_at.

    PlaybackCause:
      type: string
      enum: [user_started, reclaim]
      x-unknown-safe: false
      description: |
        Waarom een playback_started binnenkomt. Bij `user_started` heeft iemand
        op afspelen gedrukt en neemt die sessie het eigendom over, ongeacht de
        lease van een ander. Bij `reclaim` heropent een sessie die zelf nog
        speelt haar eigendom, en dat wordt alleen toegekend wanneer de lease van
        de huidige eigenaar verlopen is.

    WatchStateEvent:
      type: object
      required: [item_id, session_id, position_ms, occurred_at, explicit_action]
      additionalProperties: false
      properties:
        item_id: { $ref: "#/components/schemas/Id" }
        session_id:
          type: string
          minLength: 1
          description: |
            Client-generated. De client maakt bij het starten van afspelen een
            UUID aan en houdt die aan tot hij stopt.
        position_ms: { $ref: "#/components/schemas/DurationMs" }
        duration_ms:
          oneOf:
            - { $ref: "#/components/schemas/DurationMs" }
            - { type: "null" }
        occurred_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: |
            Het moment volgens de client. De server bewaart daarnaast zijn eigen
            ontvangstmoment, want een toestel met een scheve klok mag de
            volgorde niet bepalen.
        completed: { type: boolean, default: false }
        explicit_action: { $ref: "#/components/schemas/ExplicitAction" }
        base_revision:
          type: integer
          minimum: 0
          description: |
            De revision waarop de client zijn beeld baseerde. De server
            accepteert de schrijving alleen bij gelijkheid met de actuele
            revision; wijkt hij af, dan antwoordt de server met de actuele
            toestand en verandert er niets aan de canonieke positie.

            Weglaten mag: dan doet het event geen causale claim, en wordt het
            alleen geaccepteerd van de huidige eigenaar met een geldige lease.
            Een expliciete handeling wordt wél toegepast met een verouderde
            base_revision, zolang hij live binnenkomt en niet als backlog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.
        cause:
          allOf: [{ $ref: "#/components/schemas/PlaybackCause" }]
          description: |
            Verplicht bij explicit_action = playback_started en zinloos
            daarbuiten. Alleen te sturen wanneer
            capabilities.watch_state_ownership waar is.
        backlog:
          type: boolean
          default: false
          description: |
            Dit event komt uit een offline wachtrij en niet uit een sessie die nu
            speelt. Een backlog verwerft nooit eigendom en verplaatst de
            canonieke toestand niet zolang revision > 0, ook niet wanneer de
            lease van de eigenaar verlopen is. Alleen bij revision = 0 is er
            niets te beschermen en vestigt het laatste event uit de batch de
            toestand alsnog.

            Alleen te sturen wanneer capabilities.watch_state_ownership waar is.

    WatchStateEntry:
