# Pleya Protocol v1: contractueel leidend.
#
# De prozaspecificatie staat in docs/pleya-protocol-v1.md en legt uit waarom de
# keuzes hieronder zo zijn. Botsen de twee, dan wint dit bestand.
#
# Deze versie beschrijft feature level 1: het oppervlak dat PS-2 tot en met PS-4
# nodig hebben. Elk later oppervlak wordt toegevoegd door de fase die het
# introduceert, binnen de zes compatibiliteitsregels uit hoofdstuk 3.
openapi: 3.1.0

info:
  title: Pleya Protocol
  version: "1.0.0"
  summary: Wire-contract tussen een Pleya-client en een Pleya Server.
  description: |
    Alles wat hier niet in staat, mag een client niet aannemen.

    Zes compatibiliteitsregels binnen v1:
      1. Een nieuw optioneel veld in een antwoord mag. Clients negeren
         onbekende velden.
      2. Een veld hernoemen of verwijderen mag niet.
      3. De betekenis van een bestaand veld wijzigen mag niet.
      4. Een nieuw verplicht veld in een aanvraag mag niet, in de query net zo
         min als in de body.
      5. Een aanvraagbody is gesloten (additionalProperties: false). Een client
         stuurt een nieuw optioneel veld pas wanneer capabilities of
         feature_level zegt dat de server het kent.
      6. Een nieuwe enum-waarde mag alleen waar x-unknown-safe true is. Elk
         enum-veld in dit document draagt die markering; check_protocol.sh
         weigert er een zonder.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only

servers:
  - url: /pleya/v1
    description: Het pad draagt de majorversie.

tags:
  - name: discovery
  - name: auth
  - name: library
  - name: playback
  - name: watch-state
  - name: users
  - name: sessions
  - name: administration

security:
  - bearerAuth: []

paths:
  /info:
    get:
      tags: [discovery]
      operationId: getInfo
      summary: Wat staat er aan de andere kant.
      description: |
        Klasse `public`. Bereikbaar zonder authenticatie, want een client moet
        weten wat er staat voordat hij een inlogpoging doet. Draagt daarom
        bewust geen servernaam, versie of buildnummer; die staan in /server.
      security: []
      responses:
        "200":
          description: Serverinformatie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Maak de bootstrap-eigenaar aan met de setupcode.
      description: |
        Klasse `public`, en uitsluitend zolang info.auth.setup_required waar is.
        De eerste start van een server drukt een eenmalige code af op de console.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Eigenaar aangemaakt, tokenpaar uitgegeven.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Wissel gebruikersnaam en wachtwoord in voor een tokenpaar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: |
            auth.invalid_credentials. Een onbekende gebruiker en een verkeerd
            wachtwoord geven hetzelfde antwoord, zodat het bestaan van een
            account niet lekt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: |
            auth.origin_rejected. Alleen op het cookiepad: de aanvraag droeg
            credential_mode cookie en kwam van een origin die deze server niet
            toestaat, of droeg helemaal geen Origin. Zie hoofdstuk 17d.4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Ververs het tokenpaar.
      description: |
        Klasse `public`, want het refreshtoken is zelf het bewijs. Het token
        roteert bij elk gebruik en het oude vervalt onmiddellijk. Een tweede
        aanroep met hetzelfde token geeft auth.refresh_token_reused, en de
        server mag de hele keten dan ongeldig maken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Nieuw tokenpaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: |
            auth.origin_rejected. Alleen op het cookiepad; zie hoofdstuk 17d.4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/stream-token:
    post:
      tags: [auth]
      operationId: issueStreamToken
      summary: Vraag een kortlevend token voor bytes.
      description: |
        Klasse `authenticated`. Voor spelers die geen header kunnen zetten.
        Kortlevend en smal, maar NIET eenmalig: een speler doet een HEAD, dan
        een open range, dan losse ranges per seek, plus retries. Een token dat
        na de eerste range vervalt breekt op de tweede.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamTokenRequest" }
      responses:
        "200":
          description: Streamtoken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamToken" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/stream-session:
    post:
      tags: [auth]
      operationId: createStreamSession
      summary: Open een browser-streamsessie.
      description: |
        Klasse `authenticated`. Alleen aanwezig wanneer `capabilities.stream_sessions`
        waar is; een client vraagt er niet om zonder die vlag.

        Waarvoor. Een `<video>`-element stuurt bij elke seek een nieuwe
        range-aanvraag met de URL uit `src`, en het streamtoken uit
        /auth/stream-token leeft twee tot vijf minuten. Een lange film breekt
        daardoor op de eerste seek na die tijd. Een streamsessie leeft langer en
        houdt het geheim buiten de URL.

        Hoe. Het antwoord draagt een niet-geheime `stream_session_id`, en de
        server zet daarnaast een cookie waarvan de NAAM die id bevat:
        `pleya_ss_<stream_session_id>=<geheim>; HttpOnly; SameSite=Strict;
        Path=/pleya/v1/stream/`, met `Secure` waar de context dat toelaat. Een
        cookienaam per sessie, want cookies met dezelfde naam, domein en pad
        vervangen elkaar en twee gelijktijdige streams zouden elkaar dan breken.
        De client zet de id in de media-URL als `ss`; het geheim komt nooit in
        een URL, een log of een referrer.

        Grens. Ten hoogste acht ACTIEVE sessies per subject. De server ruimt
        eerst verlopen en ingetrokken sessies op; blijven er acht over, dan
        weigert hij de negende met `session.stream_session_limit`. Een nog
        levende stream wordt niet stilzwijgend beëindigd om plaats te maken.

        Op een LAN zonder TLS reist het geheim in klare tekst. `HttpOnly` houdt
        JavaScript op de pagina eruit; het is geen versleuteling.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamSessionRequest" }
      responses:
        "200":
          description: De sessie, plus de cookie in Set-Cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `pleya_ss_<stream_session_id>=<geheim>`, HttpOnly en
                SameSite=Strict, op Path=/pleya/v1/stream/.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: |
            session.stream_session_limit. Er staan al acht actieve streamsessies
            voor dit subject. Beëindig er een of wacht tot er een vervalt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Beëindig de huidige sessie.
      description: |
        Klasse `authenticated`. Trekt uitsluitend de sessie in waarvan het
        accesstoken op deze aanvraag `sid` draagt. Geen vervanging van
        DELETE /sessions/{id}: een ander toestel intrekken kan hiermee niet.
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/api-tokens:
    post:
      tags: [auth]
      operationId: createApiToken
      summary: Maak een API-token.
      description: |
        Klasse `authenticated` op zichzelf, `admin` met `user_id` van een ander.
        Dezelfde regel als `GET /sessions`, en met opzet geen beheerroute: RB-20
        beschrijft een token dat een gebruiker voor zichzelf maakt, of een
        beheerder namens iemand.

        Een API-token is een sessie met `kind: api`. Het valt onder
        `DELETE /sessions/{id}`, onder dezelfde intrekking binnen twee seconden,
        en het staat in `GET /sessions` naast de toestellen.

        `secret` staat precies één keer in een antwoord: hier. De server bewaart
        alleen de hash ervan, dus een tweede kans is er niet.

        Het bereik komt nooit boven de rol van de eigenaar. Een aanvraag die dat
        wel doet krijgt `auth.scope_exceeds_role`, met het gevraagde bereik en de
        rol in `details`.

        Een aanvraag die zelf met een API-token is geauthenticeerd kan alleen
        tokens maken wanneer dat token bereik `admin` heeft; anders is het
        antwoord `404`, byte-gelijk aan dat van een beheerroute. Zonder die
        regel zou een `read`-token van een beheerder een `admin`-token kunnen
        maken, want het bereik wordt tegen de rol getoetst en de rol is dan
        `admin`.

        Beschikbaar wanneer `capabilities.api_tokens` waar is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenRequest" }
      responses:
        "201":
          description: Het token, met het geheim erbij.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400":
          description: |
            auth.scope_exceeds_role wanneer het bereik boven de rol van de
            eigenaar uitkomt, session.invalid bij een naam, bereik of
            geldigheidsduur die niet klopt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found. user_id is niet van de aanvrager en de
            aanvrager is geen admin, of de aanvraag komt van een API-token
            zonder bereik `admin`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [auth]
      operationId: listApiTokens
      summary: De levende API-tokens van een gebruiker.
      description: |
        Klasse `authenticated` op zichzelf, `admin` met `?user_id=`. Zonder
        geheimen: die bestaan na het aanmaken alleen nog bij de aanvrager.

        Ingetrokken en verlopen tokens staan er niet in, om dezelfde reden als
        bij `GET /sessions`: de lijst beantwoordt wat er nú met dit account kan
        praten.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Alleen bruikbaar door `owner` en `admin`. Zonder deze parameter de eigen tokens.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: De tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. user_id is niet van de aanvrager en de aanvrager is geen admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /audit:
    get:
      tags: [administration]
      operationId: listAudit
      summary: Het auditlog.
      description: |
        Klasse `admin`. Eén regel per beherende handeling, nieuwste eerst.

        Het bereik is ruimer dan alleen mutaties op beheerendpoints: geslaagde
        en mislukte logins, het aanmaken en intrekken van tokens en sessies,
        rol- en rechtenwijzigingen, en de configuratie die de beveiliging raakt.
        Wat er niet in staat is even bewust: catalogusreads, playbackticks en
        leesvoortgang zijn volume zonder beveiligingsbetekenis.

        Regels worden negentig dagen bewaard en daarna door de opruimronde
        verwijderd. Die termijn is geen instelling: een bewaartermijn die een
        beheerder kan verlagen, kan een aanvaller met beheerrechten verlagen.

        `detail` uit de tabel staat niet in het antwoord. Het is vrije vorm, en
        vrije vorm in een antwoord is de weg waarlangs er ooit iets in belandt
        dat er niet in hoort.
      parameters:
        - name: source
          in: query
          required: false
          description: |
            `http` of `mcp`. Een onbekende waarde is geen fout maar een filter
            dat niets oplevert.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: De regels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: library.cursor_invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users:
    post:
      tags: [users]
      operationId: createUser
      summary: Maak een nieuwe gebruiker aan.
      description: |
        Klasse `admin`. `role` mag niet `owner` zijn; er is precies één owner
        en die ontstaat uitsluitend via /auth/setup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: De aangemaakte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.username_taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [users]
      operationId: listUsers
      summary: Gebruikers van dit huishouden.
      description: |
        Klasse `authenticated`. `owner` en `admin` zien iedereen; `member` en
        `restricted` zien in dit antwoord uitsluitend zichzelf.
      responses:
        "200":
          description: Gebruikers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: De gebruiker die deze aanvraag doet.
      description: |
        Klasse `authenticated`, en de enige beheerachtige route waar elke rol
        `200` krijgt. Dat is geen uitzondering op de 404-regel maar de
        toepassing ervan: het doel is de aanvrager zelf, er staat geen id in het
        pad en er is geen parameter, dus er valt niets te raden.

        Beschikbaar wanneer `capabilities.users` waar is; `administration` is
        hier niet voor nodig. Een oudere server kent de route niet en antwoordt
        `404`; een client valt dan terug op de naam waarmee hij inlogde.

        `me` botst niet met een id: er is geen `GET /users/{id}`.
      responses:
        "200":
          description: De eigen gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found. De gebruiker achter dit token bestaat niet
            meer; het accesstoken heeft zijn gebruiker overleefd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me/memory:
    get:
      tags: [users]
      operationId: getMemory
      summary: Persoonlijk Big P-geheugen (BP-08b).
      description: |
        Alleen onder capabilities.assistant_memory, eigen sessiebearer. API- en streamtokens
        geven geen toegang. Owner/admin/member zien uitsluitend hun eigen geheugen;
        restricted krijgt 403. Antwoorden dragen Cache-Control no-store. Geen user_id.
        Snapshot-CAS met epoch en base_revision; wijzigingen zijn atomair. Gewiste ids
        blijven geweigerd. Clear roteert de epoch; ondersteunde restore roteert alle epochs.
      responses:
        "200":
          description: De bevestigde snapshot van deze gebruiker.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemorySnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [users]
      operationId: replaceMemory
      summary: Persoonlijk Big P-geheugen (BP-08b).
      description: |
        Alleen onder capabilities.assistant_memory, eigen sessiebearer. API- en streamtokens
        geven geen toegang. Owner/admin/member zien uitsluitend hun eigen geheugen;
        restricted krijgt 403. Antwoorden dragen Cache-Control no-store. Geen user_id.
        Snapshot-CAS met epoch en base_revision; wijzigingen zijn atomair. Gewiste ids
        blijven geweigerd. Clear roteert de epoch; ondersteunde restore roteert alle epochs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryReplace" }
      responses:
        "200":
          description: De bevestigde snapshot van deze gebruiker.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemorySnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me/memory/clear:
    post:
      tags: [users]
      operationId: clearMemory
      summary: Persoonlijk Big P-geheugen (BP-08b).
      description: |
        Alleen onder capabilities.assistant_memory, eigen sessiebearer. API- en streamtokens
        geven geen toegang. Owner/admin/member zien uitsluitend hun eigen geheugen;
        restricted krijgt 403. Antwoorden dragen Cache-Control no-store. Geen user_id.
        Snapshot-CAS met epoch en base_revision; wijzigingen zijn atomair. Gewiste ids
        blijven geweigerd. Clear roteert de epoch; ondersteunde restore roteert alle epochs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryClear" }
      responses:
        "200":
          description: De bevestigde snapshot van deze gebruiker.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemorySnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Wijzig rol of wachtwoord van een gebruiker.
      description: |
        Klasse `admin`, of `owner` op de eigen gebruiker. Een gebruiker die
        niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: De bijgewerkte gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable. De owner kan niet gedegradeerd worden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Verwijder een gebruiker.
      description: Klasse `admin`. De owner verwijderen wordt geweigerd.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Gebruiker verwijderd. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: auth.owner_immutable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}/permissions:
    put:
      tags: [users]
      operationId: setUserPermissions
      summary: Zet de bibliotheekrechten van een gebruiker.
      description: |
        Klasse `admin`. Vervangt de volledige rechtenlijst van deze gebruiker.
        `owner` en `admin` hebben hier geen rijen voor: hun toegang volgt uit
        de rol.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionsRequest" }
      responses:
        "200":
          description: De nu geldende rechten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPermissionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            auth.user_not_found (aanvrager is geen admin, of de gebruiker
            bestaat niet) of library.not_found (een library_id in de aanvraag
            bestaat niet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: |
            auth.permission_not_allowed. De rol van het doel verbiedt deze
            trede: `restricted` krijgt nooit `manage` (DEC-119). Geen `404`,
            want de aanvrager is een beheerder die de gebruiker en de
            bibliotheek allebei al mag zien; er valt niets te verbergen. De
            hele lijst wordt geweigerd, ook de treden die op zichzelf mochten.
            `details` draagt `permission` en `role`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: Sessies van een gebruiker.
      description: |
        Klasse `owner` op de eigen sessies. Met `?user_id=` kunnen `owner` en
        `admin` de sessies van een ander opvragen.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Alleen bruikbaar door `owner` en `admin`. Zonder deze parameter de eigen sessies.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Sessies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. user_id is niet van de aanvrager en de aanvrager is geen admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sessions/{id}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Trek precies één sessie in.
      description: |
        Klasse `owner` op de eigen sessies, `admin` op elke sessie. Zet
        `revoked_at`, cascadeert naar de refreshtokens en browserstreamsessies
        van deze sessie, en werkt het intrekkingsregister bij. Een sessie-id
        dat niet van de aanvrager is en waar de aanvrager geen recht op heeft
        geeft `404`.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Sessie ingetrokken. }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.session_not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /stream-sessions:
    get:
      tags: [administration]
      operationId: listStreamSessions
      summary: Wie er op dit moment kijkt.
      description: |
        Klasse `admin`. De browser-streamsessies (6.4a) die op dit moment nog
        bytes kunnen ophalen: niet ingetrokken, niet verlopen, en de auth-sessie
        waaruit ze zijn uitgegeven evenmin ingetrokken. Een sessie die aan een
        van die drie voorwaarden niet voldoet staat er niet in, want een
        overzicht dat iemand toont die op zijn eerstvolgende aanvraag geweigerd
        wordt is misleidend.

        Ongepagineerd. Het aantal is per gebruiker begrensd door
        `max_stream_sessions` (1 tot 32), dus de lijst groeit met het
        huishouden en niet met de bibliotheek.

        Er staat geen geheim in. Het geheim van een streamsessie leeft
        uitsluitend in de cookie `pleya_ss_<id>`; de id zelf is niet geheim en
        reist als `ss` in de media-URL.
      responses:
        "200":
          description: De lopende streams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /watch-history:
    get:
      tags: [administration]
      operationId: getWatchHistory
      summary: Wat het huishouden de laatste dagen heeft afgekeken.
      description: |
        Klasse `admin` (DEC-143, hoofdstuk 17b.7). Per gebruiker de films en
        afleveringen met `watched` of `play_count` boven nul waarvan de
        kijkstatus in de laatste `days` dagen is bijgewerkt. Geen afspeellog:
        een regel is de laatste aanraking van een gebruiker op een item.

        Nieuwste eerst, ten hoogste 1000 regels; `truncated` zegt dat er meer
        waren.
      parameters:
        - name: days
          in: query
          required: false
          description: 1 tot en met 31, standaard 7. Een waarde daarbuiten wordt geklemd.
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        "200":
          description: De afgekeken titels per gebruiker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchHistory" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager is geen admin of owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server:
    get:
      tags: [discovery]
      operationId: getServer
      summary: Serverdetail achter authenticatie.
      description: |
        Klasse `authenticated`. Voor klasse `admin` komen er acht velden bij
        (S1.3): `public_url`, `listen`, `behind_proxy`, `trusted_proxies`,
        `build`, `database`, `ffprobe` en `health`. Een lid krijgt hetzelfde
        antwoord als altijd, zonder die velden en zonder een aanwijzing dat ze
        bestaan.
      responses:
        "200":
          description: Naam, versie en starttijd; voor een beheerder ook hoe de server draait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/environment:
    get:
      tags: [administration]
      operationId: getServerEnvironment
      summary: De omgevingsvariabelen van deze server.
      description: |
        Klasse `admin`. Alleen `PLEYA_SERVER_*` plus een gemaskeerde
        `DATABASE_URL`; de rest van de procesomgeving hoort bij de container en
        kan credentials van heel andere diensten dragen. Een lid of een
        beperkte gebruiker krijgt `404`.
      responses:
        "200":
          description: De variabelen, gesorteerd op naam.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvironment" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/log:
    get:
      tags: [administration]
      operationId: getServerLog
      summary: De laatste logregels.
      description: |
        Klasse `admin`. De regels komen uit een ringbuffer in het geheugen en
        nooit uit een bestand, en ze zijn geredigeerd op de weg de buffer in.
        Nieuwste eerst.
      parameters:
        - name: level
          in: query
          required: false
          description: Ondergrens. Een waarde die deze server niet kent is geen fout maar geen filter.
          schema: { $ref: "#/components/schemas/LogLevel" }
        - name: limit
          in: query
          required: false
          description: Hoogstens 500, de capaciteit van de buffer. Een hogere waarde wordt daarheen teruggebracht.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: De regels, nieuwste eerst.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerLog" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/connectivity-check:
    post:
      tags: [administration]
      operationId: checkConnectivity
      summary: Is deze server van buiten bereikbaar, en komen ranges heel aan.
      description: |
        Klasse `admin`. Er is geen aanvraagbody, en dat is de beveiliging: het
        doel is altijd het eigen `public_url` en er is dus niets aan de
        aanvrager om het ergens anders heen te richten. Vaste time-out, geen
        omleidingen. Zonder ingesteld `public_url` is het antwoord `false` op
        beide metingen, want er is dan niets aan te roepen.
      responses:
        "200":
          description: De uitkomst van de twee metingen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectivityCheck" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /server/rotate-signing-key:
    post:
      tags: [administration]
      operationId: rotateSigningKey
      summary: Vervang de ondertekensleutel en trek elke sessie in.
      description: |
        Klasse `admin`, en de bevestiging is verplicht: `confirm` moet
        letterlijk `rotate` zijn.

        De handeling trekt eerst elke sessie in en vervangt daarna pas de
        sleutel. Andersom zou een mislukte schrijfactie een server achterlaten
        waarvan de accesstokens dood zijn en de refreshtokens leven, en dan
        logt elke client zichzelf meteen weer in met precies de keten die de
        beheerder wilde verbreken.

        Ook het token van de aanvrager is hierna dood; opnieuw inloggen hoort
        erbij. Het antwoord draagt de nieuwe sleutel niet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateSigningKeyRequest" }
      responses:
        "204": { description: "Sleutel vervangen; alle sessies zijn ingetrokken." }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: server.confirm_mismatch. De bevestiging ontbreekt of klopt niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /settings:
    get:
      tags: [administration]
      operationId: getSettings
      summary: De beheerbare serverinstellingen.
      description: |
        Klasse `admin`. Per sleutel de waarde die nu geldt plus de laag die hem
        levert: `env` is de omgeving waarmee de server startte, `db` een waarde
        die een beheerder heeft opgeslagen. Een lid of een beperkte gebruiker
        krijgt `404`, dezelfde weigering als overal (hoofdstuk 7.1).

        Wat hier niet in staat is een keuze en geen omissie: bindadres,
        vertrouwde proxy's, paden en de ondertekensleutel horen bij het draaien
        van de container en niet bij beheer in de app.
      responses:
        "200":
          description: De set zoals hij nu geldt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [administration]
      operationId: patchSettings
      summary: Wijzig een of meer instellingen.
      description: |
        Klasse `admin`. De body is gesloten: een onbekende sleutel is een fout
        en geen veld dat stil wegvalt. Elke waarde heeft een grens; een waarde
        erbuiten geeft `settings.invalid_value` met het veld en de grens in
        `details`, en dan wijzigt er niets, ook niet aan de sleutels die wel
        klopten.

        Een geslaagde wijziging geldt vanaf het eerstvolgende verzoek: een
        nieuwe TTL zit dus in het eerstvolgende token, zonder herstart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: De set na de wijziging.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400":
          description: settings.invalid_value. Onbekende sleutel, verkeerd type, of buiten de grens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries:
    get:
      tags: [library]
      operationId: listLibraries
      summary: Alle zichtbare bibliotheken.
      description: |
        Niet gepagineerd; een huishouden heeft er een handvol.

        `managed`, `scan_interval_seconds` en `scan_on_start` gaan alleen mee
        voor klasse `admin` (S2.2, J.3); voor de rest ziet dit endpoint er
        precies zo uit als vóór S2.
      responses:
        "200":
          description: Bibliotheken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryList" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [library]
      operationId: createLibrary
      summary: Maak een door de API beheerde bibliotheek aan.
      description: |
        Klasse `admin`. De aangemaakte bibliotheek draagt `managed: db`, en
        blijft dat: de config-sync die `PLEYA_SERVER_LIBRARIES` leest raakt
        haar niet aan.

        `root_paths` worden structureel gevalideerd (geen overlap met een
        bestaande root of met een andere root in dezelfde aanvraag) en tegen
        de opsomming uit `GET /storage/roots`: een root_path moet onder een
        van de mounts uit `PLEYA_SERVER_MEDIA_DIRS` vallen. Geen van beide
        controles raakt het bestandssysteem aan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLibraryRequest" }
      responses:
        "201":
          description: De aangemaakte bibliotheek.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400":
          description: storage.root_not_offered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: library.slug_taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}:
    patch:
      tags: [library]
      operationId: updateLibrary
      summary: Werk een bibliotheek bij.
      description: |
        Klasse `admin`. Elk veld is optioneel; alleen wat wordt meegestuurd
        verandert. `kind` mag alleen wisselen zolang de bibliotheek geen enkel
        item draagt.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLibraryRequest" }
      responses:
        "200":
          description: De bijgewerkte bibliotheek.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400":
          description: storage.root_not_offered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: library.not_empty of library.config_managed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [library]
      operationId: deleteLibrary
      summary: Verwijder een bibliotheek.
      description: |
        Klasse `admin`, en de bevestiging is verplicht: `confirm` moet
        letterlijk de titel van de bibliotheek zijn (K rij 16).

        Verwijdert uitsluitend in de database. Geen bestand op schijf wordt
        aangeraakt.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteLibraryRequest" }
      responses:
        "204": { description: "Bibliotheek verwijderd." }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: library.confirm_mismatch of library.config_managed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/adopt:
    post:
      tags: [administration]
      operationId: adoptLibrary
      summary: Neem een bibliotheek uit de omgevingsvariabele over in de database.
      description: |
        Klasse `admin`. Zet `managed` van `config` naar `db`, met dezelfde id
        en dezelfde slug; items, kijkstatus en roots blijven wat ze waren.
        Daarna negeert de server de regel in `PLEYA_SERVER_LIBRARIES` voor
        deze bibliotheek en meldt dat bij het opstarten in de logs.

        Geen aanvraagbody. Raakt het bestandssysteem niet.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: De overgenomen bibliotheek, nu met managed db.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: library.not_config_managed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/metadata-coverage:
    get:
      tags: [administration]
      operationId: getMetadataCoverage
      summary: Hoeveel titels van een bibliotheek beschrijvende velden hebben.
      description: |
        Klasse `admin` (venster 3, pakket B5). Telt films of series van één
        bibliotheek. `ratio` is het aandeel met genres; de poort staat open
        (`gate_met`) vanaf `threshold`. Onder de drempel laat de server `genres`
        op `Item` weg, want genres bij te weinig titels maken een genrefilter
        misleidend. Samenvatting en kijkwijzer vallen niet onder de poort.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: De dekking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataCoverage" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found voor wie geen admin is, of library.not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /metadata/attention:
    get:
      tags: [administration]
      operationId: listMetadataAttention
      summary: Titels waar een beheerder naar moet kijken.
      description: |
        Klasse `admin` (S22.5). Titels die niet vanzelf een providermatch kregen
        (`ambiguous`, `unmatched`), waarvan het ophalen faalde (`failed`), of die
        een beheerder afwees (`rejected`). Bij `ambiguous` en `unmatched` staan de
        beste zoektreffers als `alternatives`, in de volgorde van de provider.
        Afgekapt op `limit`; `total` is het werkelijke aantal.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: De lijst.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataAttentionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /items/{item_id}/metadata-match:
    put:
      tags: [administration]
      operationId: setMetadataMatch
      summary: Kies welke titel van de provider bij dit item hoort.
      description: |
        Klasse `admin` (S22.5). Alleen een film of een serie. De keuze gaat voor
        op een id uit een sidecar en op zoeken; de server haalt de gegevens van
        die titel meteen op en past ze toe (antwoord `202`). Kiezen na een
        afwijzing heft de afwijzing op. Een `external_id` die geen positief
        geheel getal is geeft `library.invalid_match`.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMetadataMatchRequest" }
      responses:
        "202":
          description: De keuze staat vast; het ophalen gebeurt op de achtergrond.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataMatch" }
        "400":
          description: library.invalid_match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found voor wie geen admin is, of library.not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [administration]
      operationId: clearMetadataMatch
      summary: Wijs de providermatch af.
      description: |
        Klasse `admin` (S22.5). Haalt weg wat de provider bij dit item zette
        (samenvatting, genres, kijkwijzer, cast, gecachte afbeeldingen) en zorgt
        dat de titel nooit meer vanzelf aan de beurt komt. Wat een sidecar zette
        blijft staan. Idempotent.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: De titel staat op `rejected`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataMatch" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found voor wie geen admin is, of library.not_found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/scan:
    post:
      tags: [administration]
      operationId: startScan
      summary: Start een scan van een bibliotheek.
      description: |
        Klasse `admin`. Maakt een scanrij op `queued` en een scanjob aan.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: De nieuwe scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: library.scan_in_progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /scans:
    get:
      tags: [administration]
      operationId: listScans
      summary: Lijst scans, nieuwste eerst.
      description: Klasse `admin`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: library_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Een pagina scans.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPage" }
        "400":
          description: library.cursor_invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /scans/{scan_id}:
    get:
      tags: [administration]
      operationId: getScan
      summary: Lees een scan.
      description: Klasse `admin`.
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: De scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs:
    get:
      tags: [administration]
      operationId: listJobs
      summary: Lijst jobs, nieuwste eerst.
      description: Klasse `admin`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "400":
          description: library.cursor_invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/{job_id}/cancel:
    post:
      tags: [administration]
      operationId: cancelJob
      summary: Annuleer een job.
      description: Klasse `admin`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: De job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: job.not_cancellable. details.reason is finished (de job is al klaar).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /jobs/{job_id}/retry:
    post:
      tags: [administration]
      operationId: retryJob
      summary: Zet een job opnieuw in de wachtrij.
      description: |
        Klasse `admin`. Werkt op elke job die niet al `pending` of `running` is,
        dus ook een `succeeded` job; niet beperkt tot `failed` of `cancelled`.
        Staat de job nog op `pending` of `running`, dan verandert er niets en
        komt dezelfde job ongewijzigd terug.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: De job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: job.not_cancellable. details.reason is duplicate_in_flight (dezelfde dedupe-sleutel staat al in de wachtrij).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /storage/roots:
    get:
      tags: [administration]
      operationId: listStorageRoots
      summary: Welke mediamounts deze installatie kent, en wie ze gebruikt.
      description: |
        Klasse `admin`. De lijst is de opsomming uit `PLEYA_SERVER_MEDIA_DIRS`
        (S2.3), aangevuld met elke root die al aan een bibliotheek hangt: een
        root die uit die instelling is verdwenen blijft zichtbaar met
        `mounted: false` in plaats van stilzwijgend te verdwijnen.

        `root_paths` op `POST`/`PATCH /libraries` moeten letterlijk onder een
        van deze mounts vallen (hoofdstuk 17e.4 van de specificatie).
      responses:
        "200":
          description: De mounts, gesorteerd op pad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageRootList" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /storage/roots/recheck:
    post:
      tags: [administration]
      operationId: recheckStorageRoots
      summary: Meet elke geclaimde root opnieuw.
      description: |
        Klasse `admin`. Plant een meetronde in (bestandssysteemtype en
        inodevertrouwen) op elke geclaimde root en antwoordt meteen met `202`;
        de meting zelf loopt buiten de aanvraag om via de jobwachtrij, zodat
        een trage of tijdelijk onbereikbare mount de aanvrager niet laat
        wachten. Een tweede tik terwijl de eerste nog loopt wordt
        gededupliceerd.
      responses:
        "202": { description: "Meetronde ingepland." }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: auth.user_not_found. De aanvrager haalt de klasse admin niet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/items:
    get:
      tags: [library]
      operationId: listLibraryItems
      summary: Blader door een bibliotheek.
      description: |
        Een bibliotheek van soort `shows` levert uitsluitend items met
        kind `show`. Seizoenen en afleveringen bereikt u via /items/{id}/children.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          required: false
          description: |
            Een voorafgaand minteken keert de volgorde om. Een item zonder
            waarde (geen jaar, geen duur, nooit gekeken) staat in beide
            richtingen achteraan. `last_played_at` is het laatste moment waarop
            de aanvrager voortgang op het item boekte (bij een serie: op een van
            haar afleveringen); `duration` is de duur van de langste versie.
          schema:
            type: string
            enum:
              - title
              - added_at
              - year
              - last_played_at
              - duration
              - "-title"
              - "-added_at"
              - "-year"
              - "-last_played_at"
              - "-duration"
            default: title
            x-unknown-safe: false
        - name: genre
          in: query
          required: false
          description: |
            Herhaalbaar; een titel met een van de waarden telt mee. Vergelijkt
            zonder hoofdletters. De dekkingspoort (zie metadata-coverage) bepaalt
            alleen of de server genres toont en als facet aanbiedt; het filter
            zelf werkt ook met de poort dicht, voor wie de waarde al kent.
          schema: { type: array, items: { type: string }, maxItems: 50 }
          style: form
          explode: true
        - name: year
          in: query
          required: false
          description: Herhaalbaar, vier cijfers, 1800 tot en met 2200.
          schema: { type: array, items: { type: string, pattern: "^[0-9]{4}$" }, maxItems: 50 }
          style: form
          explode: true
        - name: year_from
          in: query
          required: false
          description: Vanaf dit jaar, inclusief. Niet na `year_to`.
          schema: { type: string, pattern: "^[0-9]{4}$" }
        - name: year_to
          in: query
          required: false
          description: Tot dit jaar, inclusief.
          schema: { type: string, pattern: "^[0-9]{4}$" }
        - name: external_id
          in: query
          required: false
          description: |
            Alleen onder `capabilities.external_id_lookup`. Levert de titels met
            dit providernummer, `tmdb:<getal>`, uit deze bibliotheek: een film
            in een `movies`-bibliotheek, een serie in een `shows`-bibliotheek.
            Geen titel of jaar nodig. Een lege lijst betekent dat deze server
            de titel in deze bibliotheek niet heeft of niet bewezen heeft. Een
            waarde die geen providernummer is geeft `library.filter_invalid`.
          schema: { type: string, pattern: "^tmdb:[1-9][0-9]*$" }
        - name: watch
          in: query
          required: false
          description: |
            Voor de aanvrager. `unwatched` bevat ook wat half bekeken is,
            `in_progress` is de deelverzameling met voortgang, `watched` is
            uitgekeken. Bij een serie telt de som van haar afleveringen: alle
            afleveringen gezien is `watched`, een deel gezien of begonnen is
            `in_progress`, en `unwatched` is elke serie die niet helemaal gezien
            is (ook een serie zonder afleveringen), zodat unwatched en watched
            samen het totaal vormen.
          schema:
            type: string
            enum: [unwatched, in_progress, watched]
            x-unknown-safe: false
        - name: content_rating
          in: query
          required: false
          description: Herhaalbaar; zonder hoofdletters, zoals de kijkwijzer in `Item` staat.
          schema: { type: array, items: { type: string }, maxItems: 50 }
          style: form
          explode: true
        - name: audio_language
          in: query
          required: false
          description: |
            Herhaalbaar; een taalcode van twee of drie letters (`nl`, `nld`, `dut`).
            De server zet hem om naar ISO 639-2/B zoals de facetten hem tonen
            (`dut`); `und` en onbekende codes zijn `library.filter_invalid`.
            Een titel telt mee als een geluidsspoor van een van zijn versies
            (bij een serie: van een van haar afleveringen) die taal heeft.
          schema: { type: array, items: { type: string, pattern: "^[A-Za-z]{2,3}$" }, maxItems: 50 }
          style: form
          explode: true
        - name: resolution
          in: query
          required: false
          description: |
            Herhaalbaar; de klasse van het videospoor: `sd`, `hd` (vanaf 1200 of
            700), `fhd` (1800 of 1000), `uhd` (3200 of 2000), breedte of hoogte.
            De lijst kan groeien; een client toont onbekende waarden uit
            `/facets` zonder ze te herkennen.
          schema:
            type: array
            maxItems: 50
            items: { type: string, enum: [sd, hd, fhd, uhd], x-unknown-safe: true }
          style: form
          explode: true
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400":
          description: |
            `library.cursor_invalid`, of `library.filter_invalid` met
            `details.parameter` en `details.value` voor een filter dat de server
            niet kan uitvoeren.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /libraries/{library_id}/facets:
    get:
      tags: [library]
      operationId: getLibraryFacets
      summary: De waarden waarop een bibliotheek te filteren is, met tellingen.
      description: |
        Klasse `authenticated`, met dezelfde bibliotheekautorisatie als de
        lijst (venster 3, pakket D1). Telt alle films of series van de
        bibliotheek en past de andere filters niet toe; `watch` geldt voor de
        aanvrager. Het genrefacet is een lege lijst zolang de dekkingspoort
        van de bibliotheek dicht staat.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: De facetten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facets" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /playback/plan:
    post:
      tags: [playback]
      operationId: planPlayback
      summary: Vraag welke versie een toestel hoe kan afspelen, en waarom.
      description: |
        Klasse `authenticated`, met dezelfde bibliotheekautorisatie als het item
        (venster 5 deel 1, S17). Alleen aanwezig wanneer
        `capabilities.playback_plan` waar is.

        De planner is een pure functie van de versies van het item en de
        `capabilities` van het toestel; hij vertakt nooit op het clienttype.
        Een capability die ontbreekt of `unknown` is keurt niets af, zodat een
        client die niets meldt hetzelfde krijgt als vóór dit endpoint:
        `direct_play` van de goedkoopste versie. Goedkoopst is de lichtste
        leveringswijze, daarna de laagste bitrate; de hoogste kwaliteit is
        geen criterium. `version_id` beperkt de keuze tot die ene versie.

        Zolang `capabilities.transcode` uit staat levert de server alleen
        `direct_play`. Laat dat niets over, dan is het antwoord `415`
        `playback.not_playable`, met in `details.reasons` waarom de goedkoopste
        versie niet paste en als laatste `server.transcode_unavailable`.

        Met `capabilities.transcode` start een plan dat meer dan direct play is
        meteen een sessie: `session_id` is gezet, `stream_url` wijst naar de
        HLS-afspeellijst van die sessie, `container` is `hls` en `seekable` is
        `false` (de lijst groeit mee met de omzetting, een speler kan alleen
        zoeken in wat er al ligt). Alle sessies bezet is `503`
        `playback.transcode_busy`, ffmpeg die niets levert `502`
        `playback.transcode_failed`.

        `reason` is de hoofdreden en het eerste element van `reasons`. Een reden
        is een domeincode met parameters, geen vertaalsleutel; een client die
        een code niet kent toont een generieke tekst en logt de code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackPlanRequest" }
      responses:
        "200":
          description: Het plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlan" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: playback.version_unavailable, het item heeft geen leverbare versie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: playback.not_playable, geen versie past op dit toestel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: playback.transcode_failed, de omzetting leverde niets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: playback.transcode_busy, alle omzetsessies zijn bezet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /playback/sessions/{session_id}/heartbeat:
    post:
      tags: [playback]
      operationId: heartbeatPlaybackSession
      summary: Houd een omzetsessie levend.
      description: |
        Klasse `authenticated`, alleen voor de gebruiker die de sessie startte
        (venster 5 deel 2, S18). Een sessie zonder hartslag of aanvraag voor zijn
        bestanden wordt na een minuut gestopt en opgeruimd, ook wanneer de client
        zonder DELETE verdwijnt. Een sessie van een ander is `404`.
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      responses:
        "204": { description: De sessie leeft. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /playback/sessions/{session_id}:
    delete:
      tags: [playback]
      operationId: stopPlaybackSession
      summary: Stop een omzetsessie en ruim hem op.
      description: |
        Klasse `authenticated`, alleen voor de eigenaar van de sessie. Het
        ffmpeg-proces stopt en zijn bestanden verdwijnen.
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      responses:
        "204": { description: De sessie is gestopt. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /playback/sessions/{session_id}/{file}:
    get:
      tags: [playback]
      operationId: getPlaybackSessionFile
      summary: De afspeellijst, het initsegment of een segment van een omzetsessie.
      description: |
        Autorisatie als op de stream: een bearer (alleen de eigenaar van de
        sessie), een `stream_token` van de versie die wordt omgezet, of een
        browser-streamsessie. Elke aanvraag telt als hartslag.

        De afspeellijst is HLS met fMP4-segmenten. Draagt de aanvraag een
        `stream_token` of `ss`, dan krijgt elke verwijzing in de lijst diezelfde
        query mee, omdat een speler de query van de lijst niet overneemt. Alleen
        de namen `index.m3u8`, `init.mp4` en `seg_NNNNN.m4s` bestaan.
      security:
        - bearerAuth: []
        - streamToken: []
        - streamSession: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: "^(index\\.m3u8|init\\.mp4|seg_[0-9]{5}\\.m4s)$" }
        - name: stream_token
          in: query
          required: false
          schema: { type: string }
        - name: ss
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Het bestand.
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transcode-sessions:
    get:
      tags: [administration]
      operationId: listTranscodeSessions
      summary: De lopende omzetsessies, het maximum en de hardwarestatus.
      description: |
        Klasse `admin`, `404` voor de rest (venster 5 deel 2, S18.5). Zonder
        omzetter (`capabilities.transcode` onwaar) is de lijst leeg met
        `max_sessions` nul. `hardware.accel` is `none` wanneer opstarten geen
        werkende versnelling vond, met de reden in `hardware.reason`; wie
        versnelling verwacht ziet hier waarom hij ontbreekt. Een sessie die na
        een mislukte hardwarestart in software draait, meldt `hw_accel` null.
      responses:
        "200":
          description: De sessies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscodeSessionList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transcode-sessions/{session_id}:
    delete:
      tags: [administration]
      operationId: stopTranscodeSession
      summary: Stop de omzetsessie van wie dan ook.
      description: |
        Klasse `admin`. Het proces stopt en de bestanden verdwijnen; de speler
        van die sessie krijgt `404` op zijn volgende aanvraag. Komt in het
        auditlog als `stopTranscodeSession`.
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      responses:
        "204": { description: De sessie is gestopt. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /backups:
    get:
      tags: [administration]
      operationId: listBackups
      summary: De back-ups, de nieuwste eerst, met doel, tijdstip en bewaartermijn.
      description: |
        Klasse `admin`, `404` voor de rest, alleen onder `capabilities.backups`
        (venster 7, S25). `dir`, `schedule` en `retention_days` komen uit de
        omgeving en zijn geen instelling. `same_failure_domain` waarschuwt dat de
        back-upmap op hetzelfde bestandssysteem staat als `/config`;
        `secrets_key_configured` onwaar betekent dat de geheimen uit `/config`
        niet in een back-up meegaan.
      responses:
        "200":
          description: De back-ups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [administration]
      operationId: createBackup
      summary: Nu een back-up maken.
      description: |
        Klasse `admin`. De back-up loopt als job; het antwoord is de nieuwe rij
        met `status: running`. Er loopt er één tegelijk: een tweede aanvraag
        terwijl de eerste wacht of loopt is `409` met `server.backup_busy`
        (herhaalbaar). Een mislukte back-up draagt in `failure_code` de code van
        zijn faalpad, `storage.full` voor een volle schijf.
      responses:
        "202":
          description: De back-up staat in de wachtrij.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Error" }

  /backups/{backup_id}:
    get:
      tags: [administration]
      operationId: getBackup
      summary: Eén back-up, met de laatste hersteltest.
      description: Klasse `admin`. Een onbekende back-up is `404` met `library.not_found`.
      parameters:
        - $ref: "#/components/parameters/BackupId"
      responses:
        "200":
          description: De back-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Error" }

  /backups/{backup_id}/verify:
    post:
      tags: [administration]
      operationId: verifyBackup
      summary: Een hersteltest starten.
      description: |
        Klasse `admin`. Zet de back-up terug in een eigen tijdelijke database,
        draait daar de migraties van deze server overheen en telt titels,
        gebruikers, bibliotheken en kijkstatus na tegen het manifest. De echte
        database blijft onaangeraakt. De server doet dit zelf wekelijks na de
        geplande back-up; deze aanroep doet het nu. Een back-up die niet geslaagd
        is, is `409` met `server.backup_not_restorable`.
      parameters:
        - $ref: "#/components/parameters/BackupId"
      responses:
        "202":
          description: De hersteltest staat in de wachtrij; `last_restore_test` loopt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Error" }

  /backups/{backup_id}/restore:
    post:
      tags: [administration]
      operationId: restoreBackup
      summary: Een back-up terugzetten.
      description: |
        Klasse `admin`. `confirm` moet letterlijk gelijk zijn aan
        `restore_confirmation` van de back-up: die zin noemt het tijdstip en wat
        er verloren gaat. Een andere waarde is `409` met
        `server.confirm_mismatch`, met de zin in `details.expected`. Een back-up
        die niet geslaagd is, van een nieuwer schema dan deze server, of waarvan
        de sleutel niet past op de geheimen, is `409` met
        `server.backup_not_restorable` en de reden in `details.reason`. Loopt er
        een back-up of hersteltest, dan `409` met `server.backup_busy`.

        Na de controles gaat de server in onderhoud: elke aanvraag krijgt `503`
        met `server.maintenance`, `/readyz` is niet gereed. De restore gebeurt in
        één transactie; daarna herstart de server, ook als het terugzetten
        mislukte, en dan is de database ongewijzigd.
      parameters:
        - $ref: "#/components/parameters/BackupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreBackupRequest" }
      responses:
        "202":
          description: De restore is begonnen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Error" }

  /downloads:
    post:
      tags: [library]
      operationId: createDownload
      summary: Een bestand klaarzetten om te downloaden.
      description: |
        Klasse `authenticated`, alleen onder `capabilities.downloads` (venster 6
        deel 3, S23). Vraagt het recht `download` op de bibliotheek van het item:
        een bibliotheek die de aanvrager niet mag zien is `404`, een die hij wel mag
        zien maar niet mag downloaden is `403` met `library.download_not_permitted`. Zonder
        `version_id` geldt de eerste versie. Een versie van meer dan één bestand is
        `409` met `library.version_multifile`. De download is eerst `preparing`
        terwijl de server de SHA-256 uitrekent; de client leest `GET /downloads/{id}`
        tot `ready` en haalt dan `file_url` op.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDownloadRequest" }
      responses:
        "201":
          description: De download is aangemaakt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [library]
      operationId: listDownloads
      summary: De downloads van de aanvrager, de nieuwste eerst.
      description: Klasse `authenticated`, alleen onder `capabilities.downloads`. Alleen de eigen downloads.
      responses:
        "200":
          description: De downloads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /downloads/{download_id}:
    get:
      tags: [library]
      operationId: getDownload
      summary: De stand van één download.
      description: Klasse `authenticated`. De download van een ander bestaat niet (`404`).
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: De download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [library]
      operationId: deleteDownload
      summary: Een download weghalen.
      description: Het mediabestand blijft staan; alleen de klaargezette download verdwijnt.
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204": { description: De download is weg. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /downloads/{download_id}/file:
    get:
      tags: [library]
      operationId: getDownloadFile
      summary: De bytes van een klaargezette download, met controlesom en hervatten.
      description: |
        Klasse `authenticated`; het recht `download` wordt bij elke aanvraag
        opnieuw getoetst, ook tijdens een hervatting. De `ETag` is sterk
        (`"sha256-<hex>"`) en `Digest` en `Repr-Digest` dragen dezelfde SHA-256.
        `Range` werkt alleen samen met een `If-Range` gelijk aan die `ETag`; zonder
        komt het hele bestand. Een download die nog `preparing` is geeft `409` met
        `library.download_not_ready` (herhaalbaar), een bestand dat na het uitrekenen van
        grootte of wijzigingstijd veranderde `409` met `library.download_changed`: de client
        vraagt dan een nieuwe download.
      parameters:
        - $ref: "#/components/parameters/DownloadId"
        - name: Range
          in: header
          required: false
          schema: { type: string }
        - name: If-Range
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Het hele bestand.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Het gevraagde stuk.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /history:
    get:
      tags: [library]
      operationId: getHistory
      summary: De afspeelgeschiedenis van de aanvrager, de laatste sessie eerst.
      description: |
        Klasse `authenticated`, alleen onder `capabilities.history` (venster 6
        deel 2, S20). Eén regel per afspeelsessie (de `session_id` van de client
        uit `POST /watch-state`), die met de meldingen van die sessie meegroeit:
        een film van twee uur met een melding per tien seconden is één regel. Ook
        een offline backlog komt erin, een melding van een toestel zonder
        schrijfrecht niet. Beperkt tot de bibliotheken die de aanvrager mag zien.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Een pagina geschiedenis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /favorites:
    get:
      tags: [library]
      operationId: listFavorites
      summary: De favorieten van de aanvrager, de laatst toegevoegde eerst.
      description: Klasse `authenticated`, alleen onder `capabilities.favorites`. Beperkt tot de bibliotheken die de aanvrager mag zien.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /favorites/{item_id}:
    put:
      tags: [library]
      operationId: setFavorite
      summary: Maak een item favoriet.
      description: Herhalen is onschadelijk. Een item buiten de bibliotheken van de aanvrager is `404`.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: Het item is favoriet. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [library]
      operationId: clearFavorite
      summary: Haal een item uit de favorieten.
      description: Een item dat geen favoriet was is geen fout.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: Het item is geen favoriet meer. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /ratings/{item_id}:
    put:
      tags: [library]
      operationId: setRating
      summary: Waardeer een item met een cijfer van 1 tot en met 10.
      description: Alleen onder `capabilities.ratings`. Een cijfer buiten bereik is `400` met `library.personal_invalid`.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingRequest" }
      responses:
        "204": { description: De waardering is bewaard. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [library]
      operationId: clearRating
      summary: Haal de waardering van een item weg.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: Er is geen waardering meer. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /track-preferences/{item_id}:
    get:
      tags: [library]
      operationId: getTrackPreference
      summary: De voorkeur voor audio en ondertitels die voor een item geldt.
      description: |
        Alleen onder `capabilities.track_preferences`. De voorkeur van het item
        zelf, anders die van het seizoen of de serie erboven (`source_item_id`
        zegt waar hij aan hangt). Zonder voorkeur zijn alle velden null. Hij reist
        met de gebruiker mee naar elk toestel.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: De voorkeur.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackPreference" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [library]
      operationId: setTrackPreference
      summary: Leg de voorkeur voor audio en ondertitels vast bij een item.
      description: |
        Bij een film, een serie of een aflevering. Een veld dat ontbreekt zegt
        niets over die keuze. Minstens één veld is verplicht; een ongeldige waarde
        is `400` met `library.personal_invalid` en `details.field`.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackPreferenceRequest" }
      responses:
        "200":
          description: De voorkeur zoals hij nu geldt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackPreference" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [library]
      operationId: clearTrackPreference
      summary: Haal de voorkeur bij precies dit item weg.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: De voorkeur bij dit item is weg. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /items/{item_id}:
    get:
      tags: [library]
      operationId: getItem
      summary: Eén item met zijn versies en kijkstatus.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /items/{item_id}/children:
    get:
      tags: [library]
      operationId: listItemChildren
      summary: Seizoenen van een serie, afleveringen van een seizoen.
      description: Voor een film is het antwoord een lege lijst en geen fout.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /search:
    get:
      tags: [library]
      operationId: search
      summary: Zoek over alle bibliotheken.
      description: |
        Resultaten zijn gewone itemobjecten. Er is geen apart resultaattype en
        geen groepering per soort; de client groepeert zelf en hoeft daarvoor
        geen tweede vorm te kennen.

        Zonder kind levert een zoekopdracht items van soort movie, show en
        episode. Seizoenen blijven eruit: hun titel is "Season 3" en draagt
        niets van wat een gebruiker intypt, dus ze voegen alleen ruis toe aan
        korte zoektermen. Een seizoen is met kind=season wel op te vragen en
        staat verder in de kinderen van zijn serie.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ItemKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items. Geen treffers is een lege lijst, geen fout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /hubs/{hub_id}:
    get:
      tags: [library]
      operationId: getHub
      summary: Bouwstenen voor het homescherm.
      description: |
        De server levert bouwstenen en geen schermindeling; de client bouwt zijn
        eigen rijen. Een server zonder kijkstatus levert lege lijsten voor
        continue_watching en next_up, en geen fout.

        Staat capabilities.watch_state op true, dan geldt hoofdstuk 15 van de
        specificatie, dat de inhoud van beide hubs normatief vastlegt.
        continue_watching bevat films en afleveringen met watched false en
        position_ms boven nul, aflopend op het moment van de laatste wijziging.
        next_up bevat per serie precies een aflevering: de laagst genummerde
        aflevering vanaf de hoogst genummerde aflevering waar deze identiteit
        kijkstatus op heeft, die ongekeken is en waaraan nog niet begonnen is.
        Specials (seizoen met item_index 0) en ongenummerde afleveringen tellen
        niet mee, niet als kandidaat en niet als ankerpunt. Een serie zonder
        kijkstatus staat niet in next_up, en een serie die uit is verdwijnt
        eruit. De twee hubs leveren nooit hetzelfde item.

        Een cursor hoort bij de hub die hem uitgaf; hem op een andere hub
        aanbieden levert library.cursor_invalid.
      parameters:
        - name: hub_id
          in: path
          required: true
          schema:
            type: string
            enum: [recently_added, continue_watching, next_up]
            x-unknown-safe: false
        - name: library_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /artwork/{artwork_id}:
    get:
      tags: [library]
      operationId: getArtwork
      summary: Een afbeelding, eventueel op maat.
      description: |
        Een andere afbeelding krijgt een ander id, maar de bytes achter een id
        kunnen veranderen (een vervangen bestand op schijf). Daarom draagt het
        antwoord een ETag en een `Cache-Control` met `max-age=300,
        must-revalidate`: cachen mag, blijven geloven zonder te vragen niet.
        Een 404 is een normale toestand en geen storing.

        Met `width` (en `capabilities.artwork_sizes` waar) levert de server een
        trede van een vaste ladder in plaats van het origineel. De breedte
        wordt naar boven afgerond op de dichtstbijzijnde trede voor de rol van
        de afbeelding: poster 240, 480, 960, 1920; backdrop 480, 960, 1920,
        3840. De server schaalt nooit op boven de bron en blijft boven de
        bovenste trede op die trede; is de bron al smaller dan de trede, dan is
        het antwoord het origineel. Elke trede heeft een eigen sterke ETag. Een
        afgeleide maat is altijd `image/jpeg`. Een `width` buiten het bereik of
        zonder waarde levert het origineel.
      parameters:
        - name: artwork_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: width
          in: query
          required: false
          description: |
            Gewenste breedte in pixels; de server kiest de trede (zie de
            beschrijving van de route). Zonder deze parameter krijgt u het origineel.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: De afbeelding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              schema: { type: string }
              description: "`public, max-age=300, must-revalidate`."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Niet gewijzigd. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /subtitles/{subtitle_id}:
    get:
      tags: [playback]
      operationId: getSubtitle
      summary: Een ondertitelbestand.
      security:
        - bearerAuth: []
        - streamToken: []
      parameters:
        - name: subtitle_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Het ondertitelbestand.
          content:
            application/x-subrip: { schema: { type: string } }
            text/x-ssa: { schema: { type: string } }
            text/vtt: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /stream/{version_id}:
    get:
      tags: [playback]
      operationId: getStream
      summary: Direct play met HTTP-range.
      description: |
        Het hoofdpad en verreweg het meeste verkeer. Geen sessie, geen state,
        geen opruimwerk.

        Eén bereik per aanvraag. Een Range-header met meerdere bereiken wordt
        beantwoord met het volledige bestand als 200; dat is de toegestane
        terugval en houdt een speler die het toch probeert aan de praat, waar
        een 416 hem zou breken.

        De ETag is een ZWAKKE validator (`W/"..."`). Pleya beheert de bestanden
        niet: ze staan op mounts die er buiten Pleya om vervangen worden, en RFC
        9110 §8.8.1 vraagt van een sterke validator strict revision control of
        een collision-resistant hash over de bytes. Geen van beide is er, dus de
        belofte staat er niet.

        Gevolg voor If-Range: de server negeert de Range-header en antwoordt met
        de volledige representatie als 200, de terugval uit RFC 9110 §13.1.5.
        Een conformante client stuurt If-Range sowieso niet met een zwakke
        validator.

        Een VERSCHILLENDE ETag betekent: er is iets veranderd, gooi de buffer
        weg. Een GELIJKE ETag zegt niets over de bytes en is nooit grond om twee
        los opgehaalde bereiken aan elkaar te plakken. Hervatten na een
        onderbreking gaat met een gewone Range-aanvraag.
      security:
        - bearerAuth: []
        - streamToken: []
        - streamSession: []
      parameters:
        - name: version_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          example: bytes=0-1048575
        - name: ss
          in: query
          required: false
          description: |
            De niet-geheime id van een browser-streamsessie uit
            POST /auth/stream-session. Het bijbehorende geheim reist als cookie
            en staat nooit in de URL. Alleen te gebruiken wanneer
            `capabilities.stream_sessions` waar is.
          schema: { type: string, minLength: 1 }
        - name: If-Range
          in: header
          required: false
          description: |
            De eerder ontvangen ETag. Die is zwak, dus de server kan er geen
            deelantwoord op geven en antwoordt met 200 en het volledige bestand.
          schema: { type: string }
      responses:
        "200":
          description: Het hele bestand. Ook het antwoord op meerdere bereiken.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Het gevraagde bereik.
          headers:
            Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Range:
              schema: { type: string }
              example: bytes 0-1048575/5368709120
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            library.version_multifile. De versie bestaat uit meer dan een
            bestand. Dat is een geldige versie in het domeinmodel; v1 begrenst
            alleen de levering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415": { $ref: "#/components/responses/Error" }
        "416":
          description: playback.range_not_satisfiable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /watch-state:
    post:
      tags: [watch-state]
      operationId: reportWatchState
      summary: Meld wat er gebeurd is.
      description: |
        Een update is een gebeurtenis en geen waarde. De client stuurt niet "de
        positie is nu X" maar "dit is er gebeurd", en de server beslist wat dat
        voor de toestand betekent.

        session_id is client-generated: de client maakt bij het starten van
        afspelen een UUID aan en houdt die aan tot hij stopt. Er zijn in v1
        bewust geen serverzijdige playbacksessies, dus er is ook geen endpoint
        dat een sessie-id uitdeelt.

        Op een server met capabilities.watch_state_ownership beslist het model
        uit DEC-049 wat een event met de toestand doet. De server is eigenaar:
        alleen de sessie met een geldige lease schrijft de canonieke positie,
        eigendom wordt uitsluitend verworven met explicit_action =
        playback_started, en base_revision draagt de causaliteit.

        Het antwoord is ALTIJD de actuele toestand, ook wanneer het event is
        afgewezen. Een client die een 200 krijgt met een hogere revision dan hij
        stuurde weet daarmee dat hij achterliep, en synchroniseert in plaats van
        door te schrijven. Er is dus geen foutcode voor "u bent niet de
        eigenaar"; dat is een normale uitkomst en geen fout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchStateEvent" }
      responses:
        "200":
          description: De nieuwe toestand van het item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [watch-state]
      operationId: listWatchState
      summary: Alles wat deze identiteit heeft aangeraakt.
      description: |
        Gesorteerd op updated_at aflopend. updated_since is wat de offline-laag
        gebruikt om na een periode zonder netwerk bij te trekken zonder de hele
        catalogus op te halen.
      parameters:
        - name: updated_since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Een pagina kijkstatusregels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchStatePage" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Het accesstoken. Nooit in een querystring.
    streamSession:
      type: apiKey
      in: query
      name: ss
      description: |
        De niet-geheime helft van een browser-streamsessie. Het geheim reist in
        een cookie waarvan de naam deze id bevat, en de server valideert de twee
        samen. Alleen geldig op /stream, en alleen wanneer
        `capabilities.stream_sessions` waar is.
    streamToken:
      type: apiKey
      in: query
      name: stream_token
      description: |
        De enige uitzondering op de regel hierboven. Externe spelers kunnen geen
        header zetten. Geldig voor twee tot vijf minuten, gebonden aan een
        identiteit en een mediaresource, zonder rechten op de rest van de API.

  headers:
    ETag:
      schema: { type: string }
      description: |
        Zwakke validator, in de vorm `W/"..."`. Ondoorzichtig: een client
        ontleedt hem niet en leidt er niets uit af.

        Verschillend betekent "er is iets veranderd". Gelijk betekent NIET dat
        de bytes gelijk zijn: de server leidt hem af uit bestandsmetadata plus
        de generatie van de versie, en een in-place overschrijving van gelijke
        lengte met teruggezette mtime blijft daar onder de radar. Gebruik hem
        als change detector en nooit als bewijs van byte-identiteit.
    AcceptRanges:
      schema: { type: string, const: bytes }

  parameters:
    LibraryId:
      name: library_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PlaybackSessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    BackupId:
      name: backup_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    DownloadId:
      name: download_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    UserId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    Limit:
      name: limit
      in: query
      required: false
      description: Een hogere waarde wordt naar het maximum teruggebracht en is geen fout.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Ondoorzichtig. Hoort bij een sortering en bij een filterset; bij een
        andere sortering of andere filters ongeldig (`library.cursor_invalid`).
      schema: { type: string }

  responses:
    Error:
      description: Fout met een stabiele machineleesbare code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: |
        `server.internal`. Elke operatie kan hem geven, want hij is het antwoord
        op een fout die de handler zelf niet had voorzien: de recovery-laag vangt
        een panic af en maakt er een envelop van in plaats van een verbroken
        verbinding of een leeg lichaam.

        `details.request_id` draagt dezelfde id als de logregel die de stack
        bevat. Dat is het enige dat een client ermee doet: tonen zodat een
        gebruiker hem kan doorgeven. De stack zelf verlaat de server nooit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:

    Id:
      type: string
      minLength: 1
      description: |
        Ondoorzichtig voor de client. Er mag niets uit worden afgeleid, ook niet
        wanneer het op iets herkenbaars lijkt. Een pad is nooit een id.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, met Z-achtervoegsel.

    DurationMs:
      type: integer
      minimum: 0
      description: Milliseconden. Nooit seconden, nooit een kommagetal.

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              pattern: "^(auth|library|playback|session|settings|storage|server|job|memory)\\.[a-z0-9_]+$"
              description: |
                Het contract. De client vertaalt codes en matcht nooit op message.

                Het domein is de helft voor de punt. De lijst is niet gesloten
                maar groeit per protocolvenster, en elke uitbreiding is een
                besluit: `server` en `settings` kwamen erbij met venster 1
                (DEC-135 en DEC-136). `job` kwam erbij met venster 2 (DEC-138),
                zodra S2.4 `job.not_cancellable` stuurde. Een client die een code
                niet kent valt terug op een generieke melding en takt niet op het domein.

                Codes die een client zelf verzint horen hier niet thuis. De
                webclient draagt `client.transport` en
                `client.malformed_response`; die komen nooit over de lijn en
                het contract keurt ze af.
            message:
              type: string
              description: Voor logs, niet voor de UI.
            retryable:
              type: boolean
              description: |
                Expliciet en geen afleiding uit de status, omdat een 503 soms wel
                en een 409 soms niet te herhalen is.
            details:
              type: object
              additionalProperties: true

    MemoryFactInput:
      type: object
      additionalProperties: false
      required: [id, category, value, source]
      properties:
        id: { type: string, format: uuid }
        category:
          type: string
          enum: [preference, dislike, habit, other]
          x-unknown-safe: false
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: Eén regel, geen controls of feiten waarvan bestaande profielinstellingen eigenaar zijn.
        source:
          type: string
          enum: [user_explicit, assistant_confirmed, settings_manual]
          x-unknown-safe: false
    MemoryFact:
      type: object
      required: [id, category, value, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        value: { type: string, minLength: 1, maxLength: 200 }
        source: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MemorySnapshot:
      type: object
      required: [epoch, revision, facts]
      properties:
        epoch: { type: string, format: uuid }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        facts:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/MemoryFact" }
    MemoryReplace:
      type: object
      additionalProperties: false
      required: [epoch, base_revision, facts]
      properties:
        epoch: { type: string, format: uuid }
        base_revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        facts:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/MemoryFactInput" }
    MemoryClear:
      type: object
      additionalProperties: false
      required: [epoch, base_revision]
      properties:
        epoch: { type: string, format: uuid }
        base_revision: { type: integer, minimum: 0, maximum: 9007199254740991 }

    Info:
      type: object
      required: [protocol, server, capabilities, auth]
      properties:
        protocol:
          type: object
          required: [major, feature_level, profile]
          properties:
            major: { type: integer, const: 1 }
            feature_level:
              type: integer
              minimum: 1
              description: |
                Wat de implementatie kan verstaan. Zegt niets over wat deze
                server aanbiedt; daarvoor is capabilities leidend.
            profile:
              type: string
              enum: [minimal, full]
              x-unknown-safe: false
        server:
          type: object
          required: [id]
          properties:
            id: { $ref: "#/components/schemas/Id" }
            setup_accepts_name:
              type: boolean
              default: false
              description: |
                De server neemt `server_name` aan op `POST /auth/setup` en legt
                hem vast als de instelling `server_name`. Optioneel en op `Info`
                en niet in `capabilities`, want het is geen functie die aan of
                uit staat maar een eigenschap van dit ene endpoint, en het is het
                enige veld dat een client vóór het inloggen moet weten. Zonder
                deze vlag laat een client `server_name` weg: `SetupRequest` is
                gesloten, dus een oudere server wijst het veld af in plaats van
                het te negeren.
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        auth:
          type: object
          required: [methods, setup_required]
          properties:
            methods:
              type: array
              items:
                type: string
                enum: [password, pairing_code]
                x-unknown-safe: true
                description: |
                  Er mag binnen v1 een methode bij komen. Een client slaat een
                  methode die hij niet kent over en kiest er een die hij wel kent.
            setup_required:
              type: boolean
              description: True zolang er nog geen eigenaar is aangemaakt.

    Capabilities:
      type: object
      description: Altijd leidend boven feature_level.
      required: [browse, search, artwork, watch_state]
      properties:
        assistant_memory:
          type: boolean
          default: false
          description: BP-08b, de drie persoonlijke geheugenoperaties met CAS en wis-epoch.
        browse: { type: boolean }
        search: { type: boolean }
        artwork: { type: boolean }
        watch_state: { type: boolean }
        playback_plan: { type: boolean, default: false }
        transcode: { type: boolean, default: false }
        downloads: { type: boolean, default: false }
        backups:
          type: boolean
          default: false
          description: |
            Venster 7, S25. De server kent GET/POST /backups, GET /backups/{id}
            en de hersteltest en restore eronder, voor klasse admin.
        live_tv: { type: boolean, default: false }
        realtime: { type: boolean, default: false }
        users: { type: boolean, default: false }
        history: { type: boolean, default: false }
        favorites: { type: boolean, default: false }
        ratings: { type: boolean, default: false }
        track_preferences: { type: boolean, default: false }
        watch_state_ownership:
          type: boolean
          default: false
          description: |
            De server kent het eigendomsmodel uit DEC-049: base_revision, de
            playback_started-verwerving en de backlog-markering op
            WatchStateEvent, en revision op UserState. WatchStateEvent is
            gesloten (additionalProperties: false), dus een client stuurt die
            velden pas wanneer deze vlag waar is.
        stream_sessions:
          type: boolean
          default: false
          description: |
            De server kent POST /auth/stream-session en de ss-parameter op
            /stream. Voor browsers; externe spelers blijven het streamtoken in
            de querystring gebruiken.
        sessions:
          type: boolean
          default: false
          description: |
            De server kent device-scoped sessies (DEC-123): device_id en
            device_name op LoginRequest en SetupRequest, GET/DELETE /sessions
            en POST /auth/logout. Een client stuurt device_id/device_name pas
            wanneer deze vlag waar is; zonder de vlag krijgt de sessie
            device_id NULL en een vaste plaatshouder als naam.
        artwork_sizes:
          type: boolean
          default: false
          description: |
            `GET /artwork/{artwork_id}` levert afgeleide maten van een vaste
            ladder bij een `width` (venster 3, pakket C). Belooft niets over
            andere routes. Zonder deze vlag levert de route altijd het origineel.
        filters:
          type: boolean
          default: false
          description: |
            `GET /libraries/{id}/items` kent de filterparameters en de
            sorteringen `last_played_at` en `duration`, en
            `GET /libraries/{id}/facets` bestaat (venster 3, pakket D1). Zonder
            de vlag stuurt een client geen filterparameters: een oudere server
            negeert ze stil en levert dan een ongefilterde lijst.
        external_id_lookup:
          type: boolean
          default: false
          description: |
            `GET /libraries/{id}/items` kent de filterparameter `external_id`
            (`tmdb:<getal>`) en `Item.external_ids` bestaat (unified). Zonder de
            vlag stuurt een client de parameter niet: een oudere server negeert
            hem stil en levert dan de hele bibliotheek. De vlag zegt niets over
            de dekking van de matches.
        api_tokens:
          type: boolean
          default: false
          description: |
            De server kent API-tokens als sessies (RB-20): POST en GET
            /auth/api-tokens bestaan, en Session draagt kind, scope en
            expires_at. De vlag staat naast `sessions` en niet erin: een client
            die sessies kent maar deze vlag niet ziet, toont het
            sessieoverzicht zonder tokens, en dat is een geldig scherm.
        cookie_auth:
          type: boolean
          default: false
          description: |
            De server kent `credential_mode` op POST /auth/login en
            POST /auth/refresh (RB-29, hoofdstuk 17d) en zet het refreshcredential
            desgevraagd in een HttpOnly-cookie. Bedoeld voor browsers; een client
            zonder cookiejar heeft er niets aan en laat het veld weg.
        administration:
          type: boolean
          default: false
          description: |
            De server heeft een beheeroppervlak: `GET`/`PATCH /settings`, de vier
            routes onder `/server`, `GET /stream-sessions` en `GET /audit`. Een
            client die de vlag niet ziet toont geen beheer, en dat is geen
            beveiliging maar netheid: de server weigert onafhankelijk daarvan met
            `404` voor wie er niet bij mag (hoofdstuk 16.4, regel 16 tot en met
            26).

            Eén vlag voor het hele oppervlak en niet één per endpoint. De zes
            routes kwamen in vier slices tegelijk met deze vlag, en een client
            die ze los zou moeten onderhandelen krijgt zes vragen waarvan het
            antwoord altijd hetzelfde is.
        mcp:
          type: boolean
          default: false
          description: |
            De server biedt een MCP-endpoint aan waarmee een agent hem kan
            beheren (RB-19, RB-20). Staat op `false` tot de slice die het bouwt;
            `Server.mcp` draagt dan het adres en het aantal tools.

    ServerDetail:
      type: object
      required: [id, name, version, started_at]
      description: |
        De eerste vier velden zijn klasse `authenticated`. De tien daaronder
        gaan alleen mee voor klasse `admin` (acht met S1.3, `web_origin` met
        S1.8, `mcp` met S1.6): ze beschrijven hoe deze server draait, en dat is
        voor een huisgenoot geen informatie maar een verkenning. Een client die
        ze niet krijgt is dus geen beheerder, en verbergt het beheeroppervlak.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        version: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        public_url:
          type: string
          description: |
            Het adres waarop deze server van buiten bereikbaar hoort te zijn.
            Leeg wanneer er geen is ingesteld. Ook een instelling
            (`Settings.public_url`); dit veld toont de waarde die nu geldt.
        web_origin:
          type: string
          description: |
            De canonieke origin van de webclient die bij deze server hoort,
            bijvoorbeeld `https://pleya.thuis`. Leeg wanneer er geen is
            ingesteld. Ook een instelling (`Settings.web_origin`); dit veld toont
            de waarde die nu geldt. `cors_origins` staat hier bewust niet naast:
            dat is beleid en geen adres, en een lijst vertrouwde origins vertelt
            wie het proberen waard is (hoofdstuk 17d.3).
        listen:
          type: string
          description: Het bindadres van het proces, bijvoorbeeld `:8080`. Geen instelling.
        behind_proxy:
          type: boolean
          description: |
            True wanneer déze aanvraag via een vertrouwde proxy binnenkwam: de
            tegenpartij staat in `trusted_proxies` én er stond een
            forwarding-header op. Zonder de eerste voorwaarde zou elke client
            het antwoord zelf kunnen bepalen.
        trusted_proxies:
          type: array
          description: De adressen en bereiken waarvan de server forwarding-headers aanneemt. Geen instelling.
          items: { type: string }
        build:
          type: string
          description: Versie, toolchain en platform van de draaiende binary.
        database:
          type: object
          required: [version, schema]
          properties:
            version:
              type: string
              description: Het versienummer van Postgres, zonder de distributieregel erachter.
            schema:
              type: integer
              description: De hoogste toegepaste migratie.
        ffprobe:
          type: object
          description: Gemeten bij het opstarten, niet per aanvraag.
          required: [found]
          properties:
            found: { type: boolean }
            version: { type: string }
        health:
          type: object
          required: [ready, jobs_running, jobs_failed]
          properties:
            ready:
              type: boolean
              description: Hetzelfde antwoord als /readyz, maar dan achter authenticatie en met de tellers ernaast.
            jobs_running: { type: integer }
            jobs_failed: { type: integer }
        mcp:
          type: object
          required: [enabled, tool_count]
          description: |
            De MCP-beheerlaag, klasse `admin` net als de velden erboven. Zolang
            `capabilities.mcp` `false` is staat hier `enabled: false` met
            `tool_count: 0` en geen `url`: het object bestaat dan wel en zegt
            precies dat er niets aanstaat, wat een ander antwoord is dan een
            server die de vraag niet kent.
          properties:
            enabled: { type: boolean }
            url:
              type: string
              description: Het adres van het MCP-endpoint. Afwezig zolang het uit staat.
            tool_count:
              type: integer
              description: Het aantal tools dat het endpoint aanbiedt, zodat een beheerscherm ziet of de laag compleet is.

    ServerEnvironment:
      type: object
      required: [entries]
      description: |
        De omgevingsvariabelen van deze server, en niet die van de container
        eromheen: alleen `PLEYA_SERVER_*` plus een gemaskeerde `DATABASE_URL`.
        Een variabele waarvan de naam een geheim aankondigt gaat er in zijn
        geheel af, ook wanneer de waarde er geen is: de TTL's staan met hun
        bron en hun grens in `GET /settings`, dus die uitzondering kost niets.
      properties:
        entries:
          type: array
          items:
            type: object
            required: [key, value, redacted]
            properties:
              key: { type: string }
              value: { type: string }
              redacted:
                type: boolean
                description: |
                  True wanneer de waarde hierboven niet de echte is. Zonder dit
                  veld zou een beheerder een gemaskeerde DSN voor de werkelijke
                  instelling aanzien.

    LogLevel:
      type: string
      description: Het niveau van een logregel, en de ondergrens van `?level=`.
      enum: [debug, info, warn, error]
      x-unknown-safe: true

    ServerLog:
      type: object
      required: [entries]
      description: |
        De laatste regels uit een ringbuffer in het geheugen, nieuwste eerst.
        Nooit uit een bestand: een endpoint dat een pad opent is een
        bestandsbrowser met een filter ervoor. De regels zijn geredigeerd op de
        weg de buffer in, dus er is geen leespad dat die redactie overslaat.
      properties:
        entries:
          type: array
          items:
            type: object
            required: [at, level, message]
            properties:
              at: { $ref: "#/components/schemas/Timestamp" }
              level: { $ref: "#/components/schemas/LogLevel" }
              component:
                type: string
                description: Het subsysteem dat de regel schreef, bijvoorbeeld `scanner` of `http`.
              message:
                type: string
                description: Het bericht met zijn attributen erachter, geredigeerd en afgekapt.

    ConnectivityCheck:
      type: object
      required: [public_url_reachable, range_intact, behind_proxy]
      properties:
        public_url_reachable:
          type: boolean
