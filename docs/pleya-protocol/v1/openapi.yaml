        wanneer `capabilities.cookie_auth` waar is: de bodies zijn gesloten, dus
        een oudere server wijst het veld af in plaats van het stil te laten
        vallen.

        Afwezig betekent `token`, en `token` reproduceert het gedrag van v1: het
        credential staat als `refresh_token` in het antwoord. Bij `cookie` zet de
        server het in een `HttpOnly`-, `SameSite=Strict`-cookie op
        `Path=/pleya/v1/auth/refresh`, blijft `refresh_token` uit het antwoord,
