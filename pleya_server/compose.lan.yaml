# Vindbaar op het thuisnetwerk (S26.9).
#
# Een aparte laag en niet in compose.yaml: de server is standaard alleen op
# loopback gepubliceerd, en dan heeft hij op het thuisnetwerk niets te melden.
# deploy-nas.sh voegt dit bestand toe wanneer PLEYA_SERVER_LAN=on in .env staat.
# Zet daarbij PLEYA_SERVER_BIND op het LAN-adres van de host of op 0.0.0.0,
# anders adverteert de server een poort die niemand kan bereiken.
#
# De UDP-poort staat op 0.0.0.0: een oproep is een broadcast en komt niet aan
# op een poort die alleen aan één adres hangt. Het antwoord zegt alleen wie de
# server is en op welke poort hij luistert; inloggen blijft nodig.
services:
  pleya-server:
    environment:
      PLEYA_SERVER_DISCOVERY_ADDR: ":48635"
      PLEYA_SERVER_DISCOVERY_PORT: "${PLEYA_SERVER_HOST_PORT:-8832}"
    ports:
      - "0.0.0.0:${PLEYA_SERVER_DISCOVERY_HOST_PORT:-48635}:48635/udp"
