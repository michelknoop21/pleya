name: pleya_verify_runner
description: >
  Scenario engine, transport client, and CLI for Pleya Verify — drives
  `pleya_verify/contract/verify_api_v1.md` against a running Pleya build and
  validates `.yaml` scenario files against automation_ids.yaml, without
  needing a simulator (that's the driver layer, added from Fase 8 on).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  http: ^1.2.0
  yaml: ^3.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
