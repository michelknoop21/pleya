name: ios.seerr.issues
target: ios-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.issues.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - settle: 1000
  - wait_until: {id: "my_pleya.tile[seerrIssues]", timeout: 10000}
  - assert: {id: "my_pleya.tile[seerrIssues]", insideViewport: true}
  - snapshot: 00-my-pleya
  - tap: {id: "my_pleya.tile[seerrIssues]"}
  - wait_until: {id: "seerr.issues.item[42]", timeout: 10000}
  - snapshot: 01-issue-list
  - tap: {id: "seerr.issues.item[42]"}
  - wait_until: {id: seerr.issues.status_action, state: {status: open, busy: false}, timeout: 10000}
  - snapshot: 02-open-report
  - tap: {id: seerr.issues.status_action}
  - wait_until: {id: seerr.issues.status_action, state: {status: resolved, busy: false}, timeout: 10000}
  - snapshot: 03-resolved-report
  - tap: {id: seerr.issues.status_action}
  - wait_until: {id: seerr.issues.status_action, state: {status: open, busy: false}, timeout: 10000}
