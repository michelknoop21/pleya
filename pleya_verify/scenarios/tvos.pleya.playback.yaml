name: tvos.pleya.playback
target: tvos-sim
# Native D-pad HLS/sidecar/quality chain; output caps measured by Go/ffprobe.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: playback.app.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 20000}
  - settle: 1500
  - press: select
  - wait_until: {id: player.surface, state: {first_frame: true, external_subtitle_count: 2}, timeout: 25000}

  # Pause first, then over to the tune button.
  # No wait for the ring first: an idb press takes one to two seconds to land,
  # and the clip was two seconds long, so a press sent after polling for the
  # focus arrived when mpv had already ended (run of 23 September). The clip
  # is fifteen seconds since VER7; the press still goes out first and lands on
  # play/pause, which the next asserts check.
  - settle: 200
  - press: select
  - settle: 400
  - assert: {id: player.play_pause, state: {playing: false}}
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - assert: {id: player.settings_button, focused: true}
  - press: select
  - wait_until: {id: player.panel, timeout: 5000}
  - settle: 400
  - snapshot: 01-panel-video

  - assert: {id: player.panel, state: {tab: video, subView: none}}
  - press: right
  - settle: 200
  - assert: {id: "player.panel.row[speed]", focused: true}
  - press: down
  - settle: 200
  - assert: {id: "player.panel.row[version_quality]", focused: true}
  - press: select
  - wait_until: {id: "player.source_choice[quality.original]", timeout: 10000}
  - snapshot: quality-before
  - press: down
  - settle: 200
  - press: select
  - wait_until: {id: player.surface, state: {first_frame: true}, timeout: 15000}
  - wait_until: {id: player.panel, state: {subView: none}, timeout: 10000}
  - assert: {id: "player.panel.row[version_quality]", state: {value: "1080p 20 Mbps"}}
  - snapshot: quality-selected
  - press: menu
  - settle: 300
  - press: menu
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - snapshot: playback-stopped
