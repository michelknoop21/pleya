name: tvos.requests.back
target: tvos-sim
# REQ-LIST-BACK (docs/tvos-fysieke-correctieronde.md): Menu on Alle aanvragen
# did nothing. The page is a pushed route above the shell and its TV branch
# had nothing that closed it, so the remote could not leave.
#
# `seerr.requests.manage.v1` seeds three requests for an admin. The walk is
# the one of tvos.requests.manage up to the list: Mijn Pleya, Aanvragen, RIGHT
# to the inbox, Select.
#
# Menu on a card closes the page and the inbox button has the focus again.
# With the rail open, Menu closes the rail first and the page stays; the next
# Menu closes the page.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requests.manage.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500

  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[requests]", timeout: 5000}
  - press: select
  - wait_until: {id: seerr.search.field, timeout: 15000}
  - settle: 2500

  - wait_until: {focused: seerr.search.field, timeout: 8000}
  - press: right
  - wait_until: {focused: seerr.search.inbox, timeout: 5000}
  - press: select
  - wait_until: {id: "tv.catalog.grid[requests]", timeout: 15000}
  - settle: 1500
  - assert: {id: "tv.catalog.grid.item[requests.0]", focused: true}
  - snapshot: 00-list

  # Menu on a card: the page is gone and the remote is where it came from.
  - press: menu
  - wait_until: {focused: seerr.search.inbox, timeout: 8000}
  - settle: 800
  - assert: {id: "tv.catalog.grid[requests]", present: false}
  - assert: {id: seerr.search.field, insideViewport: true}
  - snapshot: 01-back-on-aanvragen

  # Again, now with the rail open: one layer per press.
  - press: select
  - wait_until: {id: "tv.catalog.grid[requests]", timeout: 15000}
  - settle: 1500
  - press: left
  - wait_until: {id: "tv.catalog.rail.row[requests.status]", timeout: 8000}
  - snapshot: 02-rail-open
  - press: menu
  - wait_until: {focused: "tv.catalog.grid.item[requests.0]", timeout: 8000}
  - settle: 800
  - assert: {id: "tv.catalog.rail.row[requests.status]", present: false}
  - assert: {id: "tv.catalog.grid[requests]", insideViewport: true}
  - snapshot: 03-rail-closed-page-stays
  - press: menu
  - wait_until: {focused: seerr.search.inbox, timeout: 8000}
  - settle: 800
  - assert: {id: "tv.catalog.grid[requests]", present: false}
  - snapshot: 04-back-again
