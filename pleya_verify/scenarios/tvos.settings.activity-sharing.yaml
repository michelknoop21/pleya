name: tvos.settings.activity-sharing
target: tvos-sim
# Mijn activiteit delen on the TV settings page (A-25, DEC-171).
#
# What this proves:
#   1. on a server with capabilities.item_activity the row stands first under
#      Privacy in Geavanceerd, with the value the server holds;
#   2. Select saves, and the row changes only once the server answered.
# A server without the capability and a failed save are covered by
# test/screens/settings/settings_activity_sharing_test.dart; the fixture has no
# seed for them.
setup:
  - reset_app
  - seed: catalog.detail-movie.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 8000}
  - press: left
  - walk: {direction: down, steps: 8, stopAt: "settings.category[7]", timeout: 90000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[7]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.activity_sharing_0]", timeout: 5000}
  - wait_until: {id: "my_pleya.section.tile[settings.activity_sharing_0]", state: {toggled: true}, timeout: 5000}
  - snapshot: 00-row-on

  - press: select
  - wait_until: {id: "my_pleya.section.tile[settings.activity_sharing_0]", state: {toggled: false}, timeout: 5000}
  - assert: {id: "my_pleya.section.tile[settings.activity_sharing_0]", focused: true}
  - snapshot: 01-row-off
