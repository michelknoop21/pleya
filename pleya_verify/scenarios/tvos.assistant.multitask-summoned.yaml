name: tvos.assistant.multitask-summoned
target: tvos-sim
# Requires PLEYA_ASSISTANT_ENABLED=true with the pinned SDK.
# Real settings UI and native idb input; both searches use catalog.mixed.v1.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - settle: 600
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 5000}
  - press: select
  - wait_until: {focused: "assistant.button[setup]", timeout: 10000}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - press: select
  - wait_until: {focused: "settings.form.field[assistant.url]", timeout: 10000}
  - snapshot: 00-provider-form-before-url
  - type: "{{fixture}}"
  - settle: 1000
  - snapshot: 00b-provider-form-url
  - wait_until: {id: "settings.form.button[assistant.model.pleya-verify]", timeout: 15000}
  - snapshot: 01-provider-model-loaded
  - walk: {direction: down, steps: 8, stopAt: "settings.form.button[assistant.model.pleya-verify]", timeout: 20000, settle: 400}
  - press: select
  - assert: {id: "settings.form.button[assistant.model.pleya-verify]", state: {selected: true}}
  - walk: {direction: down, steps: 4, stopAt: "settings.form.button[assistant.test]", timeout: 10000, settle: 400}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.save]", timeout: 15000}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.change]", timeout: 10000}
  - snapshot: 02-provider-saved
  - press: menu
  - wait_until: {id: screen.assistant, state: {availability: ready}, timeout: 10000}
  - press: menu
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - press: {key: play_pause, holdMs: 900}
  - wait_until: {id: assistant.summon, state: {shown: true, state: listening}, timeout: 10000}
  - wait_until: {id: tvos.native_text_entry, state: {sessionActive: true}, timeout: 10000}
  - settle: 1000
  - snapshot: 02b-assistant-native-editor
  # Existing fixture latency op holds the first Aurora child model reply.
  # Basalt can finish first; release inserts Aurora above the focused result.
  - fixture_mutate: {op: latency, ollama_hold_aurora: true}
  - type: "Zoek Aurora en zoek Basalt."
  - press: select
  - wait_until: {id: "assistant.task[1]", state: {status: completed, cancellable: false}, timeout: 30000}
  - assert: {id: "assistant.task[0]", state: {status: running, cancellable: true}}
  - assert: {id: "assistant.match[0]", state: {title: Basalt, kind: movie, inLibrary: true, enabled: true}}
  - wait_until: {focused: "assistant.button[cancel]", timeout: 5000}
  - press: up
  - wait_until: {focused: "assistant.match[0]", timeout: 5000}
  - assert: {id: "assistant.match[0]", focused: true, state: {title: Basalt}}
  - snapshot: 03-basalt-focused-before-insertion
  - fixture_mutate: {op: latency, ollama_hold_aurora: false}
  - wait_until: {id: "assistant.task[0]", state: {status: completed, cancellable: false}, timeout: 30000}
  - wait_until: {id: "assistant.task[1]", state: {status: completed, cancellable: false}, timeout: 30000}
  - assert: {id: "assistant.match[1]", focused: true, state: {title: Basalt}}
  # Unique global match offsets; actual media result state, not model prose.
  - assert: {id: "assistant.match[0]", state: {title: Aurora, kind: movie, inLibrary: true, enabled: true}}
  - assert: {id: "assistant.match[1]", state: {title: Basalt, kind: movie, inLibrary: true, enabled: true}}
  - assert: {id: "assistant.task.cancel[0]", present: false}
  - assert: {id: "assistant.task.cancel[1]", present: false}
  - assert: {id: "assistant.task[0]", insideViewport: true}
  - assert: {id: "assistant.match[0]", insideViewport: true, below: "assistant.task[0]"}
  - assert: {id: "assistant.task[1]", insideViewport: true, below: "assistant.match[0]"}
  - assert: {id: "assistant.match[1]", insideViewport: true, below: "assistant.task[1]", sameColumn: "assistant.match[0]", notOverlapping: "assistant.match[0]"}
  - settle: 800
  - snapshot: 04-multitask-results-after-insertion
  - assert: {id: assistant.summon, state: {shown: true, state: result, error: false, pending: false}}
  - assert: {id: "assistant.button[cancel]", present: false}
  - press: menu
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - assert: {id: assistant.summon, present: false}
