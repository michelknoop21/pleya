name: ios.library.atmosphere
target: ios-sim
setup:
  - reset_app
  - seed: catalog.hero-artwork.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.movies
steps:
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - tap: {id: "landing.view_all[movies]"}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 1500
  - assert: {id: "catalog.header[movies]", insideViewport: true}
  - assert: {id: "catalog.chip.sources[movies]", insideViewport: true}
  - assert: {id: "catalog.chip.filters[movies]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "catalog.chip.sort[movies]", insideViewport: true}
  - assert: {id: "catalog.grid.item[movies.0]", below: "catalog.count[movies]", insideViewport: true}
  - assert: {id: "library.atmosphere[mobile_catalog.movies]", state: {available: true, blur_sigma: 14}}
  - snapshot: 01-catalog-atmosphere
  - tap: {id: "catalog.chip.sort[movies]"}
  - wait_until: {id: "sheet.catalog_sort", timeout: 10000}
  - snapshot: 02-sort-preserved
