name: tvos.sidebar.collapse
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  # IntroGate's cold-start splash paints over an already-ready screen.
  - settle: 3500

  # No hero assertions on this target, and that is a finding rather than a
  # choice: `discover.hero` is registered in `_buildHeroSectionSliver`, whose
  # own comment reads "TV runs through _buildTvContent, so this section is
  # phone/tablet/desktop". The TV layout builds its hero somewhere else and
  # registers no id for it, so `/v1/ui_tree` on tvOS reports the rail and the
  # nav items and nothing of the hero — on the platform where the hero is the
  # whole landing screen. Adopting an id there is Deel A work; until it
  # happens, no tvOS scenario can state anything about the hero.
  - assert: {id: sidebar.rail, insideViewport: true}
  - assert: {id: nav.discover, insideViewport: true, minimumTapTarget: 44}
  - snapshot: sidebar-collapsed

  # Left moves focus into the rail, which expands. Every press travels
  # scenario -> driver -> tvos_sim.sh -> idb HID -> UIKit ([C2]), never
  # through the automation transport, so this exercises the engine's own
  # press-claiming path — the one that bypasses the responder chain entirely
  # and is the reason tvOS input cannot be trusted to a synthetic event.
  - press: left
  - settle: 1200
  - assert: {id: sidebar.rail, insideViewport: true}
  - snapshot: sidebar-expanded

  # Down inside the rail, then Select. The tab actually changing is the proof
  # that the press was claimed by the rail and did not leak through to the
  # content underneath — the property `side_navigation_rail_test.dart`
  # asserts with a synthetic pointer, here under a real remote press against
  # a rail whose width is mid-animation.
  - press: down
  - settle: 1000
  - press: select
  - wait_until: {event: navigation.tab_changed, timeout: 15000}
  - settle: 2500
  - assert: {id: sidebar.rail, insideViewport: true}
  - snapshot: sidebar-after-select
