name: tvos.sidebar.collapse
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  # IntroGate's cold-start splash paints over an already-ready screen.
  - settle: 3500

  # No hero assertions on this target, and that is a finding rather than a
  # choice: `discover.hero` is registered in `_buildHeroSectionSliver`, whose
  # own comment reads "TV runs through _buildTvContent, so this section is
  # phone/tablet/desktop". The TV layout builds its hero somewhere else and
  # registers no id for it, so `/v1/ui_tree` on tvOS reports the rail and the
  # nav items and nothing of the hero — on the platform where the hero is the
  # whole landing screen. Adopting an id there is Deel A work; until it
  # happens, no tvOS scenario can state anything about the hero.
  # Geometry alone does not distinguish "collapsed and 48px wide" from "not
  # focused for an unrelated reason" — `state.collapsed` is
  # `SideNavigationRail`'s own `_shouldExpand` value, mirrored onto every
  # nav item (`side_navigation_rail.dart`'s `state: () => {'selected': ...,
  # 'collapsed': isCollapsed}`), so this reads the same boolean the widget
  # itself renders from, not a proxy for it.
  - assert: {id: sidebar.rail, insideViewport: true}
  - assert: {id: nav.discover, insideViewport: true, minimumTapTarget: 44, state: {collapsed: true}}
  - snapshot: sidebar-collapsed

  # Left moves focus into the rail, which expands. Every press travels
  # scenario -> driver -> tvos_sim.sh -> idb HID -> UIKit ([C2]), never
  # through the automation transport, so this exercises the engine's own
  # press-claiming path — the one that bypasses the responder chain entirely
  # and is the reason tvOS input cannot be trusted to a synthetic event.
  - press: left
  - settle: 1200
  - assert: {id: sidebar.rail, insideViewport: true}
  - assert: {id: nav.discover, state: {collapsed: false}}
  - snapshot: sidebar-expanded

  # Down inside the rail, then Select. `nav_library:...`'s own debugLabel
  # in focus-trace.json already shows this lands on the first pinned
  # library row — `wait_until: {id: screen.libraries}` makes that the
  # PASS/FAIL condition instead of the generic `navigation.tab_changed`
  # event, which would equally have gone green on a wrong destination (any
  # tab change fires it, not just this one). A screenshot with the right
  # navigation firing on the wrong tab is exactly the false-PASS this
  # closes.
  - press: down
  - settle: 1000
  - press: select
  - wait_until: {id: screen.libraries, timeout: 15000}
  - settle: 2500
  - assert: {id: sidebar.rail, insideViewport: true}

  # `onDestinationSelected` moves focus straight into the content it just
  # opened (see CLAUDE.md's tvOS Gotchas: Select activates on KeyDown, and
  # the handler relocates focus before KeyUp), so the rail's own collapse —
  # driven by that same `isSidebarFocused` — is the automatable proof focus
  # actually left the sidebar, not just that some navigation happened.
  # `nav.discover` stays mounted (the rail is a persistent shell, not
  # per-screen) regardless of which tab is now active.
  - assert: {id: nav.discover, state: {collapsed: true}}
  - snapshot: sidebar-after-select
