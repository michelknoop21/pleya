name: ios.scroll-crown.ends
target: ios-sim
# IOS-CROWN-END1 / A-06. iPhone SE (375x667): grab in the middle,
# then turn the fixed wheel far enough to reach both ends of this short page.
# A-24b: on Weergave. The Instellingen main page is three short groups now,
# under two SE screens once laid out, so it carries no crown
# (`ScrollCrown.minContentScreens`); Weergave is a long page with one.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - configure_view: {orientation: portrait}
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 800
  # A-24b: Instellingen sits in the Pleya group below Big P now; scroll it up.
  - drag: {startX: 187, startY: 500, endX: 187, endY: 150, durationMs: 400}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 800
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: "my_pleya.section.tile[setting.theme_mode]", timeout: 10000}
  - settle: 800
  - wait_until: {id: overlay.scroll_crown, timeout: 5000}
  - assert: {id: overlay.scroll_crown, state: {at_start: true, gear_height: 96, fixed: true, motion_model: fixed-wheel-v1}}
  - tap: {x: 368, y: 330}
  - drag: {startX: 368, startY: 330, endX: 368, endY: 635, durationMs: 700}
  - settle: 100
  - assert: {id: overlay.scroll_crown, state: {at_end: true}}
  - snapshot: crown-bottom
  - settle: 1100
  - tap: {x: 368, y: 330}
  - drag: {startX: 368, startY: 330, endX: 368, endY: 30, durationMs: 700}
  - settle: 100
  - assert: {id: overlay.scroll_crown, state: {at_start: true}}
  - snapshot: crown-top
