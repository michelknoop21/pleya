name: ios.pleya.subtitles
target: ios-sim
# Actual external text delivery/selection/off; real burn pixels are tested on the Go runner.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: playback.app.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 20000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 2000
  - tap: {id: "home.rail.item[0.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 1000
  - tap: {id: media-detail.play}
  - wait_until: {id: player.surface, state: {first_frame: true, external_subtitle_count: 2}, timeout: 25000}
  - tap: {id: player.play_pause}
  - settle: 500
  - tap: {id: player.tracks_button}
  - wait_until: {id: "player.source_choice[subtitle.1]", timeout: 10000}
  - settle: 700
  - snapshot: subtitle-choices
  - tap: {id: "player.source_choice[subtitle.1]"}
  - wait_until: {id: player.surface, state: {first_frame: true, subtitle_title: "Pleya embedded"}, timeout: 15000}
  - snapshot: embedded-selected
  - tap: {id: player.tracks_button}
  - wait_until: {id: "player.source_choice[subtitle.1]", timeout: 10000}
  - assert: {id: "player.source_choice[subtitle.1]", state: {selected: true}}
  - settle: 700
  - tap: {id: "player.source_choice[subtitle.off]"}
  - wait_until: {id: player.surface, state: {first_frame: true, subtitle_track_id: "no"}, timeout: 15000}
  - snapshot: subtitle-off
  - tap: {id: player.tracks_button}
  - wait_until: {id: "player.source_choice[subtitle.off]", timeout: 10000}
  - assert: {id: "player.source_choice[subtitle.off]", state: {selected: true}}
  - snapshot: off-selected
