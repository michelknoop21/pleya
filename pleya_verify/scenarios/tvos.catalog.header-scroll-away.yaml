name: tvos.catalog.header-scroll-away
target: tvos-sim
# A-06c replaced the glide of A-06b on this route: there is no heading to fold
# and the bar stays away on every row, also on the first. What is left of this
# scenario is the proof of that, and that the ring never reaches a bar nobody
# can see. `tv.catalog.header` no longer exists here; the scroll-away shell
# presentation itself stays covered by `tv_catalog_scroll_away_test.dart`.
#
# `catalog.long-grid.v1` seeds 18 films, three rows of six.
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series, nav.movies], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  # A-24c (LEESMIJ-v4): Select changed the page and left the remote on
  # the pill; Down takes it to the landing.
  - press: down
  - settle: 1500
  - press: select
  - wait_until: {id: "tv.catalog.grid[movies]", timeout: 20000}
  - wait_until: {id: "tv.catalog.grid.item[movies.17]", timeout: 10000}
  - settle: 1000
  - assert: {id: "tv.catalog.grid.item[movies.0]", focused: true}
  - assert: {id: "tv.catalog.header[movies]", present: false}
  - assert: {id: nav.bar, state: {hidden: true, overlay: true}}
  - snapshot: 00-top

  # Row 1: nothing to fold, the ring stays on the card.
  - press: down
  - settle: 900
  - assert: {id: "tv.catalog.grid.item[movies.6]", focused: true}
  - assert: {id: nav.bar, state: {hidden: true}}
  - snapshot: 01-row1

  # Back on row 0, UP stays there.
  - press: up
  - settle: 900
  - press: up
  - settle: 900
  - assert: {id: "tv.catalog.grid.item[movies.0]", focused: true}
  - assert: {id: nav.bar, state: {hidden: true}}
  - snapshot: 02-up-stays
