name: tvos.my-pleya.libraries-remote-hold
target: tvos-sim
# LIB-REMOTE1: installed idb 1.1.7 emits keyboard HID, not the physical Siri Remote touch stream.
# 250ms directions exercise the app-side held-key contract; 650ms Select tests one-shot activation.
# No assertion here proves the engine remote synthesizedPressedKeys/repeat timer or Bluetooth.
# LIB7 (DEC-092): Bibliotheken is bronbeheer on TV, not a second browsing
# screen. `tvos.my-pleya.section-libraries` proves the generic Mijn Pleya
# nested-route contract (opens, focus lands inside, Menu returns); this
# scenario proves what changed underneath it — every row is a management row
# and Select opens the action sheet, not a tab bar with content.
#
# `tvos.my-pleya.library-chooser` and `tvos.library.sort` exercised the
# tab/chooser/grid contract this decision removes on TV. TV6 retired both:
# this file replaces the chooser. Sorting lives in the catalog rail now;
# `tvos.catalog.rail-sort-focus` covers its focus, and the order it produces
# is TV8's "filters en sorteren" row.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  # A-24c: Select puts the remote on Big P; Down is the Snel naar dock, and
  # Bibliotheken is along it.
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[watchTogether]", timeout: 5000}
  - walk: {direction: right, steps: 6, stopAt: "my_pleya.tile[libraries]", timeout: 60000, settle: 400}

  - press: select
  - wait_until: {id: "my_pleya.section[libraries]", timeout: 15000}
  - settle: 1000
  - wait_until: {focused: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", timeout: 8000}
  - press: {key: down, holdMs: 250}
  - settle: 800
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:c6fe01777910c423]", focused: true}
  - press: {key: up, holdMs: 250}
  - settle: 800
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", focused: true}
  - press: {key: select, holdMs: 650}
  - wait_until: {id: sheet.library_actions, timeout: 8000}
  - snapshot: 00-held-select-one-sheet
  - press: {key: menu, holdMs: 250}
  - wait_until: {focused: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", timeout: 5000}
  - assert: {id: sheet.library_actions, present: false}
  - press: {key: up, holdMs: 250}
  - wait_until: {focused: "my_pleya.section.tile[libraries.refresh]", timeout: 5000}
  - press: {key: right, holdMs: 250}
  - press: {key: select, holdMs: 650}
  - wait_until: {focused: "my_pleya.section.tile[libraries.done]", timeout: 5000}
  - press: {key: menu, holdMs: 250}
  - wait_until: {focused: "my_pleya.section.tile[libraries.reorder]", timeout: 5000}
  - assert: {id: "my_pleya.section[libraries]"}
  - press: select
  - press: down
  - press: {key: select, holdMs: 650}
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", focused: true, state: {moving: true}}
  - press: {key: down, holdMs: 250}
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", focused: true, state: {moving: true}}
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", below: "my_pleya.section.tile[libraries.srv-1:c6fe01777910c423]"}
  - snapshot: 01-held-reorder-server-order
  - press: {key: select, holdMs: 650}
  - assert: {id: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", state: {moving: false}}
  - press: {key: menu, holdMs: 250}
  - assert: {id: "my_pleya.section[libraries]"}
  - assert: {id: sheet.library_actions, present: false}
  - wait_until: {focused: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", timeout: 5000}
  - press: {key: select, holdMs: 250}
  - wait_until: {id: sheet.library_actions, timeout: 5000}
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[libraries.srv-1:2d95c7c96f4e9f4d]", timeout: 5000}
  - snapshot: 02-followup-input-still-works
