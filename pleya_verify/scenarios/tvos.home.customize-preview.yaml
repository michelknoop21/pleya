name: tvos.home.customize-preview
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 1500
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - wait_until: {focused: home.customize.open, timeout: 5000}
  - press: select
  - wait_until: {id: home.customize.panel, timeout: 5000}
  - press: down
  - press: down
  - press: down
  - wait_until: {focused: "home.customize.action[new]", timeout: 5000}
  # Existing latency control delays a real fixture request. Leave Preview
  # while it is loading, then ask Series. Reversed order also has a unit test.
  - press: select
  - wait_until: {focused: "home.row_wizard.action[kind.movie]", timeout: 5000}
  - press: down
  - press: down
  - press: down
  - press: right
  - press: right
  - press: select
  - assert: {id: home.row_wizard, state: {step: filters}}
  - fixture_mutate: {op: latency, ms: 12000, count: 1}
  - press: select
  - assert: {id: home.row_wizard, state: {step: preview, loading: true, canSave: false}}
  - assert: {id: "home.row_wizard.action[footer.save]", present: false}
  - snapshot: 12-preview-loading
  - press: left
  - assert: {id: "home.row_wizard.action[footer.back]", focused: true}
  - press: select
  - assert: {id: home.row_wizard, state: {step: filters, loading: false, canSave: false}}
  - press: select
  - press: up
  - press: up
  - press: left
  - press: left
  - press: right
  - assert: {id: "home.row_wizard.action[kind.show]", focused: true}
  - press: select
  - assert: {id: home.row_wizard, state: {kind: show, canSave: false}}
  - press: down
  - press: down
  - press: down
  - press: right
  - press: right
  - press: select
  - assert: {id: home.row_wizard, state: {step: filters}}
  - fixture_mutate: {op: latency, ms: 0, count: 0}
  - press: select
  - wait_until: {id: home.row_wizard, state: {step: preview, kind: show, loading: false, canSave: true, failed: false}, timeout: 30000}
  - snapshot: 13-current-series-preview
  - press: menu
  - wait_until: {focused: "home.customize.action[new]", timeout: 5000}
  - assert: {id: home.customize.panel, state: {customCount: 0}}
  - press: menu
  - wait_until: {focused: home.customize.open, timeout: 5000}
  - assert: {id: home.customize.panel, present: false}
  - snapshot: 14-back-on-home
