name: ios.assistant.phone
target: ios-sim
# The iPhone-only half of ios.assistant.entry.yaml: run it on an iPhone, not
# on an iPad. Two parts need the phone:
# - the way back out of the assistant settings is the app bar's arrow, which
#   has no id; on a 402-wide iPhone (17 Pro) it is at (28, 90), the point
#   ios.glass.tabbar.yaml uses. `press: menu` does not pop a route on iOS.
# - Bibliotheken is MobileLibrariesScreen, a phone-only tab, and a long press
#   on a library card summons Big P with that library as context.
#
# Needs PLEYA_ASSISTANT_ENABLED=true in the environment of `verify.dart run`.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - wait_until: {id: bigp.faceButton, timeout: 10000}
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 800

  # Set-up and back: the settings park him, and back leaves him parked.
  - tap: {id: "my_pleya.tile[assistant]"}
  - wait_until: {id: "assistant.button[setup]", timeout: 5000}
  - assert: {id: bigp.faceButton, state: {active: true}}
  - tap: {id: "assistant.button[setup]"}
  - wait_until: {id: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - settle: 800
  - tap: {x: 28, y: 90}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 1000
  - assert: {id: "settings.form.button[assistant.provider.ollamaServer]", present: false}
  - assert: {id: bigp.faceButton, state: {active: false}}
  - assert: {id: bigp.balloon, present: false}
  - snapshot: 01-back-parked

  # Bibliotheken: a long press on a library card summons Big P.
  - tap: {id: "my_pleya.tile[libraries]"}
  - wait_until: {id: screen.library_picker, timeout: 10000}
  - wait_until: {id: "library.picker.card[0]", timeout: 10000}
  - settle: 1000
  - snapshot: 02-libraries
  # srv-1:2d95c7c96f4e9f4d is the Movies library of catalog.mixed.v1 (card 0).
  # Fixture ids are truncated sha256 hashes of the seed slug, so this holds
  # across runs; an id with a {{fixture_id:...}} placeholder inside it does
  # not resolve, the engine only replaces a whole value.
  - wait_until: {id: "bigp.libraryAsk[srv-1:2d95c7c96f4e9f4d]", timeout: 5000}
  - assert: {id: "bigp.libraryAsk[srv-1:2d95c7c96f4e9f4d]", sameRow: "library.picker.card[1]", leftOf: "library.picker.card[1]"}
  - tap: {id: "bigp.libraryAsk[srv-1:2d95c7c96f4e9f4d]", holdMs: 800}
  - wait_until: {id: bigp.balloon, timeout: 5000}
  - assert: {id: bigp.balloon, state: {availability: needsSetup}}
  - assert: {id: bigp.faceButton, state: {active: true}}
  # The long press must not also open the library: the picker is still there.
  - assert: {id: "library.picker.card[1]", minimumTapTarget: 44}
  - settle: 1000
  - snapshot: 03-library-long-press
