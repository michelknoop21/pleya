name: tvos.catalog.top-row-in-view
target: tvos-sim
# A-06b follow-up (Michel, hardware, build 391): moving UP in Alle films or
# Alle series left the top row just off the screen. On the full-bleed route of
# A-06c there is no heading to come back: the first row returns to its own top
# margin, from the rows below and from the panel.
#
# `catalog.long-grid.v1` seeds 18 films, three rows of six.
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series, nav.movies], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  # A-24c (LEESMIJ-v4): Select changed the page and left the remote on
  # the pill; Down takes it to the landing.
  - press: down
  - settle: 1500
  - press: select
  - wait_until: {id: "tv.catalog.grid[movies]", timeout: 20000}
  - wait_until: {id: "tv.catalog.grid.item[movies.17]", timeout: 10000}
  - settle: 1000

  # Down to row 2, then UP to row 1.
  - press: down
  - settle: 700
  - press: down
  - settle: 900
  - press: up
  - settle: 900
  - assert: {id: "tv.catalog.grid.item[movies.6]", focused: true, insideViewport: true}
  - snapshot: 01-up-to-row1

  # UP onto row 0: the whole first row is back.
  - press: up
  - settle: 900
  - assert: {id: "tv.catalog.grid.item[movies.0]", focused: true, insideViewport: true}
  - snapshot: 02-row0-after-up

  # Panel from row 2 and back, then up: the same whole first row.
  - press: down
  - settle: 700
  - press: down
  - settle: 900
  - press: left
  - settle: 900
  - assert: {id: "tv.catalog.rail.row[movies.sources]", focused: true}
  - press: right
  - settle: 900
  - press: up
  - settle: 700
  - press: up
  - settle: 900
  - assert: {id: "tv.catalog.grid.item[movies.0]", focused: true, insideViewport: true}
  - snapshot: 03-panel-then-row0
