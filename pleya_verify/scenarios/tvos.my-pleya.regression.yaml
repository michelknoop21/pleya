name: tvos.my-pleya.regression
target: tvos-sim
# MYP1, redone for A-24c: Mijn Pleya v4 in one walk, as the regression proof
# for the page. Every way in this fixture reaches is opened, and Menu has to
# land back on the card or tile it came from before the walk may continue.
# One trapped surface turns the rest of the walk red on the next `wait_until`.
#
# Reachable on `catalog.mixed.v1`: Big P (the set-up gate, no provider in the
# fixture), Samen kijken and Bibliotheken. Not reachable, and not faked: the
# kijklijst (no watchlist on this catalog; `tvos.my-pleya.v4` seeds one),
# Aanvragen (no Seerr), Activiteit (no Tautulli), Collecties and
# Afspeellijsten (no personal media on a Pleya Server), Downloads (never on
# Apple TV). Instellingen, Servers, Logboeken and Over moved out of the page:
# `tvos.my-pleya.v4`, `tvos.server.status`, `tvos.settings.logs` and
# `tvos.settings.about` cover them.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  # IntroGate's cold-start splash paints over an already-ready screen.
  - settle: 3500
  - walk: {direction: right, steps: 7, stopAt: nav.myPleya, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  # A-24c: Select changes the page and leaves the remote on the pill;
  # DOWN takes it in (LEESMIJ-v4, review 557-I4).
  - press: down
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - settle: 800
  - snapshot: 00-page

  # Big P
  - press: select
  - wait_until: {id: screen.assistant, timeout: 15000}
  - settle: 800
  - snapshot: 01-big-p
  - press: menu
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}

  # Samen kijken
  - press: down
  - wait_until: {focused: "my_pleya.tile[watchTogether]", timeout: 5000}
  - press: select
  - wait_until: {id: "my_pleya.section[watchTogether]", timeout: 15000}
  - settle: 800
  - snapshot: 02-watch-together
  - press: menu
  - wait_until: {focused: "my_pleya.tile[watchTogether]", timeout: 8000}

  # Bibliotheken
  - press: right
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - assert: {id: "my_pleya.tile[libraries]", insideViewport: true, sameRow: "my_pleya.tile[watchTogether]"}
  - press: select
  - wait_until: {id: "my_pleya.section[libraries]", timeout: 15000}
  - settle: 800
  - snapshot: 03-libraries
  - press: menu
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 8000}

  # Up from the dock returns to the nearest content action, and Menu from the
  # page reaches the bar on Mijn Pleya.
  - press: up
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 5000}
  - press: menu
  - wait_until: {focused: nav.myPleya, timeout: 8000}
  - snapshot: 04-back-on-nav
