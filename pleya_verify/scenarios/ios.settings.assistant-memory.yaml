name: ios.settings.assistant-memory
target: ios-sim
# BP-08a stap 3: Instellingen > Big P > Geheugen on an iPhone (mockup 43).
# The route a user takes: Mijn Pleya, Big P, "Big P instellen", the row
# "Geheugen". No model is set up, so nothing is sent anywhere and the screen
# shows the facts as a list instead of a written overview: the fallback of
# 43, which is the state every profile without a model is in.
#
# What this proves on a real build that a widget test cannot: the row opens
# the screen inside the profile session (its own MemoryService and database),
# a memory typed on the system keyboard is stored and listed, a memory is
# removed only after the confirmation, the switch turns the memory off and on
# again, and "Alle herinneringen wissen" asks first and wipes after the yes.
#
# Needs PLEYA_ASSISTANT_ENABLED=true in the environment of `verify.dart run`.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 800
  - tap: {id: "my_pleya.tile[assistant]"}
  - wait_until: {id: "assistant.button[setup]", timeout: 5000}
  - settle: 1000
  - tap: {id: "assistant.button[setup]"}
  - wait_until: {id: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - wait_until: {id: "settings.form.button[assistant.memory]", timeout: 5000}
  - settle: 800
  - assert: {id: "settings.form.button[assistant.memory]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: 00-row-in-big-p-settings

  # The screen: no memories yet (43 J), the field open, the menu button there.
  - tap: {id: "settings.form.button[assistant.memory]"}
  - wait_until: {id: screen.memory, state: {view: empty, count: 0, enabled: true}, timeout: 10000}
  - settle: 800
  - assert: {id: settings.memory.input, insideViewport: true}
  - assert: {id: "settings.memory.action[menu]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "settings.memory.action[send]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: 01-empty

  # The menu (43 C) and the list behind "Herinneringen beheren" (43 D).
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[manage]", timeout: 5000}
  - settle: 800
  - assert: {id: "settings.memory.action[use]", insideViewport: true, state: {selected: true}}
  - assert: {id: "settings.memory.action[clear]", insideViewport: true}
  - snapshot: 02-menu

  # The switch (43 I): it flips in place, the menu stays open, and the screen
  # behind it is in the off state.
  - tap: {id: "settings.memory.action[use]"}
  - wait_until: {id: screen.memory, state: {view: "off", enabled: false}, timeout: 8000}
  - wait_until: {id: "settings.memory.action[use]", state: {selected: false}, timeout: 5000}
  - settle: 800
  - snapshot: 02b-menu-switch-off
  - tap: {id: "settings.memory.action[manage]"}
  - wait_until: {id: screen.memory_list, state: {total: 0, readable: true}, timeout: 10000}
  - settle: 800
  - assert: {id: "settings.memory.action[add]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "settings.memory.fact[0]", present: false}
  - snapshot: 03-list-empty

  # Back on the memory screen: the card of the off state with its one
  # button, and a field that takes no question.
  - tap: {id: "settings.memory.action[listBack]"}
  - wait_until: {id: screen.memory, state: {view: "off", status: "off", enabled: false}, timeout: 10000}
  - wait_until: {id: "settings.memory.action[turnOn]", timeout: 5000}
  - settle: 800
  - assert: {id: "settings.memory.action[turnOn]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: settings.memory.input, insideViewport: true, state: {enabled: false}}
  - snapshot: 03b-off
  - tap: {id: "settings.memory.action[turnOn]"}
  - wait_until: {id: screen.memory, state: {view: empty, enabled: true}, timeout: 8000}
  - wait_until: {id: settings.memory.input, state: {enabled: true}, timeout: 5000}
  - settle: 600
  - assert: {id: "settings.memory.action[turnOn]", present: false}
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[use]", state: {selected: true}, timeout: 5000}
  - settle: 800
  - tap: {id: "settings.memory.action[manage]"}
  - wait_until: {id: screen.memory_list, state: {total: 0, readable: true}, timeout: 10000}
  - settle: 800

  # Add two memories through the sheet (43 F), typed on the system keyboard.
  - tap: {id: "settings.memory.action[add]"}
  - wait_until: {id: settings.memory.sheet, state: {mode: add}, timeout: 5000}
  - settle: 1000
  - tap: {id: settings.memory.sheet.field}
  - settle: 600
  - type: "Houdt niet van horror"
  - settle: 600
  - tap: {id: "settings.memory.sheet.chip[dislike]"}
  - wait_until: {id: "settings.memory.sheet.chip[dislike]", state: {selected: true}, timeout: 3000}
  - assert: {id: "settings.memory.sheet.button[save]", insideViewport: true, state: {enabled: true}}
  - snapshot: 04-add-sheet
  - tap: {id: "settings.memory.sheet.button[save]"}
  - wait_until: {id: "settings.memory.fact[0]", state: {category: dislike}, timeout: 8000}
  - wait_until: {id: screen.memory_list, state: {total: 1}, timeout: 5000}
  - settle: 1000

  - tap: {id: "settings.memory.action[add]"}
  - wait_until: {id: settings.memory.sheet, state: {mode: add}, timeout: 5000}
  - settle: 1000
  - tap: {id: settings.memory.sheet.field}
  - settle: 600
  - type: "Kijkt op vrijdagavond met het gezin"
  - settle: 600
  - tap: {id: "settings.memory.sheet.button[save]"}
  - wait_until: {id: screen.memory_list, state: {total: 2, count: 2}, timeout: 8000}
  - settle: 1000
  - assert: {id: "settings.memory.fact[1]", insideViewport: true, below: "settings.memory.fact[0]"}
  - snapshot: 05-list-two

  # The category chip filters: one of the two is left.
  - tap: {id: "settings.memory.chip[dislike]"}
  - wait_until: {id: "settings.memory.chip[dislike]", state: {selected: true}, timeout: 5000}
  - wait_until: {id: screen.memory_list, state: {total: 2, count: 1}, timeout: 5000}
  - settle: 600
  - snapshot: 06-filtered
  - tap: {id: "settings.memory.chip[all]"}
  - wait_until: {id: "settings.memory.chip[all]", state: {selected: true}, timeout: 5000}
  - wait_until: {id: screen.memory_list, state: {count: 2}, timeout: 5000}
  - settle: 600

  # Remove one (43 E): the confirmation first, Annuleren keeps it.
  - tap: {id: "settings.memory.fact[0]"}
  - wait_until: {id: settings.memory.sheet, state: {mode: edit}, timeout: 5000}
  - settle: 1000
  - snapshot: 07-edit-sheet
  - tap: {id: "settings.memory.sheet.button[delete]"}
  - wait_until: {id: "settings.memory.dialog.button[cancel]", timeout: 5000}
  - settle: 600
  - tap: {id: "settings.memory.dialog.button[cancel]"}
  - wait_until: {id: settings.memory.sheet, state: {mode: edit}, timeout: 5000}
  # The dialog needs its closing animation before it is out of the tree.
  - settle: 1000
  - assert: {id: "settings.memory.dialog.button[cancel]", present: false}
  - assert: {id: screen.memory_list, state: {total: 2}}
  - tap: {id: "settings.memory.sheet.button[delete]"}
  - wait_until: {id: "settings.memory.dialog.button[confirm]", timeout: 5000}
  - settle: 600
  - tap: {id: "settings.memory.dialog.button[confirm]"}
  - wait_until: {id: screen.memory_list, state: {total: 1, count: 1}, timeout: 8000}
  - settle: 1000
  - assert: {id: "settings.memory.fact[0]", insideViewport: true}
  - assert: {id: "settings.memory.fact[1]", present: false}
  - snapshot: 08-one-removed

  # Back on the memory screen: no model, so the facts stand as a list.
  - tap: {id: "settings.memory.action[listBack]"}
  - wait_until: {id: screen.memory, state: {view: list, count: 1}, timeout: 10000}
  - settle: 800
  - assert: {id: settings.memory.overview, insideViewport: true, state: {written: false}}
  - assert: {id: settings.memory.input, insideViewport: true}
  - snapshot: 09-fallback-list

  # "Alle herinneringen wissen" (43 G): asks first, Annuleren wipes nothing.
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[clear]", timeout: 5000}
  - settle: 800
  - tap: {id: "settings.memory.action[clear]"}
  - wait_until: {id: "settings.memory.dialog.button[cancel]", timeout: 5000}
  - settle: 600
  - assert: {id: "settings.memory.dialog.button[cancel]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "settings.memory.dialog.button[confirm]", insideViewport: true, minimumTapTarget: 44, sameRow: "settings.memory.dialog.button[cancel]"}
  - assert: {id: screen.memory, state: {count: 1}}
  - snapshot: 10-clear-dialog
  - tap: {id: "settings.memory.dialog.button[cancel]"}
  - wait_until: {id: "settings.memory.action[menu]", timeout: 5000}
  - settle: 800
  - assert: {id: screen.memory, state: {view: list, count: 1}}
  - assert: {id: "settings.memory.dialog.button[cancel]", present: false}

  # And the yes: everything is gone and the screen says the memory is empty.
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[clear]", timeout: 5000}
  - settle: 800
  - tap: {id: "settings.memory.action[clear]"}
  - wait_until: {id: "settings.memory.dialog.button[confirm]", timeout: 5000}
  - settle: 600
  - tap: {id: "settings.memory.dialog.button[confirm]"}
  - wait_until: {id: screen.memory, state: {view: empty, count: 0}, timeout: 10000}
  - settle: 800
  - snapshot: 11-wiped
