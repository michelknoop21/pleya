name: books.search.layout
target: ios-sim
# Boeken zoeken against approved golden 04
# (docs/assets/ebooks/northstar/04a-books-search.png).
#
# REQUIRES `PLEYA_VERIFY_BOOKS=1`, like the other books scenarios, and for a
# comparison against the golden also `PLEYA_VERIFY_IOS_UDID=<iPhone 15 Pro>`.
#
# The query is seeded, not typed, and that is a gap rather than a preference.
# The iOS driver has no text-input endpoint (`typeText: no /v1/input/text
# endpoint exists yet`), so `open: screen.books_search` lands on golden 04's
# canonical query instead. What this proves is that the three sections lay out
# on a real device at the golden's viewport. What it does not prove is that
# typing produces them; `test/screens/books_search_screen_test.dart` types for
# real and covers that, and the day the driver grows a text endpoint this
# scenario should type here too.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.books
  - open: screen.books_search
steps:
  - wait_until: {id: screen.books_search, timeout: 15000}
  - settle: 1500
  # The canonical state: three kinds of result from one query, and a chip for
  # each of them plus Alles.
  - assert: {id: "books.search.result[dune]", insideViewport: true}
  - assert: {id: "books.search.result[Frank Herbert]", insideViewport: true}
  - assert: {id: "books.search.category[all]", insideViewport: true}
  - assert: {id: "books.search.category[books]", insideViewport: true}
  - assert: {id: "books.search.category[authors]", insideViewport: true}
  - assert: {id: "books.search.category[series]", insideViewport: true}
  - snapshot: search-all
