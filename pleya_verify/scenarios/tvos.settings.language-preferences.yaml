name: tvos.settings.language-preferences
target: tvos-sim
# LANG1 / DEC-096: Instellingen ▸ Taal en ondertitels, the single place a
# language preference is managed (lid 9), and the journey mockup 31 A and 31 B
# describe.
#
# Three things this proves that a widget test cannot:
#   1. A-24b: Taal en ondertitels is a category of the Instellingen page, its
#      rows in place (series `tvos/04`), and the remote reaches it from the rail;
#   2. the global rows and the two switches are one column, walked with DOWN;
#   3. a picker opens and closes without leaving the page, and Menu leaves it.
#
# The series column starts empty on a fresh device: a series preference only
# exists after someone picks a language during a series. The scenario therefore
# asserts the *page*, and the series list is asserted by the widget tests in
# `test/screens/settings/language_settings_screen_test.dart`, which can seed one.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  # A-24c: Instellingen is a destination in the top bar, right after Mijn Pleya.
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  # Select leaves the remote on the pill; Down enters the page.
  - press: down

  # A-24b: from Thema, LEFT to the rail, down to Taal en ondertitels, SELECT
  # chooses it and RIGHT enters it on its first row.
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 8000}
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - press: down
  - press: down
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[2]", state: {selected: true}, timeout: 5000}
  - press: right
  # Michel, 25 Oct 2026: App-taal is the first row of Taal en ondertitels.
  - wait_until: {focused: "my_pleya.section.tile[setting.app_locale]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[language.language_audio]", timeout: 8000}
  - snapshot: 01-page-opened

  - assert: {id: "my_pleya.section.tile[language.language_audio]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[language.language_fallback]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[language.language_fallback]", sameColumn: "my_pleya.section.tile[language.language_audio]"}
  - assert: {id: "my_pleya.section.tile[language.language_fallback]", below: "my_pleya.section.tile[language.language_audio]"}
  - press: down
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[language.language_fallback]", timeout: 5000}
  - snapshot: 02-left-column
  # The switches follow in the same column, under Onthouden.
  - walk: {direction: down, steps: 3, stopAt: "my_pleya.section.tile[language.language_mirror]", timeout: 45000, settle: 400}
  - assert: {id: "my_pleya.section.tile[language.language_mirror]", insideViewport: true, sameColumn: "my_pleya.section.tile[language.language_audio]"}
  - walk: {direction: up, steps: 3, stopAt: "my_pleya.section.tile[language.language_fallback]", timeout: 45000, settle: 400}

  # The picker of a global row opens and closes without leaving the page.
  - press: select
  - settle: 800
  - snapshot: 03-picker-open
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[language.language_fallback]", timeout: 8000}
  - snapshot: 04-picker-closed

  # And out, onto the hub's tile.
  - press: menu
  - wait_until: {focused: nav.settings, timeout: 8000}
