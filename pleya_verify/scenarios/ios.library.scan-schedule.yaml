name: ios.library.scan-schedule
target: ios-sim
# De scanbevestiging toont de volgende geplande scan (DEC-XXX, drie
# servergaten): Pleya Server meldt `scan_schedule` en `next_scan_at` op de
# eerste bibliotheek. De weg is die van een gebruiker: Bibliotheken, de
# eerste bibliotheek, het menu achter de puntjes, Bibliotheken beheren, de
# opties van die bibliotheek en Scannen. De bevestiging wordt niet gegeven:
# het bewijs is de vraag zelf, en een scan op het fixture zegt niets.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: server.scan-schedule.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[libraries]"}
  - wait_until: {id: screen.library_picker, timeout: 10000}
  - settle: 1000
  - tap: {id: "library.picker.card[0]"}
  - wait_until: {id: screen.libraries, timeout: 15000}
  - settle: 3000
  - tap: {id: library.filter.more}
  - wait_until: {id: library.more.manage, timeout: 5000}
  - tap: {id: library.more.manage}
  - wait_until: {id: "library.manage.options[0]", timeout: 5000}
  - settle: 1000
  - tap: {id: "library.manage.options[0]"}
  - wait_until: {id: "library.maintenance.action[scan]", timeout: 5000}
  - settle: 800
  - snapshot: maintenance-menu
  - tap: {id: "library.maintenance.action[scan]"}
  - wait_until: {id: library.maintenance.confirm, timeout: 8000}
  - settle: 800
  - assert: {id: library.maintenance.confirm, insideViewport: true, minimumTapTarget: 44}
  - snapshot: scan-confirmation-next-scan
