name: ios.library.local-storage
target: ios-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 800
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 800
  # A-24b: the local library's rows sit inline on Bibliotheken (Bibliotheek &
  # Home, series ios/03-01).
  - tap: {id: "settings.tile[library_home]"}
  - wait_until: {id: local_library.enable, timeout: 10000}
  - settle: 800
  - assert: {id: local_library.enable, state: {value: false}, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: local_library.wifi, state: {value: true}, insideViewport: true}
  - snapshot: 01-defaults
  - tap: {id: local_library.enable}
  - wait_until: {id: local_library.status, state: {status: ready}, timeout: 90000}
  - assert: {id: local_library.enable, state: {value: true}}
  - snapshot: 02-stored
  - drag: {startX: 187, startY: 570, endX: 187, endY: 210, durationMs: 700}
  - settle: 500
  - tap: {id: local_library.clear}
  - wait_until: {id: "local_library.action[confirm_clear]", timeout: 5000}
  - snapshot: 03-confirm-clear
  - tap: {id: "local_library.action[confirm_clear]"}
  - wait_until: {id: "local_library.action[keep_off]", timeout: 10000}
  - assert: {id: "local_library.action[refill]", insideViewport: true}
  - snapshot: 04-refill-choice
  - tap: {id: "local_library.action[keep_off]"}
  - wait_until: {id: local_library.status, state: {status: disabled, items: 0, bytes: 0}, timeout: 5000}
  - snapshot: 05-cleared-off
