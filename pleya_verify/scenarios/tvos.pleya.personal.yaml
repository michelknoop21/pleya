name: tvos.pleya.personal
target: tvos-sim
# A production favorites source, without the Verify watchlist route.
setup:
  - reset_app
  - seed: catalog.studio-art.v1
  - seed: personal.favorites.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, steps: 7, stopAt: nav.myPleya, timeout: 60000, settle: 600}
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {id: "my_pleya.watchlist_item[0]", timeout: 15000}
  - assert: {id: "my_pleya.watchlist_item[0]", insideViewport: true}
  - snapshot: pleya-favorites
  - press: right
  - wait_until: {focused: "my_pleya.watchlist_item[0]", timeout: 8000}
  - snapshot: pleya-favorite-focused
  - press: menu
  - wait_until: {focused: nav.myPleya, timeout: 8000}
