name: macos.viewport-density
target: macos
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - settle: 3500
  - snapshot: macos-after-signin
  - wait_until: {id: discover.continue_watching, timeout: 20000}
  - settle: 3500
  - configure_view: {width: 900, height: 600}
  - settle: 800
  - assert: {id: sidebar.rail, insideViewport: true}
  - assert: {id: nav.discover, insideViewport: true, minimumTapTarget: 44}
  - snapshot: macos-900x600
  - configure_view: {width: 1280, height: 800}
  - settle: 800
  - assert: {id: discover.continue_watching, insideViewport: true}
  - snapshot: macos-1280x800
  - configure_view: {width: 1440, height: 900}
  - settle: 800
  - assert: {id: discover.continue_watching, insideViewport: true}
  - snapshot: macos-1440x900
  - configure_view: {width: 1920, height: 1080}
  - settle: 800
  - assert: {id: discover.continue_watching, insideViewport: true}
  - snapshot: macos-1920x1080
