name: tvos.player.panel
target: tvos-sim
# PLR2 / PLR3 (DEC-101). The simulator opens the player panel through the
# tracks shortcut and uses the tab row to reach Video. The physical Siri
# Remote can also open the panel with a down swipe.
#
# The fixture clip lasts fifteen seconds. Pause on Play/Pause, walk to Tracks,
# then go up to the tab row, left to Video and down to its first row.
#
# Mockup 33 coverage (nine states, a-i): a Info, b Video, c Geluid, d
# Ondertitels, e Audio-synchronisatie and i (the OSD entry point) are asserted
# here. Not reachable on this fixture: f Hoofdstukken (the clip has no
# chapters, so the Video tab mounts no chapters row), h Geluid during Dolby
# passthrough (needs a bitstreaming receiver, hardware only). g Slaaptimer is opened as
# a sub-view, its contents only in the screenshot.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 20000}
  - settle: 1500
  - press: select
  - wait_until: {id: player.surface, timeout: 25000}

  # Pause first, then over to the tracks button.
  # No wait for the ring first: an idb press takes one to two seconds to land,
  # and the clip was two seconds long, so a press sent after polling for the
  # focus arrived when mpv had already ended (run of 23 September). The clip
  # is fifteen seconds since VER7; the press still goes out first and lands on
  # play/pause, which the next asserts check.
  - settle: 200
  - press: select
  - settle: 400
  - assert: {id: player.play_pause, state: {playing: false}}
  - walk: {direction: right, steps: 4, stopAt: player.tracks_button, timeout: 20000, settle: 250}
  - assert: {id: player.tracks_button, focused: true}
  - press: select
  - wait_until: {id: player.panel, timeout: 5000}
  - settle: 400
  - press: up
  - settle: 250
  - walk: {direction: left, steps: 2, stopAt: "player.panel.tab[video]", timeout: 5000, settle: 250}
  - assert: {id: "player.panel.tab[video]", focused: true}
  - press: down
  - settle: 250
  - snapshot: 01-panel-video

  # 33 B: the panel opened on Video, inside the title-safe rect, with the first
  # row of the Display group under the ring and the Playback group beside it.
  - assert: {id: player.panel, state: {tab: video, subView: none}}
  - assert: {id: player.panel, insideViewport: true}
  - assert: {id: "player.panel.tab[video]", state: {active: true}}
  - assert: {id: "player.panel.row[aspect_ratio]", focused: true}
  - assert: {id: "player.panel.row[speed]", rightOf: "player.panel.row[aspect_ratio]"}
  - assert: {id: "player.panel.row[sleep_timer]", below: "player.panel.row[speed]"}
  - assert: {id: "player.panel.row[auto_play_next]", insideViewport: true}

  # A value row is entered before it steps (DEC-107): at rest RIGHT is
  # traversal and crosses to the Playback column; Select enters, and only then
  # do RIGHT and LEFT step the value. Letterbox → Vul scherm → Letterbox (the app runs in Dutch).
  - press: right
  - settle: 300
  - assert: {id: "player.panel.row[speed]", focused: true}
  - press: left
  - settle: 300
  - assert: {id: "player.panel.row[aspect_ratio]", focused: true, state: {entered: false}}
  - press: select
  - settle: 300
  - assert: {id: "player.panel.row[aspect_ratio]", state: {entered: true}}
  - press: right
  - settle: 300
  - assert: {id: "player.panel.row[aspect_ratio]", focused: true, state: {value: "Vul scherm", entered: true}}
  - snapshot: 02-panel-stepped
  - press: left
  - settle: 300
  - assert: {id: "player.panel.row[aspect_ratio]", state: {value: "Letterbox"}}
  - press: select
  - settle: 300
  - assert: {id: "player.panel.row[aspect_ratio]", focused: true, state: {entered: false}}

  # The sleep-timer sub-view (33 G): over to Playback, down to Slaaptimer,
  # Select opens it; Menu returns to the Video tab.
  - press: right
  - settle: 300
  - press: down
  - settle: 300
  - assert: {id: "player.panel.row[sleep_timer]", focused: true, state: {value: "Uit"}}
  - press: select
  - settle: 500
  - assert: {id: player.panel, state: {tab: video, subView: sleepTimer}}
  - snapshot: 02b-panel-sleep-timer
  - press: menu
  - settle: 500
  - assert: {id: player.panel, state: {tab: video, subView: none}}

  # Back from a sub-view the ring is on the tab's top row, so UP is the pill;
  # LEFT on the pill is Info (33 A).
  - press: up
  - settle: 300
  - assert: {id: "player.panel.tab[video]", focused: true}
  - press: left
  - settle: 400
  - assert: {id: player.panel, state: {tab: information, subView: none}}
  - assert: {id: "player.panel.tab[information]", state: {active: true}}
  - snapshot: 03-panel-info

  # Across the pill to Geluid (33 C) and Ondertitels (33 D).
  - press: right
  - settle: 300
  - press: right
  - settle: 300
  - assert: {id: player.panel, state: {tab: audio, subView: none}}
  - assert: {id: "player.panel.tab[audio]", state: {active: true}}
  - assert: {id: "player.panel.row[audio.track.0]", insideViewport: true}
  - assert: {id: "player.panel.row[volume_boost]", rightOf: "player.panel.row[audio.track.0]"}
  - snapshot: 04-panel-audio
  - press: right
  - settle: 300
  - assert: {id: player.panel, state: {tab: subtitles, subView: none}}
  - assert: {id: "player.panel.tab[subtitles]", state: {active: true}}
  - assert: {id: "player.panel.row[subtitle.off]", insideViewport: true}
  - snapshot: 05-panel-subtitles

  # Back to Geluid and into the audio-sync sub-view (33 E): track, over to the
  # output column (boost), one down is sync.
  - press: left
  - settle: 300
  - assert: {id: player.panel, state: {tab: audio, subView: none}}
  - press: down
  - settle: 300
  - assert: {id: "player.panel.row[audio.track.0]", focused: true}
  - press: right
  - settle: 300
  - assert: {id: "player.panel.row[volume_boost]", focused: true}
  - press: down
  - settle: 300
  - assert: {id: "player.panel.row[audio_sync]", focused: true}
  - press: select
  - settle: 500
  - assert: {id: player.panel, state: {tab: audio, subView: audioSync}}
  - assert: {id: "player.panel.row[sync_offset]", focused: true}
  - snapshot: 06-panel-audio-sync

  # Menu in a sub-view goes back to its tab, not out of the panel.
  - press: menu
  - settle: 500
  - assert: {id: player.panel, state: {tab: audio, subView: none}}
  - snapshot: 07-panel-back-from-sync

  # Menu on the tab closes the panel and hands the remote back to the player:
  # UP must show the controls again, which only works when the hidden-controls
  # handler got its focus back.
  - press: menu
  - settle: 600
  - press: up
  - settle: 400
  - assert: {id: player.title, insideViewport: true}
  - snapshot: 08-back-to-player
