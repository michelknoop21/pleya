name: tvos.theme.dark-hero-cta
target: tvos-sim
# Review round: the hero with a focused CTA in the Dark theme (the default is
# OLED), to compare with the same slide in Light and OLED.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  # A-24c: Instellingen is a destination in the top bar, right after Mijn Pleya.
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  # Select leaves the remote on the pill; Down enters the page.
  - press: down
  # A-24b: Weergave's rows sit on the Instellingen page; it opens on Thema.
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 8000}
  - settle: 400
  - press: select
  - settle: 1000
  - press: up
  - press: up
  - press: up
  - press: down
  - press: down
  - settle: 300
  - press: select
  - settle: 1500
  - snapshot: 00-appearance-dark
  - press: menu
  # A-24c: Menu from the settings page is the bar, on Instellingen.
  - wait_until: {focused: nav.settings, timeout: 8000}
  - walk: {direction: left, expect: [nav.myPleya, nav.movies, nav.series, nav.discover], timeout: 45000, settle: 800}
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 1500
  - press: down
  - wait_until: {focused: discover.hero.play, timeout: 5000}
  - settle: 800
  - snapshot: 10-hero-play-focused
  - press: right
  - settle: 800
  - snapshot: 11-hero-details-focused
