name: tvos.theme.dark-hero-cta
target: tvos-sim
# Review round: the hero with a focused CTA in the Dark theme (the default is
# OLED), to compare with the same slide in Light and OLED.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[settings]", timeout: 5000}
  - press: select
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - press: select
  - wait_until: {id: "my_pleya.section.content[appearance]", timeout: 8000}
  - press: right
  - settle: 400
  - press: select
  - settle: 1000
  - press: up
  - press: up
  - press: up
  - press: down
  - press: down
  - settle: 300
  - press: select
  - settle: 1500
  - snapshot: 00-appearance-dark
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - press: menu
  - wait_until: {focused: "my_pleya.tile[settings]", timeout: 8000}
  - press: menu
  - wait_until: {focused: nav.myPleya, timeout: 8000}
  - walk: {direction: left, expect: [nav.movies, nav.series, nav.discover], timeout: 20000, settle: 800}
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 1500
  - press: down
  - wait_until: {focused: discover.hero.play, timeout: 5000}
  - settle: 800
  - snapshot: 10-hero-play-focused
  - press: right
  - settle: 800
  - snapshot: 11-hero-details-focused
