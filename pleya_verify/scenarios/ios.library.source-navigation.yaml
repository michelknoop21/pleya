name: ios.library.source-navigation
target: ios-sim
setup:
  - reset_app
  - seed: catalog.hero-artwork.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 4000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[libraries]"}
  # A screen id backs `AutomationScreenRegistry` (readiness only, `GET
  # /v1/screens`), not a node with bounds, same convention every other
  # `screen.*` wait in this repo's scenarios follows.
  - wait_until: {id: screen.library_picker, timeout: 10000}
  - settle: 1000
  # catalog.mixed.v1 has exactly two libraries (Movies, Shows) on one server,
  # so both picker cards are always present and the server-filter chips never
  # render (the fixture has nothing to filter). Asserting both proves the
  # 2-column grid the mockup shows, without encoding a pixel value from the
  # PNG itself.
  - assert: {id: "library.picker.card[0]", insideViewport: true, minimumTapTarget: 44}
  - tap: {id: "library.picker.card[0]"}
  - wait_until: {id: screen.libraries, timeout: 15000}
  - settle: 4000
  - assert: {id: library.header, insideViewport: true}
  - assert: {id: "library.atmosphere[libraries]", state: {available: true, blur_sigma: 14}}
  - snapshot: source-library-navigation
