name: tvos.catalog.delete-from-server
target: tvos-sim
# Verwijderen van server from Alle series on Apple TV, by remote only (A-07,
# the "nog steeds geen items verwijderen" report of 13 November 2026).
# `catalog.delete.v1`: the Jellyfin user is an administrator and holds two
# series, Shrinking and Slow Horses.
#
# What this proves:
#   1. a long Select on a card in Alle series opens the context menu, and DOWN
#      reaches its trailing "Beheren" row;
#   2. Select opens the management sheet and DOWN reaches "Verwijderen van
#      server" for that series;
#   3. Select asks first, with Annuleren under the remote, and Annuleren sends
#      nothing.
# Not yet run: this machine has no tvOS simulator runtime (13 November 2026).
# The press counts follow `tv_catalog_delete_dpad_test.dart` (5 DOWNs to
# Beheren on a single-source series); that test uses a Plex series with four
# management rows, Jellyfin has three, so the sheet count is the one to check
# on the first run.
setup:
  - reset_app
  - seed: catalog.delete.v1
  - launch
  - sign_in: {base_url: "{{fixture_jellyfin}}", username: verify-owner, password: verify-password, backend: jellyfin}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  - press: select
  - wait_until: {id: "tv.catalog.grid[series]", timeout: 20000}
  - wait_until: {id: "tv.catalog.grid.item[series.1]", timeout: 10000}
  - settle: 1000
  - assert: {id: "tv.catalog.grid.item[series.0]", focused: true, state: {title: Shrinking}}

  - press: {key: select, holdMs: 900}
  - wait_until: {id: sheet.context_menu, timeout: 8000}
  - settle: 600
  - snapshot: 00-context-menu
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - assert: {id: "sheet.context_menu.item[5]", state: {label: Beheren, focused: true}}
  - snapshot: 01-manage-focused

  - press: select
  - wait_until: {id: "sheet.context_menu.item[delete.verify-jellyfin:del-shrinking]", timeout: 8000}
  - settle: 600
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - assert: {id: "sheet.context_menu.item[delete.verify-jellyfin:del-shrinking]", state: {label: Verwijderen van server, focused: true}}
  - snapshot: 02-delete-focused

  - press: select
  - wait_until: {id: "dialog.delete_media[cancel]", timeout: 8000}
  - settle: 600
  - snapshot: 03-confirmation
  - press: select
  - settle: 800
  - fixture_mutate: {op: jellyfin_deletes, items: []}
