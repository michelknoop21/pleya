name: books.home.layout
target: ios-sim
# Boeken-home against approved golden 01b
# (docs/assets/ebooks/northstar/01b-books-home.png), on a real iPhone
# simulator build.
#
# REQUIRES `PLEYA_VERIFY_BOOKS=1` in the environment:
#
#   PLEYA_VERIFY_BOOKS=1 dart run bin/verify.dart run ../scenarios/books.home.layout.yaml
#
# E-books are a Pleya-native content type with no source behind them yet, so
# availability is a compile-time define and the driver only passes it when that
# variable is set. Without it there is no Boeken destination at all and this
# scenario fails at the first wait_until with `screen.books is not
# ready/present` — which is the honest failure, not a flake.
#
# It also covers permutation (a) of DEC-094 point 5: with books available the
# bar's fourth slot is Boeken. Permutation (d), the Downloads floor, is
# `mobile.nav.primary`, which runs without the variable.
#
# To compare the screenshot with the golden pixel for pixel, pin the device to
# the viewport the golden was drawn on (iPhone 15 Pro, 393x852 pt); the default
# is whichever iPhone happens to be booted, and on an iPhone 17 the frame is
# 402x874 and every measurement is off by the difference:
#
#   xcrun simctl create "Pleya Verify iPhone 15 Pro" \
#     com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro <iOS runtime>
#   PLEYA_VERIFY_BOOKS=1 PLEYA_VERIFY_IOS_UDID=<udid> dart run bin/verify.dart run ...
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  # Through the app's own _selectTab, the same one the bar calls. `tap` takes
  # coordinates only, so a scenario cannot press a tab; `open` is the route
  # that exists for exactly this.
  - open: screen.books
steps:
  - wait_until: {id: screen.books, timeout: 15000}
  - wait_until: {id: nav.books, timeout: 15000}
  # Slot 4 is Boeken, not Live TV and not Downloads: books win the dynamic
  # slot when the profile has them.
  - assert: {id: nav.books, insideViewport: true}
  # Which screen is actually being drawn. The shell keeps every tab mounted in
  # an `IndexedStack`, so Discover has a full-viewport rect right now too and
  # every geometry predicate passes on it — `visible` is the only field that
  # separates the page on screen from the ones parked behind it.
  - assert: {id: screen.books, visible: true}
  - assert: {id: screen.discover, visible: false}
  - settle: 2000
  # The three rails golden 01b puts on this page, in its order. `assert` fails
  # on an id the ui tree does not carry, so naming them is what proves the page
  # is the golden's page and not a subset of it.
  - assert: {id: books.rail.continue, insideViewport: true}
  - assert: {id: books.rail.recent, insideViewport: true}
  - assert: {id: books.rail.series}
  - snapshot: books-home
