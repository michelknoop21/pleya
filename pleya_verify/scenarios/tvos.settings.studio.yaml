# A-24b phase 3: the TV Instellingen page per the Studio anchor `02` and the
# series `tvos/01`-`12`: a rail with glyphs, Weergave and Afspelen inline with
# their previews, Taal en ondertitels inline, and Koppelingen down to Servers
# en bronnen. OLED (the default), then Dark and Light through the Thema row,
# which now sits on the page itself. Fixture with Blender artwork, so the
# previews show real posters and a real still.
name: tvos.settings.studio
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.studio-art.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, steps: 7, stopAt: nav.myPleya, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  # A-24b: Down to Bibliotheken, Right across to Big P at the top of the right
  # column, Instellingen under it.
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 8000}
  - walk: {direction: right, steps: 4, stopAt: "my_pleya.tile[assistant]", timeout: 60000, settle: 600}
  - press: down
  - wait_until: {focused: "my_pleya.tile[settings]", timeout: 5000}
  - press: select
  # The page opens on its first row: Thema, in Weergave.
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 8000}
  # --- oled ---
  - assert: {id: "settings.category[0]", state: {selected: true}}
  - assert: {id: "settings.category[0]", leftOf: "my_pleya.section.tile[setting.theme_mode]"}
  - settle: 1500
  - snapshot: oled-0-weergave
  # Afspelen: chosen with SELECT on the rail, entered with RIGHT.
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[1]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.enable_hardware_decoding]", timeout: 5000}
  - settle: 1200
  - snapshot: oled-1-afspelen
  # Taal en ondertitels.
  - press: left
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: select
  - press: right
  # Michel, 25 Oct 2026: App-taal is the first row of Taal en ondertitels.
  - wait_until: {focused: "my_pleya.section.tile[setting.app_locale]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[language.language_audio]", timeout: 5000}
  - settle: 1200
  - snapshot: oled-2-taal
  # Koppelingen, down to Servers en bronnen.
  - press: left
  - walk: {direction: down, steps: 4, stopAt: "settings.category[5]", timeout: 60000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[5]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.trackers]", timeout: 5000}
  - walk: {direction: down, steps: 6, stopAt: "my_pleya.section.tile[settings.sources.pleyaServer]", timeout: 90000, settle: 400}
  - assert: {id: "my_pleya.section.tile[settings.sources.pleyaServer]", insideViewport: true}
  - settle: 1200
  - snapshot: oled-3-servers
  # Back to Weergave, onto Thema.
  - press: left
  - walk: {direction: up, steps: 6, stopAt: "settings.category[0]", timeout: 90000, settle: 400}
  - press: select
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 5000}
  # Thema: the picker lists Systeem, Licht, Donker, OLED and opens on OLED.
  - press: select
  - settle: 1000
  - press: up
  - press: up
  - press: up
  - press: down
  - press: down
  - settle: 300
  - press: select
  - wait_until: {id: "my_pleya.section.tile[setting.theme_mode]", state: {value: "ThemeMode.dark"}, timeout: 8000}
  # --- dark ---
  - assert: {id: "settings.category[0]", state: {selected: true}}
  - assert: {id: "settings.category[0]", leftOf: "my_pleya.section.tile[setting.theme_mode]"}
  - settle: 1500
  - snapshot: dark-0-weergave
  # Afspelen: chosen with SELECT on the rail, entered with RIGHT.
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[1]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.enable_hardware_decoding]", timeout: 5000}
  - settle: 1200
  - snapshot: dark-1-afspelen
  # Taal en ondertitels.
  - press: left
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: select
  - press: right
  # Michel, 25 Oct 2026: App-taal is the first row of Taal en ondertitels.
  - wait_until: {focused: "my_pleya.section.tile[setting.app_locale]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[language.language_audio]", timeout: 5000}
  - settle: 1200
  - snapshot: dark-2-taal
  # Koppelingen, down to Servers en bronnen.
  - press: left
  - walk: {direction: down, steps: 4, stopAt: "settings.category[5]", timeout: 60000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[5]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.trackers]", timeout: 5000}
  - walk: {direction: down, steps: 6, stopAt: "my_pleya.section.tile[settings.sources.pleyaServer]", timeout: 90000, settle: 400}
  - assert: {id: "my_pleya.section.tile[settings.sources.pleyaServer]", insideViewport: true}
  - settle: 1200
  - snapshot: dark-3-servers
  # Back to Weergave, onto Thema.
  - press: left
  - walk: {direction: up, steps: 6, stopAt: "settings.category[0]", timeout: 90000, settle: 400}
  - press: select
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 5000}
  # Thema from Donker to Licht.
  - press: select
  - settle: 1000
  - press: up
  - press: up
  - press: up
  - press: down
  - settle: 300
  - press: select
  - wait_until: {id: "my_pleya.section.tile[setting.theme_mode]", state: {value: "ThemeMode.light"}, timeout: 8000}
  # --- light ---
  - assert: {id: "settings.category[0]", state: {selected: true}}
  - assert: {id: "settings.category[0]", leftOf: "my_pleya.section.tile[setting.theme_mode]"}
  - settle: 1500
  - snapshot: light-0-weergave
  # Afspelen: chosen with SELECT on the rail, entered with RIGHT.
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[1]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.enable_hardware_decoding]", timeout: 5000}
  - settle: 1200
  - snapshot: light-1-afspelen
  # Taal en ondertitels.
  - press: left
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: select
  - press: right
  # Michel, 25 Oct 2026: App-taal is the first row of Taal en ondertitels.
  - wait_until: {focused: "my_pleya.section.tile[setting.app_locale]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[language.language_audio]", timeout: 5000}
  - settle: 1200
  - snapshot: light-2-taal
  # Koppelingen, down to Servers en bronnen.
  - press: left
  - walk: {direction: down, steps: 4, stopAt: "settings.category[5]", timeout: 60000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[5]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.trackers]", timeout: 5000}
  - walk: {direction: down, steps: 6, stopAt: "my_pleya.section.tile[settings.sources.pleyaServer]", timeout: 90000, settle: 400}
  - assert: {id: "my_pleya.section.tile[settings.sources.pleyaServer]", insideViewport: true}
  - settle: 1200
  - snapshot: light-3-servers
  # Back to Weergave, onto Thema.
  - press: left
  - walk: {direction: up, steps: 6, stopAt: "settings.category[0]", timeout: 90000, settle: 400}
  - press: select
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 5000}
