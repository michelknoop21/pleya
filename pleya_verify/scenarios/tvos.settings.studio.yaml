# A-24 PR 2: the TV settings page as Studio categories, rows and a library
# preview, in the app's default OLED theme and then Dark and Light, switched
# the way a viewer does it on Weergave's theme row. Visual evidence per
# category (Bibliotheek with its preview, Verbindingen and Geavanceerd
# without), plus Weergave's own categories.
name: tvos.settings.studio
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.tile[settings]", timeout: 5000}
  - press: select
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - assert: {id: "settings.category[0]", focused: false, state: {selected: true}}
  - assert: {id: "settings.category[0]", leftOf: "my_pleya.section.tile[settings.appearance]"}
  - settle: 2000
  - snapshot: 00-bibliotheek-oled
  # Verbindingen, then Geavanceerd: chosen with SELECT, entered with RIGHT.
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[1]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.settings_add_connection]", timeout: 5000}
  - assert: {id: "settings.category[1]", focused: false, state: {selected: true}}
  - settle: 600
  - snapshot: 01-verbindingen-oled
  - press: left
  - wait_until: {focused: "settings.category[1]", timeout: 5000}
  - press: down
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: select
  - wait_until: {id: "settings.category[2]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.watch_together_relay]", timeout: 5000}
  - assert: {id: "my_pleya.section.tile[settings.crash_reporting]", insideViewport: true, state: {toggled: true}}
  - settle: 600
  - snapshot: 02-geavanceerd-oled
  # Back to Bibliotheek and into Weergave.
  - press: left
  - wait_until: {focused: "settings.category[2]", timeout: 5000}
  - press: up
  - press: up
  - wait_until: {focused: "settings.category[0]", timeout: 5000}
  - settle: 600
  - snapshot: 03-rail-focus-oled
  - press: select
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 5000}
  - press: select
  - wait_until: {id: "my_pleya.section.content[appearance]", timeout: 8000}
  - settle: 800
  - snapshot: 04-weergave-oled
  # Thema: the picker lists Systeem, Licht, Donker, OLED.
  - press: right
  - settle: 400
  - press: select
  - settle: 1000
  - press: up
  - press: up
  - press: up
  - press: down
  - press: down
  - settle: 300
  - press: select
  - settle: 1500
  - snapshot: 05-weergave-dark
  - press: left
  - settle: 400
  - press: down
  - settle: 400
  - snapshot: 06-weergave-rail-dark
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - assert: {id: "settings.category[0]", state: {selected: true}}
  - settle: 1500
  - snapshot: 07-bibliotheek-dark
  # Verbindingen, then Geavanceerd: chosen with SELECT, entered with RIGHT.
