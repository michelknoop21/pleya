name: ios.contextmenu.northstar
target: ios-sim
# The mobile long-press menu (northstar 09, iOS Unified 2026 workitem 4 (I5),
# docs/unified-2026-closure.md §5 row 4), tegen
# `docs/assets/ios-unified/northstar/09-contextmenu-sheet.png`. Reached zoals
# een gebruiker dat doet: Home laden, dan een echte long-press op de eerste
# kaart van de eerste rij — `tap: {holdMs}` synthetiseert een echte
# PointerDown/wachten/PointerUp door de gestepijplijn, geen synthetische
# callback-aanroep. `_RailCardCell.onLongPress` is de enige call site
# (`mobile_media_rail.dart`); `availableUnifiedGroupActions` levert altijd
# minstens markeer bekeken/onbekeken, dus de eerste rijkaart opent de sheet
# gegarandeerd. `sheet.context_menu`/`sheet.context_menu.item[<index>]` zijn
# nieuwe automation-ids (deze ronde), dus dit is niet langer een puur
# observatiescenario: er zijn echte assertions op de sheet zelf.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  # Not discover.hero: catalog.mixed.v1 renders Home without a hero at all
  # (no featured item in the fixture), so ios.home.northstar's hero-wait
  # never actually applies here either — waited on what this scenario
  # actually needs instead.
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - assert: {id: "home.rail.item[0.0]", insideViewport: true}
  - tap: {id: "home.rail.item[0.0]", holdMs: 600}
  - wait_until: {id: sheet.context_menu, timeout: 10000}
  - settle: 500
  - assert: {id: sheet.context_menu, insideViewport: true}
  # availableUnifiedGroupActions always puts markWatched/markUnwatched first.
  # Not minimumTapTarget here: the automation node wraps only the label text
  # (AppMenuItem's own `child:` slot, see mobile_unified_context_menu.dart),
  # so its reported rect is the label's own tight bounds, not the full
  # tappable row AppMenuItemTile draws underneath it — asserting a tap
  # target against that rect would check something this marker cannot see.
  - assert: {id: "sheet.context_menu.item[0]", insideViewport: true}
  - snapshot: contextmenu-sheet-northstar
