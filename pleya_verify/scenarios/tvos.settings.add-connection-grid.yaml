name: tvos.settings.add-connection-grid
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.tile[servers]", timeout: 5000}
  - press: select
  - wait_until: {id: "my_pleya.section[servers]", timeout: 15000}
  - wait_until: {focused: "my_pleya.section.tile[servers.servers_add]", timeout: 8000}
  - press: select
  - wait_until: {id: "my_pleya.section.content[add_connection]", timeout: 8000}
  - assert: {id: "my_pleya.section.tile[add_connection.plex]", focused: true, insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.jellyfin]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.pleya_server]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.local_folder]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.pleya_share]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.borrow]", insideViewport: true}
  - snapshot: 00-picker
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[add_connection.jellyfin]", timeout: 5000}
  - press: select
  - snapshot: 01-jellyfin-form
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[add_connection.jellyfin]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[add_connection.local_folder]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[add_connection.borrow]", timeout: 5000}
  - snapshot: 02-borrow-focused
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[servers.servers_add]", timeout: 8000}
  - snapshot: 03-back-on-add
