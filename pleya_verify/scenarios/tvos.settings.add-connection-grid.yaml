name: tvos.settings.add-connection-grid
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  # A-24c: Servers lives under Instellingen > Koppelingen; its row opens the
  # same TvServersPage Mijn Pleya opened before.
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 10000}
  - press: left
  - walk: {direction: down, steps: 6, stopAt: "settings.category[5]", timeout: 75000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[5]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.trackers]", timeout: 5000}
  - walk: {direction: down, steps: 12, stopAt: "my_pleya.section.tile[settings.servers]", timeout: 150000, settle: 400}
  - press: select
  - wait_until: {focused: "my_pleya.section.tile[servers.servers_add]", timeout: 15000}
  - press: select
  - wait_until: {id: "my_pleya.section.content[add_connection]", timeout: 8000}
  # TvNestedSurface places the entry focus a frame after the route mounts.
  - wait_until: {focused: "my_pleya.section.tile[add_connection.plex]", timeout: 5000}
  - assert: {id: "my_pleya.section.tile[add_connection.plex]", focused: true, insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.jellyfin]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.emby]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.pleya_server]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.local_folder]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.pleya_share]", insideViewport: true}
  - assert: {id: "my_pleya.section.tile[add_connection.borrow]", insideViewport: true}
  - snapshot: 00-picker
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[add_connection.jellyfin]", timeout: 5000}
  - press: select
  - snapshot: 01-jellyfin-form
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[add_connection.jellyfin]", timeout: 8000}
  - press: left
  - wait_until: {focused: "my_pleya.section.tile[add_connection.plex]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[add_connection.emby]", timeout: 5000}
  - press: select
  - snapshot: 01b-emby-form
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[add_connection.emby]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[add_connection.local_folder]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[add_connection.borrow]", timeout: 5000}
  - snapshot: 02-borrow-focused
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[servers.servers_add]", timeout: 8000}
  - snapshot: 03-back-on-add
