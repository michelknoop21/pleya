name: ios.settings.studio
target: ios-sim
# A-24 (Apple TV+ Studio on iOS, Michel's choice of 24 October 2026): the
# Instellingen main page and three sub-pages with the Studio header, in the
# app's default OLED theme, then Dark and Light, switched the way a viewer
# does it, on Weergave's theme row. Visual evidence for PR 1; the header's own
# assertions also live in ios.settings.northstar.
#
# Coordinates are iPhone SE points (375x667). The theme segments have no
# automation id of their own; the taps hit the segment labels of the theme
# row, the first row of Weergave's first card (Licht at x 148, Donker at x 226,
# y 340, read from the first run's screenshot). The back button is at (28, 48).
# After a scroll the run settles 2.5 s: iOS scroll physics keep a long
# ballistic tail, and a tap that lands in it only stops the scroll.
# The catalog.mixed.v1 fixture serves no backdrops, so the header shows its
# brand fallback here; the artwork path is covered by
# test/widgets/settings/settings_studio_header_test.dart.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 2000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1500
  - assert: {id: settings.header, insideViewport: true}
  - assert: {id: settings.header, above: "settings.tile[appearance]"}
  # ── oled ──
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - assert: {id: settings.header, insideViewport: true}
  - snapshot: 01-main-top-oled
  - drag: {startX: 187, startY: 520, endX: 187, endY: 320, durationMs: 700}
  - settle: 2500
  - snapshot: 02-main-scrolled-oled
  - assert: {id: "settings.tile[playback]", insideViewport: true, minimumTapTarget: 44}
  - tap: {id: "settings.tile[playback]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - snapshot: 03-afspelen-oled
  - drag: {startX: 187, startY: 560, endX: 187, endY: 160, durationMs: 450}
  - settle: 2500
  - snapshot: 04-afspelen-scrolled-oled
  - tap: {x: 28, y: 48}
  - settle: 1000
  - assert: {id: "settings.tile[language]", insideViewport: true}
  - tap: {id: "settings.tile[language]"}
  - settle: 1500
  - snapshot: 04b-taal-oled
  - tap: {x: 28, y: 48}
  - settle: 1000
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - snapshot: 05-weergave-oled
  - tap: {x: 28, y: 48}
  - settle: 1000
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - tap: {x: 226, y: 340}
  - settle: 1500
  - snapshot: 06-weergave-dark
  - tap: {x: 28, y: 48}
  - settle: 1000
  # ── dark ──
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - assert: {id: settings.header, insideViewport: true}
  - snapshot: 07-main-top-dark
  - drag: {startX: 187, startY: 520, endX: 187, endY: 320, durationMs: 700}
  - settle: 2500
  - snapshot: 08-main-scrolled-dark
  - assert: {id: "settings.tile[playback]", insideViewport: true, minimumTapTarget: 44}
  - tap: {id: "settings.tile[playback]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - snapshot: 09-afspelen-dark
  - drag: {startX: 187, startY: 560, endX: 187, endY: 160, durationMs: 450}
  - settle: 2500
  - snapshot: 10-afspelen-scrolled-dark
  - tap: {x: 28, y: 48}
  - settle: 1000
  - assert: {id: "settings.tile[language]", insideViewport: true}
  - tap: {id: "settings.tile[language]"}
  - settle: 1500
  - snapshot: 10b-taal-dark
  - tap: {x: 28, y: 48}
  - settle: 1000
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - tap: {x: 148, y: 340}
  - settle: 1500
  - snapshot: 11-weergave-light
  - tap: {x: 28, y: 48}
  - settle: 1000
  # ── light ──
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - assert: {id: settings.header, insideViewport: true}
  - snapshot: 12-main-top-light
  - drag: {startX: 187, startY: 520, endX: 187, endY: 320, durationMs: 700}
  - settle: 2500
  - snapshot: 13-main-scrolled-light
  - assert: {id: "settings.tile[playback]", insideViewport: true, minimumTapTarget: 44}
  - tap: {id: "settings.tile[playback]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - snapshot: 14-afspelen-light
  - drag: {startX: 187, startY: 560, endX: 187, endY: 160, durationMs: 450}
  - settle: 2500
  - snapshot: 15-afspelen-scrolled-light
  - tap: {x: 28, y: 48}
  - settle: 1000
  # Taal en ondertitels in light: the value rows with the shared label.
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - drag: {startX: 187, startY: 200, endX: 187, endY: 620, durationMs: 300}
  - settle: 2500
  - drag: {startX: 187, startY: 520, endX: 187, endY: 320, durationMs: 700}
  - settle: 2500
  - assert: {id: "settings.tile[language]", insideViewport: true}
  - tap: {id: "settings.tile[language]"}
  - wait_until: {id: settings.header, timeout: 8000}
  - settle: 1200
  - snapshot: 16-taal-light
