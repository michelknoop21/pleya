name: tvos.pleya.subtitles
target: tvos-sim
# Native D-pad HLS/sidecar/quality chain; output caps measured by Go/ffprobe.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: playback.app.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 20000}
  - settle: 1500
  - press: select
  - wait_until: {id: player.surface, state: {first_frame: true, external_subtitle_count: 2}, timeout: 25000}

  - press: select
  - settle: 400
  - assert: {id: player.play_pause, state: {playing: false}}
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - assert: {id: player.settings_button, focused: true}
  - press: right
  - settle: 250
  - assert: {id: player.tracks_button, focused: true}
  - press: select
  - wait_until: {id: player.panel, state: {tab: subtitles, subView: none}, timeout: 10000}
  - assert: {id: "player.panel.row[subtitle.off]", focused: true}
  - snapshot: subtitle-choices
  - press: down
  - settle: 200
  - press: down
  - settle: 200
  - assert: {id: "player.panel.row[subtitle.track.1]", focused: true}
  - press: select
  - wait_until: {id: player.surface, state: {first_frame: true, subtitle_title: "Pleya embedded"}, timeout: 15000}
  - wait_until: {id: "player.panel.row[subtitle.track.1]", state: {selected: true}, timeout: 10000}
  - settle: 1000
  - assert: {id: "player.panel.row[subtitle.track.1]", focused: true}
  - snapshot: embedded-selected
  - press: up
  - settle: 200
  - press: up
  - settle: 200
  - assert: {id: "player.panel.row[subtitle.off]", focused: true}
  - press: select
  - wait_until: {id: player.surface, state: {first_frame: true, subtitle_track_id: "no"}, timeout: 15000}
  - wait_until: {id: "player.panel.row[subtitle.off]", state: {selected: true}, timeout: 10000}
  - settle: 1000
  - assert: {id: "player.panel.row[subtitle.off]", focused: true}
  - assert: {id: "player.panel.row[subtitle.track.0]"}
  - assert: {id: "player.panel.row[subtitle.track.1]"}
  - snapshot: subtitle-off
  - press: menu
  - settle: 300
  - press: menu
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - snapshot: playback-stopped
