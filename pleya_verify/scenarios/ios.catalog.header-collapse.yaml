name: ios.catalog.header-collapse
target: ios-sim
# Alle films: the top menu (title row and chip row) folds away on scroll down
# and is back on any scroll up, even mid-list (A-06, decision Michel 20 Oct
# 2026). Reached through the landing's "Alle films" action, same as
# `ios.catalog.northstar`.
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.movies
steps:
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - tap: {id: "landing.view_all[movies]"}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 500
  - assert: {id: "catalog.header[movies]", insideViewport: true}
  - assert: {id: "catalog.chip.sources[movies]", insideViewport: true}
  - snapshot: catalog-top-shown
  # Scroll down: the menu folds away, the count line and the grid stay.
  - drag: {startX: 187, startY: 560, endX: 187, endY: 200, durationMs: 400}
  - settle: 800
  - snapshot: catalog-top-hidden
  - assert: {id: "catalog.count[movies]", insideViewport: true}
  # A short scroll up mid-list brings it back.
  - drag: {startX: 187, startY: 300, endX: 187, endY: 380, durationMs: 400}
  - settle: 800
  - assert: {id: "catalog.header[movies]", insideViewport: true}
  - assert: {id: "catalog.chip.sources[movies]", insideViewport: true}
  - snapshot: catalog-top-back-mid-list
