name: ios.player.sheets-after-handoff
target: ios-sim
# A sheet opened after the Pleya Fly picker was dismissed (A-23). The picker
# closes while it still searches; the settings sheet that follows must build
# its own content instead of a framework assertion.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 2000
  - tap: {id: nav.movies}
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - tap: {id: "landing.rail.item[movies.0.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 1500
  - tap: {id: media-detail.play}
  - settle: 4000
  - wait_until: {id: player.play_pause, timeout: 25000}
  - tap: {id: player.play_pause}
  - settle: 500
  - assert: {id: player.play_pause, state: {playing: false}}
  - assert: {id: player.handoff_button, insideViewport: true}
  - tap: {id: player.handoff_button}
  - settle: 1500
  - snapshot: handoff-searching
  # Close through the barrier while the search still runs.
  - tap: {x: 40, y: 40}
  - settle: 2500
  - assert: {id: player.settings_button, insideViewport: true}
  - tap: {id: player.settings_button}
  - settle: 1500
  - snapshot: settings-after-handoff
