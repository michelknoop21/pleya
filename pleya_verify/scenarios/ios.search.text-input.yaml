name: ios.search.text-input
target: ios-sim
# Proves the /v1/input/text endpoint end-to-end (I4, docs/ios-unified-
# implementation-register.md rij 05): typing a real query through the
# transport — not a widget test — has to surface a matching result.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  # Same settle ios.home.northstar.yaml uses past IntroGate/cold-start: the
  # search tab is `onlineOnly`, and tapping it before the offline check
  # resolves silently no-ops (`_selectTab` filters it out of visible tabs).
  - settle: 3500
  - assert: {id: home.header.search, insideViewport: true}
  - tap: {id: home.header.search}
  - settle: 800
  - type: "aurora"
  - wait_until: {id: "search.results.section[movies]", timeout: 10000}
  - assert: {id: "search.results.section[movies]", insideViewport: true}
  - snapshot: search-text-input
