name: ios.pleya.start-position
target: ios-sim
# DEC-XXX (startpositie in het afspeelplan): a converted film resumes at 70 s. The
# fixture starts its HLS at the segment holding 70 s, whose timestamps begin at
# 60.186 s; mpv keeps them (rebase-start-time=no) and opens at 70 s title time.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: playback.app.v1
  - seed: playback.start-position.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 20000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 2000
  - tap: {id: "home.rail.item[0.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 1000
  - tap: {id: media-detail.play}
  - wait_until: {id: player.play_pause, timeout: 25000}
  - wait_until: {id: player.surface, state: {first_frame: true}, timeout: 15000}
  - tap: {id: player.play_pause}
  - settle: 500
  - assert: {id: player.play_pause, state: {playing: false}}
  - assert: {id: player.surface, state: {first_frame: true, position_10s: 7}}
  - snapshot: resumed-converted-at-70s
