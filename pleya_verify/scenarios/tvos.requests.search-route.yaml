name: tvos.requests.search-route
target: tvos-sim
# REQ-SEARCH-ROUTE (docs/tvos-fysieke-correctieronde.md): on Aanvragen the
# search field got the desktop callbacks. DOWN asked for focus nodes TV never
# builds and still reported the key as handled, UP had no handler, UP out of
# the content skipped the field, and Menu on an empty field jumped to the top
# navigation instead of closing Aanvragen.
#
# This walks the route the fix gives it, one press at a time, and asserts the
# focus after every press: field, first content, field, top navigation, field,
# inbox, field, and Menu on the empty field back to the Mijn Pleya tile.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requests.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500

  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}

  # With Seerr configured the content group carries Aanvragen, its only tile
  # on this fixture: DOWN from the profile control lands on it.
  - press: down
  - wait_until: {focused: "my_pleya.tile[requests]", timeout: 5000}
  - snapshot: 00-hub
  - press: select
  - wait_until: {id: seerr.search.field, timeout: 15000}
  - settle: 2500
  - snapshot: 01-requests-opened

  # Put the remote on the field from the top navigation side, the way a
  # viewer arrives: UP from the content reaches the field first.
  - press: down
  - settle: 500
  - press: up
  - settle: 500
  - press: up
  - wait_until: {focused: seerr.search.field, timeout: 5000}
  - snapshot: 02-field-focused

  # DOWN from the field: into the content, off the field.
  - press: down
  - settle: 500
  - assert: {id: seerr.search.field, focused: false}
  - assert: {id: seerr.search.inbox, focused: false}
  - snapshot: 03-content-after-down

  # UP back to the field (through the first shelf's heading action).
  - press: up
  - settle: 300
  - press: up
  - wait_until: {focused: seerr.search.field, timeout: 5000}

  # UP from the field: the top navigation, and DOWN returns to the field.
  - press: up
  - settle: 500
  - assert: {id: seerr.search.field, focused: false}
  - snapshot: 04-topnav-after-up
  - press: down
  - wait_until: {focused: seerr.search.field, timeout: 5000}

  # RIGHT to the inbox button and LEFT back.
  - press: right
  - wait_until: {focused: seerr.search.inbox, timeout: 5000}
  - snapshot: 05-inbox-focused
  - press: left
  - wait_until: {focused: seerr.search.field, timeout: 5000}

  # Menu on the empty field closes Aanvragen instead of jumping to the bar.
  - press: menu
  - wait_until: {focused: "my_pleya.tile[requests]", timeout: 8000}
  - snapshot: 06-menu-closed-requests
