name: tvos.carousel.leading-anchor
target: tvos-sim
# CAROUSEL-LEFT1 / Roadmap A-06.
setup:
  - reset_app
  - seed: catalog.long-rails.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - settle: 500
  - press: right
  - settle: 800
  - press: select
  - wait_until: {id: "discover.rail[0]", timeout: 20000}
  - settle: 2000
  - press: down
  - settle: 800
  - press: down
  - settle: 1000
  - assert: {id: "discover.rail.item[0.0]", focused: true}
  - assert: {id: "discover.rail[0]", state: {selected_index: 0, anchored: true}}
  - snapshot: 00-films-begin
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - settle: 800
  - assert: {id: "discover.rail.item[0.5]", focused: true, insideViewport: true}
  - assert: {id: "discover.rail[0]", state: {selected_index: 5, anchored: true}}
  - snapshot: 01-films-middle
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - press: right
  - settle: 250
  - settle: 800
  - assert: {id: "discover.rail.item[0.11]", focused: true, insideViewport: true}
  - assert: {id: "discover.rail[0]", state: {selected_index: 11, anchored: true}}
  - snapshot: 02-films-end
  - press: right
  - settle: 500
  - assert: {id: "discover.rail.item[0.11]", focused: true}
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 1000
  - press: menu
  - wait_until: {focused: "discover.rail.item[0.11]", timeout: 10000}
  - settle: 1000
  - assert: {id: "discover.rail[0]", state: {selected_index: 11, anchored: true}}
  - snapshot: 03-films-return
  - press: left
  - press: right
  - press: left
  - press: right
  - press: left
  - press: right
  - press: left
  - press: right
  - press: left
  - press: right
  - settle: 800
  - assert: {id: "discover.rail[0]", state: {selected_index: 11, anchored: true}}
  - snapshot: 04-films-fast
