name: tvos.continue-watching.overview-more-info
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.continue-watching.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}
  - press: right
  - wait_until: {focused: "discover.rail.item[0.1]", timeout: 5000}
  - snapshot: 00-view-all-focused
  - press: select
  - settle: 800
  - snapshot: 00-overview-entry
  - wait_until: {id: "tv.catalog.grid[continueWatchingAll.resumeShows]", timeout: 10000}
  - wait_until: {focused: "tv.catalog.grid.item[continueWatchingAll.resumeShows.0]", timeout: 5000}
  - snapshot: 01-overview-card
  - press: {key: select, holdMs: 900}
  - wait_until: {id: sheet.context_menu, timeout: 5000}
  - assert: {id: player.surface, present: false}
  - snapshot: 02-overview-menu
  - press: down
  - press: down
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {id: media-detail.episode-list, state: {child_count: 3}, timeout: 10000}
  - assert: {id: player.surface, present: false}
  - snapshot: 03-overview-series-details
  - press: menu
  - wait_until: {focused: "tv.catalog.grid.item[continueWatchingAll.resumeShows.0]", timeout: 5000}
  - snapshot: 04-overview-return
  - press: select
  - wait_until: {id: player.surface, timeout: 30000}
  - snapshot: 05-overview-short-select-player
  - press: menu
  - wait_until: {focused: "tv.catalog.grid.item[continueWatchingAll.resumeShows.0]", timeout: 10000}
  - snapshot: 06-overview-player-return
