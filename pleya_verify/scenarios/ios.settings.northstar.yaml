name: ios.settings.northstar
target: ios-sim
# The iPhone Instellingen list (northstar 14, iOS Unified 2026 workitem 8
# (I7), docs/unified-2026-closure.md §5 row 8, register row 14), against
# `docs/assets/ios-unified/northstar/14-instellingen.png`. Reached the way a
# user does: Home, tap `nav.myPleya`, then tap the Instellingen row on My
# Pleya (`my_pleya.tile[settings]`). `screen.settings` and `settings.tile`
# did not exist before this scenario: the main settings list had zero
# automation coverage until now (only its destination sub-screens had ids).
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 2000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  # A-24b: Instellingen sits in the Pleya group below Big P now; scroll it up.
  - drag: {startX: 187, startY: 500, endX: 187, endY: 150, durationMs: 400}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  # A-24: the Studio header opens the page, above the search field and the
  # first card, and the first row still clears the 44 pt tap target.
  - assert: {id: settings.header, insideViewport: true}
  - assert: {id: settings.header, above: "settings.tile[appearance]"}
  - assert: {id: "settings.tile[appearance]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: settings-top
  # Exercise the real gesture pipeline instead of stopping at the first
  # viewport. The Servers row is near the bottom of this long settings list.
  - drag: {startX: 187, startY: 580, endX: 187, endY: 160, durationMs: 450}
  - settle: 500
  # A-24: the Studio rows are shorter (52/68 pt) than before, so the second
  # drag is a short, slow one; two full flings carried Servers past the top.
  - drag: {startX: 187, startY: 580, endX: 187, endY: 400, durationMs: 900}
  - settle: 500
  - snapshot: settings-bottom
  - assert: {id: "settings.tile[servers]", insideViewport: true, minimumTapTarget: 44}
