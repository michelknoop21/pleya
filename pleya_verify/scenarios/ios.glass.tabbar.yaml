name: ios.glass.tabbar
target: ios-sim
# The floating Liquid Glass tab bar on the iPhone (mockup LG-01, Liquid Glass
# Task 5). Reached the way a user turns it on: Home, My Pleya, Instellingen,
# Uiterlijk, the Liquid Glass switch (`SettingSwitchTile` registers every
# switch as `my_pleya.section.tile[setting.<pref key>]`), back to Settings
# and then Home through the bar. The snapshot is the evidence the glass
# renders; the asserts pin that the bar is still there and still tappable.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 2000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: "my_pleya.section.tile[setting.liquid_glass]", timeout: 10000}
  - settle: 500
  - assert: {id: "my_pleya.section.tile[setting.liquid_glass]", state: {value: false}}
  - tap: {id: "my_pleya.section.tile[setting.liquid_glass]"}
  - settle: 500
  - assert: {id: "my_pleya.section.tile[setting.liquid_glass]", state: {value: true}}
  # Back to Settings through the app bar's back arrow. There is no id on
  # that arrow, and `press: menu` (Escape) does not pop a route on iOS, so
  # this is the arrow's point on a 402-wide iPhone (17 Pro); Settings is a
  # tab root, so the bar is visible again.
  - tap: {x: 28, y: 90}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  - tap: {id: nav.discover}
  - wait_until: {id: screen.discover, timeout: 10000}
  - settle: 2000
  - assert: {id: nav.bar, insideViewport: true}
  # nav.<tab> sits on the 24 pt glyph (Task 4), so no tap-target check here.
  - assert: {id: nav.discover, insideViewport: true}
  - assert: {id: home.header.search, insideViewport: true, minimumTapTarget: 44}
  - snapshot: glass-tabbar
