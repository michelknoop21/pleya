name: ios.library.crown-list
target: ios-sim
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 4000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  # A-24b: Instellingen sits in the Pleya group below Big P now; scroll it up.
  - drag: {startX: 187, startY: 500, endX: 187, endY: 150, durationMs: 400}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.tile[appearance]"}
  - settle: 1000
  - snapshot: appearance-view-mode
  # A-24b: Raster- of lijstweergave is a value row with a picker.
  - tap: {id: "my_pleya.section.tile[setting.view_mode]"}
  - settle: 800
  - tap: {id: "settings.choice.option[1]"}
  - settle: 800
  - snapshot: appearance-list-selected
  - tap: {id: settings.back}
  - settle: 1000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[libraries]"}
  - wait_until: {id: screen.library_picker, timeout: 10000}
  - settle: 1000
  - tap: {id: "library.picker.card[0]"}
  - wait_until: {id: screen.libraries, timeout: 15000}
  - settle: 1000
  - tap: {x: 185, y: 110}
  - wait_until: {id: library.grid, timeout: 10000}
  - settle: 1000
  - assert: {id: library.grid, state: {view_mode: list}}
  - wait_until: {id: overlay.scroll_crown, timeout: 5000}
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {motion_model: position-direct-v3, gear_height: 96}}
  - snapshot: list-crown-ready
  - drag: {startX: 354, startY: 400, endX: 354, endY: 403, durationMs: 600}
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {visible: true, at_start: false}}
  - snapshot: list-crown-active
  - drag: {startX: 354, startY: 240, endX: 354, endY: 640, durationMs: 1000}
  - settle: 300
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {at_end: true}}
  - snapshot: list-crown-end
  - drag: {startX: 354, startY: 640, endX: 354, endY: 100, durationMs: 1000}
  - settle: 300
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {at_start: true}}
  - snapshot: list-crown-start
