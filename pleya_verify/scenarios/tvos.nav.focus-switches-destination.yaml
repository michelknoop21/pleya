name: tvos.nav.focus-switches-destination
target: tvos-sim
# The name is historical. From 2 September 2026 to A-24c focus on a top-nav
# item was the navigation; LEESMIJ-v4 (A-24c, review 557-I4) reverses that for
# every destination: "Over een andere bestemming focussen verandert de actieve
# pagina niet". The ring moves, the page stays, Select changes the page and
# keeps the remote on the pill, DOWN goes into the page that is on screen.
# The file keeps its name because the Verify MCP tests and the agent guide
# point at it.
#
# `active` is the pill's own white-capsule flag, published by
# `TvTopNavigation` as automation state, so "Home is the page you are on" is
# asserted separately from "Films is where the ring is". Asserting only focus
# would pass on the 2 September behaviour too.
#
# Every assertion here is on a real HID press. The fast walk at the end
# presses with nothing in between: the ring has to end on the last item and
# the page must not have moved at all.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500

  - assert: {id: nav.discover, focused: true, state: {active: true}}
  - snapshot: 00-home

  # --- RIGHT walks the ring; Home stays on screen --------------------------
  - press: right
  - wait_until: {focused: nav.series, timeout: 5000}
  - settle: 400
  - assert: {id: nav.series, focused: true, state: {active: false}}
  - assert: {id: nav.discover, state: {active: true}}
  - snapshot: 01-ring-on-series

  - press: right
  - wait_until: {focused: nav.movies, timeout: 5000}
  - settle: 400
  - assert: {id: nav.movies, focused: true, state: {active: false}}
  - assert: {id: nav.discover, state: {active: true}}

  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - settle: 400
  - assert: {id: nav.myPleya, focused: true, state: {active: false}}
  - assert: {id: nav.discover, state: {active: true}}
  - assert: {id: screen.discover}
  - snapshot: 02-ring-on-my-pleya

  # --- Select changes the page and keeps the remote on the pill -------------
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - settle: 400
  - assert: {id: nav.myPleya, focused: true, state: {active: true}}
  - assert: {id: nav.discover, state: {active: false}}
  - snapshot: 03-my-pleya

  # Instellingen follows the same rule as every other pill (A13).
  - press: right
  - wait_until: {focused: nav.settings, timeout: 5000}
  - settle: 400
  - assert: {id: nav.settings, focused: true, state: {active: false}}
  - assert: {id: nav.myPleya, state: {active: true}}
  - assert: {id: screen.my_pleya}
  - snapshot: 03b-settings-ring

  # --- DOWN goes into the page on screen ------------------------------------
  # From the Instellingen ring the page is still Mijn Pleya: Big P, then the
  # first tile of the Snel naar dock.
  - press: down
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[watchTogether]", timeout: 8000}
  - assert: {id: nav.myPleya, state: {active: true}}
  - snapshot: 04-content-focused

  # --- UP comes back to the pill of the page on screen ----------------------
  - press: up
  - press: up
  - wait_until: {focused: nav.myPleya, timeout: 8000}
  - settle: 400
  - assert: {id: nav.myPleya, focused: true, state: {active: true}}
  - snapshot: 05-back-on-nav

  # --- LEFT walks back to Search, and Mijn Pleya stays ----------------------
  # Landing on Search must not let the text field claim the remote.
  - press: left
  - press: left
  - press: left
  - wait_until: {focused: nav.discover, timeout: 8000}
  - settle: 400
  - assert: {id: nav.discover, focused: true, state: {active: false}}
  - press: left
  - wait_until: {focused: nav.search, timeout: 8000}
  - settle: 400
  - assert: {id: nav.search, focused: true, state: {active: false}}
  - assert: {id: nav.myPleya, state: {active: true}}
  - assert: {id: screen.my_pleya}
  - snapshot: 06-search-ring-my-pleya-on-screen

  # --- The fast walk: three presses with nothing in between ----------------
  - press: right
  - wait_until: {focused: nav.discover, timeout: 8000}
  - settle: 1200
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 8000}
  - settle: 1500
  - assert: {id: nav.myPleya, focused: true, state: {active: true}}
  - assert: {id: nav.movies, state: {active: false}}
  - assert: {id: nav.series, state: {active: false}}
  - assert: {id: nav.discover, state: {active: false}}
  - assert: {id: screen.my_pleya}
  - snapshot: 07-fast-walk
