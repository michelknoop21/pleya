name: ios.media-detail.phone-movie
target: ios-sim
# I6 (docs/unified-2026-closure.md rij 5, mockup 06-film-detail.png): proves
# the phone-only detail layout actually mounts for a movie — a plain 16:9
# preview image, title/metadata/actions as normal page content, no crash.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3500
  - tap: {id: home.header.search}
  - settle: 800
  - type: "aurora"
  - wait_until: {id: "search.results.section[movies]", timeout: 10000}
  - tap: {id: "search.results.item[movies.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 2000
  - snapshot: phone-movie-detail
