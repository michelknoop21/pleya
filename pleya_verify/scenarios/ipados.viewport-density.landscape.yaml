name: ipados.viewport-density.landscape
target: ios-sim
# The Verify app requests landscape through iOS; assert_viewport prevents a
# platform-channel acknowledgement from silently passing as a rotation.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 20000}
  - wait_until: {id: discover.continue_watching, timeout: 20000}
  - settle: 3500
  - configure_view: {orientation: landscapeLeft}
  - assert_viewport: {orientation: landscape}
  # The billboard takes the landing here and the first rail peeks under it, as
  # on tvOS (A-17): under the hero, with its top edge on screen above the bar.
  - wait_until: {id: discover.hero, timeout: 5000}
  - assert: {id: discover.continue_watching, below: discover.hero, peeksAbove: nav.bar}
  - assert: {id: nav.bar, insideViewport: true}
  - assert: {id: nav.search, insideViewport: true}
  - snapshot: home-landscape
