name: discover.hero.layout
target: ios-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - assert: {id: discover.hero}
  # IntroGate's cold-start splash overlay (~2.8s) paints on top of an
  # already-ready DiscoverScreen — it has no automation id, so no
  # wait_until can see it finish; settle past it before the screenshot.
  - settle: 3500
  - snapshot: discover-hero

