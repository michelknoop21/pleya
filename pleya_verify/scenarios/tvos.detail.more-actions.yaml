name: tvos.detail.more-actions
target: tvos-sim
# Meer acties on TvDetailPage (northstar 12 of 2026-10-30).
#
# What this proves:
#   1. the ⋮ on the row opens the panel down the right side over the dimmed page,
#      the white pill on Audiostream;
#   2. the rows carry their value, and the focus does not leave the panel: LEFT
#      and RIGHT stay on the row;
#   3. a track opens as a page in the panel, a pick lands back on the row with
#      the new value;
#   4. Menu closes the panel and the ring is back on the ⋮.
setup:
  - reset_app
  - seed: catalog.detail-movie.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}

  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {focused: media-detail.play, timeout: 8000}
  - settle: 2500

  # Pill, restart, watchlist or rate, ... up to the ⋮ at the end of the row.
  - press: right
  - settle: 500
  - press: right
  - settle: 500
  - press: right
  - settle: 500
  - press: right
  - settle: 500
  - press: right
  - settle: 500
  - press: right
  - settle: 500
  - wait_until: {focused: "media-detail.action[more]", timeout: 3000}

  - press: select
  - wait_until: {id: media-detail.action-panel, timeout: 4000}
  - settle: 900
  - assert: {id: "media-detail.action-panel.row[audio]", focused: true}
  - assert: {id: "media-detail.action-panel.row[audio]", insideViewport: true}
  - snapshot: 12-panel

  - press: left
  - settle: 400
  - assert: {id: "media-detail.action-panel.row[audio]", focused: true}
  - press: right
  - settle: 400
  - assert: {id: "media-detail.action-panel.row[audio]", focused: true}

  - press: down
  - settle: 500
  - assert: {id: "media-detail.action-panel.row[subtitles]", focused: true}
  - snapshot: 12-subtitles-row

  - press: up
  - settle: 500
  - press: select
  - settle: 900
  - assert: {id: "media-detail.action-panel.row[track_0]", focused: true}
  - snapshot: 12-audio-page

  - press: down
  - settle: 500
  - press: select
  - settle: 1200
  - assert: {id: "media-detail.action-panel.row[audio]", focused: true}
  - assert: {id: "media-detail.action-panel.row[audio]", state: {value: "Dutch (AAC Stereo)"}}
  - snapshot: 12-audio-picked

  - press: menu
  - settle: 900
  - assert: {id: "media-detail.action[more]", focused: true}
  - snapshot: 12-closed
