name: tvos.server.status
target: tvos-sim
# TVUX-56: Select is informational; Select on default Close returns to the source tile.
# A-24c: reached through Instellingen > Koppelingen > Servers.
# Synthetic srv-1 only. This does not accept real disconnect or local-source removal.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  # A-24c: Servers lives under Instellingen > Koppelingen; its row opens the
  # same TvServersPage Mijn Pleya opened before.
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 10000}
  - press: left
  - walk: {direction: down, steps: 6, stopAt: "settings.category[5]", timeout: 75000, settle: 400}
  - press: select
  - wait_until: {id: "settings.category[5]", state: {selected: true}, timeout: 5000}
  - press: right
  - wait_until: {focused: "my_pleya.section.tile[settings.trackers]", timeout: 5000}
  - walk: {direction: down, steps: 12, stopAt: "my_pleya.section.tile[settings.servers]", timeout: 150000, settle: 400}
  - snapshot: 00-tile-focused

  - press: select
  - wait_until: {focused: "my_pleya.section.tile[servers.servers_add]", timeout: 15000}
  - snapshot: 01-opened

  - press: down
  - assert: {id: "my_pleya.section.tile[servers.servers_server_srv-1]", focused: true}
  - press: select
  - wait_until: {id: server.status, timeout: 5000}
  - assert: {id: server.status, insideViewport: true}
  - snapshot: 02-status-default-close
  - press: select
  - settle: 500
  - assert: {id: server.status, present: false}
  - assert: {id: "my_pleya.section.tile[servers.servers_server_srv-1]", focused: true}
  - snapshot: 03-closed-returned
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[settings.servers]", timeout: 8000}
