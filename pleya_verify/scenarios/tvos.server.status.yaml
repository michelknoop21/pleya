name: tvos.server.status
target: tvos-sim
# TVUX-56: Select is informational; Select on default Close returns to the source tile.
# Synthetic srv-1 only. This does not accept real disconnect or local-source removal.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: right
  - assert: {id: "my_pleya.tile[servers]", focused: true}
  - snapshot: 00-tile-focused

  - press: select
  - wait_until: {id: "my_pleya.section[servers]", timeout: 15000}
  - snapshot: 01-opened

  - press: down
  - assert: {id: "my_pleya.section.tile[servers.servers_server_srv-1]", focused: true}
  - press: select
  - wait_until: {id: server.status, timeout: 5000}
  - assert: {id: server.status, insideViewport: true}
  - snapshot: 02-status-default-close
  - press: select
  - settle: 500
  - assert: {id: server.status, present: false}
  - assert: {id: "my_pleya.section.tile[servers.servers_server_srv-1]", focused: true}
  - snapshot: 03-closed-returned
  - press: menu
  - wait_until: {focused: "my_pleya.tile[servers]", timeout: 8000}
