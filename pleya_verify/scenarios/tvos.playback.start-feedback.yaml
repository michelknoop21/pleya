name: tvos.playback.start-feedback
target: tvos-sim
# A-11/A-12, TVUX-10/21. Fixture-only delayed preparation; no hardware claim.
# reset_app starts the notice sequence at zero; no fixture login notice precedes it.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 20000}
  - settle: 1500
  - assert: {id: media-detail.play, focused: true}
  - fixture_mutate: {op: latency, ms: 12000, count: 1}
  - press: select
  - wait_until: {id: "notice.busy[notice-0]", timeout: 5000}
  - assert: {id: "notice.busy[notice-0]", insideViewport: true, state: {busy: true}}
  - assert: {id: media-detail.play, focused: true}
  - snapshot: 01-starting-focus-preserved
  - press: select
  - assert: {id: "notice.busy[notice-0]", insideViewport: true, state: {busy: true}}
  - wait_until: {id: player.surface, timeout: 30000}
  - assert: {id: "notice.busy[notice-0]", present: false}
  - snapshot: 02-player-mounted
