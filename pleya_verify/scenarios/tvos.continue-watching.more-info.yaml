name: tvos.continue-watching.more-info
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.continue-watching.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}
  - press: {key: select, holdMs: 900}
  - wait_until: {id: sheet.context_menu, timeout: 5000}
  - snapshot: 01-held-select-menu
  - assert: {id: player.surface, present: false}
  - press: down
  - press: down
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  # A one-season show intentionally has no season-chip row.
  - wait_until: {id: media-detail.episode-list, state: {child_count: 3}, timeout: 10000}
  - assert: {id: player.surface, present: false}
  - snapshot: 02-series-details
  - press: menu
  - wait_until: {focused: "discover.rail.item[0.0]", timeout: 5000}
  - snapshot: 03-return-to-card
  # A fresh short press after returning still starts ordinary playback.
  - press: select
  - wait_until: {id: player.surface, timeout: 30000}
  - snapshot: 04-short-select-player
  - press: menu
  - wait_until: {focused: "discover.rail.item[0.0]", timeout: 10000}
  - snapshot: 05-player-return
