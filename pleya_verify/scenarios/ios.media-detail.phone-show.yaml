name: ios.media-detail.phone-show
target: ios-sim
# I6 (docs/unified-2026-closure.md rij 5, mockup 07-serie-afleveringen.png):
# proves the phone-only series tabs (Afleveringen/Vergelijkbaar/Extra's/
# Details) mount for a show and the episode list renders under the default
# Afleveringen tab.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3500
  - tap: {id: home.header.search}
  - settle: 800
  - type: "driftwood"
  - wait_until: {id: "search.results.section[shows]", timeout: 10000}
  - tap: {id: "search.results.item[shows.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 2000
  - snapshot: phone-show-detail
