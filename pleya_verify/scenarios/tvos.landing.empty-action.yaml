name: tvos.landing.empty-action
target: tvos-sim
# LAND6: an empty Films landing does not strand the remote. With no hubs to
# show, the landing's message carries one action, "Alle films", which is
# focused and opens the complete catalog inside the shell.
#
# `catalog.empty.v1` gives the server no libraries and no items, so there are
# no hubs; the catalog behind the action is empty too, which is its own state
# (`tv.catalog.state[movies.empty]`), not a failure.
setup:
  - reset_app
  - seed: catalog.empty.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series, nav.movies], timeout: 40000, settle: 800}
  - press: select
  - wait_until: {id: "tv.catalog.state[movies.landing_empty]", timeout: 15000}
  - settle: 1500
  - snapshot: 00-empty-landing
  - press: down
  - wait_until: {focused: "tv.catalog.state[movies.landing_empty]", timeout: 5000}
  - snapshot: 01-action-focused
  - press: select
  - wait_until: {id: "tv.catalog.state[movies.empty]", timeout: 15000}
  - assert: {id: nav.movies, state: {active: true}}
  - settle: 1500
  - snapshot: 02-all-movies
