name: tvos.settings.appearance-categories
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - press: down
  - press: down
  - wait_until: {focused: "my_pleya.tile[settings]", timeout: 5000}
  - press: select
  - wait_until: {id: "my_pleya.section[settings]", timeout: 15000}
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - press: select
  - wait_until: {id: "my_pleya.section.content[appearance]", timeout: 8000}
  - assert: {id: "settings.appearance.category[0]", insideViewport: true, state: {selected: true}}
  - snapshot: 00-display
  - press: down
  - wait_until: {focused: "settings.appearance.category[1]", timeout: 8000}
  - press: select
  - assert: {id: "settings.appearance.category[1]", state: {selected: true}}
  - snapshot: 01-home
  - press: right
  - assert: {id: "settings.appearance.category[1]", focused: false}
  - snapshot: 02-home-control-focus
  - press: menu
  - wait_until: {focused: "my_pleya.section.tile[settings.appearance]", timeout: 8000}
  - snapshot: 03-back-on-tile
