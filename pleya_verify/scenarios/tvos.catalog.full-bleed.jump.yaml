name: tvos.catalog.full-bleed.jump
target: tvos-sim
# A-06c: Spring naar on 500 titles, and the price of a press on a wall that
# size. `catalog.alphabet-500.v1` has twenty films per letter from A to Y.
#
# The measurement is the tight `wait_until` after each press: the grid builds
# every card it has loaded, so 500 mounted cards is where a D-pad press would
# start to lag. The bundle's `duration_ms` per run and `focus-trace.json` carry
# the numbers.
setup:
  - reset_app
  - seed: catalog.alphabet-500.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series, nav.movies], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  # A-24c (LEESMIJ-v4): Select changed the page and left the remote on
  # the pill; Down takes it to the landing.
  - press: down
  - settle: 1500
  - press: select
  - wait_until: {id: "tv.catalog.grid[movies]", timeout: 20000}
  # Eager loading reads the whole catalog behind the first page.
  - wait_until: {id: "tv.catalog.grid.item[movies.0]", state: {title: A 01}, timeout: 20000}
  - wait_until: {id: "tv.catalog.grid.item[movies.499]", timeout: 60000}
  - snapshot: 00-all-loaded

  - press: down
  - wait_until: {focused: "tv.catalog.grid.item[movies.6]", timeout: 1500}
  - press: down
  - wait_until: {focused: "tv.catalog.grid.item[movies.12]", timeout: 1500}
  - press: down
  - wait_until: {focused: "tv.catalog.grid.item[movies.18]", timeout: 1500}
  - press: right
  - wait_until: {focused: "tv.catalog.grid.item[movies.19]", timeout: 1500}
  - press: up
  - wait_until: {focused: "tv.catalog.grid.item[movies.13]", timeout: 1500}
  - settle: 500
  - snapshot: 01-after-presses

  # Open the panel, down to Spring naar, down the letters to M.
  - press: up
  - settle: 400
  - press: up
  - settle: 400
  - press: left
  - settle: 300
  - press: left
  - settle: 800
  - assert: {id: "tv.catalog.rail.row[movies.sources]", focused: true}
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - press: down
  - settle: 400
  - assert: {id: "tv.catalog.rail.row[movies.jump]", focused: true}
  - press: select
  - settle: 800
  - assert: {id: "tv.catalog.rail.row[movies.jump.#]", focused: true}
  - press: down
  - settle: 300
  - press: down
  - settle: 300
  - assert: {id: "tv.catalog.rail.row[movies.jump.B]", focused: true}
  - snapshot: 02-letters
  - press: select
  - settle: 2000
  - assert: {id: "tv.catalog.rail[movies]", present: false}
  - assert: {id: "tv.catalog.grid.item[movies.20]", focused: true, insideViewport: true, state: {title: B 01}}
  - snapshot: 03-landed-on-b
