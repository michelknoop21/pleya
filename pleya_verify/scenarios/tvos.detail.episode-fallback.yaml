name: tvos.detail.episode-fallback
target: tvos-sim
# A season row on TvDetailPage where episodes 3 and 4 have no still of their
# own, the way a Pleya Server episode looks before the metadata round found one
# (S22.4, catalog.detail-series.no-stills.v1).
#
# What this proves:
#   1. an episode with a still keeps it (`artwork: own`);
#   2. an episode without one draws the show's art instead of an empty tile
#      (`artwork: fallback`), read from the same path the card renders;
#   3. focus walks onto that card and it sits in view.
setup:
  - reset_app
  - seed: catalog.detail-series.no-stills.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}

  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {focused: "media-detail.tab[series]", timeout: 8000}
  - settle: 2000

  - press: right
  - settle: 1000
  - press: right
  - settle: 1500
  - wait_until: {id: media-detail.tabs, state: {open: "1"}, timeout: 5000}
  - wait_until: {id: "media-detail.section[episodes]", state: {child_count: 5}, timeout: 8000}
  - assert: {id: "media-detail.section.item[episodes.1]", state: {artwork: own}}
  - assert: {id: "media-detail.section.item[episodes.2]", state: {artwork: own}}
  - assert: {id: "media-detail.section.item[episodes.3]", state: {artwork: fallback}}
  - assert: {id: "media-detail.section.item[episodes.4]", state: {artwork: fallback}}

  - press: down
  - settle: 1200
  - press: right
  - settle: 800
  - press: right
  - settle: 800
  - press: right
  - settle: 1500
  - assert: {id: "media-detail.section.item[episodes.3]", focused: true}
  - assert: {id: "media-detail.section.item[episodes.3]", insideViewport: true}
  - snapshot: 01-episode-without-still
