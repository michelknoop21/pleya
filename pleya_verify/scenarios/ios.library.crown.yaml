name: ios.library.crown
target: ios-sim
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 4000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[libraries]"}
  - wait_until: {id: screen.library_picker, timeout: 10000}
  - settle: 1000
  - tap: {id: "library.picker.card[0]"}
  - wait_until: {id: screen.libraries, timeout: 15000}
  - settle: 4000
  - tap: {x: 185, y: 110}
  - wait_until: {id: library.grid, timeout: 10000}
  - settle: 1000
  - assert: {id: library.grid, state: {view_mode: grid}}
  - wait_until: {id: overlay.scroll_crown, timeout: 5000}
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {motion_model: fixed-wheel-v1, fixed: true, gear_height: 96}}
  - snapshot: grid-crown-ready
  - drag: {startX: 354, startY: 333, endX: 354, endY: 336, durationMs: 600}
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {visible: true, at_start: false}}
  - snapshot: grid-crown-active
  - drag: {startX: 354, startY: 333, endX: 354, endY: 343, durationMs: 1000}
  - settle: 300
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {at_start: false, at_end: false, fixed: true}}
  - snapshot: grid-crown-turned
  - drag: {startX: 354, startY: 333, endX: 354, endY: 303, durationMs: 1000}
  - settle: 300
  - assert: {id: overlay.scroll_crown, leftInset: 331, state: {at_start: true}}
  - snapshot: grid-crown-start
