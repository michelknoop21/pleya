name: tvos.nav.held-press-lands-once
target: tvos-sim
# NAV1 app-side acceptance: a held HID key must not cause an enable message
# while HardwareKeyboard still reports that key down. Check parkedFlushes and
# enablesSentWhileKeysHeld, as documented in tvos-remote-press-pipeline.md.
# Installed idb uses keyboard HID in the simulator. It does NOT reach the
# swizzled physical UIPress hook, synthesizedPressedKeys or the engine repeat
# timer. Passing this scenario proves the app-side contract, not a physical
# Siri Remote/engine re-tap fix. No Bluetooth or touch-surface claim.
# The immediate-send negative control is detected by enablesSentWhileKeysHeld,
# independently of whether this synthetic input route produces a second step.
# 250ms holds exercise separate down/up phases without claiming engine repeats.
# DEC-194: the ring on a pill is the page again, so every held landing on
# Home raises the passthrough on its own; no Select is needed.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - assert: {id: nav.discover, focused: true, state: {active: true}}

  # Off Home first. Leaving Home disables the passthrough, and a disable
  # releases nothing, so a short press is enough here.
  - press: right
  - wait_until: {focused: nav.series, timeout: 5000}
  - settle: 600
  - assert: {id: nav.series, focused: true, state: {active: true}}
  - snapshot: 00-series

  # --- Held LEFT onto Home: one step, not two -----------------------------
  - press: {key: left, holdMs: 250}
  - settle: 900
  - assert: {id: nav.discover, focused: true, state: {active: true}}
  - assert: {id: nav.search, state: {active: false}}
  # The app-side contract, measurable here: the enable that this landing
  # raises waited for the key-up (one parked flush) and nothing went to the
  # engine while the arrow was down.
  - assert: {id: tvos.menu_passthrough, state: {enabled: true, parked: false, parkedFlushes: 1, enablesSentWhileKeysHeld: 0}}
  - snapshot: 01-held-left-lands-on-home

  # --- Held RIGHT off Home: the disable path, must stay a single step ------
  - press: {key: right, holdMs: 250}
  - settle: 900
  - assert: {id: nav.series, focused: true, state: {active: true}}
  - assert: {id: nav.movies, state: {active: false}}
  - snapshot: 02-held-right-one-step

  # --- Held LEFT onto Home from the other side --------------------------
  # Search is left of Home. Landing on Home from Search raises the passthrough
  # too, and a second step here would end on Series.
  - press: {key: left, holdMs: 250}
  - wait_until: {focused: nav.discover, timeout: 5000}
  - settle: 600
  - press: {key: left, holdMs: 250}
  - wait_until: {focused: nav.search, timeout: 5000}
  - settle: 600
  - assert: {id: nav.search, focused: true, state: {active: true}}
  - press: {key: right, holdMs: 250}
  - settle: 900
  - assert: {id: nav.discover, focused: true, state: {active: true}}
  - assert: {id: nav.series, state: {active: false}}
  # Third landing on Home under a held key (Series to Home above, and now
  # Search to Home): a parked flush per landing, still no enable while held.
  # The disables on leaving Home go out at once and are not counted; a
  # disable releases nothing in the engine.
  - assert: {id: tvos.menu_passthrough, state: {enabled: true, parked: false, parkedFlushes: 3, enablesSentWhileKeysHeld: 0}}
  - snapshot: 03-held-right-from-search-lands-on-home
