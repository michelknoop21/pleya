name: tvos.detail.movie
target: tvos-sim
# Film detail on TvDetailPage (northstars 06-10 of 2026-10-30), on one path a
# viewer takes: a card on Home, Select, the page, down the rows, Menu back.
#
# What this proves:
#   1. the page opens with the ring on the pill, inside the viewport;
#   2. every round action has its own node, and the first screen shows the
#      Cast & Crew heading (06);
#   3. DOWN scrolls the first row onto the band of 07;
#   4. the empty sections are absent: the Pleya wire has no reviews, extras or
#      related rows, so Cast & Crew is the only one;
#   5. back is Menu, not a drawn arrow: the ring lands on the card that opened
#      the page.
# 08 to 10 need rows only Plex and Jellyfin fill in, so they stay widget-test
# territory (test/screens/media_detail/tv/).
setup:
  - reset_app
  - seed: catalog.detail-movie.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}

  # Bar, hero Play, first rail card (same route as tvos.detail.context-menu).
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}

  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {focused: media-detail.play, timeout: 8000}
  - settle: 2500
  - assert: {id: media-detail.play, insideViewport: true}
  - assert: {id: "media-detail.action[watched]", insideViewport: true}
  - assert: {id: "media-detail.action[more]", insideViewport: true}
  - assert: {id: "media-detail.section[cast]", state: {child_count: 7}}
  - snapshot: 06-hero

  - press: down
  - settle: 1200
  - assert: {id: "media-detail.section.item[cast.0]", focused: true}
  - assert: {id: "media-detail.section.item[cast.0]", insideViewport: true}
  - assert: {id: "media-detail.section[reviews]", present: false}
  - assert: {id: "media-detail.section[extras]", present: false}
  - snapshot: 07-cast

  - press: right
  - settle: 500
  - assert: {id: "media-detail.section.item[cast.1]", focused: true}

  - press: up
  - settle: 1200
  - wait_until: {focused: media-detail.play, timeout: 4000}
  - snapshot: 06-back-on-pill

  - press: menu
  - wait_until: {focused: "discover.rail.item[0.0]", timeout: 8000}
  - settle: 800
  - snapshot: 01-back-on-card
