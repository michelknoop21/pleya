name: tvos.detail.movie
target: tvos-sim
# Film detail on TvDetailPage (northstars 06-10 of 2026-10-30), on one path a
# viewer takes: a card on Home, Select, the page, down the rows, Menu back.
#
# What this proves:
#   1. the page opens with the ring on the pill, on scroll offset 0;
#   2. every round action has its own node, and the first screen shows the
#      scores, the technical labels and the Cast & Crew heading (06);
#   3. every DOWN brings the next section's heading to the height of 07 and 09;
#   4. the sections arrive on approach: the rows under Cast & Crew exist only
#      after the page got near them;
#   5. back is Menu, not a drawn arrow: the ring lands on the card that opened
#      the page;
#   6. the activity line says who, under capabilities.item_activity (06).
# The scores, reviews, portraits, extras and rows the Pleya wire has no field
# for come from the fixture's /verify/detail route, which only a Verify build
# asks (lib/services/pleya_server_client/parts/verify_detail.dart).
setup:
  - reset_app
  - seed: catalog.detail-movie.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}

  # Bar, hero Play, first rail card (same route as tvos.detail.context-menu).
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}

  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {focused: media-detail.play, timeout: 8000}
  - settle: 2500
  - assert: {id: media-detail.play, insideViewport: true}
  - assert: {id: "media-detail.action[watched]", insideViewport: true}
  - assert: {id: "media-detail.action[more]", insideViewport: true}
  - assert: {id: "media-detail.section[cast]", state: {child_count: 8}}
  - wait_until: {id: media-detail.activity, state: {names: 4}, timeout: 5000}
  - assert: {id: media-detail.activity, insideViewport: true}
  - snapshot: 06-hero

  - press: down
  - settle: 1200
  - assert: {id: "media-detail.section.item[cast.0]", focused: true}
  - assert: {id: "media-detail.section.item[cast.0]", insideViewport: true}
  - snapshot: 06-cast

  - press: right
  - settle: 500
  - assert: {id: "media-detail.section.item[cast.1]", focused: true}

  - press: down
  - settle: 1200
  - assert: {id: "media-detail.section[reviews]", state: {child_count: 4}}
  - snapshot: 07-reviews

  # Trakt's reactions through the fixture: five on the route, the flagged one and
  # the one with an inline tag stay out.
  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[discussions]", state: {child_count: 3}, timeout: 6000}
  - assert: {id: "media-detail.section.item[discussions.0]", focused: true}
  - snapshot: 07-discussions
  - press: select
  - settle: 900
  - snapshot: 07-discussion-full-text
  - press: menu
  - settle: 900
  - assert: {id: "media-detail.section.item[discussions.0]", focused: true}

  - press: down
  - settle: 1200
  - wait_until: {id: "media-detail.section[extras]", state: {child_count: 2}, timeout: 4000}
  - snapshot: 08-extras

  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[hub:collection]", state: {child_count: 5}, timeout: 6000}
  - snapshot: 08-collection

  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[person:person-0]", state: {child_count: 4}, timeout: 6000}
  - snapshot: 09-person

  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 1200
  - press: up
  - settle: 1200
  - wait_until: {focused: media-detail.play, timeout: 4000}
  - snapshot: 06-back-on-pill

  - press: menu
  - wait_until: {focused: "discover.rail.item[0.0]", timeout: 8000}
  - settle: 800
  - snapshot: 01-back-on-card
