name: tvos.requests.form-4k-default
target: tvos-sim
# REQ-FORM-4K-DEFAULT (docs/tvos-fysieke-correctieronde.md): a requester sends
# no server with a request, so the form may only offer 4K, and may only let
# HD go, when the instance list says where the request ends up.
#
# `seerr.requester.4k-default.v1` seeds one film nobody has asked for, Frost
# Line, and a user who holds REQUEST and REQUEST_4K and no manage right. The 4K right is there and
# Radarr lists a default 4K instance, so the form offers the 4K switch and HD
# can go out.
#
# The walk is the one of tvos.requests.detail-4k: Mijn Pleya, Aanvragen, the
# only card, its title page, then "Aanvragen" opens the form. Nothing is sent.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requester.4k-default.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500

  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  # A-24c: Select puts the remote on Big P; Down is the Snel naar dock, where
  # Aanvragen follows Samen kijken.
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 8000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[watchTogether]", timeout: 5000}
  - walk: {direction: right, steps: 6, stopAt: "my_pleya.tile[requests]", timeout: 60000, settle: 400}
  - press: select
  - wait_until: {id: seerr.search.field, timeout: 15000}
  - settle: 2500

  - press: down
  - settle: 800
  - assert: {id: seerr.search.field, focused: false}
  - press: select

  # Nobody asked for this film, so the page offers "Aanvragen" and nothing
  # else, whatever the instance list says. The form is where the list counts.
  - wait_until: {id: "requests.detail.action[request]", timeout: 15000}
  - settle: 800
  - snapshot: 00-title-page
  - press: select

  - wait_until: {id: "requests.form[create]", state: {phase: form, is4k: false}, timeout: 15000}
  - settle: 1200
  - assert: {id: "requests.form[create]", insideViewport: true, state: {is4k: false, canSubmit: true}}
  # The same id is the lock row of a user without the 4K right, so the state
  # is what tells the switch from that row.
  - assert: {id: "requests.form.option[fourK]", insideViewport: true, state: {allowed: true, selected: false}}
  - assert: {id: "requests.form.button[submit]", insideViewport: true, state: {enabled: true, busy: false}}
  - snapshot: 01-form
