name: ios.assistant.confirm-password
target: ios-sim
# The Pleya confirmation card in Big P's balloon (39 G) for "create a user with
# a password", on the smallest phone: an iPhone SE, 375 x 667.
#
# Needs PLEYA_ASSISTANT_ENABLED=true in the environment of `verify.dart run`
# and PLEYA_VERIFY_IOS_UDID pointing at an iPhone SE (3rd generation)
# simulator.
#
# Send and the dialog's buttons are tapped by id (`bigp.send`,
# `dialog.input.button[cancel|confirm]`). Two things still lean on the SE's
# 375 x 667 screen: the app bar's back arrow out of the settings form, tapped
# at (28, 48) because the shared scaffold gives it no id, and the four drags
# that scroll that form under the keyboard (x 187, y 340 to 60).
#
# No live model: the fixture's local model answers "Maak gebruiker Robin aan."
# with one create_user call, and `server.owner.v1` makes the signed-in account
# the owner, which is what offers that tool at all. Pleya builds the card and
# reads the password itself; the scenario never confirms, so nothing is
# created.
#
# The saved provider lives in the simulator's keychain and survives
# `reset_app`. A second run then finds Big P set up, with the address of a
# fixture that is gone. Empty the keychain first:
# `xcrun simctl keychain <udid> reset`.
#
# BIGP-IOS1-KB (docs/ios-unified-implementation-register.md): before its fix
# the balloon shrank to 213 pt with the keyboard up and Annuleren ended below
# it, which is what the `notClipped` asserts are for.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: server.owner.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - wait_until: {id: bigp.faceButton, timeout: 10000}
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 800

  # Set the fixture's local model up through the real settings form.
  - tap: {id: "my_pleya.tile[assistant]"}
  - wait_until: {id: "assistant.button[setup]", timeout: 5000}
  # The balloon is still animating in when its button first reports.
  - settle: 1000
  - tap: {id: "assistant.button[setup]"}
  - wait_until: {id: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - settle: 800
  - tap: {id: "settings.form.button[assistant.provider.ollamaServer]"}
  - wait_until: {id: "settings.form.field[assistant.url]", timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.form.field[assistant.url]"}
  - settle: 500
  - type: "{{fixture}}"
  - settle: 500
  - snapshot: 00-settings-url

  # The keyboard is up and covers the lower half of the form: scroll the form
  # before each tap, the way a thumb would.
  - drag: {startX: 187, startY: 340, endX: 187, endY: 60, durationMs: 400}
  - settle: 800
  - tap: {id: "settings.form.button[assistant.fetchModels]"}
  - wait_until: {id: "settings.form.button[assistant.model.pleya-verify]", timeout: 15000}
  - drag: {startX: 187, startY: 340, endX: 187, endY: 60, durationMs: 400}
  - settle: 800
  - tap: {id: "settings.form.button[assistant.model.pleya-verify]"}
  - wait_until: {id: "settings.form.button[assistant.model.pleya-verify]", state: {selected: true}, timeout: 5000}
  - wait_until: {id: "settings.form.button[assistant.test]", timeout: 5000}
  - drag: {startX: 187, startY: 340, endX: 187, endY: 60, durationMs: 400}
  - settle: 800
  - tap: {id: "settings.form.button[assistant.test]"}
  - wait_until: {id: "settings.form.button[assistant.save]", timeout: 15000}
  - drag: {startX: 187, startY: 340, endX: 187, endY: 60, durationMs: 400}
  - settle: 800
  - tap: {id: "settings.form.button[assistant.save]"}
  - wait_until: {id: "settings.form.button[assistant.change]", timeout: 10000}
  - settle: 800
  - snapshot: 01-settings-saved

  # The app bar's back arrow has no id; on the SE it is at (28, 48).
  - tap: {x: 28, y: 48}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 1000
  - assert: {id: "settings.form.button[assistant.change]", present: false}

  # Ask. The field is in the balloon, the send button beside it.
  - tap: {id: "my_pleya.tile[assistant]"}
  - wait_until: {id: bigp.balloon, state: {availability: ready}, timeout: 10000}
  - wait_until: {id: bigp.input, timeout: 5000}
  - settle: 800
  - tap: {id: bigp.input}
  - settle: 800
  - type: "Maak gebruiker Robin aan."
  - settle: 800
  - snapshot: 02-question-typed

  - assert: {id: bigp.send, insideViewport: true}
  - tap: {id: bigp.send}
  - wait_until: {id: assistant.confirm, state: {kind: createUser, password: required, canConfirm: false}, timeout: 30000}
  - settle: 1500

  # 39 G at rest: the password row and both buttons are on screen and big
  # enough for a thumb, and Aanmaken waits for a password.
  - assert: {id: assistant.confirm, insideViewport: true}
  - assert: {id: "assistant.confirm.button[password]", insideViewport: true, minimumTapTarget: 44, state: {filled: false}}
  - assert: {id: "assistant.confirm.button[cancel]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "assistant.confirm.button[approve]", insideViewport: true, minimumTapTarget: 44, sameRow: "assistant.confirm.button[cancel]"}
  - assert: {id: "assistant.confirm.button[password]", above: "assistant.confirm.button[approve]"}
  - snapshot: 03-confirm-card

  # The password is read in Pleya's own masked dialog, which brings the
  # keyboard up. The balloon shrinks to the room above it, and the card has to
  # keep its password row and both buttons inside that balloon.
  - tap: {id: "assistant.confirm.button[password]"}
  - settle: 2000
  - assert: {id: assistant.confirm, state: {canConfirm: false}}
  - assert: {id: "dialog.input.button[cancel]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "dialog.input.button[confirm]", insideViewport: true, minimumTapTarget: 44, sameRow: "dialog.input.button[cancel]"}
  - snapshot: 04-password-dialog-keyboard
  - type: "verify-pass-1"
  - settle: 800
  - snapshot: 05-password-typed
  - assert: {id: bigp.balloon, insideViewport: true}
  - assert: {id: "assistant.confirm.button[password]", notClipped: bigp.balloon}
  - assert: {id: "assistant.confirm.button[cancel]", notClipped: bigp.balloon}
  - assert: {id: "assistant.confirm.button[approve]", notClipped: bigp.balloon}

  # Opslaan in the dialog. The card then holds the password and Aanmaken is
  # enabled. Nothing is confirmed.
  - tap: {id: "dialog.input.button[confirm]"}
  - wait_until: {id: "assistant.confirm.button[password]", state: {filled: true}, timeout: 8000}
  - settle: 1500
  - assert: {id: assistant.confirm, insideViewport: true, state: {canConfirm: true}}
  - assert: {id: "assistant.confirm.button[approve]", insideViewport: true, notClipped: bigp.balloon, state: {enabled: true}}
  - assert: {id: "assistant.confirm.button[cancel]", insideViewport: true, notClipped: bigp.balloon}
  - snapshot: 06-password-filled
