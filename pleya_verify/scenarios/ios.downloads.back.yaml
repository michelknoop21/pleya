name: ios.downloads.back
target: ios-sim
# Roadmap A-08: Downloads is a phone tab root, reached from My Pleya.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[downloads]"}
  - settle: 1000
  - wait_until: {id: navigation.back, timeout: 15000}
  - assert: {id: navigation.back, insideViewport: true, minimumTapTarget: 44}
  - snapshot: downloads-back
  - tap: {id: navigation.back}
  - settle: 1000
  - wait_until: {id: "my_pleya.tile[downloads]", timeout: 10000}
  - assert: {id: "my_pleya.tile[downloads]", insideViewport: true}
  - snapshot: returned-my-pleya
