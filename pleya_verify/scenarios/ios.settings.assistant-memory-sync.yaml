name: ios.settings.assistant-memory-sync
target: ios-sim
# Roadmap BP-08b: native memory route, one locally added fact, explicit account
# choice and import preview, server confirmation, refresh and return navigation.
# Needs PLEYA_ASSISTANT_ENABLED=true; TV uses native idb HID only.
# This scenario drives one client. Fixture two-session tests and shared-engine
# two-client tests separately exercise isolation and propagation; hardware remains open.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: memory.sync.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - wait_until: {id: "my_pleya.tile[assistant]", timeout: 10000}
  - settle: 800
  - tap: {id: "my_pleya.tile[assistant]"}
  - wait_until: {id: "assistant.button[setup]", timeout: 5000}
  - settle: 1000
  - tap: {id: "assistant.button[setup]"}
  - wait_until: {id: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - wait_until: {id: "settings.form.button[assistant.memory]", timeout: 5000}
  - settle: 800
  - assert: {id: "settings.form.button[assistant.memory]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: 00-row-in-big-p-settings

  # The screen: no memories yet (43 J), the field open, the menu button there.
  - tap: {id: "settings.form.button[assistant.memory]"}
  - wait_until: {id: screen.memory, state: {view: empty, count: 0, enabled: true}, timeout: 10000}
  - settle: 800
  - assert: {id: settings.memory.input, insideViewport: true}
  - assert: {id: "settings.memory.action[menu]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "settings.memory.action[send]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: 01-empty

  # Add one ordinary fact locally before explicitly choosing an account.
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[manage]", timeout: 5000}
  - settle: 800
  - snapshot: 02-local-management-menu
  - tap: {id: "settings.memory.action[manage]"}
  - wait_until: {id: screen.memory_list, state: {total: 0}, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.memory.action[add]"}
  - wait_until: {id: settings.memory.sheet, state: {mode: add}, timeout: 5000}
  - settle: 1000
  - tap: {id: settings.memory.sheet.field}
  - settle: 600
  - type: "Houdt van ruimtefilms"
  - settle: 600
  - tap: {id: "settings.memory.sheet.button[save]"}
  - wait_until: {id: screen.memory_list, state: {total: 1}, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.memory.action[listBack]"}
  - wait_until: {id: screen.memory, state: {count: 1}, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.memory.action[menu]"}
  - wait_until: {id: "settings.memory.action[sync]", timeout: 5000}
  - settle: 800
  - tap: {id: "settings.memory.action[sync]"}
  - wait_until: {id: screen.memory_sync, state: {status: local, eligible: true}, timeout: 10000}
  - settle: 1000
  - assert: {id: "settings.memory.action[syncAccount0]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: 01-account-choice
  - tap: {id: "settings.memory.action[syncAccount0]"}
  - wait_until: {id: screen.memory_sync, state: {preview: true, busy: false}, timeout: 10000}
  - assert: {id: "settings.memory.action[syncFact0]", state: {selected: true}, insideViewport: true}
  - assert: {id: "settings.memory.action[syncConfirm]", insideViewport: true, minimumTapTarget: 44}
  - settle: 800
  - snapshot: 02-import-preview
  - tap: {id: "settings.memory.action[syncConfirm]"}
  - wait_until: {id: screen.memory_sync, state: {status: synced, preview: false, busy: false}, timeout: 15000}
  - settle: 1000
  - snapshot: 03-confirmed
  # One native client; two-session tests separately prove shared server state.
  - tap: {id: "settings.memory.action[syncRefresh]"}
  - wait_until: {id: screen.memory_sync, state: {status: synced, busy: false}, timeout: 10000}
  - tap: {id: "settings.memory.action[syncBack]"}
  - wait_until: {id: screen.memory, state: {count: 1}, timeout: 10000}
  - settle: 1000
  - snapshot: 04-returned-memory
