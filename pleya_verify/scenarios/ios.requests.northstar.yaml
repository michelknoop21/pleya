name: ios.requests.northstar
target: ios-sim
# Aanvragen (northstar 19). The screen is hidden until Seerr is configured.
# `seed_seerr` uses the real SeerrProvider test/commit path against the local
# fixture, without pretending the below-the-fold Settings form was touched.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requests.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
  - open: screen.requests
steps:
  - wait_until: {id: screen.requests, timeout: 15000}
  - settle: 2000
  - assert: {id: "requests.mine.item[0]", insideViewport: true}
  - assert: {id: "requests.mine.item[1]", insideViewport: true}
  - assert: {id: "requests.mine.item[2]", insideViewport: true}
  - snapshot: requests-northstar
