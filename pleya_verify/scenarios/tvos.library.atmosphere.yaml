name: tvos.library.atmosphere
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.hero-artwork.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - walk: {direction: right, expect: [nav.series, nav.movies], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  - press: select
  - wait_until: {id: "tv.catalog.grid[movies]", timeout: 20000}
  - wait_until: {id: "tv.catalog.grid.item[movies.0]", state: {title: Narrow 1.48}, timeout: 10000}
  - settle: 1000
  - assert: {id: "library.atmosphere[tv_catalog.movies]", state: {title: Narrow 1.48, available: true, blur_sigma: 14}}
  - snapshot: 01-narrow-selected
  - press: right
  - settle: 1000
  - assert: {id: "tv.catalog.grid.item[movies.1]", focused: true, insideViewport: true}
  - assert: {id: "library.atmosphere[tv_catalog.movies]", state: {title: Standard 1.78, available: true, blur_sigma: 14}}
  - snapshot: 02-standard-selected
  - press: left
  - settle: 1000
  - assert: {id: "tv.catalog.grid.item[movies.0]", focused: true, insideViewport: true}
  - assert: {id: "library.atmosphere[tv_catalog.movies]", state: {title: Narrow 1.48}}
  - snapshot: 03-returned-context
