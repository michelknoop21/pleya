name: tvos.home.hero-cta-focus
target: tvos-sim
# VIS-0925-E and review D1: the hero CTAs with the focus on them, in the
# default (OLED) theme. The focused CTA is a white fill; its white ring stands a
# clear band off the fill so it still reads as a ring. The fill stays on the
# page edge (75.48, D3) with the ring going outward.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}

  # Down out of the bar lands on Afspelen.
  - press: down
  - wait_until: {focused: discover.hero.play, timeout: 5000}
  - assert: {id: discover.hero.play, leftInset: 75.48}
  - settle: 800
  - snapshot: 00-play-focused

  # Right onto Details bekijken, which inverts to white when focused.
  - press: right
  - settle: 800
  - assert: {id: discover.hero.play, focused: false}
  - snapshot: 01-details-focused
