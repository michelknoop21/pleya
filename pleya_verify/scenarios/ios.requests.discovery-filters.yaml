name: ios.requests.discovery-filters
target: ios-sim
# Written for REQ-DISCOVERY-FILTERS. Execution and visual evidence remain open.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requests.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
  - open: screen.requests
steps:
  - wait_until: {id: screen.requests, timeout: 15000}
  - wait_until: {id: "catalog.chip.filters[requests]", timeout: 5000}
  - settle: 400
  - tap: {id: "catalog.chip.filters[requests]"}
  - wait_until: {id: "seerr.discover.filter[source.popular]", timeout: 5000}
  - wait_until: {id: "seerr.discover.filter[year]", timeout: 5000}
  - settle: 400
  - tap: {id: "seerr.discover.filter[year]"}
  - wait_until: {id: "seerr.discover.filter[year.0]", timeout: 5000}
  - wait_until: {id: "seerr.discover.filter[year.0]", insideViewport: true, state: {selected: true}, timeout: 5000}
  - assert: {id: "seerr.discover.filter[year.0]", insideViewport: true, state: {selected: true}}
  - snapshot: requests-year-picker
  - wait_until: {id: "seerr.discover.filter[year.0]", timeout: 5000}
  - settle: 400
  - tap: {id: "seerr.discover.filter[year.0]"}
  - wait_until: {id: "catalog.chip.filters[requests]", timeout: 5000}
  - settle: 400
  - tap: {id: "catalog.chip.filters[requests]"}
  - wait_until: {id: "seerr.discover.filter[source.upcoming]", timeout: 5000}
  - settle: 400
  - tap: {id: "seerr.discover.filter[source.upcoming]"}
  - wait_until: {id: "seerr.discover.filter[source.upcoming]", state: {selected: true}, timeout: 5000}
  - assert: {id: "seerr.discover.filter[source.upcoming]", state: {selected: true}}
  - assert: {id: "seerr.discover.filter[year]", insideViewport: true}
  - snapshot: requests-upcoming-filters
  - wait_until: {id: "seerr.discover.filter[source.trending]", timeout: 5000}
  - settle: 400
  - tap: {id: "seerr.discover.filter[source.trending]"}
  - wait_until: {id: seerr.discover.filter, timeout: 5000}
  - wait_until: {id: seerr.discover.filter, timeout: 5000}
  - settle: 400
  - tap: {id: seerr.discover.filter}
  - wait_until: {id: "seerr.discover.filter[source.trending]", state: {selected: true}, timeout: 5000}
  - assert: {id: "seerr.discover.filter[source.trending]", state: {selected: true}}
  - assert: {id: "seerr.discover.filter[year]", present: false}
  - assert: {id: "seerr.discover.filter[sort]", present: false}
  - snapshot: requests-trending-filters
