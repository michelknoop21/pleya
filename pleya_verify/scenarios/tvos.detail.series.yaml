name: tvos.detail.series
target: tvos-sim
# Series detail on TvDetailPage (northstars 03, 04, 05 of 2026-10-30), one show
# with two seasons, on the path a viewer takes.
#
# What this proves:
#   1. the page opens on the Serie tab with the white pill, offset 0 (03);
#   2. DOWN walks tab, actions, the row of seasons, Cast & Crew, Trailers &
#      Extras and the collection, each heading on the height of 04 and 05;
#   3. UP walks back to the tab, and one more reaches the top bar;
#   4. RIGHT opens a season in this same screen and swaps what is under the tabs;
#   5. Select on a poster opens that season; Menu comes back to the poster and
#      a second Menu closes the page, onto the card that opened it.
setup:
  - reset_app
  - seed: catalog.detail-series.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}

  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - wait_until: {id: media-detail.tabs, state: {child_count: 3, open: series}, timeout: 10000}
  - wait_until: {focused: "media-detail.tab[series]", timeout: 8000}
  - settle: 2500
  - assert: {id: media-detail.play, insideViewport: true}
  - assert: {id: "media-detail.section[seasons]", state: {child_count: 2}}
  - snapshot: 03-serie

  - press: down
  - settle: 800
  - assert: {id: media-detail.play, focused: true}
  - snapshot: 03-actions

  - press: down
  - settle: 1200
  - assert: {id: "media-detail.section.item[seasons.0]", focused: true}
  - snapshot: 03-seasons

  - press: down
  - settle: 1200
  - assert: {id: "media-detail.section.item[cast.0]", focused: true}
  - snapshot: 04-cast

  # Through Trakt's TMDB lookup: the series' three clean reactions and the one on
  # season 2.
  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[discussions]", state: {child_count: 4}, timeout: 6000}
  - assert: {id: "media-detail.section.item[discussions.0]", focused: true}
  - snapshot: 04-discussions

  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[extras]", state: {child_count: 1}, timeout: 6000}
  - snapshot: 05-trailers

  - press: down
  - settle: 1500
  - wait_until: {id: "media-detail.section[hub:collection]", state: {child_count: 5}, timeout: 6000}
  - snapshot: 05-collection

  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 800
  - press: up
  - settle: 1200
  - wait_until: {focused: media-detail.play, timeout: 4000}
  - press: up
  - settle: 800
  - assert: {id: media-detail.read-more, focused: true}
  - press: up
  - settle: 800
  - assert: {id: "media-detail.tab[series]", focused: true}

  - press: up
  - settle: 1000
  - wait_until: {focused: nav.discover, timeout: 4000}
  - snapshot: 03-topbar
  - press: down
  - settle: 1000
  - wait_until: {focused: "media-detail.tab[series]", timeout: 4000}

  - press: right
  - settle: 1500
  - wait_until: {id: media-detail.tabs, state: {open: "0"}, timeout: 5000}
  - assert: {id: "media-detail.tab[0]", focused: true}
  - assert: {id: "media-detail.section[seasons]", present: false}
  - assert: {id: "media-detail.section[episodes]", state: {child_count: 5}}
  - snapshot: 04-season-tab

  - press: right
  - settle: 1500
  - wait_until: {id: media-detail.tabs, state: {open: "1"}, timeout: 5000}
  - wait_until: {id: "media-detail.section[episodes]", state: {child_count: 5}, timeout: 8000}

  - press: left
  - settle: 500
  - press: left
  - settle: 1000
  - wait_until: {id: media-detail.tabs, state: {open: series}, timeout: 5000}
  - assert: {id: "media-detail.tab[series]", focused: true}

  - press: down
  - settle: 800
  - press: down
  - settle: 1200
  - press: right
  - settle: 600
  - assert: {id: "media-detail.section.item[seasons.1]", focused: true}
  - snapshot: 03-poster
  - press: select
  - settle: 1500
  - wait_until: {id: media-detail.tabs, state: {open: "1"}, timeout: 5000}
  - wait_until: {focused: "media-detail.section.item[episodes.0]", timeout: 5000}

  - press: menu
  - settle: 1500
  - wait_until: {focused: "media-detail.section.item[seasons.1]", timeout: 5000}
  - wait_until: {id: media-detail.tabs, state: {open: series}, timeout: 5000}

  - press: menu
  - wait_until: {focused: "discover.rail.item[0.0]", timeout: 8000}
  - settle: 800
  - snapshot: 01-back-on-card
