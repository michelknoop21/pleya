name: media-detail.episode-refresh
target: tvos-sim
setup:
  - reset_app
  - seed: catalog.shows.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500

  # VER8: the show is on Home's first rail, the same way in as
  # `tvos.detail.series`. The old route went Mijn Pleya > Bibliotheken >
  # library > grid; since LIB7 Bibliotheken on TV is source management and
  # Select on a library opens its management sheet, not a grid.
  - wait_until: {id: discover.hero, timeout: 15000}
  - press: down
  - settle: 800
  - press: down
  - settle: 800
  - assert: {id: "discover.rail.item[0.0]", focused: true}
  - press: select
  - wait_until: {id: screen.media_detail, timeout: 15000}

  - wait_until: {id: media-detail.episode-list, timeout: 15000}
  - settle: 1500
  - assert: {id: media-detail.episode-list, state: {child_count: 10}}
  - snapshot: detail-10-episodes

  # A series opens with the ring on its episode rail; Select plays the
  # episode under it.
  - wait_until: {focused: media-detail.episode-list, timeout: 5000}
  - press: select
  - wait_until: {id: player.surface, timeout: 15000}

  # The mutation must land *before* the player has any chance to reach
  # end-of-playback on its own: `sampleMediaMp4Bytes` is a real, very short
  # clip (its `duration_ms` metadata is a fixture fiction, decoupled from
  # actual playable length), and mpv reaching its real end auto-returns to
  # `MediaDetailScreen` exactly like a Menu press would — `refreshAfterPlayback`
  # then runs on its own, before any scripted `press: menu`. A `settle: 2500`
  # here previously gave it exactly that chance: the timestamped fixture-server
  # log showed the revalidation GET landing ~0.6s *before* `addEpisode` ran,
  # meaning the screen had already refreshed (to the old count) by the time
  # this mutation applied, and the scripted Menu press afterward closed nothing
  # (the player was already gone) — the assertion then failed on a stale 10,
  # not on the bug this scenario exists to catch. No settle at all here keeps
  # the mutation's local HTTP round-trip (tens of ms) far inside the clip's
  # real playable length.
  #
  # The mutation happens while the player is the foreground screen and the
  # detail screen underneath is not visible — the regression this proves is
  # that the *already-mounted* `MediaDetailScreen` picks the change up on
  # return via `refreshAfterPlayback`, not that a fresh navigation would
  # have (any correctly written screen gets that for free). `add_episode`
  # keeps the season's `child_count` in sync — see
  # `PleyaFakeServer.addEpisode`'s own doc comment, "the mutation
  # media-detail.episode-refresh needs".
  - fixture_mutate: {op: add_episode, parent_id: "{{fixture_id:season/testserie-s01}}"}

  # The first Menu in the player only hides its controls while they are up;
  # they hide on their own after five seconds on TV. Waiting that out makes
  # the one Menu below the one that leaves the player (VER8). The clip runs
  # fifteen seconds, so the player is still there.
  - settle: 6500

  # Menu pops the player over idb HID — the real remote-press path ([C2]),
  # not a synthetic pop — landing back on the same `MediaDetailScreen`
  # instance rather than a freshly re-navigated one: nothing in this
  # scenario ever leaves the Home-to-detail path a second time. Harmless
  # if the clip already auto-returned on its own by this point (`onBack`'s
  # own suppression, or simply nothing left to pop for a stray press).
  - press: menu
  # `screen.media_detail` stays mounted under the player, so the ring on the
  # episode rail is what says the player is gone.
  - wait_until: {focused: media-detail.episode-list, timeout: 15000}
  - settle: 2500
  - assert: {id: media-detail.episode-list, state: {child_count: 11}}
  - snapshot: detail-11-episodes
