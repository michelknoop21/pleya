name: ios.catalog.quick-menu
target: ios-sim
# Alle films: holding a poster opens the compact menu anchored at the card
# (Dense Library, variant 3; A-06/A-08), Play first, then the unified group
# actions. Reached the same way as `ios.catalog.header-collapse`.
setup:
  - reset_app
  - seed: catalog.long-grid.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.movies
steps:
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - tap: {id: "landing.view_all[movies]"}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 800
  - assert: {id: "catalog.grid.item[movies.4]", insideViewport: true}
  - tap: {id: "catalog.grid.item[movies.4]", holdMs: 600}
  - wait_until: {id: sheet.context_menu, timeout: 10000}
  - settle: 500
  - assert: {id: sheet.context_menu, insideViewport: true}
  - assert: {id: "sheet.context_menu.item[1]", insideViewport: true}
  - snapshot: catalog-quick-menu
