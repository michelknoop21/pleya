name: tvos.carousel.normal-motion-control
target: tvos-sim
# CAROUSEL-LEFT1 / Roadmap A-06.
setup:
  - reset_app
  - seed: catalog.long-rails.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - settle: 500
  - press: right
  - settle: 800
  - press: select
  - wait_until: {id: "discover.rail[0]", timeout: 20000}
  - settle: 2000
  - press: down
  - settle: 800
  - press: down
  - settle: 1000
  - assert: {id: "discover.rail.item[0.0]", focused: true}
  - assert: {id: "discover.rail[0]", state: {selected_index: 0, anchored: true, reduced_motion: false}}
  - snapshot: normal-motion-restored
