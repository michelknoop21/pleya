name: ios.detail.northstar
target: ios-sim
# Filmdetail (northstar 06, iOS Unified 2026 workitem I6, docs/unified-2026-closure.md
# §5 rij 5), tegen `docs/assets/ios-unified/northstar/06-film-detail.png`. Reached zoals
# een gebruiker dat doet: Films-landing -> "Alle films" -> een postertegel, dezelfde weg
# als `ios.catalog.northstar` tot aan de grid, met precies één tik verder de detailpagina
# in. Sinds DEC-140 hoort de snapshot naast `docs/assets/ios-unified/detail-2026/D-01-film.png`
# (posterhero, scores, afspeelknop, actierij). De afspeelknop (`media-detail.play`), de
# herstartknop (`media-detail.play-from-start`) en de actierij (`media-detail.action[<naam>]`)
# zijn automation-ids; de techtabel blijft visuele evidence in de snapshot. Het fixture
# heeft geen voortgang, dus de herstartknop hoort er niet te staan.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.movies
steps:
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - assert: {id: "landing.view_all[movies]", insideViewport: true}
  - tap: {id: "landing.view_all[movies]"}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 500
  - assert: {id: "catalog.grid.item[movies.0]", insideViewport: true}
  - tap: {id: "catalog.grid.item[movies.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 2000
  - assert: {id: media-detail.play, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: media-detail.play-from-start, present: false}
  - assert: {id: "media-detail.action[rate]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[watched]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[download]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[more]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: detail-film-northstar
