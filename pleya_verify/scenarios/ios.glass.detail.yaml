name: ios.glass.detail
target: ios-sim
# The iPhone film page with Liquid Glass on (mockup LG-02, Liquid Glass
# Task 7). Glass is turned on the way a user does it (Uiterlijk, the Liquid
# Glass switch, same walk as `ios.glass.tabbar`), then a film opens through
# Films, "Alle films" and the first poster, the walk of
# `ios.detail.northstar`. The page opens on the full-bleed hero: back and
# more as glass circles, title and tags on the scrim, the white Resume/Play
# capsule, Download in glass with the round watchlist button beside it. The
# asserts pin that the play capsule (`media-detail.play`) is on screen and a
# full tap target; the snapshot is the visual evidence next to LG-02.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 2000
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 1000
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  - tap: {id: "settings.tile[appearance]"}
  - wait_until: {id: "my_pleya.section.tile[setting.liquid_glass]", timeout: 10000}
  - settle: 500
  - tap: {id: "my_pleya.section.tile[setting.liquid_glass]"}
  - settle: 500
  - assert: {id: "my_pleya.section.tile[setting.liquid_glass]", state: {value: true}}
  # Back to Settings through the app bar's arrow (no id, see
  # `ios.glass.tabbar`), then Films through the bar.
  - tap: {x: 28, y: 90}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 1000
  - tap: {id: nav.movies}
  - wait_until: {id: screen.movies, timeout: 15000}
  - settle: 3500
  - tap: {id: "landing.view_all[movies]"}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 500
  - tap: {id: "catalog.grid.item[movies.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 2000
  - assert: {id: media-detail.play, insideViewport: true, minimumTapTarget: 44}
  - snapshot: glass-detail-film
