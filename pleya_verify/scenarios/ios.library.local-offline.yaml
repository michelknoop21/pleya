name: ios.library.local-offline
target: ios-sim
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - settle: 3500
  - tap: {id: nav.myPleya}
  - wait_until: {id: screen.my_pleya, timeout: 10000}
  - settle: 800
  - tap: {id: "my_pleya.tile[settings]"}
  - wait_until: {id: screen.settings, timeout: 10000}
  - settle: 800
  # A-24b: the local library's rows sit inline on Bibliotheken (Bibliotheek &
  # Home, series ios/03-01).
  - tap: {id: "settings.tile[library_home]"}
  - wait_until: {id: local_library.enable, timeout: 10000}
  - settle: 800
  - assert: {id: local_library.enable, state: {value: false}, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: local_library.wifi, state: {value: true}, insideViewport: true}
  - snapshot: 01-defaults
  - tap: {id: local_library.enable}
  - wait_until: {id: local_library.status, state: {status: ready}, timeout: 90000}
  - assert: {id: local_library.enable, state: {value: true}}
  - snapshot: 02-stored
  - fixture_mutate: {op: offline, enabled: true}
  - restart
  - wait_until: {id: nav.movies, timeout: 45000}
  - settle: 1500
  - tap: {id: nav.movies}
  - wait_until: {id: screen.catalog_movies, timeout: 15000}
  - settle: 1500
  - assert: {id: "catalog.grid.item[movies.0]", insideViewport: true}
  - snapshot: 03-offline-posters
  - tap: {id: "catalog.header.search[movies]"}
  - settle: 800
  - type: "aurora"
  - wait_until: {id: "search.results.section[movies]", timeout: 10000}
  - snapshot: 04-offline-search
  - tap: {id: "search.results.item[movies.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 1000
  - assert: {id: media-detail.play, state: {enabled: false}}
  - snapshot: 05-offline-detail
