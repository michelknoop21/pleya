name: ipados.player.filmbeeld
target: ios-sim
# A-11: iPad opens Aurora from the Home hero; the Films tab is phone-only.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - configure_view: {orientation: portrait}
  - wait_until: {id: discover.hero.play, timeout: 15000}
  - assert: {id: discover.hero, state: {activeTitle: Aurora}}
  - tap: {id: discover.hero.play}
  - settle: 4000
  - wait_until: {id: player.play_pause, timeout: 25000}
  - tap: {id: player.play_pause}
  - settle: 500
  - assert: {id: player.play_pause, state: {playing: false}, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: player.settings_button, above: player.play_pause, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: player.tracks_button, sameRow: player.settings_button, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: player.timeline, below: player.play_pause, insideViewport: true}
  - assert: {id: player.handoff_button, below: player.timeline, insideViewport: true, minimumTapTarget: 44}
  - snapshot: ipad-filmbeeld-paused
