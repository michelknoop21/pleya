name: ios.detail-episodes.northstar
target: ios-sim
# Seriedetail met afleveringen (northstar 07, iOS Unified 2026 workitem I6,
# docs/unified-2026-closure.md §5 rij 5), tegen
# `docs/assets/ios-unified/northstar/07-serie-afleveringen.png`. Reached via de
# Series-landing -> "Alle series" -> een postertegel, dezelfde weg als
# `ios.detail.northstar` maar dan de series-catalogus. `catalog.mixed.v1`'s Driftwood
# heeft één seizoen met 3 afleveringen (`named_fixtures.dart`), genoeg om de
# Afleveringen-tab in `mobile_episodes_tab.dart` te tonen zonder een seizoenwissel nodig
# te hebben. Sinds DEC-140 hoort de snapshot naast
# `docs/assets/ios-unified/detail-2026/D-03-serie.png`. Afspeelknop, actierij
# (`media-detail.action[<naam>]`) en seizoensposters (`media-detail.season-poster[<index>]`)
# zijn automation-ids. Een serie heeft geen Downloaden in de actierij.
# Daarna de seizoenspagina: op het 402x874-toestel (iPhone 17 Pro) begint de eerste
# seizoensposter op de onderrand. Een tik op id mikt op het midden van de poster, en dat
# ligt onder de rand; zonder scroll-verb blijft een tik op (60, 872) de enige weg erheen.
# Op een kleiner toestel landt die tik ergens anders.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - open: screen.series
steps:
  - wait_until: {id: screen.series, timeout: 15000}
  - settle: 3500
  - assert: {id: "landing.view_all[series]", insideViewport: true}
  - tap: {id: "landing.view_all[series]"}
  - wait_until: {id: screen.catalog_series, timeout: 15000}
  - settle: 500
  - assert: {id: "catalog.grid.item[series.0]", insideViewport: true}
  - tap: {id: "catalog.grid.item[series.0]"}
  - wait_until: {id: screen.media_detail, timeout: 15000}
  - settle: 2000
  - assert: {id: media-detail.play, insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[watched]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[more]", insideViewport: true, minimumTapTarget: 44}
  - assert: {id: "media-detail.action[download]", present: false}
  - assert: {id: "media-detail.season-poster[0]"}
  - snapshot: detail-series-episodes-northstar
  - tap: {x: 60, y: 872}
  - settle: 2500
  # Geen assert op `media-detail.play` hier: de seriepagina eronder blijft in de
  # boom staan, met haar knop op x = -118 (de parallax van de push), en de runner
  # pakt die eerste. De snapshot is het bewijs.
  - snapshot: detail-season-page
