name: tvos.assistant.result-space
target: tvos-sim
# Requires PLEYA_ASSISTANT_ENABLED=true with the pinned SDK.
# BP-09: six request cards in one display go dense on the full surface, and the
# first five stand inside the panel without scrolling. Real settings UI and
# native idb input; the model fixture answers "Ontdek ruimtefilms." with one
# discover_request_titles call (find_title is capped at five candidates).
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: seerr.requests.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
  - seed_seerr: {base_url: "{{fixture_seerr}}", api_key: "verify-seerr-key"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  - press: right
  - press: right
  - press: right
  - wait_until: {focused: nav.myPleya, timeout: 5000}
  - press: select
  - wait_until: {id: screen.my_pleya, timeout: 15000}
  - settle: 600
  # With Seerr connected the content group starts with Aanvragen.
  - press: down
  - wait_until: {focused: "my_pleya.tile[requests]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[libraries]", timeout: 5000}
  - press: down
  - wait_until: {focused: "my_pleya.tile[assistant]", timeout: 5000}
  - press: select
  - wait_until: {focused: "assistant.button[setup]", timeout: 10000}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.provider.ollamaServer]", timeout: 10000}
  - press: select
  - wait_until: {focused: "settings.form.field[assistant.url]", timeout: 10000}
  - snapshot: 00-provider-form-before-url
  - type: "{{fixture}}"
  - settle: 1000
  - snapshot: 00b-provider-form-url
  - wait_until: {id: "settings.form.button[assistant.model.pleya-verify]", timeout: 15000}
  - snapshot: 01-provider-model-loaded
  - walk: {direction: down, steps: 8, stopAt: "settings.form.button[assistant.model.pleya-verify]", timeout: 80000, settle: 400}
  - press: select
  - assert: {id: "settings.form.button[assistant.model.pleya-verify]", state: {selected: true}}
  - walk: {direction: down, steps: 4, stopAt: "settings.form.button[assistant.test]", timeout: 40000, settle: 400}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.save]", timeout: 15000}
  - press: select
  - wait_until: {focused: "settings.form.button[assistant.change]", timeout: 10000}
  - snapshot: 02-provider-saved
  - press: menu
  - wait_until: {id: screen.assistant, state: {availability: ready}, timeout: 10000}
  - wait_until: {focused: "assistant.button[ask]", timeout: 5000}
  - press: select
  - wait_until: {id: screen.assistant, state: {state: listening}, timeout: 5000}
  - wait_until: {id: tvos.native_text_entry, state: {sessionActive: true}, timeout: 10000}
  - settle: 1000
  - snapshot: 02b-assistant-native-editor
  - type: "Ontdek ruimtefilms."
  - press: select
  - wait_until: {id: screen.assistant, state: {state: result, error: false, pending: false}, timeout: 30000}
  - wait_until: {id: "assistant.option[5]", timeout: 15000}
  - assert: {id: "assistant.option[0]", insideViewport: true}
  - assert: {id: "assistant.option[3]", insideViewport: true, below: "assistant.option[2]", sameColumn: "assistant.option[0]", notOverlapping: "assistant.option[2]"}
  - settle: 800
  - snapshot: 03-result-six-options
  - wait_until: {focused: "assistant.option[0]", timeout: 5000}
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - wait_until: {focused: "assistant.option[5]", timeout: 5000}
  - assert: {id: "assistant.option[5]", insideViewport: true, below: "assistant.option[4]", sameColumn: "assistant.option[0]"}
  - settle: 600
  - snapshot: 04-last-option-focused
