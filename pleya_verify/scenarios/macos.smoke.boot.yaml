name: macos.smoke.boot
target: macos
setup:
  - reset_app
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.main, timeout: 15000}
  - assert: {id: screen.main}
  - snapshot: boot
