name: tvos.settings.appearance
target: tvos-sim
# MOC-20 (PB-10): Instellingen ▸ Uiterlijk carries the four TV preferences
# mockup 20 asks for (titles under posters, hero clearlogo, hero auto-rotate,
# reduce motion; commit 7e0b2935), each a real `BoolPref`. The rows publish
# the value they draw as `my_pleya.section.tile[setting.<pref key>].state.value`.
#
# What this proves:
#   1. Weergave is reachable from Mijn Pleya ▸ Instellingen with the remote
#      (A-24b: its rows sit on the Instellingen page itself);
#   2. all four prefs are rows on the page, with their shipped defaults, and
#      the remote reaches each of them;
#   3. Select flips "titels onder posters" and the row reports the new value,
#      a second Select flips it back (so the run leaves no changed pref behind);
#   4. Menu leaves the page onto the hub's Instellingen tile.
#
# Reduce motion is deliberately not toggled: it restarts the app
# (`onAfterWrite: _restartApp`), which would end the driven session.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  - settle: 3500
  # A-24c: Instellingen is a destination in the top bar, right after Mijn Pleya.
  - walk: {direction: right, steps: 8, stopAt: nav.settings, timeout: 60000, settle: 600}
  - press: select
  - wait_until: {id: nav.settings, state: {active: true}, timeout: 15000}
  # Select leaves the remote on the pill; Down enters the page.
  - press: down
  # A-24b: the page opens on Weergave's first row, Thema.
  - wait_until: {focused: "my_pleya.section.tile[setting.theme_mode]", timeout: 8000}
  - assert: {id: "settings.category[0]", state: {selected: true}}
  - settle: 800
  - snapshot: 01-appearance-opened

  # Down the Scherm group onto "titels onder posters", whatever rows the
  # platform adds above it.
  - walk: {direction: down, steps: 12, stopAt: "my_pleya.section.tile[setting.tv_show_titles_under_posters]", timeout: 180000, settle: 300}
  - assert: {id: "my_pleya.section.tile[setting.tv_show_titles_under_posters]", insideViewport: true, state: {value: true}}
  - assert: {id: "my_pleya.section.tile[setting.tv_reduce_motion]", state: {value: false}}

  # Select flips it, and the row says so; Select again restores the default.
  - press: select
  - settle: 600
  - assert: {id: "my_pleya.section.tile[setting.tv_show_titles_under_posters]", focused: true, state: {value: false}}
  - snapshot: 02-titles-off
  - press: select
  - settle: 600
  - assert: {id: "my_pleya.section.tile[setting.tv_show_titles_under_posters]", state: {value: true}}

  # The hero rows open the Home group, further down the same column.
  - walk: {direction: down, steps: 4, stopAt: "my_pleya.section.tile[setting.tv_hero_clear_logo]", timeout: 60000, settle: 300}
  - assert: {id: "my_pleya.section.tile[setting.tv_hero_clear_logo]", insideViewport: true, state: {value: true}}
  - press: down
  - wait_until: {focused: "my_pleya.section.tile[setting.tv_hero_auto_advance]", timeout: 5000}
  - assert: {id: "my_pleya.section.tile[setting.tv_hero_auto_advance]", insideViewport: true, state: {value: true}}
  - snapshot: 02b-hero-rows
  # LEFT from any row goes back to the category it belongs to.
  - press: left
  - wait_until: {focused: "settings.category[0]", timeout: 5000}

  # Menu out, onto the hub's tile.
  - press: menu
  - wait_until: {focused: nav.settings, timeout: 8000}
