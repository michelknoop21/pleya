name: tvos.catalog.rail-sort-focus
target: tvos-sim
# CAT17, in the place it was reported, under the contract that replaced it. On
# the full-bleed route of A-06c a sort is chosen in the panel, the panel closes
# and the ring lands on card 0. The defect CAT17 was about stays the thing to
# prove: the grid re-pages on a sort change, the card the viewer stood on before
# opening the panel may be off page one, and the ring must not end up on nothing.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 30000}
  # IntroGate's cold-start splash paints over an already-ready screen.
  - settle: 3500

  # Series, not Films, and that is a fixture fact rather than a preference:
  # `catalog.mixed.v1` seeds shows and no movies ("Fetched 0 latest movies" in
  # the app log of the first run), so Alle films draws `TvCatalogEmptyState` and
  # never builds a grid at all. The cold start leaves the ring on Home and the
  # bar does not wrap, so Series is one hop right; the order is the one
  # `tvos.nav.walk` proves.
  - walk: {direction: right, expect: [nav.series], timeout: 40000, settle: 800}
  - press: select
  - settle: 1500
  # A-24c (LEESMIJ-v4): Select changed the page and left the remote on
  # the pill; Down takes it to the landing.
  - press: down
  - settle: 1500
  # Series is a discovery landing, not the catalog: rails plus a "view all"
  # button, and Alle series is one Select further. The first run's focus trace
  # named the node (`TvDiscoveryViewAll`) after this press, which is how the
  # route is known rather than guessed.
  - press: select
  - wait_until: {id: "tv.catalog.grid[series]", timeout: 20000}
  - settle: 1500
  - snapshot: 00-catalog

  # LEFT off column 0 opens the rail on Bronnen (DEC-093), two DOWNs reach
  # Sortering.
  - press: left
  - settle: 800
  - assert: {id: "tv.catalog.rail[series]"}
  - assert: {id: "tv.catalog.rail.row[series.sources]", focused: true}
  - press: down
  - settle: 600
  - press: down
  - settle: 600
  - assert: {id: "tv.catalog.rail.row[series.sort]", focused: true}
  - snapshot: 01-rail-sort

  # Into the sort page, take the sort below the one in force. The panel closes
  # on the choice; the catalog re-pages behind it.
  - press: select
  - settle: 1200
  - press: down
  - settle: 600
  - press: select
  - settle: 3000
  - snapshot: 02-after-sort

  # The point of the whole file.
  - assert: {id: "tv.catalog.rail[series]", present: false}
  - assert: {id: "tv.catalog.grid.item[series.0]", focused: true}

  # And Menu still works from where the ring is: it leaves the route.
  - press: menu
  - settle: 1000
  - assert: {id: "tv.catalog.grid[series]", present: false}
  - snapshot: 03-left-route
