name: ios.home.northstar
target: ios-sim
# The iPhone Home surface as fase 1 delivers it: header, chips, in-page hero,
# the first rail under it, and the bottom bar. Observation only — every node
# asserted here is one the product renders on its own, with no verify-only
# behaviour behind it (docs/ios-unified-2026-fase1-plan.md stap 10).
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  # Same two-pass load and same cold-start splash as discover.hero.layout:
  # wait for the hero node itself and settle past IntroGate before measuring.
  - wait_until: {id: discover.hero, timeout: 15000}
  - settle: 3500
  # Header: the lockup row has to be on screen, and its search control has to
  # be hittable. A header that scrolls away or a 32 pt icon button is exactly
  # the kind of regression no widget test sees.
  - assert: {id: home.header, insideViewport: true}
  - assert: {id: home.header.search, insideViewport: true, minimumTapTarget: 44}
  # Chips sit between the header and the hero.
  - assert: {id: home.chips, insideViewport: true}
  # The hero is in-page, not a full-bleed billboard: it must fit the viewport
  # with its play button intact.
  - assert: {id: discover.hero, insideViewport: true}
  - assert: {id: discover.hero.play, insideViewport: true, minimumTapTarget: 44}
  # The first rail sits under the hero, which is the whole point of budgeting
  # the hero height against it.
  - assert: {id: "home.rail[0]", below: discover.hero}
  # The tabset is unchanged by fase 1; the bar is only restyled, so it still
  # has to be there.
  - assert: {id: nav.bar, insideViewport: true}
  - snapshot: home-northstar
