name: ios.activity.northstar
target: ios-sim
# Activiteit (northstar 21, iOS Unified 2026 I7) is the approved mobile
# deviation from the full-page mockup: a sheet opened from the live-presence
# control in Home's header (audit 9a). `activity.button` names that control,
# `activity.sheet` the opened surface, and `activity.row[1]` the session seeded
# by `activity.active-session.v1`.
#
# The scenario is intentionally also the executable boundary of ACT1. The
# fixture profile is Pleya-Server-only, while ProfileSessionScreen enables
# NowWatchingProvider only for a server for which
# MultiServerManager.isOwnerOrAdmin is true. That method deliberately returns
# false for Pleya Server until PS-9 defines users and roles. Therefore the
# fixture's fake Tautulli session cannot become visible yet without either a
# protocol-faithful Plex fixture or bypassing the product authorization gate;
# the latter is forbidden by docs/tvos-fysieke-correctieronde.md's ACT1 ruling.
setup:
  - reset_app
  - seed: catalog.mixed.v1
  - seed: activity.active-session.v1
  - launch
  - sign_in: {base_url: "{{fixture}}", username: verify-owner, password: verify-password, setup_code: "{{fixture_setup_code}}"}
steps:
  - wait_until: {id: screen.discover, timeout: 15000}
  - wait_until: {id: "home.rail.item[0.0]", timeout: 15000}
  - settle: 3500
  - wait_until: {id: activity.button, timeout: 10000}
  - tap: {id: activity.button}
  - wait_until: {id: activity.sheet, timeout: 5000}
  - assert: {id: "activity.row[1]", insideViewport: true, minimumTapTarget: 44}
  - snapshot: activity-northstar
